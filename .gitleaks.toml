title = "pandora"

[extend]
useDefault = true

# Komari 监控的 admin API 密钥：带 admin:exec，拿到即可在被管机器上执行命令
[[rules]]
id = "komari-api-key"
description = "Komari admin API key"
regex = '''komari-[A-Za-z0-9]{20,}'''
keywords = ["komari-"]

# 管理后台隐藏路径前缀：install.sh 生成的 ops_ + 十六进制，靠不可猜测挡扫描
[[rules]]
id = "pandora-admin-path-prefix"
description = "Pandora admin console hidden path prefix"
regex = '''ops_[0-9a-f]{20,}'''
keywords = ["ops_"]

  # render-nginx_test.sh 用的是显然虚构的递增串
  [[rules.allowlists]]
  regexes = ['''ops_0123456789abcdef0123456789abcdef''']

# ---------------------------------------------------------------------------
# 已逐条核实的误报，按完整值放行（不放行整个文件：同一文件里将来出现的真密钥照样拦）。
# 幂等标签、接口路径、协议常量名、CLIENT-AUTH-01 冻结契约文档（panel/docs）里的测试向量
# （0x00..0x3f 递增字节的 base64、签发方为 client.example.com 的 JWT）。
# 新增一条前先确认它不是机密。nodefabric/testdata 夹具曾带着生产节点的真实 REALITY 私钥，
# 2026-09-22 已换成新生成的假密钥对（见 xboard_field_names_test.go 注释），下面只放行这几个假值；
# 以后夹具里出现任何别的私钥都会被拦。
# ---------------------------------------------------------------------------
[[allowlists]]
description = "verified non-secret literals"
