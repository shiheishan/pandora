name: Pandora NativeCore

on:
  workflow_dispatch:
  push:
    paths:
      - "pdnd/**"
      - "nodeapi/**"
      - "panel/internal/module/node/protocol/**"
      - "panel/web/**"
      - "panel/frontend/**"
      - "panel/internal/pkg/webapp/**"
      - "panel/Makefile"
      - ".github/workflows/pandora-native.yml"
      - ".github/scripts/deadcode.sh"
  pull_request:
    paths:
      - "pdnd/**"
      - "nodeapi/**"
      - "panel/internal/module/node/protocol/**"
      - "panel/web/**"
      - "panel/frontend/**"
      - "panel/internal/pkg/webapp/**"
      - "panel/Makefile"
      - ".github/workflows/pandora-native.yml"
      - ".github/scripts/deadcode.sh"

permissions:
  contents: read

# 显式 shell: bash 让 GitHub 用 `bash --noprofile --norc -eo pipefail {0}`，
# 于是 `go test ... | tee x.log` 按 go test 的状态退出。缺省 shell 没有
# pipefail，tee 永远成功，首跑时 race 测试的 FAIL 与 DATA RACE 被它吞成绿灯。
defaults:
  run:
    shell: bash

jobs:
  panel-native-parity:
    name: NativeCore and panel protocol parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check capability/schema/serving parity
        run: python3 pdnd/release/check_native_panel_parity.py

  panel-web-contract:
    name: Panel embedded UI contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: Embedded frontend contracts (placeholder entry)
        run: go test -mod=readonly ./web/ ./internal/pkg/webapp/

  panel-frontend:
    name: Panel frontend lint, typecheck, tests, build and embed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
          # Pro 图标包（@hugeicons-pro）走私有源：setup-node 写 .npmrc，令牌只在装依赖的步骤经 NODE_AUTH_TOKEN 传入
          registry-url: https://npm.collectui.pro/
          scope: '@hugeicons-pro'
      - uses: actions/setup-go@v7
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HUGEICONS_NPM_TOKEN }}
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build both entries
        run: npm run build
      # frontend-embed 自己会 npm ci + build 一遍，再把 dist/{admin,portal} 同步进 web/；
      # 上一步的独立构建让构建失败直接落在「Build」上，不和同步混在一起
      - name: Sync the real build into web/{admin,portal} for go:embed
        working-directory: panel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HUGEICONS_NPM_TOKEN }}
        run: make frontend-embed
      - name: Real build is embeddable and served at the gateway root
        working-directory: panel
        run: |
          # 占位页还在就说明同步没生效，app_test 会退回只查入口的宽松分支。
          # 不写成 `! grep`：bash -e 对取反命令不生效，非末行的 `! grep` 命中也不会让步骤失败
          if grep -l pandora-placeholder web/admin/index.html web/portal/index.html; then
            echo "placeholder entry still embedded after frontend-embed" >&2
            exit 1
          fi
          go test -mod=readonly ./web/ ./internal/pkg/webapp/

  pdnd-lint:
    name: pdnd lint (golangci-lint + deadcode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          # 与面板同一版本；配置在 pdnd/.golangci.yml（fork 来的目录整目录排除）
          version: v2.5.0
          # 官方预编译包用 Go 1.25 构建，读不了 go 1.26 的模块；用 setup-go 装的版本现编
          install-mode: goinstall
          # 配置校验要在线拉 JSON schema，偶发超时会把整个 lint 判红；配置写错 golangci-lint run 本身也会报错
          verify: false
          working-directory: pdnd
          args: ./...
      # 从二进制入口（节点端、h3 探测、发布工具与模拟器）出发，只剩测试在调的函数也算死代码；误报写进 pdnd/.deadcode-ignore
      - name: Dead code
        working-directory: .
        run: bash .github/scripts/deadcode.sh pdnd . ./cmd/... ./release/...

  linux-race:
    name: Linux race and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Race tests
        run: go test -mod=readonly -p 1 -race -count=1 ./... | tee amd64-race.log
      - name: Vet
        run: go vet -mod=readonly -p 1 ./... | tee amd64-vet.log
      - name: Cross-platform build and vet
        # 发布只出 linux/amd64、linux/arm64；这里钉住别的平台至少编得过、vet 过，防平台专属
        # 代码回退（w12quic review-r6 J2：udprecv 用了 linux/386 没有的 SYS_RECVFROM）。
        # 不含 windows：它要 linux 构建用不到的模块（sing-tun 的 winfw 引 go-ole），离线模块
        # 缓存的检查机上取不到；kernel 测试在 windows 上本来也编不过（Getrusage，已登记不改）。
        run: |
          set -e
          for target in linux/386 linux/arm darwin/arm64 freebsd/amd64; do
            echo "== vet ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet -mod=readonly -p 1 ./...
          done
      - name: Native REALITY stdout gate
        run: bash release/check_native_stdout.sh | tee native-stdout-gate.log
      - name: Native capability smoke
        run: |
          report="$(go run . --capabilities)"
          printf '%s\n' "${report}" | tee native-capabilities.json
          grep -q '"kernel": "pandora-native"' <<<"${report}"
          grep -q '"reality-h3-experimental"' <<<"${report}"
          grep -q '"external-reality-xhttp-h3-unverified"' <<<"${report}"
      - name: Native adapter self-check
        run: |
          report="$(go run . --self-check)"
          printf '%s\n' "${report}" | tee native-self-check.json
          grep -q '"status": "ok"' <<<"${report}"
          grep -q '"capability_count": 13' <<<"${report}"
      - name: Process REALITY H3 probe
        run: go test -mod=readonly -p 1 -run TestProcessProbeRoundTrip -count=3 ./cmd/pandora-h3-probe
      - name: Default dependency boundary
        run: |
          # 发布物与全部测试都不许链 sing-box（它在 Go 1.27 下用 go:linkname 取 x/net 的私有符号，链接失败）。
          # 不写成 `! go list | grep`：bash -e 对取反命令不生效，只有末行能让步骤失败。
          # 先取整份依赖再 grep：管道接 grep -q 时，pipefail 下 go list 失败或被 SIGPIPE
          # 都会让 if 判为未命中而静默放行；单独赋值则 go list 出错直接由 -e 终止。
          deps="$(go list -mod=readonly -deps -test ./...)"
          if grep -q 'github.com/sagernet/sing-box' <<<"${deps}"; then
            echo "github.com/sagernet/sing-box leaked into pdnd" >&2
            exit 1
          fi
          # 上面按默认构建标签算，带 interop 等标签的测试看不到；go.mod 里出现就说明有地方又引回来了
          if grep -q 'github.com/sagernet/sing-box ' go.mod; then
            echo "github.com/sagernet/sing-box is back in pdnd/go.mod" >&2
            exit 1
          fi
      - name: Node perf gate tools (vet, tests, dependency boundary)
        # 节点端性能闸门的工具是独立 module（pdnd/tests/perf/gate/tools），pdnd 的 ./... 不包含它；
        # 它可以用 xray-core、sing-quic 当客户端，但同样不许链 sing-box。Python 部分（compare、report）的单测也在这里跑。
        working-directory: pdnd/tests/perf/gate/tools
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 ./...
          deps="$(go list -mod=readonly -deps -test ./...)"
          if grep -q 'github.com/sagernet/sing-box' <<<"${deps}"; then
            echo "github.com/sagernet/sing-box leaked into the node perf gate tools" >&2
            exit 1
          fi
          cd .. && python3 -m unittest -v test_compare.py test_report.py test_collect.py
      - name: External Xray TLS XHTTP H3 interoperability
        # This is intentionally a non-race opt-in gate: the external Xray
        # client currently contains a known WaitReadCloser race of its own.
        run: go test -mod=mod -tags interop -run 'TestExternalXray(VLESSXHTTPRealityH2Interop|VLESSXHTTPH3Interop|XHTTPH3Transport|VMessInterop|VLESSRealityVisionTLS13Interop)$' -count=1 ./kernel
      - name: External AnyTLS client interoperability
        # Non-race for the same reason: sing-anytls (v0.0.11 and v0.0.13)
        # races between Stream.closeLocally and Stream.Write inside the client.
        run: go test -mod=readonly -tags interop -run 'TestAnyTLSNativeClientTCPAndUOTUDP$' -count=3 ./kernel
      - name: External Mihomo interoperability
        # mihomo 是用户最多的客户端：每次都用官方二进制逐协议真连 NativeCore。
        # 下载包的 SHA-256 取自 GitHub release 公布的 digest；升级时版本与哈希成对改（deps-upgrade skill），
        # 并与 subscription-e2e.yml 里同名的 MIHOMO_VERSION / MIHOMO_GZ_SHA256 一起改。
        # 非 race：外部客户端是独立进程，race 只会拖慢。
        env:
          MIHOMO_VERSION: v1.19.32
          MIHOMO_GZ_SHA256: 8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/mihomo"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/mihomo.gz" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          echo "${MIHOMO_GZ_SHA256}  ${dir}/mihomo.gz" | sha256sum -c -
          gunzip -c "${dir}/mihomo.gz" > "${dir}/mihomo"
          chmod +x "${dir}/mihomo"
          export MIHOMO_BIN="${dir}/mihomo"
          # 测试要求可执行文件本身的哈希：信任锚是上面核过的下载包，这里只是把解压结果交给测试核对
          export MIHOMO_SHA256="$(sha256sum "${MIHOMO_BIN}" | cut -d' ' -f1)"
          go test -mod=readonly -tags interop_mihomo -run 'TestExternalMihomo' -count=1 -v ./kernel 2>&1 | tee mihomo-interop.log
          # 没设上二进制时这些测试会跳过而不是失败：逐协议那组必须真的跑过
          grep -q -- '--- PASS: TestExternalMihomoProtocolsInterop' mihomo-interop.log
      - name: Upload x64 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-native-linux-evidence
          path: |
            pdnd/amd64-race.log
            pdnd/amd64-vet.log
            pdnd/native-stdout-gate.log
            pdnd/native-capabilities.json
            pdnd/native-self-check.json
          if-no-files-found: warn

  linux-arm64-runtime:
    name: Native ARM64 runtime and race gate
    # GitHub documents ubuntu-24.04-arm as a public-preview ARM64 hosted VM.
    # This job is intentionally native execution, not a cross-compile check.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: pdnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Confirm runner architecture
        run: test "$(uname -m)" = aarch64
      - name: Native ARM64 race tests
        run: go test -mod=readonly -p 1 -race -count=1 ./... | tee arm64-race.log
      - name: Native ARM64 vet
        run: go vet -mod=readonly -p 1 ./... | tee arm64-vet.log
      - name: Build and execute NativeCore binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -mod=readonly -trimpath -ldflags "-s -w" -o pandora-native-linux-arm64 .
          file pandora-native-linux-arm64
          ./pandora-native-linux-arm64 --self-check | tee arm64-self-check.json
          ./pandora-native-linux-arm64 --capabilities | tee arm64-capabilities.json
      - name: Upload ARM64 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-native-arm64-evidence
          path: |
            pdnd/arm64-race.log
            pdnd/arm64-vet.log
            pdnd/arm64-self-check.json
            pdnd/arm64-capabilities.json
            pdnd/pandora-native-linux-arm64
          if-no-files-found: warn

  linux-release:
    name: Linux ${{ matrix.arch }} release build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: pdnd
    # GOARCH 放在 job 级：产物名带着它，Verify 步骤也要用。原先只写在
    # Build 步骤的 env 里，Verify 拿到的是空串，于是去找一个叫
    # "pandora-native-linux-" 的文件，报 No such file or directory。
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Build
        run: go build -mod=readonly -trimpath -ldflags "-s -w" -o "pandora-native-linux-${GOARCH}" .
      - name: Build REALITY H3 probe
        run: go build -mod=readonly -trimpath -ldflags "-s -w" -o "pandora-h3-probe-linux-${GOARCH}" ./cmd/pandora-h3-probe
      - name: Verify artifact
        run: sha256sum "pandora-native-linux-${GOARCH}" "pandora-h3-probe-linux-${GOARCH}"

  release-manifest:
    name: Release manifest and hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Release script toolchain pinning (stub go)
        # build.sh / verify.sh 固定 GOTOOLCHAIN 为 go.mod 的版本、版本不符即失败：桩 go 实跑
        run: bash pdnd/release/build_toolchain_mock_test.sh
      - name: Build and verify release directory
        run: |
          bash pdnd/release/build.sh "$RUNNER_TEMP/pandora-release" ci
          bash pdnd/release/verify.sh "$RUNNER_TEMP/pandora-release" ci
      - name: Isolated staging acceptance
        run: |
          bash pdnd/release/staging-acceptance.sh \
            "$RUNNER_TEMP/pandora-release" \
            "$RUNNER_TEMP/pandora-native-staging" ci
      - name: Runtime acceptance (gRPC enroll and session)
        # 验的是上一步 build.sh 产出的 amd64 发布二进制本身：回环模拟 gRPC 面板上
        # 先验指纹不对的 enroll 被拒、再正式 enroll，冷启动两次（第二次 Hello 报出缓存版本），
        # 停掉面板再用落盘缓存冷启动一次，查 SIGTERM 收尾与端口释放。模拟面板由脚本用本 checkout 的 Go 编出。
        run: |
          test "$(uname -m)" = x86_64
          bash pdnd/release/runtime-acceptance.sh \
            "$RUNNER_TEMP/pandora-release/pandora-native-linux-amd64" \
            "$RUNNER_TEMP/pandora-native-runtime"
