name: Pandora NativeCore

on:
  workflow_dispatch:
  push:
    paths:
      - "pdnd/**"
      # PG18 门禁覆盖 panel/internal 下十几个域，整棵树都要触发
      - "panel/internal/**"
      - "panel/migrations/**"
      - "panel/web/**"
      - "panel/frontend/**"
      - "panel/go.mod"
      - "panel/go.sum"
      - "panel/Makefile"
      # PG18 门禁脚本、运行角色加固、种子，以及钉 goose 版本的发布脚本
      - "panel/deploy/run-pg18-gates.sh"
      - "panel/deploy/configure-app-role.sql"
      - "panel/deploy/fixtures/**"
      - "panel/deploy/build-release.sh"
      - ".github/workflows/pandora-native.yml"
  pull_request:
    paths:
      - "pdnd/**"
      # PG18 门禁覆盖 panel/internal 下十几个域，整棵树都要触发
      - "panel/internal/**"
      - "panel/migrations/**"
      - "panel/web/**"
      - "panel/frontend/**"
      - "panel/go.mod"
      - "panel/go.sum"
      - "panel/Makefile"
      # PG18 门禁脚本、运行角色加固、种子，以及钉 goose 版本的发布脚本
      - "panel/deploy/run-pg18-gates.sh"
      - "panel/deploy/configure-app-role.sql"
      - "panel/deploy/fixtures/**"
      - "panel/deploy/build-release.sh"
      - ".github/workflows/pandora-native.yml"

permissions:
  contents: read

# 显式 shell: bash 让 GitHub 用 `bash --noprofile --norc -eo pipefail {0}`，
# 于是 `go test ... | tee x.log` 按 go test 的状态退出。缺省 shell 没有
# pipefail，tee 永远成功，首跑时 race 测试的 FAIL 与 DATA RACE 被它吞成绿灯。
defaults:
  run:
    shell: bash

jobs:
  panel-native-parity:
    name: NativeCore and panel protocol parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check capability/schema/serving parity
        run: python3 pdnd/release/check_native_panel_parity.py

  panel-contract:
    name: Panel NativeCore contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: Node protocol contract tests
        run: go test -mod=readonly ./internal/domain/nodefabric
      - name: Node protocol contract vet
        run: go vet -mod=readonly ./internal/domain/nodefabric

  panel-web-contract:
    name: Panel embedded UI, schema and permission contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: Embedded frontend contracts (placeholder entry)
        run: go test -mod=readonly ./web/ ./internal/platform/webapp/
      - name: Schema table registry
        run: go test -mod=readonly -run TestSchemaTablesAreReferencedOrRegistered ./internal/platform/db/
      - name: Route permission catalog
        run: go test -mod=readonly -run TestRoutePermissionsExistInCatalog ./internal/api/admin/

  panel-pg18:
    name: Panel PostgreSQL 18 integration gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      # goose 版本只有一处真相：发布包 build-release.sh 里钉死的那个。
      # 这里跟着它走，门禁迁移用的就是生产安装会用的同一版
      - name: Install goose pinned by the release bundle
        run: |
          v="$(grep -m1 '^GOOSE_VERSION=' panel/deploy/build-release.sh | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')"
          test -n "$v"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/pressly/goose/v3/cmd/goose@$v"
          "$RUNNER_TEMP/bin/goose" --version
      # 脚本自己起 postgres:18-alpine 容器（runner 自带 Docker），迁移到最新、
      # 查运行角色授权，再给每个域克隆一次性库跑 go test -v；有用例跳过或
      # 一个都没跑也判失败
      - name: Run every PG18 domain gate
        env:
          GOOSE_BIN: ${{ runner.temp }}/bin/goose
        run: bash panel/deploy/run-pg18-gates.sh panel

  panel-frontend:
    name: Panel frontend lint, typecheck, tests, build and embed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build both entries
        run: npm run build
      # frontend-embed 自己会 npm ci + build 一遍，再把 dist/{admin,portal} 同步进 web/；
      # 上一步的独立构建让构建失败直接落在「Build」上，不和同步混在一起
      - name: Sync the real build into web/{admin,portal} for go:embed
        working-directory: panel
        run: make frontend-embed
      - name: Real build is embeddable and served at the gateway root
        working-directory: panel
        run: |
          # 占位页还在就说明同步没生效，app_test 会退回只查入口的宽松分支。
          # 不写成 `! grep`：bash -e 对取反命令不生效，非末行的 `! grep` 命中也不会让步骤失败
          if grep -l pandora-placeholder web/admin/index.html web/portal/index.html; then
            echo "placeholder entry still embedded after frontend-embed" >&2
            exit 1
          fi
          go test -mod=readonly ./web/ ./internal/platform/webapp/ ./internal/api/...

  linux-race:
    name: Linux race and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Race tests
        run: go test -mod=readonly -p 1 -race -count=1 ./... | tee amd64-race.log
      - name: Vet
        run: go vet -mod=readonly -p 1 ./... | tee amd64-vet.log
      - name: Native REALITY stdout gate
        run: bash release/check_native_stdout.sh | tee native-stdout-gate.log
      - name: Native capability smoke
        run: |
          report="$(go run . --capabilities)"
          printf '%s\n' "${report}" | tee native-capabilities.json
          grep -q '"kernel": "pandora-native"' <<<"${report}"
          grep -q '"native_only": true' <<<"${report}"
          grep -q '"reality-h3-experimental"' <<<"${report}"
          grep -q '"external-reality-xhttp-h3-unverified"' <<<"${report}"
      - name: Native adapter self-check
        run: |
          report="$(go run . --self-check)"
          printf '%s\n' "${report}" | tee native-self-check.json
          grep -q '"status": "ok"' <<<"${report}"
          grep -q '"capability_count": 13' <<<"${report}"
      - name: Process REALITY H3 probe
        run: go test -mod=readonly -p 1 -run TestProcessProbeRoundTrip -count=3 ./cmd/pandora-h3-probe
      - name: Default dependency boundary
        run: |
          ! go list -mod=readonly -deps . | grep -q 'github.com/aegispanel/nodeagent/core/multi'
          ! go list -mod=readonly -deps . | grep -q 'github.com/aegispanel/nodeagent/core/sing'
          ! go list -mod=readonly -deps . | grep -q 'github.com/aegispanel/nodeagent/core/xray'
          ! go list -mod=readonly -deps . | grep -q 'github.com/sagernet/sing-box'
      - name: Compatibility migration compile
        run: go test -mod=readonly -tags compat -p 1 ./...
      - name: External Xray TLS XHTTP H3 interoperability
        # This is intentionally a non-race opt-in gate: the external Xray
        # client currently contains a known WaitReadCloser race of its own.
        run: go test -mod=mod -tags interop -run 'TestExternalXray(VLESSXHTTPRealityH2Interop|VLESSXHTTPH3Interop|XHTTPH3Transport)$' -count=1 ./kernel
      - name: External AnyTLS client interoperability
        # Non-race for the same reason: sing-anytls (v0.0.11 and v0.0.13)
        # races between Stream.closeLocally and Stream.Write inside the client.
        run: go test -mod=readonly -tags interop -run 'TestAnyTLSNativeClientTCPAndUOTUDP$' -count=3 ./kernel
      - name: Upload x64 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-native-linux-evidence
          path: |
            pdnd/amd64-race.log
            pdnd/amd64-vet.log
            pdnd/native-stdout-gate.log
            pdnd/native-capabilities.json
            pdnd/native-self-check.json
          if-no-files-found: warn

  linux-arm64-runtime:
    name: Native ARM64 runtime and race gate
    # GitHub documents ubuntu-24.04-arm as a public-preview ARM64 hosted VM.
    # This job is intentionally native execution, not a cross-compile check.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: pdnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Confirm runner architecture
        run: test "$(uname -m)" = aarch64
      - name: Native ARM64 race tests
        run: go test -mod=readonly -p 1 -race -count=1 ./... | tee arm64-race.log
      - name: Native ARM64 vet
        run: go vet -mod=readonly -p 1 ./... | tee arm64-vet.log
      - name: Build and execute NativeCore binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -mod=readonly -trimpath -ldflags "-s -w" -o pandora-native-linux-arm64 .
          file pandora-native-linux-arm64
          ./pandora-native-linux-arm64 --self-check | tee arm64-self-check.json
          ./pandora-native-linux-arm64 --capabilities | tee arm64-capabilities.json
      - name: Upload ARM64 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-native-arm64-evidence
          path: |
            pdnd/arm64-race.log
            pdnd/arm64-vet.log
            pdnd/arm64-self-check.json
            pdnd/arm64-capabilities.json
            pdnd/pandora-native-linux-arm64
          if-no-files-found: warn

  linux-release:
    name: Linux ${{ matrix.arch }} release build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: pdnd
    # GOARCH 放在 job 级：产物名带着它，Verify 步骤也要用。原先只写在
    # Build 步骤的 env 里，Verify 拿到的是空串，于是去找一个叫
    # "pandora-native-linux-" 的文件，报 No such file or directory。
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Build
        run: go build -mod=readonly -trimpath -ldflags "-s -w" -o "pandora-native-linux-${GOARCH}" .
      - name: Build REALITY H3 probe
        run: go build -mod=readonly -trimpath -ldflags "-s -w" -o "pandora-h3-probe-linux-${GOARCH}" ./cmd/pandora-h3-probe
      - name: Verify artifact
        run: sha256sum "pandora-native-linux-${GOARCH}" "pandora-h3-probe-linux-${GOARCH}"

  release-manifest:
    name: Release manifest and hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pdnd/go.mod
          cache-dependency-path: pdnd/go.sum
      - name: Build and verify release directory
        run: |
          bash pdnd/release/build.sh "$RUNNER_TEMP/pandora-release" ci
          bash pdnd/release/verify.sh "$RUNNER_TEMP/pandora-release" ci
      - name: Isolated staging acceptance
        run: |
          bash pdnd/release/staging-acceptance.sh \
            "$RUNNER_TEMP/pandora-release" \
            "$RUNNER_TEMP/pandora-native-staging" ci
