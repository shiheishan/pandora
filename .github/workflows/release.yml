name: Release

# 发版：在默认分支（main）的提交上打 v* 标签并推送 → 构建 linux amd64 / arm64 两份发布包 → 对附件出来源证明
# → 建 GitHub Release。推标签时在建 Release 之后，再用同一份发布包构建并推送三个多架构镜像到 GHCR，并各出来源证明。
# 部署者在目标机上用 Release 里的 get.sh 一条命令首装或升级（见 README「部署」）。
# workflow_dispatch 是演练：只构建并上传 workflow artifact，不建 Release、不打标签。
# 只有「推标签」这一种事件会发布；别的事件（workflow_dispatch，或调试时临时加的分支触发）一律只演练构建。
# workflow_dispatch 要等本文件进了默认分支才能触发（GitHub 的限制），之后可 --ref 任一分支跑那个分支上的版本。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "演练用的版本号（v 开头；只构建、上传 artifact，不发布）"
        required: true
        default: v0.0.0-dryrun
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve and check the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
          else
            version="${INPUT_VERSION:-v0.0.0-dryrun}"
          fi
          # 与 build-release.sh 的版本号检查同一字符集（[A-Za-z0-9._-]+，不能是 . / ..），再限定 v 开头；
          # get.sh 按同一规则校验部署者给的版本号
          if [[ ! "$version" =~ ^v[A-Za-z0-9._-]*$ ]]; then
            echo "::error::版本号不合规：'$version'（须为 v 开头，只含字母、数字、点、下划线、连字符）"
            exit 1
          fi
          # 推标签发版时只认语义化版本（v1.2.3 或 v1.2.3-rc.1）：误推的 vtest 之类不会发成 latest
          if [ "$EVENT_NAME" = push ] && [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::发版标签须为语义化版本 vX.Y.Z 或 vX.Y.Z-后缀：'$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag must point at a commit on the default branch
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # main 是发布分支：标签提交必须已在默认分支上（compare 的 status 为 identical 或 behind）
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical|behind) echo "标签提交 $GITHUB_SHA 在 $DEFAULT_BRANCH 上" ;;
            *) echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 $DEFAULT_BRANCH 上（compare: $status）；先合进 $DEFAULT_BRANCH 再打标签"; exit 1 ;;
          esac
      # 发版构建不用缓存（setup-go 关掉 cache、setup-node 不开 npm 缓存）：发布物不吃可能被别的 run 写过的缓存
      - uses: actions/setup-go@v7
        with:
          go-version-file: panel/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # v5 起有 packageManager 字段时会自动开缓存；发版构建显式关掉
          package-manager-cache: false
      - name: Build both architectures
        env:
          PANDORA_VERSION: ${{ steps.version.outputs.version }}
        run: bash panel/deploy/build-release.sh "$RUNNER_TEMP/dist"
      - name: Collect the release assets and write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          for arch in amd64 arm64; do
            pkg="pandora-panel_${VERSION}_linux_${arch}.tar.gz"
            cp -- "$dist/$pkg" "$dist/$pkg.sha256" "$dist/$pkg.manifest.sha256" "$out/"
          done
          cp -- panel/deploy/get.sh "$out/get.sh"
          cd "$out"
          sha256sum --strict -c -- *.tar.gz.sha256
          # SHA256SUMS 覆盖其余全部附件（两个包、它们的 .sha256 与 .manifest.sha256、get.sh）
          files=(get.sh pandora-panel_*)
          [ "${#files[@]}" -eq 7 ] || { echo "::error::附件数不对：${files[*]}"; exit 1; }
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pandora-panel-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest and publish the GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有这个 job 能写：建 Release（contents: write）、取 OIDC 令牌签来源证明（id-token: write）、存证明（attestations: write）
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pandora-panel-${{ needs.build.outputs.version }}
          path: assets
      - name: Check the assets against SHA256SUMS
        working-directory: assets
        run: sha256sum --strict -c SHA256SUMS
      # actions/attest：只给 subject-path 时出 SLSA build provenance（v4 起 attest-build-provenance 只是它的包装，
      # 上游建议新用法直接用它）。部署者用 gh attestation verify <文件> --repo <仓库> 核对
      - uses: actions/attest@v4
        with:
          subject-path: |
            assets/pandora-panel_*.tar.gz
            assets/get.sh
            assets/SHA256SUMS
      - name: Create the GitHub Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          # 带连字符的标签（v1.2.0-rc.1）发成预发布：releases/latest 不指向它，get.sh 缺省不会装到
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          notes="$RUNNER_TEMP/notes.md"
          {
            printf '在目标机（Debian 12–14 / Ubuntu 22.04–26.04，x86_64 或 aarch64）上用 root 首装或升级到 %s：\n\n' "$TAG"
            printf '```bash\ncurl -fsSL https://github.com/%s/releases/download/%s/get.sh | sudo PANDORA_VERSION=%s bash\n```\n\n' "$GH_REPO" "$TAG" "$TAG"
            printf '无人值守、建第一个管理员、升级见仓库 README 的「部署」一节。\n\n'
            printf '核对：`SHA256SUMS` 覆盖本页全部附件；包旁的 `.sha256` 与包同源，只防下载损坏。防篡改核对 GitHub Actions 出的来源证明：\n\n'
            printf '```bash\ngh attestation verify pandora-panel_%s_linux_amd64.tar.gz --repo %s \\\n  --signer-workflow %s/.github/workflows/release.yml --source-ref refs/tags/%s\n```\n' "$TAG" "$GH_REPO" "$GH_REPO" "$TAG"
            printf '\n核过后直接解开这份包跑 `deploy/install.sh`，不要再经 get.sh 重新下载。\n'
            owner="${GH_REPO%%/*}"
            owner="${owner,,}"
            printf '\nDocker / Compose / 1Panel：镜像 `ghcr.io/%s/pandora`、`pandora-nginx`、`pandora-ops`，标签 `%s`，用法见仓库 `panel/deploy/docker/README.md`。\n' "$owner" "$TAG"
          } > "$notes"
          gh release create "$TAG" \
            pandora-panel_*.tar.gz pandora-panel_*.tar.gz.sha256 pandora-panel_*.tar.gz.manifest.sha256 \
            get.sh SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file "$notes" "${prerelease[@]}"

  images:
    name: Build and push container images
    needs: [build, publish]
    # 推标签：等 Release 建好再推镜像；workflow_dispatch：只演练构建、不推、不出证明
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pandora-panel-${{ needs.build.outputs.version }}
          path: assets
      - name: Check the assets against SHA256SUMS
        working-directory: assets
        run: sha256sum --strict -c SHA256SUMS
      - name: Unpack release packages for image build context
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # 镜像里的二进制、节点端、离线库与部署脚本就是刚出了来源证明的这两个包里的字节，
          # 不在镜像构建里重新编译（Dockerfile 的 release 阶段被 --build-context release=… 整体替换）。
          tree="$RUNNER_TEMP/release-tree"
          mkdir -p "$tree"
          for arch in amd64 arm64; do
            tar -xzf "assets/pandora-panel_${VERSION}_linux_${arch}.tar.gz" -C "$tree"
            (
              cd "$tree/pandora-panel_${VERSION}_linux_${arch}"
              sha256sum --strict -c SHA256SUMS
            )
          done
      - name: Resolve container image repository
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 只打版本号标签、不打 latest（升级是站长在 .env 里改版本号，不会被 pull 意外带走）；
      # 来源证明用 actions/attest，与发布包同一口径。
      - name: Build and push pandora image
        id: build_pandora
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: panel/deploy/docker/Dockerfile
          target: pandora
          platforms: linux/amd64,linux/arm64
          build-contexts: release=${{ runner.temp }}/release-tree
          build-args: |
            PANDORA_VERSION=${{ needs.build.outputs.version }}
            PANDORA_REVISION=${{ github.sha }}
          tags: ${{ steps.image.outputs.repo }}/pandora:${{ needs.build.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
      - name: Attest pandora image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.repo }}/pandora
          subject-digest: ${{ steps.build_pandora.outputs.digest }}
          push-to-registry: true
      - name: Build and push pandora-nginx image
        id: build_nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: panel/deploy/docker/Dockerfile
          target: pandora-nginx
          platforms: linux/amd64,linux/arm64
          build-contexts: release=${{ runner.temp }}/release-tree
          build-args: |
            PANDORA_VERSION=${{ needs.build.outputs.version }}
            PANDORA_REVISION=${{ github.sha }}
          tags: ${{ steps.image.outputs.repo }}/pandora-nginx:${{ needs.build.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
      - name: Attest pandora-nginx image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.repo }}/pandora-nginx
          subject-digest: ${{ steps.build_nginx.outputs.digest }}
          push-to-registry: true
      - name: Build and push pandora-ops image
        id: build_ops
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: panel/deploy/docker/Dockerfile
          target: pandora-ops
          platforms: linux/amd64,linux/arm64
          build-contexts: release=${{ runner.temp }}/release-tree
          build-args: |
            PANDORA_VERSION=${{ needs.build.outputs.version }}
            PANDORA_REVISION=${{ github.sha }}
          tags: ${{ steps.image.outputs.repo }}/pandora-ops:${{ needs.build.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
      - name: Attest pandora-ops image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.repo }}/pandora-ops
          subject-digest: ${{ steps.build_ops.outputs.digest }}
          push-to-registry: true
