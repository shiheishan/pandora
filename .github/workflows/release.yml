name: Release

# 发版：在默认分支（main）的提交上打 v* 标签并推送 → 构建 linux amd64 / arm64 两份发布包 → 对附件出来源证明
# → 建 GitHub Release。
# 部署者在目标机上用 Release 里的 get.sh 一条命令首装或升级（见 README「部署」）。
# workflow_dispatch 是演练：只构建并上传 workflow artifact，不建 Release、不打标签。
# 只有「推标签」这一种事件会发布；别的事件（workflow_dispatch，或调试时临时加的分支触发）一律只演练构建。
# workflow_dispatch 要等本文件进了默认分支才能触发（GitHub 的限制），之后可 --ref 任一分支跑那个分支上的版本。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "演练用的版本号（v 开头；只构建、上传 artifact，不发布）"
        required: true
        default: v0.0.0-dryrun
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Resolve and check the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
          else
            version="${INPUT_VERSION:-v0.0.0-dryrun}"
          fi
          # 与 build-release.sh 的版本号检查同一字符集（[A-Za-z0-9._-]+，不能是 . / ..），再限定 v 开头；
          # get.sh 按同一规则校验部署者给的版本号
          if [[ ! "$version" =~ ^v[A-Za-z0-9._-]*$ ]]; then
            echo "::error::版本号不合规：'$version'（须为 v 开头，只含字母、数字、点、下划线、连字符）"
            exit 1
          fi
          # 推标签发版时只认语义化版本（v1.2.3 或 v1.2.3-rc.1）：误推的 vtest 之类不会发成 latest
          if [ "$EVENT_NAME" = push ] && [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::发版标签须为语义化版本 vX.Y.Z 或 vX.Y.Z-后缀：'$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The tag must point at a commit on the default branch
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # main 是发布分支：标签提交必须已在默认分支上（compare 的 status 为 identical 或 behind）
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical|behind) echo "标签提交 $GITHUB_SHA 在 $DEFAULT_BRANCH 上" ;;
            *) echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 $DEFAULT_BRANCH 上（compare: $status）；先合进 $DEFAULT_BRANCH 再打标签"; exit 1 ;;
          esac

  pdnd:
    name: Build and sign the node binaries
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 签名私钥只在这个 job 里出现：它只有 Go（不装 npm 依赖，没有第三方安装脚本能读到私钥），
    # 推标签发版时进需要审批的 environment release-signing 才拿得到 secret；演练不进环境、不签名。
    environment: ${{ needs.preflight.outputs.publish == 'true' && 'release-signing' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: pdnd/go.mod
          cache: false
      - name: Build the node binaries and the release manifest
        env:
          PANDORA_VERSION: ${{ needs.preflight.outputs.version }}
          PANDORA_PDND_ONLY: '1'
        run: bash panel/deploy/build-release.sh "$RUNNER_TEMP/pdnd-out"
      - name: Sign the release manifest
        if: needs.preflight.outputs.publish == 'true'
        env:
          PDND_SIGNING_KEY: ${{ secrets.PDND_SIGNING_KEY }}
        working-directory: pdnd
        run: |
          # 发出去的包必须能在线升级：推标签发版时没有签名私钥就失败
          if [ -z "${PDND_SIGNING_KEY:-}" ]; then
            echo "::error::environment release-signing 里没有 secret PDND_SIGNING_KEY：发布包的节点端清单签不了名，节点无法在线升级"
            exit 1
          fi
          keydir="$(mktemp -d "$RUNNER_TEMP/pdnd-key.XXXXXX")"
          trap 'rm -rf -- "$keydir"' EXIT
          umask 077
          printf '%s\n' "$PDND_SIGNING_KEY" > "$keydir/key"
          unset PDND_SIGNING_KEY
          manifest="$RUNNER_TEMP/pdnd-out/pdnd-dist/pdnd-manifest.json"
          GOFLAGS='' go run -mod=readonly ./release/signmanifest -key "$keydir/key" -in "$manifest" -out "$manifest.sig"
          rm -rf -- "$keydir"
          # 用仓库里内置的公钥核一遍：私钥与 pdnd/upgrade/keys 对不上时在这里失败，而不是发出去后所有节点都拒绝
          GOFLAGS='' go run -mod=readonly ./release/signmanifest -verify "$manifest.sig" -in "$manifest"
      - name: Collect the manifest
        run: |
          out="$RUNNER_TEMP/pdnd-signed"
          mkdir -p "$out"
          cp -- "$RUNNER_TEMP/pdnd-out/pdnd-dist/pdnd-manifest.json" "$out/"
          if [ -f "$RUNNER_TEMP/pdnd-out/pdnd-dist/pdnd-manifest.json.sig" ]; then
            cp -- "$RUNNER_TEMP/pdnd-out/pdnd-dist/pdnd-manifest.json.sig" "$out/"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pdnd-manifest-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/pdnd-signed/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build release packages
    needs: [preflight, pdnd]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pdnd-manifest-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/pdnd-signed
      # 发版构建不用缓存（setup-go 关掉 cache、setup-node 不开 npm 缓存）：发布物不吃可能被别的 run 写过的缓存
      - uses: actions/setup-go@v7
        with:
          go-version-file: panel/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # v5 起有 packageManager 字段时会自动开缓存；发版构建显式关掉
          package-manager-cache: false
          # Pro 图标包（@hugeicons-pro）走私有源：setup-node 写 .npmrc，令牌只在装依赖的步骤经 NODE_AUTH_TOKEN 传入
          registry-url: https://npm.collectui.pro/
          scope: '@hugeicons-pro'
      - name: Build both architectures
        env:
          PANDORA_VERSION: ${{ needs.preflight.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.HUGEICONS_NPM_TOKEN }}
          # 节点端在这里重新构建，清单必须与 pdnd job 签过名的那份逐字节相同（演练没有 .sig，只核复现）
          PUBLISH: ${{ needs.preflight.outputs.publish }}
        run: |
          if [ -f "$RUNNER_TEMP/pdnd-signed/pdnd-manifest.json.sig" ]; then
            export PDND_SIGNATURE_DIR="$RUNNER_TEMP/pdnd-signed"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::pdnd job 没交回 pdnd-manifest.json.sig"
            exit 1
          fi
          bash panel/deploy/build-release.sh "$RUNNER_TEMP/dist"
          if [ -z "${PDND_SIGNATURE_DIR:-}" ]; then
            cmp -- "$RUNNER_TEMP/pdnd-signed/pdnd-manifest.json" "$RUNNER_TEMP/dist/pdnd-dist/pdnd-manifest.json" \
              || { echo "::error::pdnd 没能复现构建：两个 job 构建出的清单不同"; exit 1; }
          fi
      - name: Collect the release assets and write SHA256SUMS
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
        run: |
          dist="$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          for arch in amd64 arm64; do
            pkg="pandora-panel_${VERSION}_linux_${arch}.tar.gz"
            cp -- "$dist/$pkg" "$dist/$pkg.sha256" "$dist/$pkg.manifest.sha256" "$out/"
            if [ "$PUBLISH" = true ]; then
              tar -tzf "$dist/$pkg" | grep -qx "pandora-panel_${VERSION}_linux_${arch}/pdnd-dist/pdnd-manifest.json.sig" \
                || { echo "::error::发布包缺少 pdnd-manifest.json.sig: $pkg"; exit 1; }
            fi
          done
          cp -- panel/deploy/get.sh "$out/get.sh"
          cd "$out"
          sha256sum --strict -c -- *.tar.gz.sha256
          # SHA256SUMS 覆盖其余全部附件（两个包、它们的 .sha256 与 .manifest.sha256、get.sh）
          files=(get.sh pandora-panel_*)
          [ "${#files[@]}" -eq 7 ] || { echo "::error::附件数不对：${files[*]}"; exit 1; }
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: pandora-panel-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest and publish the GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有这个 job 能写：建 Release（contents: write）、取 OIDC 令牌签来源证明（id-token: write）、存证明（attestations: write）
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pandora-panel-${{ needs.build.outputs.version }}
          path: assets
      - name: Check the assets against SHA256SUMS
        working-directory: assets
        run: sha256sum --strict -c SHA256SUMS
      # actions/attest：只给 subject-path 时出 SLSA build provenance（v4 起 attest-build-provenance 只是它的包装，
      # 上游建议新用法直接用它）。部署者用 gh attestation verify <文件> --repo <仓库> 核对
      - uses: actions/attest@v4
        with:
          subject-path: |
            assets/pandora-panel_*.tar.gz
            assets/get.sh
            assets/SHA256SUMS
      - name: Create the GitHub Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          # 带连字符的标签（v1.2.0-rc.1）发成预发布：releases/latest 不指向它，get.sh 缺省不会装到
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          notes="$RUNNER_TEMP/notes.md"
          {
            printf '在目标机（Debian 12–14 / Ubuntu 22.04–26.04，x86_64 或 aarch64）上用 root 首装或升级到 %s：\n\n' "$TAG"
            printf '```bash\ncurl -fsSL https://github.com/%s/releases/download/%s/get.sh | sudo PANDORA_VERSION=%s bash\n```\n\n' "$GH_REPO" "$TAG" "$TAG"
            printf '无人值守、建第一个管理员、升级见仓库 README 的「部署」一节。\n\n'
            printf '核对：`SHA256SUMS` 覆盖本页全部附件；包旁的 `.sha256` 与包同源，只防下载损坏。防篡改核对 GitHub Actions 出的来源证明：\n\n'
            printf '```bash\ngh attestation verify pandora-panel_%s_linux_amd64.tar.gz --repo %s \\\n  --signer-workflow %s/.github/workflows/release.yml --source-ref refs/tags/%s\n```\n' "$TAG" "$GH_REPO" "$GH_REPO" "$TAG"
            printf '\n核过后直接解开这份包跑 `deploy/install.sh`，不要再经 get.sh 重新下载。\n'
          } > "$notes"
          gh release create "$TAG" \
            pandora-panel_*.tar.gz pandora-panel_*.tar.gz.sha256 pandora-panel_*.tar.gz.manifest.sha256 \
            get.sh SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file "$notes" "${prerelease[@]}"
