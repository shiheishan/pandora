name: Panel deploy script contracts

# deploy/ 下的桩测试原本 CI 一个都不跑：迁移脚本要求编号连续、真实目录却有历史空号，
# 按发布包安装会卡在迁移，而 CI 的迁移直接调 goose，一直没人发现。这里只跑不需要
# 数据库、不需要 root 的桩测试，几秒跑完，所以单独成一个 workflow、只按 deploy 与
# migrations 的路径触发，不拖 PG18 门禁和前端构建。
# 两个迁移脚本（migrate.sh、check-migrations.sh）的桩测试会拿仓库里真实的
# panel/migrations 跑校验：脚本拒绝真实目录即变红。

on:
  workflow_dispatch:
  push:
    paths:
      - "panel/deploy/**"
      - "panel/migrations/**"
      - ".github/workflows/panel-deploy.yml"
  pull_request:
    paths:
      - "panel/deploy/**"
      - "panel/migrations/**"
      - ".github/workflows/panel-deploy.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy-mock-tests:
    name: Deploy script mock tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: panel/deploy
    steps:
      - uses: actions/checkout@v4
      # 清单逐个点名：新加一个与本 workflow 触发面相关、无需 root 的桩测试就补进来。
      # 每个都跑完再判，失败的名字集中列出
      - name: Run deploy mock tests
        run: |
          tests=(
            migrate_fail_closed_mock_test.sh
            migrate-layout_mock_test.sh
            migrate-rollback_mock_test.sh
            check-migrations_mock_test.sh
            check-migrations_native_mock_test.sh
            pg-layout_mock_test.sh
            render-nginx_test.sh
            cloudflare-realip_mock_test.sh
            release-artifact-binding_mock_test.sh
            logrotate-aegis_static_test.sh
            public-base-url_mock_test.sh
            migrate-to-new-host_mock_test.sh
            install-chain_mock_test.sh
            install-migrate-order_mock_test.sh
            install-firstrun_mock_test.sh
            edge-tls_mock_test.sh
            healthcheck_mock_test.sh
            tls-renew_static_test.sh
            healthcheck-install_static_test.sh
            build-release_toolchain_mock_test.sh
            install-native_pgcluster_mock_test.sh
            install-native_backup_mock_test.sh
            webdav-backup-hardening_mock_test.sh
          )
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if bash "$t"; then echo "PASS $t"; else echo "FAIL $t (exit $?)"; failed+=("$t"); fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            printf 'failed: %s\n' "${failed[@]}" >&2
            exit 1
          fi
          echo "deploy mock tests: ${#tests[@]} passed"

  # 发布控制器的桩测试要 Linux root（systemd、flock、/proc 的桩都按 root 写）。GitHub runner
  # 有免密 sudo，在这里必跑；它证明「完整预检在停服之前、停服后只做只读核对」的顺序。
  # 只在 GitHub 上跑（GITHUB_ACTIONS=true）：检查机回放时机器形状不同（2026-10-07 在检查机上
  # 以 root 跑失败、日志只在云电脑上），明说跳过，以 GitHub 的结论为准。
  deploy-root-mock-tests:
    name: Deploy controller mock tests (root)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: panel/deploy
    steps:
      - uses: actions/checkout@v4
      - name: Run release-stop-the-world mock test as root
        # 控制器要求发布目录的每一级父目录都归 root、不可组写或他写，/tmp（1777）过不了；
        # 桩测试的临时目录放到一个 root 独占的目录里（PANDORA_MOCK_TMPDIR）
        run: |
          t=release-stop-the-world_mock_test.sh
          mock_tmp=/srv/pandora-release-mock
          if [ "${GITHUB_ACTIONS:-}" != true ]; then
            echo "不在 GitHub Actions 上，跳过 $t（GitHub 上必跑）"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then
            install -d -m 0700 -o root -g root "$mock_tmp"
            PANDORA_MOCK_TMPDIR="$mock_tmp" bash "$t"
          elif sudo -n true 2>/dev/null; then
            sudo -n install -d -m 0700 -o root -g root "$mock_tmp"
            sudo -n env "PATH=$PATH" PANDORA_MOCK_TMPDIR="$mock_tmp" bash "$t"
          else
            echo "GitHub runner 上没有免密 sudo，无法跑 $t" >&2
            exit 1
          fi
