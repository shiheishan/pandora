# 从源码构建三个镜像 → gen-env 生成 .env → compose 起全栈 → 迁移、/readyz、门户与后台经 nginx、
# 建管理员并登录、真实来源 IP 两种口径、重建与就地杀掉 serve 后 nginx 恢复、备份校验恢复演练 → down -v。
# 只在部署相关路径或本 workflow 变化时跑。
name: Panel docker compose smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "panel/deploy/**"
      - "panel/db/migrations/**"
      - ".dockerignore"
      - ".github/workflows/panel-docker.yml"
  pull_request:
    paths:
      - "panel/deploy/**"
      - "panel/db/migrations/**"
      - ".dockerignore"
      - ".github/workflows/panel-docker.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compose-smoke:
    name: Compose stack end to end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check container entrypoint shell script syntax
        run: |
          # 分开检查两个容器专用脚本语法
          bash -n panel/deploy/docker/nginx-entrypoint.sh
          bash -n panel/deploy/docker/ops.sh

      - name: Build container images from source
        run: |
          # 同一构建器按依赖顺序构建 pandora、pandora-nginx 与 pandora-ops
          # 第二、三个目标镜像复用 release-build 阶段的构建缓存
          for t in pandora pandora-nginx pandora-ops; do
            echo "::group::Build $t"
            docker build \
              -f panel/deploy/docker/Dockerfile \
              --target "$t" \
              --build-arg PANDORA_VERSION=ci \
              --build-arg PANDORA_REVISION="$GITHUB_SHA" \
              -t "pandora-ci/$t:ci" .
            echo "::endgroup::"
          done

      - name: Generate compose environment and wrap commands
        run: |
          # 1. 验证 gen-env 在未给 PANDORA_PUBLIC_BASE_URL 时必须失败
          rc=0
          docker run --rm pandora-ci/pandora-ops:ci gen-env > /dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::gen-env 在未给对外地址时未按预期退出失败"
            exit 1
          fi

          # 2. 生成合法的 .env 文件，权限限制为 0600
          (
            umask 077
            docker run --rm \
              -e PANDORA_PUBLIC_BASE_URL=https://panel.example.test \
              -e PANDORA_IMAGE_REPO=pandora-ci \
              -e PANDORA_VERSION=ci \
              pandora-ci/pandora-ops:ci gen-env > "$RUNNER_TEMP/pandora.env"
          )

          # 校验生成的 env：绝不能包含 CHANGE_ME 占位符，且必须包含 PANDORA_ADMIN_PATH 与指定的 PANDORA_IMAGE_REPO
          if grep -qE '^[A-Z][A-Z0-9_]*=.*CHANGE_ME' "$RUNNER_TEMP/pandora.env"; then
            echo "::error::生成的 .env 文件中仍有 CHANGE_ME 占位符"
            exit 1
          fi
          grep -q "^PANDORA_ADMIN_PATH=" "$RUNNER_TEMP/pandora.env" || {
            echo "::error::生成的 .env 缺失 PANDORA_ADMIN_PATH"
            exit 1
          }
          grep -q "^PANDORA_IMAGE_REPO=pandora-ci$" "$RUNNER_TEMP/pandora.env" || {
            echo "::error::生成的 .env 缺失 PANDORA_IMAGE_REPO=pandora-ci"
            exit 1
          }

          # 3. 提取后台路径并加入日志掩码与环境变量
          admin_path="$(awk -F= '$1=="PANDORA_ADMIN_PATH"{print $2}' "$RUNNER_TEMP/pandora.env")"
          [ -n "$admin_path" ] || { echo "::error::未能提取到 PANDORA_ADMIN_PATH"; exit 1; }
          echo "::add-mask::$admin_path"
          echo "ADMIN_PATH=$admin_path" >> "$GITHUB_ENV"

          # 4. 创建命令包装脚本 dc 与健康等待脚本 wait-healthy
          mkdir -p "$RUNNER_TEMP/bin"

          cat <<EOF > "$RUNNER_TEMP/bin/dc"
          #!/usr/bin/env bash
          exec docker compose -p pandora-ci -f "$GITHUB_WORKSPACE/panel/deploy/docker/compose.yaml" --env-file "$RUNNER_TEMP/pandora.env" "\$@"
          EOF
          chmod 755 "$RUNNER_TEMP/bin/dc"

          cat <<'EOF' > "$RUNNER_TEMP/bin/wait-healthy"
          #!/usr/bin/env bash
          set -euo pipefail
          # 最多等 90 次、每次 2 秒（共 180 秒），nginx 服务就绪即代表全栈健康
          for ((i=1; i<=90; i++)); do
            cid="$(dc ps -q nginx 2>/dev/null || true)"
            if [ -n "$cid" ]; then
              status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "全栈健康检查通过（尝试第 $i 次）"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "等待容器就绪超时（90 次尝试结束）" >&2
          exit 1
          EOF
          chmod 755 "$RUNNER_TEMP/bin/wait-healthy"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          # 5. 校验 compose 配置渲染结果
          "$RUNNER_TEMP/bin/dc" config -q

      - name: Start stack and wait for healthy
        run: |
          dc up -d
          wait-healthy
          # 验证 migrate 退出码必须是 0
          mig_cid="$(dc ps -a -q migrate)"
          [ -n "$mig_cid" ] || { echo "::error::未找到 migrate 容器"; exit 1; }
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$mig_cid")"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::migrate 容器退出码非 0: $exit_code"
            exit 1
          fi

      - name: Verify edge and portal HTTP endpoints
        run: |
          R=(--resolve panel.example.test:443:127.0.0.1 -k)
          B="https://panel.example.test"

          # 1. 本机回环 9080 入口可访问，返回 html
          curl_out="$(curl -fsS http://127.0.0.1:9080/)"
          grep -iq '<html' <<<"$curl_out" || { echo "::error::回环 9080 未返回 HTML"; exit 1; }

          # 2. 回环 9080 的 /readyz 必须在边缘被拒绝（403 forbidden）
          readyz_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9080/readyz)"
          [ "$readyz_code" = "403" ] || { echo "::error::/readyz 边缘应返回 403，实际: $readyz_code"; exit 1; }

          # 3. HTTPS 门户公共接口可用且返回有效 JSON
          curl -fsS "${R[@]}" "$B/v1/site-config" | python3 -m json.tool > /dev/null

          # 4. HTTPS 后台管理入口返回 HTML
          admin_out="$(curl -fsS "${R[@]}" "$B/$ADMIN_PATH/")"
          grep -iq '<html' <<<"$admin_out" || { echo "::error::后台管理入口未返回 HTML"; exit 1; }

          # 5. 80 端口非 acme 挑战重定向至 HTTPS (308)
          redirect_code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: panel.example.test' http://127.0.0.1/v1/site-config)"
          [ "$redirect_code" = "308" ] || { echo "::error::80 端口未返回 308 重定向，实际: $redirect_code"; exit 1; }

          # 6. 节点端 gRPC mTLS 端口正常监听
          timeout 5 bash -c '</dev/tcp/127.0.0.1/9443' || { echo "::error::gRPC 9443 端口未在监听"; exit 1; }

      - name: Bootstrap admin and verify authentication
        run: |
          R=(--resolve panel.example.test:443:127.0.0.1 -k)
          B="https://panel.example.test"

          # 1. 验证尚未创建管理员时 has-admin 退出码必须为 3
          rc=0
          dc exec -T serve /opt/pandora/bin/pandora admin has-admin || rc=$?
          [ "$rc" = "3" ] || { echo "::error::has-admin 应退出 3，实际: $rc"; exit 1; }

          # 2. 生成随机密码并创建第一个管理员，密码经标准输入传入不进参数
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          printf '%s\n' "$pw" | dc exec -T serve /opt/pandora/bin/pandora admin create --email admin@example.test --password-stdin

          # 3. 调用登录接口，请求体经管道传入
          login_resp="$(printf '{"email":"admin@example.test","password":"%s"}' "$pw" | \
            curl -fsS "${R[@]}" -H 'Content-Type: application/json' --data-binary @- "$B/$ADMIN_PATH/v1/auth/login")"
          token="$(python3 -c "import sys, json; print(json.loads(sys.stdin.read()).get('access_token', ''))" <<< "$login_resp")"
          [ -n "$token" ] || { echo "::error::登录响应中未获取到 access_token"; exit 1; }
          echo "::add-mask::$token"

          # 4. 写入 0600 头文件并通过 /v1/me 验证受保护的后台接口
          (
            umask 077
            printf 'Authorization: Bearer %s\n' "$token" > "$RUNNER_TEMP/auth.h"
          )
          curl -fsS "${R[@]}" -H @"$RUNNER_TEMP/auth.h" "$B/$ADMIN_PATH/v1/me" | python3 -m json.tool > /dev/null

      - name: Verify real client IP handling
        run: |
          # 1. 缺省配置下不信任任何代理：送入 X-Real-IP: 203.0.113.7 不得作为客户端来源 IP 记录
          curl -fsS -o /dev/null -H 'X-Real-IP: 203.0.113.7' http://127.0.0.1:9080/v1/site-config
          sleep 1
          # 先整份取进变量再查：grep -q 命中即退，管道另一端可能吃 SIGPIPE，pipefail 下会误判
          logs="$(dc logs --no-log-prefix nginx)"
          if grep -q '^203\.0\.113\.7 - ' <<<"$logs"; then
            echo "::error::缺省配置不应信任 X-Real-IP"
            exit 1
          fi

          # 2. 启用信任网关：PANDORA_REALIP_FROM=gateway 重建 nginx
          PANDORA_REALIP_FROM=gateway dc up -d --no-deps nginx
          wait-healthy
          curl -fsS -o /dev/null -H 'X-Real-IP: 203.0.113.8' http://127.0.0.1:9080/v1/site-config
          sleep 1
          logs="$(dc logs --no-log-prefix nginx)"
          if ! grep -q '^203\.0\.113\.8 - ' <<<"$logs"; then
            echo "::error::信任 gateway 时日志中未找到以 203.0.113.8 - 开头的访问记录"
            exit 1
          fi

          # 3. 恢复缺省信任配置
          dc up -d --no-deps nginx
          wait-healthy

      - name: Recreate serve and ensure nginx network link remains healthy
        run: |
          # nginx 共用 serve 的网络命名空间，强制重建 serve 后 nginx 会随之重启并仍可通信
          dc up -d --force-recreate serve
          # 重建刚返回时 nginx 可能还没跟着换到新的命名空间，健康状态也可能是旧的：按请求实际通不通判，最多等 60 秒
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:9080/; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::重建 serve 后经 9080 打不开门户（nginx 没跟着重建？）"; exit 1; }
          wait-healthy

      - name: Kill serve in place and ensure nginx rejoins its network namespace
        run: |
          # 模拟崩溃 / OOM：从宿主杀掉 serve 主进程，Docker 按 restart: unless-stopped 就地拉起（换了新的网络命名空间）；
          # compose 不参与，靠 nginx 入口脚本的看门狗发现连不上 127.0.0.1:9000 后自行退出、被 Docker 拉起重新加入
          serve_cid="$(dc ps -q serve)"
          [ -n "$serve_cid" ] || { echo "::error::未找到 serve 容器"; exit 1; }
          before="$(docker inspect -f '{{.RestartCount}}' "$serve_cid")"
          pid="$(docker inspect -f '{{.State.Pid}}' "$serve_cid")"
          sudo kill -KILL "$pid"
          now="$before"
          for _ in $(seq 1 30); do
            now="$(docker inspect -f '{{.RestartCount}}' "$serve_cid")"
            [ "$now" -gt "$before" ] && break
            sleep 2
          done
          [ "$now" -gt "$before" ] || { echo "::error::serve 被杀后 Docker 没有就地拉起"; exit 1; }
          # 看门狗：nginx 启动后宽限 60 秒，之后连续 30 秒拒绝连接才退出；最多等 180 秒
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:9080/; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::serve 就地重启后 nginx 没有回到新的网络命名空间（看门狗没生效？）"; exit 1; }
          wait-healthy

      - name: Verify compose up idempotency and migration skipping
        run: |
          dc up -d
          wait-healthy
          mig_cid="$(dc ps -a -q migrate)"
          [ -n "$mig_cid" ] || { echo "::error::未找到 migrate 容器"; exit 1; }
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$mig_cid")"
          [ "$exit_code" -eq 0 ] || { echo "::error::重复 up 时 migrate 退出码非 0: $exit_code"; exit 1; }

          # 无待迁移项时不得生成升级前自动转储文件
          backups="$(dc run --rm -T --entrypoint sh ops -c 'ls /var/backups/pandora')"
          if grep -q 'pre-upgrade-' <<<"$backups"; then
            echo "::error::无待执行迁移时却发现了 pre-upgrade- 备份转储"
            exit 1
          fi

      - name: Practice backup, verify, restore drills, and psql connectivity
        run: |
          # 1. 执行全量加密备份
          dc run --rm -T ops backup

          # 2. 检索最新的备份归档文件
          archive="$(dc run --rm -T --entrypoint sh ops -c 'ls -1t /var/backups/pandora/pandora-postgres-*.dump.age | head -1' | tr -d '\r')"
          [ -n "$archive" ] || { echo "::error::未找到生成的备份归档"; exit 1; }
          [[ "$archive" == /var/backups/pandora/* ]] || { echo "::error::归档路径不符合规范: $archive"; exit 1; }

          # 3. 校验备份归档完整性
          dc run --rm -T ops verify "$archive"

          # 4. 容器内禁止直接覆盖正式库 pandora，必须被拦截拒绝
          rc=0
          dc run --rm -T ops restore --archive "$archive" --target-db pandora || rc=$?
          [ "$rc" -ne 0 ] || { echo "::error::尝试恢复至正式库 pandora 应当被拒绝但成功了"; exit 1; }

          # 5. 演练恢复至新库 pandora_restore
          dc run --rm -T -e PANDORA_RESTORE_CONFIRM=RESTORE:pandora_restore ops restore --archive "$archive" --target-db pandora_restore

          # 6. 通过 psql 查询恢复库或当前数据库的迁移版本数，必须为正整数
          n="$(dc run --rm -T ops psql -tAc 'SELECT count(*) FROM goose_db_version' | tr -d '[:space:]')"
          [[ "$n" =~ ^[1-9][0-9]*$ ]] || { echo "::error::迁移版本数量非正整数: '$n'"; exit 1; }

      - name: Print diagnostics on failure
        if: failure()
        run: |
          if command -v dc >/dev/null 2>&1; then
            echo "::group::Compose containers state"
            dc ps -a || true
            echo "::endgroup::"
            echo "::group::Compose logs"
            dc logs --no-color --tail 300 || true
            echo "::endgroup::"
          fi

      - name: Tear down stack
        if: always()
        run: |
          if command -v dc >/dev/null 2>&1; then
            dc down -v --remove-orphans || true
          fi
