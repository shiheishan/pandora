name: Panel frontend smoke

# 新前端对真实网关的联调冒烟（面板重构第 4 阶段）：一次性 PG18 + Valkey，
# 从源码编译 aegis-public、aegis-admin、aegis-node 与 aegis-adminctl（后者建平台管理员），
# 起三个网关，之后用前端页面自己的 zod schema 解析真响应。
#
# 单独成一个 workflow 而不并进 panel-pg18.yml：
#   - 触发面不同。冒烟要跟着 panel/frontend/src 走（schema 变了就得重验），
#     并进去会让只改前端的推送也拖着十几个域的 PG18 门禁跑一遍；
#   - 失败的含义不同。PG18 门禁红是后端 SQL 坏了，冒烟红是前后端形状对不上，
#     分开挂在 checks 里一眼能看出该找谁。

on:
  workflow_dispatch:
  push:
    paths:
      - "panel/internal/**"
      - "panel/cmd/**"
      - "panel/migrations/**"
      - "panel/go.mod"
      - "panel/go.sum"
      - "panel/frontend/src/**"
      - "panel/frontend/tests/smoke/**"
      - "panel/frontend/tests/browser/**"
      - "panel/frontend/package.json"
      - "panel/frontend/package-lock.json"
      - "panel/deploy/run-smoke-stack.sh"
      - "panel/deploy/run-smoke-e2e.sh"
      - "panel/deploy/psql.sh"
      - "panel/tests/*.sh"
      - "panel/deploy/configure-app-role.sql"
      - "panel/deploy/build-release.sh"
      - "panel/tools/loadtest/**"
      - ".github/workflows/panel-smoke.yml"
  pull_request:
    paths:
      - "panel/internal/**"
      - "panel/cmd/**"
      - "panel/migrations/**"
      - "panel/go.mod"
      - "panel/go.sum"
      - "panel/frontend/src/**"
      - "panel/frontend/tests/smoke/**"
      - "panel/frontend/tests/browser/**"
      - "panel/frontend/package.json"
      - "panel/frontend/package-lock.json"
      - "panel/deploy/run-smoke-stack.sh"
      - "panel/deploy/run-smoke-e2e.sh"
      - "panel/deploy/psql.sh"
      - "panel/tests/*.sh"
      - "panel/deploy/configure-app-role.sql"
      - "panel/deploy/build-release.sh"
      - "panel/tools/loadtest/**"
      - ".github/workflows/panel-smoke.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Real gateways under the frontend schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      # goose 版本跟发布包 build-release.sh 走，与 panel-pg18.yml 同一个真相
      - name: Install goose pinned by the release bundle
        run: |
          v="$(grep -m1 '^GOOSE_VERSION=' panel/deploy/build-release.sh | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')"
          test -n "$v"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/pressly/goose/v3/cmd/goose@$v"
          "$RUNNER_TEMP/bin/goose" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      # 网关嵌入真前端产物（同 make frontend-embed，发布包也这么做）：门户在门户网关根上、后台在后台网关根上，
      # 最后一步的浏览器测试点的就是它。仓库里只有占位页，所以必须在起栈编译网关之前构建
      - name: Embed the real frontend into the gateways
        run: make -C panel frontend-embed
      # 配置在脚本里用 openssl 现场生成，不读任何 secrets
      # 容器取 docker-compose 的名字 aegis-postgres：第 ⑤ 步的 e2e 脚本经仓库自带的
      # deploy/psql.sh 查库，它写死这个名字；runner 一次性，不会撞名
      - name: Start the stack
        id: stack
        env:
          GOOSE_BIN: ${{ runner.temp }}/bin/goose
          PANDORA_SMOKE_PG_CONTAINER: aegis-postgres
        run: bash panel/deploy/run-smoke-stack.sh up panel "$RUNNER_TEMP/smoke"
      # 最小业务链：各列表不为空，schema 才验得出东西。seed.ts 只用 node 内置模块，
      # Node 22 原生剥类型直接跑，不需要 npm ci
      - name: Seed through the real gateways
        run: node panel/frontend/tests/smoke/seed.ts "$RUNNER_TEMP/smoke"
      - name: Install frontend dependencies
        working-directory: panel/frontend
        run: npm ci
      # 冒烟自己的 tsconfig：页面模块会连带 .tsx，node 侧那份没开 jsx
      - name: Typecheck the smoke tables
        working-directory: panel/frontend
        run: npx tsc -p tests/smoke/tsconfig.json
      # 前端调用的每个 GET 接口，用调用处那个页面 schema 解析真响应；
      # 写路径（writes.smoke.ts）由 vitest.config.ts 的 sequencer 固定排在两张读表之后
      - name: Parse real responses with the page schemas
        working-directory: panel/frontend
        env:
          SMOKE_STATE: ${{ runner.temp }}/smoke
        run: npx vitest run -c tests/smoke/vitest.config.ts
      # 仓库现有的 tests/*_e2e.sh 与 tests/e2e.sh 在同一个栈上逐个跑：
      # 放在读表与写路径之后，免得它们造的数据搅乱条数；脚本失败只进下面那张表，
      # 失败即让 job 变红，但 run-smoke-e2e.sh 先把全部脚本跑完、表格写完再给退出码。
      # 前面哪步红了照样跑，只要栈起来了
      - name: Run the e2e scripts against the stack
        if: always() && steps.stack.outcome == 'success'
        run: bash panel/deploy/run-smoke-e2e.sh panel "$RUNNER_TEMP/smoke"
      # 压测工具链对真网关的小规模试跑：证明 seed 造出的节点身份与订阅能被网关接受、
      # 模拟节点的签名全部验过、用户流量与 burst 的请求形状对，不是测性能。
      # 放在 e2e 之后：seed 往库里加 200 个用户和 5 个节点，不能搅乱前面各表的条数。
      # 判据（各子命令的 -strict）：零 5xx、零签名失败、零令牌 401、每个节点都拿到配置
      - name: Load-test tool trial (200 users, 5 nodes, 60s)
        if: always() && steps.stack.outcome == 'success'
        timeout-minutes: 5
        working-directory: panel
        run: |
          S="$RUNNER_TEMP/smoke"
          LT="$S/loadtest"
          mkdir -p "$LT"
          set -a; . "$S/smoke.env"; . "$S/gateway.env"; set +a
          export LOADTEST_ADMIN_EMAIL="$SMOKE_ADMIN_EMAIL" LOADTEST_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD"
          go build -o "$S/bin/loadtest" ./tools/loadtest
          start=$(date +%s)
          "$S/bin/loadtest" seed -database-url "$AEGIS_DATABASE_URL" -admin-base "$SMOKE_ADMIN_BASE" \
            -node-base "$SMOKE_NODE_BASE" -public-base "$SMOKE_PUBLIC_BASE" -admin-email "$SMOKE_ADMIN_EMAIL" \
            -users 200 -nodes 5 -label ci -out "$S/lt-manifest.json"
          echo "seed took $(( $(date +%s) - start ))s"
          "$S/bin/loadtest" nodes -manifest "$S/lt-manifest.json" -node-url "$SMOKE_NODE_BASE" \
            -nodes 5 -duration 60s -stagger 10s -progress 20s -out "$LT" -strict > "$LT/nodes.log" 2>&1 &
          nodes_pid=$!
          "$S/bin/loadtest" users -manifest "$S/lt-manifest.json" \
            -public-url "$SMOKE_PUBLIC_BASE" -admin-url "$SMOKE_ADMIN_BASE" \
            -duration 60s -sub-rate 2 -portal-rate 2 -admin-rate 0.5 -login-rate 0.05 \
            -portal-users 200 -warmup-login-rate 10 -progress 20s \
            -rl-auth-per-min 1000 -out "$LT" -strict > "$LT/users.log" 2>&1 &
          users_pid=$!
          # 节点起跑窗口 10 秒、首轮配置之后再改用户，节点侧应各收到一次流推送的全量用户表
          sleep 25
          burst_rc=0
          "$S/bin/loadtest" burst -manifest "$S/lt-manifest.json" -admin-url "$SMOKE_ADMIN_BASE" \
            -count 2 -interval 10s -out "$LT" > "$LT/burst.log" 2>&1 || burst_rc=$?
          nodes_rc=0; users_rc=0
          wait "$nodes_pid" || nodes_rc=$?
          wait "$users_pid" || users_rc=$?
          for f in burst.log nodes.log users.log; do echo "::group::$f"; cat "$LT/$f"; echo "::endgroup::"; done
          {
            echo "### 压测工具试跑（200 用户、5 节点、60 秒）"
            echo
            echo "nodes=$nodes_rc users=$users_rc burst=$burst_rc，总耗时 $(( $(date +%s) - start ))s"
            for f in nodes users burst-http; do
              [ -f "$LT/$f.txt" ] || continue
              echo; echo '```'; cat "$LT/$f.txt"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "nodes=$nodes_rc users=$users_rc burst=$burst_rc"
          [ "$nodes_rc" = 0 ] && [ "$users_rc" = 0 ] && [ "$burst_rc" = 0 ]
      # 购买路径的无头浏览器测试（tests/browser，w8walk 的 31 步在门户与后台的页面上点一遍）：
      # 种子现场生成用户与套餐，只经真网关；每步读页面文字核对金额、到期日、按钮与错误提示。
      # 放在最后：它只留自己的演示易支付渠道收新单（站点最低付款额要是 ¥1.00），会改变之后下单的前提
      - name: Playwright version for the browser cache
        id: playwright
        if: always() && steps.stack.outcome == 'success'
        working-directory: panel/frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: always() && steps.stack.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Browser purchase paths (Playwright, headless Chromium)
        if: always() && steps.stack.outcome == 'success'
        timeout-minutes: 8
        working-directory: panel/frontend
        env:
          SMOKE_STATE: ${{ runner.temp }}/smoke
          BROWSER_OUT: ${{ runner.temp }}/smoke/browser
        run: |
          start=$(date +%s)
          npx playwright install --with-deps --only-shell chromium
          echo "装 Chromium 用了 $(( $(date +%s) - start ))s"
          npx playwright test -c tests/browser/playwright.config.ts
          echo "整步用了 $(( $(date +%s) - start ))s"
      - name: Shape table
        if: always()
        run: |
          f="$RUNNER_TEMP/smoke/smoke-results.md"
          [ -f "$f" ] || exit 0
          {
            echo "### GET 接口 × 页面 schema"
            echo
            echo "| 入口 | 接口 | 调用处 | 结果 | 条数 · 覆盖 | 造数 | 说明 |"
            echo "|---|---|---|---|---|---|---|"
            cat "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$f"
      - name: E2E script table
        if: always()
        run: |
          f="$RUNNER_TEMP/smoke/e2e-results.md"
          [ -f "$f" ] || exit 0
          {
            echo "### e2e 脚本 × 冒烟栈（任一失败即 job 变红）"
            echo
            echo "| 脚本 | 结果 | OK | FAIL | 首个失败所在步骤 | 首个失败 |"
            echo "|---|---|---|---|---|---|"
            cat "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$f"
      - name: Browser path table
        if: always()
        working-directory: panel/frontend
        run: |
          d="$RUNNER_TEMP/smoke/browser"
          [ -d "$d" ] || exit 0
          node tests/browser/table.ts "$d" > /dev/null
          {
            echo "### 购买路径 × 浏览器（Playwright 无头 Chromium，任一失败即 job 变红）"
            echo
            echo "| 步骤 | 页面上看到的 | 预期 | 结果 |"
            echo "|---|---|---|---|"
            cat "$d/results.md"
            echo
            echo "每步一张 1280 宽截图、关键页面另有 375 宽，失败的 trace 与 HTML 报告都在产物 browser-paths 里"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$d/results.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-paths
          path: ${{ runner.temp }}/smoke/browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Gateway logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP/smoke"/logs/aegis-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"; tail -200 "$f"; echo "::endgroup::"
          done
      - name: Stop the stack
        if: always()
        run: bash panel/deploy/run-smoke-stack.sh down "$RUNNER_TEMP/smoke"
