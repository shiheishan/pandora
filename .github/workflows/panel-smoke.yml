name: Panel frontend smoke

# 新前端对真实 pandora 的联调冒烟：一次性 PG18 + Redis 8，
# 从源码编译 pandora 与 nodesim，起 serve 与 worker，
# 之后用前端页面自己的 zod schema 解析真响应，再跑 Playwright 购买路径。
#
# 单独成一个 workflow 而不并进 panel-newstack.yml：
#   - 触发面不同。冒烟要跟着 panel/frontend/src 走（schema 变了就得重验），
#     并进去会让只改前端的推送也拖着全量 go test 与 e2e 跑一遍；
#   - 失败的含义不同。newstack 红是后端逻辑坏了，冒烟红是前后端形状对不上，
#     分开挂在 checks 里一眼能看出该找谁。

on:
  workflow_dispatch:
  push:
    paths:
      - "panel/internal/**"
      - "panel/cmd/**"
      - "panel/db/**"
      - "panel/web/**"
      - "panel/go.mod"
      - "panel/go.sum"
      - "nodeapi/**"
      - "pdnd/panel/**"
      - "pdnd/release/nodesim/**"
      - "pdnd/go.mod"
      - "pdnd/go.sum"
      - "panel/Makefile"
      - "panel/frontend/src/**"
      - "panel/frontend/tests/smoke/**"
      - "panel/frontend/tests/browser/**"
      - "panel/frontend/package.json"
      - "panel/frontend/package-lock.json"
      - "panel/deploy/run-smoke-stack.sh"
      - ".github/workflows/panel-smoke.yml"
  pull_request:
    paths:
      - "panel/internal/**"
      - "panel/cmd/**"
      - "panel/db/**"
      - "panel/web/**"
      - "panel/go.mod"
      - "panel/go.sum"
      - "nodeapi/**"
      - "pdnd/panel/**"
      - "pdnd/release/nodesim/**"
      - "pdnd/go.mod"
      - "pdnd/go.sum"
      - "panel/Makefile"
      - "panel/frontend/src/**"
      - "panel/frontend/tests/smoke/**"
      - "panel/frontend/tests/browser/**"
      - "panel/frontend/package.json"
      - "panel/frontend/package-lock.json"
      - "panel/deploy/run-smoke-stack.sh"
      - ".github/workflows/panel-smoke.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: pandora under the frontend schemas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: |
            panel/go.sum
            pdnd/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      # pandora serve 嵌入真前端产物（同 make frontend-embed，发布包也这么做）：门户在 public、后台在 admin 根上，
      # 浏览器测试点的就是它。仓库里只有占位页，所以必须在起栈编译 pandora 之前构建
      - name: Embed the real frontend
        run: make -C panel frontend-embed
      - name: Start the stack
        id: stack
        run: bash panel/deploy/run-smoke-stack.sh up panel "$RUNNER_TEMP/smoke"
      # 种子经后台与门户接口造数；节点由种子拉起的 nodesim 走 gRPC 接入并上报
      - name: Seed through pandora
        run: node panel/frontend/tests/smoke/seed.ts "$RUNNER_TEMP/smoke"
      - name: Install frontend dependencies
        working-directory: panel/frontend
        run: npm ci
      # 冒烟自己的 tsconfig：页面模块会连带 .tsx，node 侧那份没开 jsx
      - name: Typecheck the smoke tables
        working-directory: panel/frontend
        run: npx tsc -p tests/smoke/tsconfig.json
      # 前端调用的每个 GET 接口，用调用处那个页面 schema 解析真响应；
      # 写路径（writes.smoke.ts）由 vitest.config.ts 的 sequencer 固定排在两张读表之后
      - name: Parse real responses with the page schemas
        working-directory: panel/frontend
        env:
          SMOKE_STATE: ${{ runner.temp }}/smoke
        run: npx vitest run -c tests/smoke/vitest.config.ts
      # panel/tests/*.sh 的 e2e 在 panel-newstack.yml 跑；
      # 「200 用户、5 节点、60 秒零 5xx」的判据由 panel-newstack.yml node-e2e job 的 node_smoke_e2e.sh 覆盖
      # （旧的 tools/loadtest 走旧节点通道）。
      - name: Playwright version for the browser cache
        id: playwright
        if: always() && steps.stack.outcome == 'success'
        working-directory: panel/frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: always() && steps.stack.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Browser purchase paths (Playwright, headless Chromium)
        if: always() && steps.stack.outcome == 'success'
        timeout-minutes: 10
        working-directory: panel/frontend
        env:
          SMOKE_STATE: ${{ runner.temp }}/smoke
          BROWSER_OUT: ${{ runner.temp }}/smoke/browser
        run: |
          start=$(date +%s)
          npx playwright install --with-deps --only-shell chromium
          echo "装 Chromium 用了 $(( $(date +%s) - start ))s"
          npx playwright test -c tests/browser/playwright.config.ts
          echo "整步用了 $(( $(date +%s) - start ))s"
      - name: Shape table
        if: always()
        run: |
          f="$RUNNER_TEMP/smoke/smoke-results.md"
          [ -f "$f" ] || exit 0
          {
            echo "### GET 接口 × 页面 schema"
            echo
            echo "| 入口 | 接口 | 调用处 | 结果 | 条数 · 覆盖 | 造数 | 说明 |"
            echo "|---|---|---|---|---|---|---|"
            cat "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$f"
      - name: Browser path table
        if: always()
        working-directory: panel/frontend
        run: |
          d="$RUNNER_TEMP/smoke/browser"
          [ -d "$d" ] || exit 0
          node tests/browser/table.ts "$d" > /dev/null
          {
            echo "### 购买路径 × 浏览器（Playwright 无头 Chromium，任一失败即 job 变红）"
            echo
            echo "| 步骤 | 页面上看到的 | 预期 | 结果 |"
            echo "|---|---|---|---|"
            cat "$d/results.md"
            echo
            echo "每步一张 1280 宽截图、关键页面另有 375 宽，失败的 trace 与 HTML 报告都在产物 browser-paths 里"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$d/results.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-paths
          path: ${{ runner.temp }}/smoke/browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Stack logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP/smoke"/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            tail -300 "$f"
            echo "::endgroup::"
          done
      - name: Stop the stack
        if: always()
        run: bash panel/deploy/run-smoke-stack.sh down "$RUNNER_TEMP/smoke"
