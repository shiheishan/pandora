# [INPUT]: 由同目录 nginx-realip.sh 把 __LOADGEN_IP__ 换成压测机地址（每个地址一行 set_real_ip_from），压测期间顶替 /etc/aegispanel/cloudflare-realip.conf
# [OUTPUT]: 只对压测机来的连接采信 X-Real-IP，让 $remote_addr 变成每个模拟用户自己的地址
# [POS]: tools/loadtest/scripts 的压测专用 nginx 片段，不属于产品，不进发布包；随包模板 deploy/nginx-aegis.conf 的默认行为不变
#
# 为什么需要：压测机经 nginx 打面板时，所有模拟用户都来自同一个 IP。
#   - nginx-aegis.conf 的 7 个 proxy_pass 位置都写了 proxy_set_header X-Real-IP $remote_addr，
#     面板只信这个头（httpx.ClientIP），于是风控的 IP 聚类、应用层按 IP 限流（AEGIS_RL_IP_PER_MIN、
#     AEGIS_RL_AUTH_PER_MIN）全打在一个 IP 上
#   - nginx 自己的 limit_req（aegis_api 每 IP 240 次/分）与 limit_conn aegis_conn 24 也按
#     $binary_remote_addr 计，整台压测机最多 24 个并发连接——不开这个片段，测出来的是 nginx 的闸门
# 怎么生效：realip 模块在 server 上下文里把可信来源的 $remote_addr 改写成 X-Real-IP 的值，
#   上面那句 proxy_set_header 原样往上游带改写后的值，限流区的键也随之按模拟用户分开。
#   压测工具在每个请求里带该模拟用户自己的 X-Real-IP（造数清单 ltkit.ManifestUser.RealIP）。
#
# 为什么是「顶替」而不是「追加」：模板在 server 块里 include /etc/aegispanel/cloudflare-realip.conf，
#   那里已有 real_ip_header CF-Connecting-IP；real_ip_header 每个上下文只能写一次（再写 nginx -t
#   报 duplicate），写到 http 块也没用（server 块自己的 realip 设置整体覆盖上层）。所以压测期间整份
#   换掉这个 include 文件。代价：这段时间经 Cloudflare 回源的请求不再还原真实 IP（看到的是
#   Cloudflare 边缘地址），只应在压测主机或压测窗口里这么做。
#
# 启用 / 撤销（面板主机，root；脚本做备份、nginx -t 失败自动回滚、reload）：
#   nginx-realip.sh enable <压测机 IP> [更多 IP...]
#   nginx-realip.sh disable          还原压测前的 cloudflare-realip.conf
#   nginx-realip.sh status
# 手工等价操作：cp 原文件到 cloudflare-realip.conf.loadtest-orig → 把本文件替换占位符后写成
#   cloudflare-realip.conf → nginx -t && systemctl reload nginx；撤销时拷回原文件再 nginx -t && reload
#   （原文件丢了就跑 deploy/update-cloudflare-realip.sh 重新生成）。
#
# 安全：可信来源里的任何人都能自称任意 IP。只写压测机的地址，压测一结束就撤销；真实地址不进仓库。

set_real_ip_from __LOADGEN_IP__;
real_ip_header X-Real-IP;
real_ip_recursive off;
