# Pandora Panel unified private edge template.
#
# Render this file with deploy/render-nginx.sh. The domain placeholder becomes
# the host of public_base_url in /etc/pandora/config.yaml (a DNS domain or a
# public IPv4 address) in server_name. The administrator path placeholder comes
# from PANDORA_ADMIN_PATH in /etc/pandora/deploy.env. The certificate is always
# read through /etc/pandora/tls/live, which deploy/edge-tls.sh points at the
# Let's Encrypt certificate (domain via certbot, IP address via lego) or at the
# self-signed fallback. The public portal remains at / and the administrator
# console is mounted below /__PANDORA_ADMIN_PATH__. Node agents connect to the
# panel over gRPC on port 9443 with mTLS; they do not traverse this nginx edge.

limit_req_zone $binary_remote_addr zone=pandora_auth:4m     rate=12r/m;
limit_req_zone $binary_remote_addr zone=pandora_api:4m      rate=240r/m;
limit_req_zone $binary_remote_addr zone=pandora_adm_auth:2m rate=12r/m;
limit_req_zone $binary_remote_addr zone=pandora_adm:2m      rate=300r/m;
limit_req_zone $binary_remote_addr zone=pandora_refresh:2m  rate=60r/m;
limit_conn_zone $binary_remote_addr zone=pandora_conn:4m;

# API 路径（门户 /v1/…、后台 /<前缀>/v1/…）上 nginx 自己产生的错误回与面板同形的 JSON 信封，
# 前端照样按 error.code 处理；其余路径仍是 nginx 默认错误页。后台 location 里 rewrite 去掉前缀后
# $uri 是 /v1/…，带前缀与不带前缀两种写法都算。
map $uri $pandora_api {
    default 0;
    ~^/v1/ 1;
    ~^/__PANDORA_ADMIN_PATH__/v1/ 1;
}

# Request targets are deliberately omitted: subscription URLs and callback
# query strings may contain credentials or signatures.
log_format pandora_safe '$remote_addr - $remote_user [$time_local] '
                        'method=$request_method status=$status bytes=$body_bytes_sent '
                        'request_id=$request_id host=$host protocol=$server_protocol '
                        'ua="$http_user_agent" '
                        'request_time=$request_time upstream_time=$upstream_response_time';

upstream pandora_public {
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream pandora_admin {
    server 127.0.0.1:9001 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

# Port 80 answers only the panel host. Requests with any other Host (scanners
# probing the bare IP of a domain deployment, unknown names) are dropped before
# reaching the application, reducing commodity scan exposure.
server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    # crit 及以上（含 alert 级的「worker_connections are not enough」）写文件；不能是 /dev/null，
    # 否则连接数顶满时什么都看不到（5k-r4）。发行版的 logrotate 覆盖 /var/log/nginx/*.log
    error_log /var/log/nginx/pandora-error.log crit;
    return 444;
}

# 面板地址的 80：只做两件事——Let's Encrypt 的 HTTP-01 校验文件（首次申请与续期都走它，
# certbot 与 lego 都写到同一个 webroot），其余一律 308 跳到 https（308 保留方法与请求体，
# 写成 http 的支付回调也不会被改成 GET）。
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name __PANDORA_DOMAIN__;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/pandora-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pandora-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    # 127.0.0.1:9080 是本机回环运维入口（安装与迁移脚本的收尾验证走它）。
    # 公网只经面板地址的 80（跳 443）与 443 进来，没有公网明文入口。
    listen 127.0.0.1:9080;
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    # HTTP/2：同源的门户与后台各开 SSE，HTTP/1.1 每源 6 条连接，开到第 6 个标签页新页面就挂住；
    # 冷加载的十几个资源也省掉多次握手。render-nginx.sh 按本机 nginx 版本渲染：
    # 1.25.1 及以上保留这一行；更老或探不到版本时删掉它，改在上面两条 443 的 listen 末尾加 http2
    http2 on;
    server_name __PANDORA_DOMAIN__;
    server_tokens off;

    # Generated from Cloudflare's official IPv4/IPv6 lists. Only connections
    # from those networks may supply CF-Connecting-IP.
    include /etc/pandora/cloudflare-realip.conf;

    # 证书一律经这个稳定路径：edge-tls.sh 把 live 指向 Let's Encrypt 证书或自签兜底，
    # 换证书只改链接再 reload，不重新渲染本文件
    ssl_certificate /etc/pandora/tls/live/fullchain.pem;
    ssl_certificate_key /etc/pandora/tls/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 2m 约 8000 个会话（每个约 256 字节）。10m 是 40000 个，千节点 + 数千用户远用不满，
    # 而共享区在 worker 里常驻
    ssl_session_cache shared:PandoraTLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/pandora-access.log pandora_safe;
    # 只留 crit 及以上：error 级的日志行带请求行（订阅令牌、回调签名），这一级不写；crit / alert
    # 是 fd 与连接数耗尽、SSL 内部错误这类，要看得见。少数 crit 行在请求上下文里同样带请求行，
    # 文件权限按发行版 /var/log/nginx 的规矩（root:adm）
    error_log /var/log/nginx/pandora-error.log crit;

    # HTTP/2 下每个并发请求都算一条「连接」（nginx 文档）：一个标签页冷加载就有约 30 个
    # 并发请求，常驻的 SSE 每个标签页再占一条。HTTP/1.1 时一个浏览器最多 6 条，24 够用；
    # 开了 HTTP/2 不放宽，资源会被 503
    limit_conn pandora_conn 64;

    # 限速与连接数超限回 429（缺省是 503）：与面板的 rate_limited 同码，503 只留给「服务不可用」
    limit_req_status 429;
    limit_conn_status 429;

    # nginx 自己产生的错误（请求体超过 client_max_body_size、限速、连不上或等不到上游）：API 路径回
    # JSON 信封，别的路径仍是默认错误页（见文件末尾的 @pandora_* 命名 location）。不开
    # proxy_intercept_errors：面板自己回的错误已是信封，原样透传。
    error_page 413 @pandora_413;
    error_page 429 @pandora_429;
    error_page 502 @pandora_502;
    error_page 503 @pandora_503;
    error_page 504 @pandora_504;

    # 网关给 .js 发的是 text/javascript（webapp 的 contentTypes），只登记 application/javascript
    # 时 JS 原样下发。订阅正文是 text/yaml（Clash）、application/json（sing-box）、text/plain
    # （URI 列表）：节点多时一份几十到上百 KB，压缩后约小七成，移动网络上拉订阅明显更快。
    # 级别 5 比 1 小约 15%：级别按配置块定、不能按类型分，订阅路径又是随机前缀，所以全站一档；
    # 取 5 是为了新访客首次加载的 JS/CSS 不变大。以后订阅改由渲染缓存直接给预压缩正文、静态资源
    # 构建期预压缩，这里的现压 CPU 就整个省掉
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/yaml text/plain image/svg+xml;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;

    # Exact administrator login gets the strictest edge throttle. The path is
    # replaced at deployment time and is never written to access logs.
    location = /__PANDORA_ADMIN_PATH__/v1/auth/login {
        limit_req zone=pandora_adm_auth burst=5 nodelay;
        rewrite ^/__PANDORA_ADMIN_PATH__(/.*)$ $1 break;
        proxy_pass http://pandora_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        proxy_cookie_path /v1/auth /__PANDORA_ADMIN_PATH__/v1/auth;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /__PANDORA_ADMIN_PATH__/v1/auth/refresh {
        limit_req zone=pandora_refresh burst=20 nodelay;
        rewrite ^/__PANDORA_ADMIN_PATH__(/.*)$ $1 break;
        proxy_pass http://pandora_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_cookie_path /v1/auth /__PANDORA_ADMIN_PATH__/v1/auth;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /__PANDORA_ADMIN_PATH__/v1/events {
        limit_req zone=pandora_adm burst=60 nodelay;
        rewrite ^/__PANDORA_ADMIN_PATH__(/.*)$ $1 break;
        proxy_pass http://pandora_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_cookie_path /v1/auth /__PANDORA_ADMIN_PATH__/v1/auth;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # The console must be served from the trailing-slash URL: the SPA resolves
    # ./assets/ and v1/ relative to the entry page, so serving it at the bare
    # prefix would send its asset and API requests to the public gateway at /.
    location = /__PANDORA_ADMIN_PATH__ {
        return 301 /__PANDORA_ADMIN_PATH__/;
    }

    # ^~ prevents public regex locations from intercepting administrator APIs.
    # The prefix is removed before forwarding to the isolated admin service.
    location ^~ /__PANDORA_ADMIN_PATH__/ {
        limit_req zone=pandora_adm burst=60 nodelay;
        rewrite ^/__PANDORA_ADMIN_PATH__(/.*)$ $1 break;
        proxy_pass http://pandora_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cookie_path /v1/auth /__PANDORA_ADMIN_PATH__/v1/auth;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /v1/auth/refresh {
        limit_req zone=pandora_refresh burst=20 nodelay;
        proxy_pass http://pandora_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location ~ ^/v1/auth/ {
        limit_req zone=pandora_auth burst=8 nodelay;
        proxy_pass http://pandora_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /v1/events {
        limit_req zone=pandora_api burst=60 nodelay;
        proxy_pass http://pandora_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/v1/webhooks/ {
        limit_req zone=pandora_api burst=120 nodelay;
        proxy_pass http://pandora_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /readyz { deny all; }

    location = /healthz { deny all; }

    location / {
        limit_req zone=pandora_api burst=60 nodelay;
        proxy_pass http://pandora_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # 以下是 error_page 指向的命名 location。request_id 用 nginx 的 $request_id（与访问日志里
    # request_id= 是同一个值，按它查 pandora-access.log）；它与面板的 X-Request-ID 不是一回事：
    # nginx 不把它传给面板，请求没到面板时面板日志里也没有它。非 API 路径 return 不带正文，
    # 回 nginx 默认错误页（recursive_error_pages 缺省关，不会再进 error_page）。
    location @pandora_413 {
        default_type application/json;
        if ($pandora_api) {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 413 '{"error":{"code":"payload_too_large","message":"\u8bf7\u6c42\u5185\u5bb9\u8fc7\u5927","request_id":"$request_id"}}';
        }
        return 413;
    }

    location @pandora_429 {
        default_type application/json;
        if ($pandora_api) {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"error":{"code":"rate_limited","message":"\u64cd\u4f5c\u592a\u9891\u7e41\uff0c\u8bf7\u7a0d\u540e\u518d\u8bd5","request_id":"$request_id"}}';
        }
        return 429;
    }

    location @pandora_502 {
        default_type application/json;
        if ($pandora_api) {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 502 '{"error":{"code":"service_unavailable","message":"\u670d\u52a1\u6682\u65f6\u4e0d\u53ef\u7528\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5","request_id":"$request_id"}}';
        }
        return 502;
    }

    location @pandora_503 {
        default_type application/json;
        if ($pandora_api) {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"error":{"code":"service_unavailable","message":"\u670d\u52a1\u6682\u65f6\u4e0d\u53ef\u7528\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5","request_id":"$request_id"}}';
        }
        return 503;
    }

    location @pandora_504 {
        default_type application/json;
        if ($pandora_api) {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 504 '{"error":{"code":"timeout","message":"\u8bf7\u6c42\u8d85\u65f6\uff0c\u8bf7\u7a0d\u540e\u518d\u8bd5","request_id":"$request_id"}}';
        }
        return 504;
    }
}
