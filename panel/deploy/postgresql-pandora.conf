# Pandora 的 PostgreSQL 18 参数：install.sh 装到 /etc/postgresql/18/main/conf.d/pandora.conf（Debian 的
# postgresql.conf 缺省 include_dir = 'conf.d'，安装器先核这一行生效，没有就停下），每次安装、升级整份覆盖；
# 变了才重启（与 PostgreSQL 的加固 drop-in 同一次重启，在停服窗口里；起不来两样一起还原）。
# 用 conf.d 不用 ALTER SYSTEM：原因见 install-lib.sh 的 native_apply_pg_config；postgresql.auto.conf 留给运维。
# 开发用数据基座 panel/dev/docker-compose.yml 以 -c 给同一组值，dev-compose_static_test.sh 核对一致；
# Go 契约测试 configure_role_contract_test.go 读这份文件核 jit=off。
# 手改会被下次安装覆盖；要改值，改这份文件随发布走。

# --- 低内存主机调参（2c4g 面板机；三个网关的连接池合计 46 条，见 internal/platform/config/runtime.go）---
max_connections = 60
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 48MB

# --- 关 JIT：PG18 缺省 jit=on、jit_above_cost=100000，带每行子计划的查询（如节点拉用户列表）代价估计
#     轻易越线，编译耗时远超执行本身。5k 用户实测 JIT 吃掉约 78% 的库执行时间（节点用户列表
#     1269ms → 关后 234ms）。这里关的是整个实例（含迁移与维护用的超级用户）；configure-app-role.sql
#     另对运行角色 aegis_app 按库设 jit=off。两处都关是有意的：角色级设置压过这里，任何一处被改回
#     都不会让应用重新开 JIT。
jit = off

# --- 可靠性 / NFR-003 时间点恢复的前提 ---
wal_level = replica
max_wal_size = 512MB
min_wal_size = 96MB
checkpoint_completion_target = 0.9

# --- 可观测性 NFR-005：慢查询与锁等待；检查点打日志（每次一行：写了多少缓冲、同步耗时，一小时十几行）---
log_min_duration_statement = 500
log_lock_waits = on
log_checkpoints = on

# --- 强制 UTC，账期换算全部在应用层按租户时区做（SUB-010）---
timezone = 'UTC'
