# Pandora Panel unified private edge template.
#
# Render this file with deploy/render-nginx.sh. The domain placeholder becomes
# the host of AEGIS_PUBLIC_BASE_URL (a DNS domain or a public IPv4 address) in
# server_name, so the edge answers for the same origin the panel builds its
# links from. The certificate is always read through /etc/aegispanel/tls/live,
# which deploy/edge-tls.sh points at the Let's Encrypt certificate (domain via
# certbot, IP address via lego) or at the self-signed fallback.
# The public portal remains at / and the administrator console is mounted
# below /__AEGIS_ADMIN_PATH__. The
# administrator upstream stays a separate process and authentication domain;
# only the browser-facing listener is unified.

limit_req_zone $binary_remote_addr zone=aegis_auth:4m     rate=12r/m;
limit_req_zone $binary_remote_addr zone=aegis_api:4m      rate=240r/m;
limit_req_zone $binary_remote_addr zone=aegis_adm_auth:2m rate=12r/m;
limit_req_zone $binary_remote_addr zone=aegis_adm:2m      rate=300r/m;
limit_conn_zone $binary_remote_addr zone=aegis_conn:4m;

# 节点网关单独限速。一台机器挂几十个节点时，全部请求来自同一个 IP：60 个节点每分钟约
# 810 次（配置、用户、状态、流量、在线、事件流），按每 IP 240 次的 aegis_api 会被 503。
# 改按「来源 IP + 节点标识」分桶：签名通道取请求头 X-Node-Id，兼容通道（UniProxy）取
# query 的 node_id。只认 UUID 形状，别的值（含缺失）一律当空串，于是没带标识的请求
# （接入、引导）退回按 IP 一个桶，和原来一样每分钟 240 次。换着节点标识刷请求绕不过
# 下面的每 IP 总上限 aegis_node_ip。
map $http_x_node_id $aegis_signed_node {
    "~^[0-9A-Fa-f-]{36}$" $http_x_node_id;
    default               "";
}
map $arg_node_id $aegis_compat_node {
    "~^[0-9A-Fa-f-]{36}$" $arg_node_id;
    default               "";
}
limit_req_zone "$binary_remote_addr$aegis_signed_node$aegis_compat_node" zone=aegis_node:8m rate=240r/m;
limit_req_zone $binary_remote_addr zone=aegis_node_ip:4m rate=3000r/m;
# 节点的长连接（每个节点一条事件流）单独计数，不和浏览器的 aegis_conn 混用
limit_conn_zone $binary_remote_addr zone=aegis_node_conn:4m;

# 节点路径的访问日志只记「不正常」的：2xx 与 304 不写。节点每分钟约 12 条请求，千节点
# 约 12000 行/分、4GB/天，几乎全是 304 / 204 / 200，对排障没有信息量，却占 nginx 的写盘 CPU
# 与磁盘。限流 503、鉴权 401/403、上游 502/504、400 这类异常照常入账，且立即落盘（不像
# buffer= 那样最多晚 5 秒、进程崩了丢缓冲）；成功请求的排障看 aegis-node 自己的日志与指标。
map $status $aegis_node_log {
    ~^2     0;
    304     0;
    default 1;
}

# Request targets are deliberately omitted: subscription URLs and callback
# query strings may contain credentials or signatures.
log_format aegis_safe '$remote_addr - $remote_user [$time_local] '
                      'method=$request_method status=$status bytes=$body_bytes_sent '
                      'request_id=$request_id host=$host protocol=$server_protocol '
                      'ua="$http_user_agent" '
                      'request_time=$request_time upstream_time=$upstream_response_time';

upstream aegis_public {
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream aegis_admin {
    server 127.0.0.1:9001 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

upstream aegis_node {
    server 127.0.0.1:9003 max_fails=3 fail_timeout=10s;
    keepalive 16;
    # 节点约 200 次/秒打在这 16 条空闲长连接上，缺省 1000 次就换一条（约每 80 秒一轮），
    # 每次换连接都要在 aegis-node 侧重新建 bufio 与 goroutine。调到实际上不限，
    # 连接寿命交给 keepalive_timeout / keepalive_time 管
    keepalive_requests 100000;
}

# Port 80 answers only the panel host. Requests with any other Host (scanners
# probing the bare IP of a domain deployment, unknown names) are dropped before
# reaching the application, reducing commodity scan exposure.
server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    # crit 及以上（含 alert 级的「worker_connections are not enough」）写文件；不能是 /dev/null，
    # 否则连接数顶满时什么都看不到（5k-r4）。发行版的 logrotate 覆盖 /var/log/nginx/*.log
    error_log /var/log/nginx/aegis-error.log crit;
    return 444;
}

# 面板地址的 80：只做两件事——Let's Encrypt 的 HTTP-01 校验文件（首次申请与续期都走它，
# certbot 与 lego 都写到同一个 webroot），其余一律 308 跳到 https（308 保留方法与请求体，
# 写成 http 的支付回调也不会被改成 GET）。
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name __AEGIS_DOMAIN__;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/aegis-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aegis-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    # 127.0.0.1:9080 是本机回环运维入口（安装与迁移脚本的收尾验证走它）。
    # 公网只经面板地址的 80（跳 443）与 443 进来，没有公网明文入口。
    listen 127.0.0.1:9080;
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    # HTTP/2：同源的门户与后台各开 SSE，HTTP/1.1 每源 6 条连接，开到第 6 个标签页新页面就挂住；
    # 冷加载的十几个资源也省掉多次握手。render-nginx.sh 按本机 nginx 版本渲染：
    # 1.25.1 及以上保留这一行；更老或探不到版本时删掉它，改在上面两条 443 的 listen 末尾加 http2
    http2 on;
    server_name __AEGIS_DOMAIN__;
    server_tokens off;

    # Generated from Cloudflare's official IPv4/IPv6 lists. Only connections
    # from those networks may supply CF-Connecting-IP.
    include /etc/aegispanel/cloudflare-realip.conf;

    # 证书一律经这个稳定路径：edge-tls.sh 把 live 指向 Let's Encrypt 证书或自签兜底，
    # 换证书只改链接再 reload，不重新渲染本文件
    ssl_certificate /etc/aegispanel/tls/live/fullchain.pem;
    ssl_certificate_key /etc/aegispanel/tls/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 2m 约 8000 个会话（每个约 256 字节）。10m 是 40000 个，千节点 + 数千用户远用不满，
    # 而共享区在 worker 里常驻
    ssl_session_cache shared:PandoraTLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/aegis-access.log aegis_safe;
    # 只留 crit 及以上：error 级的日志行带请求行（订阅令牌、回调签名），这一级不写；crit / alert
    # 是 fd 与连接数耗尽、SSL 内部错误这类，要看得见。少数 crit 行在请求上下文里同样带请求行，
    # 文件权限按发行版 /var/log/nginx 的规矩（root:adm）
    error_log /var/log/nginx/aegis-error.log crit;

    # HTTP/2 下每个并发请求都算一条「连接」（nginx 文档）：一个标签页冷加载就有约 30 个
    # 并发请求，常驻的 SSE 每个标签页再占一条。HTTP/1.1 时一个浏览器最多 6 条，24 够用；
    # 开了 HTTP/2 不放宽，资源会被 503
    limit_conn aegis_conn 64;

    # 网关给 .js 发的是 text/javascript（webapp 的 contentTypes），只登记 application/javascript
    # 时 JS 原样下发。订阅正文是 text/yaml（Clash）、application/json（sing-box）、text/plain
    # （URI 列表）：节点多时一份几十到上百 KB，压缩后约小七成，移动网络上拉订阅明显更快。
    # 级别 1：nginx 的压缩级别按配置块定、不能按类型分，订阅路径又是两段随机前缀、没有固定
    # location 可单独设；订阅体与静态资源每次请求现压，级别 1 的 CPU 约为 5 的三分之一，
    # 体积只大约 15%（订阅是低频、静态资源带哈希长缓存，首次之后不再下载）
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json text/yaml text/plain image/svg+xml;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_vary on;

    # Exact administrator login gets the strictest edge throttle. The path is
    # replaced at deployment time and is never written to access logs.
    location = /__AEGIS_ADMIN_PATH__/v1/auth/login {
        limit_req zone=aegis_adm_auth burst=5 nodelay;
        rewrite ^/__AEGIS_ADMIN_PATH__(/.*)$ $1 break;
        proxy_pass http://aegis_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # The console must be served from the trailing-slash URL: the SPA resolves
    # ./assets/ and v1/ relative to the entry page, so serving it at the bare
    # prefix would send its asset and API requests to the public gateway at /.
    location = /__AEGIS_ADMIN_PATH__ {
        return 301 /__AEGIS_ADMIN_PATH__/;
    }

    # ^~ prevents public regex locations from intercepting administrator APIs.
    # The prefix is removed before forwarding to the isolated admin service.
    location ^~ /__AEGIS_ADMIN_PATH__/ {
        limit_req zone=aegis_adm burst=60 nodelay;
        rewrite ^/__AEGIS_ADMIN_PATH__(/.*)$ $1 break;
        proxy_pass http://aegis_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 1h;
        proxy_buffering off;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ ^/v1/auth/ {
        limit_req zone=aegis_auth burst=8 nodelay;
        proxy_pass http://aegis_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location ~ ^/v1/webhooks/ {
        limit_req zone=aegis_api burst=120 nodelay;
        proxy_pass http://aegis_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Node agents use the same public TLS edge but a separate upstream and
    # authentication domain. UniProxy uses Bearer credentials; native agent
    # bootstrap is one-time and subsequent requests require Ed25519 signatures.
    location ^~ /api/v1/server/UniProxy/ {
        # 按节点分桶，外加宽松的每 IP 总上限；limit_conn 在这一层另写，server 层的 64 不再生效
        limit_req zone=aegis_node burst=120 nodelay;
        limit_req zone=aegis_node_ip burst=600 nodelay;
        limit_conn aegis_node_conn 512;
        access_log /var/log/nginx/aegis-access.log aegis_safe if=$aegis_node_log;
        proxy_pass http://aegis_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location ^~ /v1/nodes/ {
        # 同上：一台机器 60 个节点各有一条事件流，limit_conn 放宽到 512
        limit_req zone=aegis_node burst=60 nodelay;
        limit_req zone=aegis_node_ip burst=600 nodelay;
        limit_conn aegis_node_conn 512;
        access_log /var/log/nginx/aegis-access.log aegis_safe if=$aegis_node_log;
        proxy_pass http://aegis_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /readyz { deny all; }

    location / {
        limit_req zone=aegis_api burst=60 nodelay;
        proxy_pass http://aegis_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }
}
