# 小机器 / 与他人共用的机器上的资源上限。
#
# 放到 /etc/systemd/system/aegis-nodeagent.service.d/ 下即可生效，
# 不要去改主 unit —— 改了下次比对就分不清是有意调整还是部署漂移。
#
# 用在 1 核 2G、上面还跑着别的业务的共享机上：
# 给节点端设上限，免得它某次异常把整机拖垮。代理进程崩了只影响代理，
# 拖垮机器会连带别的业务一起。
#
# 大机器、专机不要用这份，1048576 的 NOFILE 是按几百用户的并发算的。

[Service]
MemoryMax=512M
CPUQuota=60%
LimitNOFILE=65535
