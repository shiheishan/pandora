# AegisPanel 数据基座。
#
# 该 compose 与宿主机上的其他 compose 项目完全隔离：
#   - 独立项目名 aegis（COMPOSE_PROJECT_NAME）
#   - 独立 bridge 网络 aegis_data
#   - 独立命名卷 aegis_pgdata / aegis_valkeydata
#   - 宿主端口只绑 127.0.0.1，满足 ARC-003「数据面私有化」：外部扫描不可达
#   - 另把两个服务的 unix socket 放到本目录的 run/ 下（宿主机可见）：装好的网关经 socket
#     直连，不走 Docker 的 userland docker-proxy。回环端口 5433 → docker-proxy → 容器
#     每个往返多一次用户态拷贝和两次上下文切换，5k 复测里 docker-proxy 的 CPU 排第 3。
#     install.sh 确认 socket 可用后才把 .env 的两条连接串换成 socket 形式；回环端口照留，
#     给迁移、维护与本地开发用
#
# 内存预算：按低内存主机调参，两个服务都压低了内存占用。
name: aegis

services:
  postgres:
    image: postgres:18-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      # scram-sha-256 而非 md5：避免弱口令哈希被离线破解
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # --- 低内存主机调参 ---
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      # --- 关 JIT：PG18 缺省 jit=on、jit_above_cost=100000，带每行子计划的查询
      #     （如节点拉用户列表）代价估计轻易越线，编译耗时远超执行本身。5k 用户
      #     实测 JIT 吃掉约 78% 的库执行时间（节点用户列表 1269ms → 关后 234ms）。
      #     这里关的是整个实例（含迁移与维护用的超级用户）；configure-app-role.sql
      #     另对运行角色 aegis_app 按库设 jit=off，覆盖不经这份 compose 的原生安装。
      #     两处都关是有意的：命令行参数压过 postgresql.conf 与 ALTER SYSTEM，
      #     角色级设置又压过命令行，任何一处被改回都不会让应用重新开 JIT。
      - -c
      - jit=off
      # --- 可靠性 / NFR-003 时间点恢复的前提 ---
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=96MB
      - -c
      - checkpoint_completion_target=0.9
      # --- 可观测性 NFR-005：慢查询与自动 EXPLAIN 线索 ---
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=off
      # --- 强制 UTC，账期换算全部在应用层按租户时区做（SUB-010）---
      - -c
      - timezone=UTC
    ports:
      # 只绑回环地址：不产生公网监听
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PG 18+ 镜像改用 pg_ctlcluster 布局（主版本号子目录），挂载点必须是
      # /var/lib/postgresql 而非旧版的 /var/lib/postgresql/data，
      # 否则启动时报「unused mount/volume」并循环重启。
      - pgdata:/var/lib/postgresql
      # 宿主机 run/postgresql/.s.PGSQL.5432 就是容器里 PG 的 socket。挂在镜像默认的 socket
      # 目录上：入口脚本每次启动都把它 chown 给 postgres、chmod 3775，重启后宿主目录被 Docker
      # 重新建成 root 所有也照常可写；其他本机用户只能连、不能在里面放文件
      - ./run/postgresql:/var/run/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512M

  valkey:
    # Valkey 8 = Redis 协议兼容的 BSD 许可分支（Redis 7.4+ 已改 RSALv2/SSPL）
    image: valkey/valkey:8-alpine
    container_name: aegis-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - --maxmemory
      - 96mb
      # 限流计数器、幂等键、会话缓存都允许被淘汰；持久化状态一律落 PG
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
      # 危险命令改名，降低横向移动价值
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      # 宿主机 run/valkey/valkey.sock：挂在 /data 下，入口脚本每次启动把 /data 整棵 chown 给
      # valkey，socket 目录因此总是可写；770 让本机其他用户连不上（网关以 root 运行）
      - --unixsocket
      - /data/sock/valkey.sock
      - --unixsocketperm
      - "770"
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6380}:6379"
    volumes:
      - valkeydata:/data
      - ./run/valkey:/data/sock
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 160M

networks:
  data:
    name: aegis_data
    driver: bridge

volumes:
  pgdata:
    name: aegis_pgdata
  valkeydata:
    name: aegis_valkeydata
