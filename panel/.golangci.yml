# 由 tools/depguardgen 生成，不要手改；改规则改生成器，加模块后重新运行。
# tools、tests、web 不进 lint。
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        handler-no-db:
          files:
            - "**/internal/module/*/handler/**"
            - "**/internal/module/*/task/**"
            - "**/internal/module/*/grpc/**"
          deny:
            - pkg: gorm.io
              desc: handler、task 与 grpc 不碰数据库，经 service 访问
            - pkg: github.com/aegispanel/aegis/internal/pkg/db$
              desc: handler 与 task 不碰数据库，经 service 访问
            - pkg: github.com/aegispanel/aegis/internal/pkg/tx
              desc: 事务边界在 service
        service-no-gorm:
          files:
            - "**/internal/module/*/service/**"
          deny:
            - pkg: gorm.io
              desc: service 不直接用 GORM，读写经本模块 repo，事务经 internal/pkg/tx
            - pkg: github.com/aegispanel/aegis/internal/pkg/db$
              desc: service 不直接取连接，事务经 internal/pkg/tx
        model-plain:
          files:
            - "**/internal/module/*/model/**"
          deny:
            - pkg: github.com/aegispanel/aegis/internal/module
              desc: model 只放字段与标签，不依赖任何模块
        pure-packages:
          files:
            - "**/internal/module/*/render/**"
            - "**/internal/module/*/protocol/**"
          deny:
            - pkg: github.com/aegispanel/aegis/internal/module
              desc: 纯函数包（订阅渲染、节点协议），不依赖任何模块
            - pkg: gorm.io
              desc: 纯函数包不碰数据库
            - pkg: github.com/aegispanel/aegis/internal/pkg/db$
              desc: 纯函数包不碰数据库
            - pkg: github.com/aegispanel/aegis/internal/pkg/tx
              desc: 纯函数包不碰数据库
        pkg-no-business:
          files:
            - "**/internal/pkg/**"
          deny:
            - pkg: github.com/aegispanel/aegis/internal/module
              desc: 基础设施不依赖业务模块
            - pkg: github.com/aegispanel/aegis/internal/app
              desc: 基础设施不依赖装配层
        httpx-no-db:
          files:
            - "**/internal/pkg/httpx/**"
            - "**/internal/pkg/ratelimit/**"
          deny:
            - pkg: gorm.io
              desc: 中间件不碰数据库
            - pkg: github.com/aegispanel/aegis/internal/pkg/db$
              desc: 中间件不碰数据库
        stack-conventions:
          files:
            - "**/internal/pkg/**"
            - "**/internal/app/**"
            - "**/internal/module/**"
            - "**/cmd/pandora/**"
            - "**/db/migrations/**"
          deny:
            - pkg: github.com/go-chi/chi
              desc: 新栈用 gin
            - pkg: github.com/jackc/pgx/v5/pgxpool
              desc: 新栈经 GORM 访问数据库
        # 标准库日志只在生产代码里禁：测试里第三方夹具的 API 可能要求传 *log.Logger
        stack-no-stdlog:
          files:
            - "**/internal/pkg/**"
            - "**/internal/app/**"
            - "**/internal/module/**"
            - "**/cmd/pandora/**"
            - "**/db/migrations/**"
            - "!$test"
          deny:
            - pkg: log$
              desc: 日志用 zap（internal/pkg/log）
            - pkg: log/slog
              desc: 日志用 zap（internal/pkg/log）
        # 只有用 database/sql 打开连接的地方（goose 迁移、测试夹具）可以碰 database/sql；测试照旧可用
        stack-no-database-sql:
          files:
            - "**/internal/pkg/**"
            - "**/internal/app/**"
            - "**/internal/module/**"
            - "**/cmd/pandora/**"
            - "!$test"
            - "!**/internal/app/migrate.go"
            - "!**/internal/pkg/testkit/**"
          deny:
            - pkg: database/sql
              desc: 经 GORM 访问数据库（internal/pkg/db），取不到行看 RowsAffected 或 gorm.ErrRecordNotFound
        # pgx 只在 internal/pkg/db（约束违例翻译）与用 pgx 驱动打开 database/sql 的地方出现；测试同样适用
        stack-no-pgx:
          files:
            - "**/internal/pkg/**"
            - "**/internal/app/**"
            - "**/internal/module/**"
            - "**/cmd/pandora/**"
            - "**/db/migrations/**"
            - "!**/internal/pkg/db/**"
            - "!**/internal/pkg/testkit/**"
            - "!**/internal/app/migrate.go"
            - "!**/db/migrations/migrations_test.go"
          deny:
            - pkg: github.com/jackc/pgx
              desc: 约束违例经 db.AsViolation / db.ConstraintErrors 翻译，可重试错误经 db.IsRetryable 判断
        # handler、task、grpc 经本模块 service 读写，不直接用 repo，也不把 model 直接序列化出去
        module-appearance-entry:
          files:
            - "**/internal/module/appearance/handler/**"
            - "**/internal/module/appearance/task/**"
            - "**/internal/module/appearance/grpc/**"
          deny:
            - pkg: github.com/aegispanel/aegis/internal/module/appearance/repo
              desc: 经本模块 service 读写
            - pkg: github.com/aegispanel/aegis/internal/module/appearance/model
              desc: 对外用 service 的类型与 handler 的 DTO，不直接用 model
        module-appearance-boundary:
          files:
            - "**/internal/module/appearance/**"
            - "!$test"
          deny:
            - pkg: github.com/aegispanel/aegis/internal/module/audit/repo
              desc: 别的模块的数据经它的 service 取
            - pkg: github.com/aegispanel/aegis/internal/module/audit/model
              desc: 别的模块的数据经它的 service 取
            - pkg: github.com/aegispanel/aegis/internal/module/audit/handler
              desc: 模块之间只调 service
            - pkg: github.com/aegispanel/aegis/internal/module/audit/task
              desc: 模块之间只调 service
            - pkg: github.com/aegispanel/aegis/internal/module/audit/grpc
              desc: 模块之间只调 service
            - pkg: github.com/aegispanel/aegis/internal/module/audit/provider
