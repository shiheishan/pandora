function fmtDateTime(s){
  if (!s) return '—';
  const d = new Date(s), p = n => String(n).padStart(2,'0');
  return (d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function submitTicket(){
  const btn = $('tkSubmit');
  const body = $('tkBody').value.trim();
  if (body.length < 10)   return toast('详细说明至少 10 个字', 'err');

  busy(btn, true, '提交中');
  try{
	const payload={body};
    const t = await api('/v1/support/tickets', {method:'POST',
      idem:supportCreateAttempt.keyFor(payload),body:JSON.stringify(payload)});
	supportCreateAttempt.reset();
    toast('工单已提交 ' + t.ticket_no, 'ok');
    await renderSupport();
    openTicket(t.id);
  }catch(e){ toast(e.message, 'err'); busy(btn, false); }
}

async function openTicket(id){
  let t;
  try { t = await api('/v1/support/tickets/' + id); }
  catch(e){ return toast(e.message, 'err'); }

  const st = TK_STATUS[t.status] || [t.status, ''];
  const closed = t.status === 'closed';
	const visibleMessages=(t.messages||[]).filter(msg=>!msg.internal_note);

  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
  '<div class="modal" style="max-width:640px" role="dialog" aria-modal="true">' +
    '<div class="modal-head">' +
      '<h3 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(t.subject) + '</h3>' +
      '<span class="badge badge-' + (st[1] || 'plain') + '">' + st[0] + '</span>' +
      '<button class="btn-icon" data-close aria-label="关闭">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>' +
    '<div class="tk-thread" id="tkThread">' +
      visibleMessages.map(msg => {
        if (msg.author_kind === 'system'){
          return '<div class="msg system"><div class="msg-body">' + esc(msg.body) + '</div></div>';
        }
        const mine = msg.author_kind === 'user';
        return '<div class="msg' + (mine ? ' mine' : '') + '">' +
          '<span class="msg-who">' + (mine ? '我' : '客服') + ' · ' +
            fmtDateTime(msg.created_at) + '</span>' +
          '<div class="msg-body">' + esc(msg.body) + '</div></div>';
      }).join('') +
    '</div>' +
    (closed
      ? '<div class="tk-compose"><p class="muted" style="margin:0;text-align:center">' +
        '此工单已关闭。如仍有问题，请提交新工单。</p></div>'
      : '<div class="tk-compose">' +
          '<textarea class="input" id="tkReply" maxlength="5000" placeholder="补充说明或回复客服…"></textarea>' +
          '<div class="row" style="margin-top:var(--sp-3)">' +
            '<button class="btn btn-primary" id="tkSend">发送</button>' +
            '<button class="btn btn-ghost" id="tkWithdrawBtn">撤回工单</button>' +
            '<button class="btn btn-ghost" id="tkCloseBtn">结束此工单</button>' +
          '</div>' +
          '<div class="hint" style="margin-top:var(--sp-2)">撤回表示不再需要处理；若问题已解决，请结束工单。</div>' +
        '</div>') +
  '</div>';
  document.body.appendChild(m);

  const thread = m.querySelector('#tkThread');
  thread.scrollTop = thread.scrollHeight;

  const dismiss = () => { m.remove(); renderSupport(); };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = dismiss);
  m.onclick = ev => { if (ev.target === m) dismiss(); };
  document.addEventListener('keydown', function onEsc(ev){
    if (ev.key === 'Escape'){ dismiss(); document.removeEventListener('keydown', onEsc); }
  });

  if (!closed){
	const replyAttempt=idemAttempt(),closeAttempt=idemAttempt();
    m.querySelector('#tkWithdrawBtn').onclick = () => {
      const confirm=document.createElement('div');
      const withdrawAttempt=idemAttempt();
      confirm.className='mask';
      confirm.innerHTML=
        '<div class="modal" role="dialog" aria-modal="true" aria-label="撤回工单">' +
          '<div class="modal-head"><h3>撤回工单</h3></div>' +
          '<div class="modal-body"><p class="muted">撤回表示您不再需要客服处理；若问题已解决，请结束工单。</p>' +
            '<div class="field" style="margin-bottom:0"><label for="tkWithdrawReason">撤回原因（选填）</label>' +
              '<textarea class="input" id="tkWithdrawReason" maxlength="500" placeholder="例如：问题已自行解决"></textarea></div></div>' +
          '<div class="modal-foot"><button class="btn btn-ghost" data-close>再想想</button>' +
            '<button class="btn btn-primary" id="tkWithdrawGo">确认撤回</button></div>' +
        '</div>';
      document.body.appendChild(confirm);
      const closeConfirm=()=>confirm.remove();
      confirm.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeConfirm);
      confirm.onclick=ev=>{if(ev.target===confirm) closeConfirm();};
      confirm.querySelector('#tkWithdrawGo').onclick=async ev=>{
        const btn=ev.currentTarget;
        const payload={reason:confirm.querySelector('#tkWithdrawReason').value.trim()};
        busy(btn,true,'撤回中');
        try{
          await api('/v1/support/tickets/'+id+'/withdraw',{method:'POST',idem:withdrawAttempt.keyFor(payload),body:JSON.stringify(payload)});
          withdrawAttempt.reset();
          closeConfirm();
          m.remove();
          await renderSupport();
          await openTicket(id);
          toast('工单已撤回','ok',2000);
        }catch(e){toast(e.message,'err');busy(btn,false);}
      };
    };
    m.querySelector('#tkSend').onclick = async ev => {
      const btn = ev.currentTarget;
      const body = m.querySelector('#tkReply').value.trim();
      if (!body) return toast('请填写回复内容', 'err');
      busy(btn, true, '发送中');
      try{
		const payload={body};
        await api('/v1/support/tickets/' + id + '/reply',
		  {method:'POST',idem:replyAttempt.keyFor(payload),body:JSON.stringify(payload)});
		replyAttempt.reset();
        m.remove();
        await renderSupport();
        openTicket(id);
        toast('已发送', 'ok', 2000);
      }catch(e){ toast(e.message, 'err'); busy(btn, false); }
    };
    m.querySelector('#tkCloseBtn').onclick = async ev => {
      const btn = ev.currentTarget;
      busy(btn, true, '处理中');
      try{
		const payload={ticket_id:id,action:'close'};
        await api('/v1/support/tickets/' + id + '/close',
		  {method:'POST',idem:closeAttempt.keyFor(payload)});
		closeAttempt.reset();
        toast('工单已关闭', 'ok', 2000);
        dismiss();
      }catch(e){ toast(e.message, 'err'); busy(btn, false); }
    };
  }
}

// 下单确认：优惠码在这一步试算。
//
// 试算与真正的折扣都由服务端算，前端只负责显示 ——
// 两边各算一次迟早会因为取整或封顶规则不同而对不上，
// 而对不上的那一次用户已经付过钱了。
function openConfirmModal(planId, priceId){
  const plan = (cache.plans || []).find(p => p.id === planId);
  const price = plan && (plan.prices || []).find(pr => pr.id === priceId);
  if (!price){ toast('套餐信息已过期，请刷新', 'err'); return; }
  const sym = CUR_SYM[price.currency] || '';
  let applied = '';   // 已试算通过的码

  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
  '<div class="modal" role="dialog" aria-modal="true" aria-label="确认订单">' +
    '<div class="modal-head"><h3>确认订单</h3>' +
      '<button class="btn-icon" data-close aria-label="关闭">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>' +
    '<div class="modal-body">' +
      '<div class="sum">' +
        '<div class="sum-row"><span class="k">套餐</span>' +
          '<span class="v">' + esc(plan.name) + '</span></div>' +
        '<div class="sum-row"><span class="k">原价</span>' +
          '<span class="v num">' + sym + money(price.unit_amount, price.currency) + '</span></div>' +
        '<div class="sum-row" id="cpRow" hidden><span class="k">优惠</span>' +
          '<span class="v num" id="cpVal" style="color:var(--ok)"></span></div>' +
        '<div class="sum-row total"><span class="k">应付</span>' +
          '<span class="v num" id="cpPay">' + sym + money(price.unit_amount, price.currency) +
          ' ' + price.currency + '</span></div>' +
      '</div>' +
      '<div class="field" style="margin:var(--sp-4) 0 0">' +
        '<label for="cpCode">优惠码（可选）</label>' +
        '<div style="display:flex;gap:var(--sp-2)">' +
          '<input class="input" id="cpCode" placeholder="输入优惠码" autocomplete="off" ' +
            'style="text-transform:uppercase">' +
          '<button class="btn btn-ghost" id="cpApply" style="flex:none">使用</button>' +
        '</div>' +
        '<div class="hint" id="cpMsg" style="min-height:16px;margin-top:var(--sp-2)"></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-close>取消</button>' +
      '<button class="btn btn-primary" id="cpGo">确认下单</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(m);

  const close = () => { m.style.animation = 'fadeIn var(--t-fast) reverse';
                        setTimeout(() => m.remove(), 120); };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  m.onclick = ev => { if (ev.target === m) close(); };

  const msg = m.querySelector('#cpMsg');
  m.querySelector('#cpApply').onclick = async ev => {
    const code = m.querySelector('#cpCode').value.trim().toUpperCase();
    if (!code){ applied = ''; return; }
    const btn = ev.currentTarget;
    busy(btn, true, '校验');
    try{
      const r = await api('/v1/coupons/preview', {method:'POST', body: JSON.stringify({
        plan_id: planId, price_id: priceId, coupon_code: code })});
      applied = code;
      m.querySelector('#cpRow').hidden = false;
      m.querySelector('#cpVal').textContent = '−' + sym + money(r.discount, r.currency);
      m.querySelector('#cpPay').textContent = sym + money(r.payable, r.currency) + ' ' + r.currency;
      msg.textContent = '优惠码已应用';
      msg.style.color = 'var(--ok)';
    }catch(e){
      // 试算失败就把码丢掉。留着它下单会在支付前又失败一次，
      // 用户会以为是系统抽风而不是码本身有问题
      applied = '';
      m.querySelector('#cpRow').hidden = true;
      m.querySelector('#cpPay').textContent =
        sym + money(price.unit_amount, price.currency) + ' ' + price.currency;
      msg.textContent = e.message;
      msg.style.color = 'var(--err)';
    }finally{ busy(btn, false); }
  };
  m.querySelector('#cpCode').addEventListener('keydown', ev => {
    if (ev.key === 'Enter'){ ev.preventDefault(); m.querySelector('#cpApply').click(); }
  });

  m.querySelector('#cpGo').onclick = async ev => {
    const btn = ev.currentTarget;
    close();
    await createOrder(planId, priceId, btn, applied);
  };
}

function openCommissionTransferModal(s){
  const m=document.createElement('div');
  const transferAttempt=idemAttempt();
  m.className='mask';
  m.innerHTML=
    '<div class="modal" role="dialog" aria-modal="true" aria-label="转入账户余额">' +
      '<div class="modal-head"><h3>转入账户余额</h3>' +
        '<button class="btn-icon" data-close aria-label="关闭">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
        '</button></div>' +
      '<div class="modal-body"><div class="field"><label for="rfTransferAmt">转入金额（元）</label>' +
        '<input class="input" id="rfTransferAmt" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
        '<div class="hint">可转 ' + (CUR_SYM.CNY||'') + money(s.available,'CNY') + ' CNY，最多为当前可转金额。</div></div></div>' +
      '<div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button>' +
        '<button class="btn btn-primary" id="rfTransferGo">确认转入</button></div>' +
    '</div>';
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  m.onclick=ev=>{if(ev.target===m) close();};
  m.querySelector('#rfTransferGo').onclick=async ev=>{
    const btn=ev.currentTarget;
    const amount=parseCNYMinor(m.querySelector('#rfTransferAmt').value);
    if(!amount) return toast('请输入最多两位小数的有效金额','err');
    if(s.currency!=='CNY'||!Number.isSafeInteger(s.available)||amount>s.available){
      return toast('转入金额不能超过当前可转佣金','err');
    }
    const payload={amount};
    busy(btn,true,'转入中');
    try{
      await api('/v1/me/commission/transfer',{method:'POST',idem:transferAttempt.keyFor(payload),body:JSON.stringify(payload)});
      transferAttempt.reset();
      close();
      await renderReferral();
      try{
        const balance=await api('/v1/me/balance');
        const sym=CUR_SYM[balance.currency]||'';
        toast('佣金已转入余额，当前余额 '+sym+money(balance.balance,balance.currency),'ok',3000);
      }catch(_){toast('佣金已转入余额，请稍后刷新余额','ok',3000);}
    }catch(e){toast(e.message,'err');busy(btn,false);}
  };
}

// 账户余额
//
// 余额可以用来抵扣订单，但抵扣是在下单时锁定、支付成功时才真正扣走的 ——
// 所以下完单还没付款时，这里显示的数字不会立刻变少。
async function openTopupModal(){
  const m = document.createElement('div');
  const topupAttempt = idemAttempt();
  m.className = 'mask';
  m.innerHTML =
  '<div class="modal" role="dialog" aria-modal="true" aria-label="账户充值">' +
    '<div class="modal-head"><h3>账户余额</h3>' +
      '<button class="btn-icon" data-close aria-label="关闭">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>' +
    '<div class="modal-body" id="tpBody">' + skeleton() + '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-close>关闭</button>' +
      '<button class="btn btn-primary" id="tpGo">去支付</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  m.onclick = ev => { if (ev.target === m) close(); };

  let d;
  try{ d = await api('/v1/me/balance'); }
  catch(e){
    m.querySelector('#tpBody').innerHTML =
      '<div class="hint" style="color:var(--err)">' + esc(e.message) + '</div>';
    return;
  }

  const sym = CUR_SYM[d.currency] || '';
  const KINDS = {
    balance_topup: '充值', balance_adjusted: '人工调整',
    order_paid: '购买扣减', refund_issued: '退款',
  };
  const hist = (d.history || []).slice(0, 8).map(h =>
    '<tr><td>' + (KINDS[h.kind] || esc(h.kind)) +
      (h.memo ? '<div class="hint" style="margin:2px 0 0">' + esc(h.memo) + '</div>' : '') + '</td>' +
    '<td class="r num" style="color:' + (h.delta > 0 ? 'var(--ok)' : 'var(--fg)') + '">' +
      (h.delta > 0 ? '+' : '−') + sym + money(Math.abs(h.delta), d.currency) + '</td>' +
    '<td class="sub num">' + fmtDateTime(h.at) + '</td></tr>').join('')
    || '<tr><td colspan="3" class="sub" style="text-align:center;padding:var(--sp-5)">' +
       '还没有余额变动</td></tr>';

  m.querySelector('#tpBody').innerHTML =
    '<div style="text-align:center;padding:var(--sp-4) 0 var(--sp-5)">' +
      '<div class="sub" style="font-size:var(--fs-xs)">当前余额</div>' +
      '<div class="num" style="font-size:var(--fs-4xl);font-weight:600;margin-top:var(--sp-1)">' +
        sym + money(d.balance, d.currency) + '</div>' +
    '</div>' +
    '<div class="field">' +
      '<label for="tpAmt">充值金额（元）</label>' +
      '<input class="input" id="tpAmt" type="number" min="1" step="1" value="50">' +
      '<div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap">' +
        [10, 50, 100, 300, 500].map(v =>
          '<button type="button" class="btn btn-ghost btn-sm" data-amt="' + v + '">' +
          sym + v + '</button>').join('') +
      '</div>' +
      '<div class="hint">充值后余额可用于购买或续费套餐。单次最低 ' + sym + '1。</div>' +
    '</div>' +
    '<div class="sect" style="margin-top:var(--sp-5)">最近变动</div>' +
    '<div class="tbl-wrap"><table class="tbl"><tbody>' + hist + '</tbody></table></div>';

  m.querySelectorAll('[data-amt]').forEach(b =>
    b.onclick = () => { m.querySelector('#tpAmt').value = b.dataset.amt; });

  m.querySelector('#tpGo').onclick = async ev => {
    const yuan = parseFloat(m.querySelector('#tpAmt').value || '0');
    if (!(yuan > 0)){ toast('请填写充值金额', 'err'); return; }
    busy(ev.currentTarget, true, '创建中');
    try{
      // 金额在这里从元转成分。转换只在提交这一处做，
      // 分散到多处早晚会漏掉一次，而漏掉的那次是把 50 元充成了 5 毛
      const payload = {amount: Math.round(yuan * 100)};
      const o = await api('/v1/me/topups', {method:'POST',
        idem: topupAttempt.keyFor(payload), body: JSON.stringify(payload)});
      topupAttempt.reset();
      close();
      // 复用买套餐那套支付弹窗：充值单在支付这一步和普通订单没有区别
      openPayModal({
        order_id: o.order_id, order_no: o.order_no,
        total_amount: o.amount, payable_amount: o.amount,
        discount_amount: 0, balance_applied: 0, currency: o.currency,
        kind: 'topup',
      });
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };
}

// 续费。
//
// 之前这个按钮只是跳到套餐页重新下单，结果是同一个人被开出第二条订阅 ——
// 两个订阅链接、两份配额、两套设备数。真正的续费落在原订阅上。
async function openRenewModal(subId){
  const subs = cache.subs || [];
  const sub = subId ? subs.find(s => s.id === subId)
                    : (subs.find(s => s.status === 'active' || s.status === 'trialing') || subs[0]);
  if (!sub){ toast('还没有可续费的订阅', 'err'); return; }

  const renewalAttempt = idemAttempt();
  const sym = CUR_SYM[sub.currency] || '';
  // 同一个套餐下的其它价格档也列出来 —— 月付转年付是最常见的续费动作，
  // 逼用户为此另买一份反而会开出第二条订阅
  const plan = (cache.plans || []).find(p => p.id === sub.plan_id);
  const prices = (plan && plan.prices) ? plan.prices : [];

  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
  '<div class="modal" role="dialog" aria-modal="true" aria-label="续费">' +
    '<div class="modal-head"><h3>续费</h3>' +
      '<button class="btn-icon" data-close aria-label="关闭">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>' +
    '<div class="modal-body">' +
      '<div class="sum">' +
        '<div class="sum-row"><span class="k">套餐</span>' +
          '<span class="v">' + esc(sub.plan_name || '当前套餐') + '</span></div>' +
        '<div class="sum-row"><span class="k">当前到期</span>' +
          '<span class="v num">' + fmtDate(sub.current_period_end) + '</span></div>' +
        '<div class="sum-row" id="rnNewEnd" hidden><span class="k">续费后到期</span>' +
          '<span class="v num" id="rnNewEndVal"></span></div>' +
        '<div class="sum-row total"><span class="k">应付</span>' +
          '<span class="v num" id="rnPay">—</span></div>' +
      '</div>' +
      (prices.length > 1
        ? '<div class="field" style="margin:var(--sp-4) 0 0">' +
            '<label for="rnPrice">续费周期</label>' +
            '<select class="input" id="rnPrice">' +
              prices.map(pr =>
                '<option value="' + esc(pr.id) + '"' +
                  (pr.id === sub.price_id ? ' selected' : '') + '>' +
                  (pr.interval_count > 1 ? pr.interval_count : '') +
                  (INTV[pr.billing_interval] || pr.billing_interval) + ' · ' +
                  sym + money(pr.unit_amount, pr.currency) + '</option>').join('') +
            '</select>' +
          '</div>'
        : '') +
      '<div class="field" style="margin:var(--sp-4) 0 0">' +
        '<label for="rnCode">优惠码（可选）</label>' +
        '<div style="display:flex;gap:var(--sp-2)">' +
          '<input class="input" id="rnCode" placeholder="输入优惠码" autocomplete="off" ' +
            'style="text-transform:uppercase">' +
        '</div>' +
      '</div>' +
      '<div class="hint" style="margin-top:var(--sp-3);line-height:1.7">' +
        '续费从当前到期日往后延，提前续不会损失剩余天数。' +
        '流量额度在续费生效时重置，订阅链接不变，设备无需重新导入。' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-close>取消</button>' +
      '<button class="btn btn-primary" id="rnGo">确认续费</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  m.onclick = ev => { if (ev.target === m) close(); };

  // 选中价格变化时，把金额与续费后到期日一起算出来给用户看，
  // 而不是等到下一屏才揭晓
  const preview = () => {
    const sel = m.querySelector('#rnPrice');
    const pr = prices.find(x => x.id === (sel ? sel.value : sub.price_id)) || prices[0];
    if (!pr){ m.querySelector('#rnPay').textContent = sym + money(sub.amount || 0, sub.currency); return; }
    m.querySelector('#rnPay').textContent = sym + money(pr.unit_amount, pr.currency);
    const base = new Date(sub.current_period_end);
    const from = base > new Date() ? base : new Date();
    const d = new Date(from);
    const n = pr.interval_count || 1;
    switch (pr.billing_interval){
      case 'day':     d.setDate(d.getDate() + n); break;
      case 'week':    d.setDate(d.getDate() + 7 * n); break;
      case 'month':   d.setMonth(d.getMonth() + n); break;
      case 'quarter': d.setMonth(d.getMonth() + 3 * n); break;
      case 'year':    d.setFullYear(d.getFullYear() + n); break;
      default:        d.setMonth(d.getMonth() + n);
    }
    m.querySelector('#rnNewEnd').hidden = false;
    m.querySelector('#rnNewEndVal').textContent = fmtDate(d.toISOString());
  };
  preview();
  const sel = m.querySelector('#rnPrice');
  if (sel) sel.onchange = preview;

  m.querySelector('#rnGo').onclick = async ev => {
    const btn = ev.currentTarget;
    busy(btn, true, '创建中');
    try{
      const body = {
        use_balance: 0,
        coupon_code: m.querySelector('#rnCode').value.trim().toUpperCase(),
      };
      if (sel) body.price_id = sel.value;
      const o = await api('/v1/me/subscriptions/' + sub.id + '/renew',
        {method:'POST', idem: renewalAttempt.keyFor(body), body: JSON.stringify(body)});
      renewalAttempt.reset();
      close();
      openPayModal({
        order_id: o.order_id, order_no: o.order_no,
        total_amount: o.total_amount, payable_amount: o.payable_amount,
        discount_amount: o.discount_amount, balance_applied: o.balance_applied,
        currency: o.currency, kind: 'renewal',
      });
    }catch(e){ toast(e.message, 'err'); busy(btn, false); }
  };
}

async function createOrder(planId, priceId, btn, coupon){
  busy(btn, true, '创建中');
  try{
    // 幂等键：网络抖动重发不会变成两张订单（PAY-003）
    const idem = 'portal-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    curOrder = await api('/v1/orders', {method:'POST', idem, body: JSON.stringify({
      plan_id: planId, price_id: priceId, use_balance: 0,
      coupon_code: coupon || '' })});
    openPayModal(curOrder);
  }catch(e){ toast('下单失败：' + e.message, 'err'); }
  finally{ busy(btn, false); }
}

      '<div class="field" style="margin:0">' +
        '<label for="payProv">支付方式</label>' +
        '<select class="input" id="payProv"><option value="epay">易支付 · 支付宝 / 微信</option></select>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-close>取消</button>' +
      '<button class="btn btn-primary" id="btnGoPay">前往支付</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(m);

  const close = () => { m.style.animation = 'fadeIn var(--t-fast) reverse'; setTimeout(() => m.remove(), 120); };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  m.onclick = ev => { if (ev.target === m) close(); };
  document.addEventListener('keydown', function esc2(ev){
    if (ev.key === 'Escape'){ close(); document.removeEventListener('keydown', esc2); }
  });

  m.querySelector('#btnGoPay').onclick = async ev => {
    const btn = ev.currentTarget;
    busy(btn, true, '生成中');
    try{
      const r = await api('/v1/orders/' + o.order_id + '/pay', {method:'POST',
        body: JSON.stringify({provider: m.querySelector('#payProv').value, method:'alipay'})});
      close();
      // 新标签打开收银台；被拦截时给出可点击的兜底链接
      const w = window.open(r.redirect_url, '_blank', 'noopener');
      if (!w) toast('浏览器拦截了弹窗，请复制以下地址打开：\n' + r.redirect_url, 'info', 12000);
      else toast('已打开收银台' + (r.reused ? '（复用既有支付意图）' : '') +
                 '，支付完成后回本页刷新即可。', 'ok', 6000);
    }catch(e){ toast('发起支付失败：' + e.message, 'err'); busy(btn, false); }
  };
}

//==============================================================================
// 我的订单
//==============================================================================
//
// 在此之前用户下完单就再也看不到它了 —— 付没付成、什么时候过期、
// 优惠抵了多少，一概查不到，只能开工单问。这一页把订单摊开，
// 顺便把后端早就写好、却一直没有入口的取消接口接上。

const ORDER_ST = {
  draft:              ['待支付', 'warn'],
  pending_payment:    ['待支付', 'warn'],
  processing:         ['处理中', 'warn'],
  paid:               ['已支付', 'ok'],
  fulfilled:          ['已完成', 'ok'],
  cancelled:          ['已取消', ''],
  expired:            ['已过期', ''],
  partially_refunded: ['部分退款', 'err'],
  refunded:           ['已退款', 'err'],
};
const ORDER_KIND = {new:'新购', renewal:'续费', topup:'余额充值', manual:'人工单'};

const ordersState = {status:'', offset:0, limit:20};

// portal 的弹窗历来是各写各的，这里只有两处要用，抽一个局部的壳，
// 不去动那些已经在跑的弹窗。
function orderModal(title, bodyHTML, footHTML){
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
        '<button class="btn-icon" type="button" data-close aria-label="关闭">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
        '</button></div>' +
      '<div class="modal-body">' + bodyHTML + '</div>' +
      '<div class="modal-foot">' + footHTML + '</div>' +
    '</div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  m.onclick = ev => { if (ev.target === m) close(); };
  document.addEventListener('keydown', function escOrd(ev){
    if (ev.key === 'Escape'){ close(); document.removeEventListener('keydown', escOrd); }
  });
  return m;
}

async function renderOrders(){
  const el = $('pageOrders');
  el.innerHTML = skeleton();
  let d;
  try{
    const qs = new URLSearchParams({limit:ordersState.limit, offset:ordersState.offset});
    if (ordersState.status) qs.set('status', ordersState.status);
    d = await api('/v1/orders?' + qs.toString());
  }catch(e){
    el.innerHTML = emptyState('订单加载失败', esc(e.message),
      '<button class="btn btn-primary" onclick="renderOrders()">重试</button>');
    return;
  }

  const list = d.orders || [];
  if (!list.length && !ordersState.status && ordersState.offset === 0){
    el.innerHTML = emptyState('还没有订单', '选购一个套餐就可以开始使用了。',
      '<button class="btn btn-primary" onclick="go(\'plans\')">去选购</button>');
    return;
  }

  const filters = [['','全部'], ['pending_payment','待支付'], ['fulfilled','已完成'],
                   ['cancelled','已取消'], ['expired','已过期']]
    .map(f => '<button class="btn btn-sm ' +
      (ordersState.status === f[0] ? 'btn-primary' : 'btn-ghost') +
      '" data-ofilter="' + f[0] + '">' + f[1] + '</button>').join(' ');

  const rows = list.map(o => {
    const st = ORDER_ST[o.status] || [o.status, ''];
    const sym = CUR_SYM[o.currency] || '';
    // 待支付订单要显示剩余时间。不显示的话用户不知道还能拖多久，
    // 回来发现过期了会以为是系统把他的订单吞了。
    const left = (o.expires_at && o.cancellable) ? expiryHint(o.expires_at) : '';
    return '<tr>' +
      '<td><b>' + esc(o.plan_name || ORDER_KIND[o.kind] || o.kind) + '</b>' +
        '<div class="sub mono">' + esc(o.order_no) + '</div></td>' +
      '<td class="sub">' + esc(ORDER_KIND[o.kind] || o.kind) + '</td>' +
      '<td class="r num"><b>' + sym + money(o.payable_amount, o.currency) + '</b>' +
        ((o.discount_amount > 0 || o.balance_applied > 0)
          ? '<div class="sub">原价 ' + sym +
            money(o.total_amount + o.discount_amount, o.currency) + '</div>' : '') +
      '</td>' +
      '<td><span class="pill' + (st[1] ? ' pill-' + st[1] : '') + '">' + st[0] + '</span>' +
        (left ? '<div class="sub">' + left + '</div>' : '') +
        (o.cancel_reason ? '<div class="sub">' + esc(cancelReasonText(o.cancel_reason)) + '</div>' : '') +
      '</td>' +
      '<td class="sub num">' + fmtDateTime(o.created_at) + '</td>' +
      '<td class="r" style="white-space:nowrap">' +
        (o.cancellable
          ? '<button class="btn btn-sm btn-primary" data-opay="' + esc(o.id) + '">去支付</button> ' +
            '<button class="btn btn-sm btn-ghost" data-ocancel="' + esc(o.id) +
              '" data-ono="' + esc(o.order_no) + '">取消</button>'
          : '<button class="btn btn-sm btn-ghost" data-odetail="' + esc(o.id) + '">详情</button>') +
      '</td></tr>';
  }).join('');

  const pages = Math.ceil((d.total || 0) / ordersState.limit);
  const cur = Math.floor(ordersState.offset / ordersState.limit) + 1;

  el.innerHTML =
    '<div class="card card-pad" style="margin-bottom:var(--sp-4);display:flex;' +
      'gap:var(--sp-2);flex-wrap:wrap;align-items:center">' + filters + '</div>' +
    (list.length
      ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>订单</th><th>类型</th><th class="r">实付</th><th>状态</th>' +
          '<th>下单时间</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        (pages > 1
          ? '<div class="card-pad" style="display:flex;gap:var(--sp-2);align-items:center;' +
              'justify-content:flex-end">' +
              '<span class="sub">第 ' + cur + ' / ' + pages + ' 页</span>' +
              '<button class="btn btn-sm btn-ghost" id="oPrev"' +
                (cur <= 1 ? ' disabled' : '') + '>上一页</button>' +
              '<button class="btn btn-sm btn-ghost" id="oNext"' +
                (cur >= pages ? ' disabled' : '') + '>下一页</button></div>'
          : '') + '</div>'
      : emptyState('没有符合条件的订单', '换一个筛选条件试试。', ''));

  el.querySelectorAll('[data-ofilter]').forEach(b => b.onclick = () => {
    ordersState.status = b.dataset.ofilter; ordersState.offset = 0; renderOrders();
  });
  const prev = el.querySelector('#oPrev'), next = el.querySelector('#oNext');
  if (prev) prev.onclick = () => {
    ordersState.offset = Math.max(0, ordersState.offset - ordersState.limit); renderOrders();
  };
  if (next) next.onclick = () => {
    ordersState.offset += ordersState.limit; renderOrders();
  };

  el.querySelectorAll('[data-opay]').forEach(b => b.onclick = () => {
    const o = list.find(x => x.id === b.dataset.opay);
    if (o) openPayModal({order_id:o.id, order_no:o.order_no, currency:o.currency,
      total_amount:o.total_amount, discount_amount:o.discount_amount,
      balance_applied:o.balance_applied, payable_amount:o.payable_amount, kind:o.kind});
  });
  el.querySelectorAll('[data-odetail]').forEach(b =>
    b.onclick = () => openOrderDetail(b.dataset.odetail));
  el.querySelectorAll('[data-ocancel]').forEach(b =>
    b.onclick = () => confirmCancelOrder(b.dataset.ocancel, b.dataset.ono));
}

// 库里存的是内部原因码，直接摆给用户看没有意义
function cancelReasonText(reason){
  if (reason === 'user_cancelled') return '你取消了这笔订单';
  if (reason === 'reservation_expired') return '超时未支付，已自动取消';
  return reason;
}

function expiryHint(iso){
  const ms = new Date(iso).getTime() - Date.now();
  if (!isFinite(ms)) return '';
  if (ms <= 0) return '已超时，即将自动取消';
  const min = Math.floor(ms / 60000);
  if (min < 60) return '请在 ' + min + ' 分钟内支付';
  return '请在 ' + Math.floor(min / 60) + ' 小时内支付';
}

function confirmCancelOrder(id, orderNo){
  const m = orderModal('取消订单',
    '<p style="margin:0 0 var(--sp-3)">确定取消订单 <b class="mono">' + esc(orderNo) + '</b>？</p>' +
    '<div class="sub" style="line-height:1.7">取消之后，这笔订单占用的库存、优惠券名额和' +
      '冻结的余额会立刻释放，你可以重新下单。已经支付成功的订单不能在这里取消，' +
      '需要开工单处理。</div>',
    '<button class="btn btn-ghost" type="button" data-close>再想想</button>' +
    '<button class="btn btn-primary" type="button" id="ocGo">确定取消</button>');

  m.querySelector('#ocGo').onclick = async ev => {
    busy(ev.currentTarget, true, '取消中');
    try{
      const r = await api('/v1/orders/' + id + '/cancel', {method:'POST'});
      m.remove();
      toast(r.already_terminal ? '这笔订单此前已经取消过了' : '订单已取消', 'ok', 3000);
      cache.me = null;   // 余额解冻会改变可用余额，概览上的数字得跟着刷新
      renderOrders();
    }catch(e){
      // 并发场景：用户点取消的同一刻支付回调到了，订单其实已经付掉。
      // 这时候光说「失败」会让人以为是系统坏了。
      toast(e.message + '（如果你刚完成支付，刷新一下就能看到）', 'err', 8000);
      busy(ev.currentTarget, false);
    }
  };
}

async function openOrderDetail(id){
  const m = orderModal('订单详情', '<div id="odBody" class="sub">加载中…</div>',
    '<button class="btn btn-ghost" type="button" data-close>关闭</button>');
  let o;
  try{ o = (await api('/v1/orders/' + id)).order; }
  catch(e){
    m.querySelector('#odBody').innerHTML =
      '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
    return;
  }
  const sym = CUR_SYM[o.currency] || '';
  const st = ORDER_ST[o.status] || [o.status, ''];

  const meta = [
    ['订单号', '<span class="mono">' + esc(o.order_no) + '</span>'],
    ['类型', esc(ORDER_KIND[o.kind] || o.kind)],
    ['状态', '<span class="pill' + (st[1] ? ' pill-' + st[1] : '') + '">' + st[0] + '</span>'],
    ['下单时间', fmtDateTime(o.created_at)],
  ];
  if (o.paid_at) meta.push(['支付时间', fmtDateTime(o.paid_at)]);
  if (o.cancelled_at) meta.push(['取消时间', fmtDateTime(o.cancelled_at) +
    (o.cancel_reason ? '<div class="sub">' + esc(cancelReasonText(o.cancel_reason)) + '</div>' : '')]);

  const items = (o.items || []).map(it =>
    '<tr><td>' + esc(it.name || '—') + '</td>' +
    '<td class="r num">' + it.quantity + '</td>' +
    '<td class="r num">' + sym + money(it.line_amount, o.currency) + '</td></tr>').join('');

  const pays = (o.payments || []).map(pm =>
    '<tr><td>' + esc(pm.status) + '</td>' +
    '<td class="r num">' + (CUR_SYM[pm.currency] || '') + money(pm.amount, pm.currency) + '</td>' +
    '<td class="sub num">' + fmtDateTime(pm.created_at) + '</td></tr>').join('');

  m.querySelector('#odBody').innerHTML =
    '<div class="sum">' +
      meta.map(kv => '<div class="sum-row"><span class="k">' + kv[0] + '</span>' +
        '<span class="v">' + kv[1] + '</span></div>').join('') +
    '</div>' +
    (items ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>项目</th><th class="r">数量</th><th class="r">金额</th>' +
      '</tr></thead><tbody>' + items + '</tbody></table></div>' : '') +
    '<div class="sum" style="margin-top:var(--sp-4)">' +
      '<div class="sum-row"><span class="k">小计</span><span class="v num">' +
        sym + money(o.total_amount + o.discount_amount, o.currency) + '</span></div>' +
      (o.discount_amount > 0 ? '<div class="sum-row"><span class="k">优惠抵扣</span>' +
        '<span class="v num" style="color:var(--ok)">−' + sym +
        money(o.discount_amount, o.currency) + '</span></div>' : '') +
      (o.balance_applied > 0 ? '<div class="sum-row"><span class="k">余额抵扣</span>' +
        '<span class="v num" style="color:var(--ok)">−' + sym +
        money(o.balance_applied, o.currency) + '</span></div>' : '') +
      '<div class="sum-row total"><span class="k">实付</span><span class="v num">' +
        sym + money(o.payable_amount, o.currency) + ' ' + o.currency + '</span></div>' +
    '</div>' +
    (pays ? '<div class="sect">支付记录</div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>状态</th><th class="r">金额</th><th>时间</th>' +
      '</tr></thead><tbody>' + pays + '</tbody></table></div>' : '');
}

//==============================================================================
// 兑换礼品卡
//==============================================================================
//
// 兑换前先预览：用户手里拿到一串码，多半不知道它到底是什么。
// 直接兑掉再告诉他送了什么，中间那一步的忐忑是可以省掉的。
//
// 盲盒只展示奖品名称、不展示权重和金额 —— 概率和期望值一旦公示，
// 这个玩法就变成了可以被算计的东西。

async function renderGift(){
  const el = $('pageGift');
  const redeemAttempt = idemAttempt();
  el.innerHTML = skeleton();
  let history = [];
  try{ history = (await api('/v1/me/gift-cards')).redemptions || []; }catch(_){}

  const rows = history.map(h =>
    '<tr><td><b>' + esc(h.template_name) + '</b>' +
      (h.prize_label ? '<div class="sub">抽中：' + esc(h.prize_label) + '</div>' : '') + '</td>' +
    '<td class="sub">' + [
      h.balance ? '余额 ' + money(h.balance, 'CNY') : '',
      h.traffic_bytes ? '流量 ' + fmtGB(h.traffic_bytes) : '',
      h.expire_days ? '延长 ' + h.expire_days + ' 天' : '',
    ].filter(Boolean).join('、') + '</td>' +
    '<td class="sub num">' + fmtDateTime(h.redeemed_at) + '</td></tr>').join('');

  el.innerHTML =
    '<div class="card" style="margin-bottom:var(--sp-5)">' +
      '<div class="card-pad">' +
        '<div class="field" style="margin-bottom:var(--sp-3)">' +
          '<label for="gcInput">输入卡密</label>' +
          '<input class="input mono" id="gcInput" placeholder="例如 CNYAB3WYXY7C6C4" ' +
            'autocomplete="off" spellcheck="false" style="text-transform:uppercase">' +
          '<div class="sub" style="margin-top:var(--sp-2)">' +
            '不区分大小写。卡密里不含容易看错的 I、L、O、0、1。</div>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" id="gcCheck">查看这张卡送什么</button>' +
        '<div id="gcPreview" style="margin-top:var(--sp-4)"></div>' +
      '</div>' +
    '</div>' +
    (history.length
      ? '<div class="card"><div class="card-head"><h3>兑换记录</h3></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>礼品卡</th><th>获得</th><th>时间</th></tr></thead><tbody>' +
        rows + '</tbody></table></div></div>'
      : '');

  const input = el.querySelector('#gcInput');
  const box = el.querySelector('#gcPreview');
  const check = async ev => {
    const code = input.value.trim().toUpperCase();
    if (!code){ toast('请输入卡密', 'err'); return; }
    box.innerHTML = '<div class="sub">查询中…</div>';
    if (ev && ev.currentTarget) busy(ev.currentTarget, true, '查询中');
    try{
      const c = (await api('/v1/gift-cards/preview',
        {method:'POST', body: JSON.stringify({code})})).card;
      box.innerHTML = renderGiftPreview(c, code);
      box.querySelector('#gcGo').onclick = e2 => doRedeem(code, e2, redeemAttempt);
    }catch(e){
      box.innerHTML = '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
    }finally{
      if (ev && ev.currentTarget) busy(ev.currentTarget, false);
    }
  };
  el.querySelector('#gcCheck').onclick = check;
  input.onkeydown = e => { if (e.key === 'Enter') check({currentTarget: el.querySelector('#gcCheck')}); };
}

function renderGiftPreview(c, code){
  let what;
  if (c.type === 'mystery'){
    what = '<div class="sub" style="margin-bottom:var(--sp-2)">这是一张盲盒，可能开出：</div>' +
      '<div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">' +
      (c.rewards.pool || []).map(p =>
        '<span class="pill">' + esc(p.label) + '</span>').join('') + '</div>';
  } else if (c.type === 'plan'){
    what = '<div>兑换后立即为你开通对应套餐。</div>';
  } else {
    const parts = [];
    if (c.rewards.balance) parts.push('余额 ' + money(c.rewards.balance, 'CNY'));
    if (c.rewards.traffic_bytes) parts.push('流量 ' + fmtGB(c.rewards.traffic_bytes));
    if (c.rewards.expire_days) parts.push('到期时间延长 ' + c.rewards.expire_days + ' 天');
    if (c.rewards.reset_quota) parts.push('本周期已用流量清零');
    what = '<div>' + parts.map(p => '<div>· ' + p + '</div>').join('') + '</div>';
  }
  return '<div class="sum">' +
      '<div style="font-weight:600;margin-bottom:var(--sp-2)">' + esc(c.name) + '</div>' +
      (c.description ? '<div class="sub" style="margin-bottom:var(--sp-3)">' +
        esc(c.description) + '</div>' : '') +
      what +
    '</div>' +
    '<button class="btn btn-primary btn-block" id="gcGo" style="margin-top:var(--sp-3)">' +
      '确认兑换</button>';
}

async function doRedeem(code, ev, attempt){
  busy(ev.currentTarget, true, '兑换中');
  try{
    const payload = {code};
    const r = await api('/v1/gift-cards/redeem', {method:'POST',
      idem: attempt.keyFor(payload), body: JSON.stringify(payload)});
    attempt.reset();
    const gained = (r.summary || []).join('，');
    toast((r.prize_label ? '抽中「' + r.prize_label + '」！' : '兑换成功！') +
      (gained ? ' ' + gained : ''), 'ok', 7000);
    cache.me = null;    // 余额和流量都变了，概览要重新拉
    cache.subs = null;
    renderGift();
  }catch(e){
    toast(e.message, 'err', 7000);
    busy(ev.currentTarget, false);
  }
}

function fmtGB(bytes){
  const gb = bytes / (1024*1024*1024);
  if (gb >= 1) return (Math.round(gb * 100) / 100) + ' GB';
  return Math.round(bytes / (1024*1024)) + ' MB';
}

//==============================================================================
// 占位片段
//==============================================================================
function skeleton(){
  return '<div class="stats">' +
    '<div class="stat"><div class="sk" style="width:40%;height:12px"></div>' +
      '<div class="sk" style="width:64%;height:26px;margin-top:14px"></div></div>'.repeat(3) +
  '</div><div class="card card-pad"><div class="sk" style="height:132px"></div></div>';
}
function emptyState(title, desc, action){
  return '<div class="card"><div class="empty">' +
    '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="2.5" y="5" width="19" height="15" rx="2.5"/>' +
      '<path d="M2.5 10h19M7 3v4M17 3v4"/></svg>' +
    '<h4>' + title + '</h4><p>' + desc + '</p>' +
    (action ? '<div class="empty-actions">' + action + '</div>' : '') +
    '</div></div>';
}

//==============================================================================
// 外观：主题与插槽
//==============================================================================
//
// 主题是一组 CSS 变量，直接 setProperty 到 :root 上 —— 站点所有样式
// 都引用这些变量，所以换主题不需要改任何一条规则。
//
// 插槽内容是后端净化过的 HTML（白名单标签，没有 script、没有事件属性、
// 没有 style 属性）。这里用 innerHTML 是有意的：净化在写入时做过一次，
// 库里存的就是可渲染的那份。防线在服务端，不在这一行。

let appearance = {theme: null, slots: {}};

// 哪一页显示哪些插槽
const PAGE_SLOTS = {
  overview:  ['portal-home-banner', 'portal-home-aside'],
  subs:      ['portal-subscribe-notice'],
  plans:     ['portal-plans-notice'],
};

async function loadAppearance(){
  try{
    appearance = await api('/v1/appearance');
  }catch(_){
    // 拿不到外观不该让站点打不开：退回前端内置的默认样式，插槽当空的。
    // 外观是门面，不是运行的必要条件。
    appearance = {theme: null, slots: {}};
    return;
  }
  applySiteTheme(appearance.theme);
  paintSlots();
}

// 站点主题：把后台配的 token 注入成 CSS 变量。与深浅色正交——
// 品牌色在两套配色下都要生效，所以写在 :root 的行内样式上。
function applySiteTheme(t){
  if (!t) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(t.tokens || {})){
    // 变量最终会进 CSS。一个带 ; 或 } 的取值能从当前这条声明里逃出去，
    // 改写它本不该碰的规则 —— 后端存的是 JSON，不会替我们挡这个。
    if (typeof v !== 'string' || /[;{}<>]/.test(v)) continue;
    if (!/^[a-z0-9-]{1,40}$/i.test(k)) continue;
    root.style.setProperty('--' + k, v);
  }

  const b = t.branding || {};
  if (b.site_name){
    document.title = b.site_name;
    document.querySelectorAll('[data-brand-name]').forEach(el => {
      el.textContent = b.site_name;
    });
  }
  if (b.tagline){
    const el = document.querySelector('[data-brand-tagline]');
    if (el) el.textContent = b.tagline;
  }

  if (t.custom_css){
    let tag = document.getElementById('themeCSS');
    if (!tag){
      tag = document.createElement('style');
      tag.id = 'themeCSS';
      document.head.appendChild(tag);
    }
    // textContent 而不是 innerHTML：CSS 文本里若出现 </style> 会提前
    // 闭合样式块，后面的内容就以 HTML 身份进了文档。服务端也拦这个串，
    // 这里是第二道。
    tag.textContent = t.custom_css;
  }
}

function paintSlots(){
  for (const [key, html] of Object.entries(appearance.slots || {})){
    const el = document.getElementById('slot-' + key.replace(/\./g, '-'));
    if (el) el.innerHTML = html;
  }
}

// syncSlotVisibility 按当前页决定哪些插槽露出来。
function syncSlotVisibility(page){
  const show = new Set(PAGE_SLOTS[page] || []);
  ['portal-home-banner', 'portal-home-aside',
   'portal-subscribe-notice', 'portal-plans-notice'].forEach(id => {
    const el = document.getElementById('slot-' + id);
    if (el) el.classList.toggle('hide', !show.has(id));
  });
}

//==============================================================================
// 账号安全：Telegram 绑定 / 登录设备 / 免密登录链接
//==============================================================================
async function renderSecurity(){
  const el = $('pageSecurity');
  el.innerHTML = skeleton();

  const [tg, sess, prefs] = await Promise.all([
    api('/v1/me/telegram').catch(() => ({enabled:false, bound:false})),
    api('/v1/me/sessions').catch(() => ({sessions:[]})),
    api('/v1/me/notification-preferences').catch(() => ({preferences:[], unavailable:true})),
  ]);

  el.innerHTML =
    '<div class="card" style="margin-bottom:var(--sp-5)">' +
      '<div class="card-head"><h3>Telegram 通知</h3></div>' +
      '<div class="card-pad" id="tgBox"></div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:var(--sp-5)">' +
      '<div class="card-head"><h3>通知偏好</h3></div>' +
      '<div class="card-pad" id="npBox"></div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:var(--sp-5)">' +
      '<div class="card-head"><h3>登录设备</h3>' +
        '<span class="sub">共 ' + (sess.sessions || []).length + ' 个在用会话</span></div>' +
      '<div class="tbl-wrap" id="sessBox"></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h3>免密登录链接</h3></div>' +
      '<div class="card-pad">' +
        '<div class="sub" style="margin-bottom:var(--sp-3)">' +
          '生成一条 60 秒有效、只能用一次的链接，用来在别的设备上登录，' +
          '不必在那台机器上输入密码。链接等同于你的账号，别转发给任何人。</div>' +
        '<button class="btn btn-primary" id="qlGo">生成链接</button>' +
        '<div id="qlBox" style="margin-top:var(--sp-3)"></div>' +
      '</div>' +
    '</div>';

  renderTelegramBox(tg);
  renderNotificationPreferences(prefs);
  renderSessions(sess.sessions || []);
  el.querySelector('#qlGo').onclick = async ev => {
    busy(ev.currentTarget, true, '生成中');
    try{
      const r = await api('/v1/me/quick-login', {method:'POST'});
      const url = location.origin + location.pathname + '#quick=' + r.token;
      el.querySelector('#qlBox').innerHTML =
        '<div class="sum"><div class="sub" style="margin-bottom:var(--sp-2)">' +
          '有效期 ' + r.expires_in + ' 秒，过期或用过一次后自动作废。</div>' +
          '<div class="mono" id="qlUrl" style="word-break:break-all;font-size:12px">' +
            esc(url) + '</div>' +
          '<button class="btn btn-ghost" id="qlCopy" style="margin-top:var(--sp-2)">复制</button>' +
        '</div>';
      el.querySelector('#qlCopy').onclick = async () => {
        try{ await navigator.clipboard.writeText(url); toast('已复制'); }
        catch(_){ toast('复制失败，请手动选中', 'err'); }
      };
    }catch(e){ toast(e.message, 'err'); }
    finally{ busy(ev.currentTarget, false); }
  };
}

function renderNotificationPreferences(result){
  const box=$('npBox');
  if(result.unavailable){
    box.innerHTML='<div class="sub">通知偏好暂时无法加载，请稍后刷新。</div>';
    return;
  }
  const labels={transactional:'交易与安全',service:'服务提醒',marketing:'营销活动'};
  const channels={email:'邮件',telegram:'Telegram'};
  const ids={
    transactional_email:'npTransactionalEmail',transactional_telegram:'npTransactionalTelegram',
    service_email:'npServiceEmail',service_telegram:'npServiceTelegram',
    marketing_email:'npMarketingEmail',marketing_telegram:'npMarketingTelegram'
  };
  const preferences=result.preferences||[];
  box.innerHTML=
    '<div class="sub" style="margin-bottom:var(--sp-3)">交易与安全通知用于支付凭据和账号风险提醒，始终开启。其他通知可按渠道调整。</div>'+
    '<div style="display:grid;gap:var(--sp-2)">'+preferences.map(item=>{
      const id=ids[item.category+'_'+item.channel]||'';
      if(!id)return '';
      return '<label style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:1px solid var(--line);border-radius:var(--radius-sm)">'+
        '<input type="checkbox" id="'+id+'" data-category="'+esc(item.category)+'" data-channel="'+esc(item.channel)+'"'+
          (item.enabled?' checked':'')+(item.locked?' disabled':'')+'>'+
        '<span><b>'+esc(labels[item.category]||item.category)+'</b><span class="sub"> · '+esc(channels[item.channel]||item.channel)+
          (item.locked?' · 必须开启':'')+'</span></span></label>';
    }).join('')+'</div>';
  box.querySelectorAll('input[data-category]:not(:disabled)').forEach(input=>{
    input.onchange=async()=>{
      const enabled=input.checked;
      input.disabled=true;
      try{
        await api('/v1/me/notification-preferences',{method:'PUT',body:JSON.stringify({
          category:input.dataset.category,channel:input.dataset.channel,enabled
        })});
        toast('通知偏好已更新','ok',1800);
      }catch(e){
        input.checked=!enabled;
        toast(e.message,'err');
      }finally{input.disabled=false;}
    };
  });
}

function renderTelegramBox(tg){
  const box = $('tgBox');
  if (!tg.enabled){
    box.innerHTML = '<div class="sub">站点还没有开启 Telegram 通知。</div>';
    return;
  }
  if (tg.bound){
    box.innerHTML =
      '<div style="display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap">' +
        '<span class="pill pill-ok">已绑定' +
          (tg.username ? ' @' + esc(tg.username) : '') + '</span>' +
        '<span class="sub">到期提醒、流量预警会同时发到 Telegram。</span>' +
        '<button class="btn btn-ghost" id="tgUnbind" style="margin-left:auto">解除绑定</button>' +
      '</div>';
    $('tgUnbind').onclick = async ev => {
      busy(ev.currentTarget, true, '解绑中');
      try{
        await api('/v1/me/telegram', {method:'DELETE'});
        toast('已解除绑定');
        renderSecurity();
      }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
    };
    return;
  }
  box.innerHTML =
    '<div class="sub" style="margin-bottom:var(--sp-3)">' +
      '绑定后，订阅到期和流量预警会直接推到 Telegram。</div>' +
    '<button class="btn btn-primary" id="tgBind">获取绑定码</button>' +
    '<div id="tgCode" style="margin-top:var(--sp-3)"></div>';
  $('tgBind').onclick = async ev => {
    busy(ev.currentTarget, true, '获取中');
    try{
      const r = await api('/v1/me/telegram/bind-code', {method:'POST'});
      const deep = r.bot_username
        ? 'https://t.me/' + r.bot_username + '?start=' + r.code : '';
      $('tgCode').innerHTML =
        '<div class="sum">' +
          '<div class="sub">在 Telegram 里给 ' +
            (r.bot_username ? '<b>@' + esc(r.bot_username) + '</b>' : '本站机器人') +
            ' 发送这个码：</div>' +
          '<div class="mono" style="font-size:22px;letter-spacing:2px;margin:var(--sp-2) 0">' +
            esc(r.code) + '</div>' +
          '<div class="sub">十分钟内有效。重新获取会让上一个码失效。</div>' +
          (deep ? '<a class="btn btn-primary" style="margin-top:var(--sp-3)" ' +
            'href="' + esc(deep) + '" target="_blank" rel="noopener">在 Telegram 中打开</a>' : '') +
          '<button class="btn btn-ghost" id="tgDone" style="margin-top:var(--sp-3)">我发好了，刷新</button>' +
        '</div>';
      $('tgDone').onclick = () => renderSecurity();
    }catch(e){ toast(e.message, 'err'); }
    finally{ busy(ev.currentTarget, false); }
  };
}

function renderSessions(list){
  if (!list.length){
    $('sessBox').innerHTML = '<div class="card-pad sub">没有记录。</div>';
    return;
  }
  $('sessBox').innerHTML =
    '<table class="tbl"><thead><tr><th>设备</th><th>地区</th>' +
      '<th>最近活动</th><th></th></tr></thead><tbody>' +
    list.map(x =>
      '<tr><td>' + esc(shortUA(x.user_agent)) +
        (x.current ? ' <span class="pill pill-ok">当前设备</span>' : '') +
        '<div class="sub">登录于 ' + fmtDateTime(x.created_at) + '</div></td>' +
      '<td class="sub">' + esc(x.country || '—') + '</td>' +
      '<td class="sub num">' + (x.last_seen_at ? fmtDateTime(x.last_seen_at) : '—') + '</td>' +
      '<td style="text-align:right">' +
        (x.current ? '<span class="sub">—</span>'
          : '<button class="btn btn-ghost btn-sm" data-kill="' + esc(x.id) + '">下线</button>') +
      '</td></tr>').join('') +
    '</tbody></table>';

  $('sessBox').querySelectorAll('[data-kill]').forEach(b => b.onclick = async ev => {
    busy(ev.currentTarget, true, '处理中');
    try{
      await api('/v1/me/sessions/' + encodeURIComponent(b.dataset.kill), {method:'DELETE'});
      toast('该设备已下线');
      renderSecurity();
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  });
}

// shortUA 把 User-Agent 压成一句人能读的话。
// 原始 UA 有两百字符，摊在表格里只会把「哪台设备」这件事淹掉。
function shortUA(ua){
  if (!ua) return '未知设备';
  const os = /iPhone|iPad/.test(ua) ? 'iOS'
    : /Android/.test(ua) ? 'Android'
    : /Mac OS X/.test(ua) ? 'macOS'
    : /Windows/.test(ua) ? 'Windows'
    : /Linux/.test(ua) ? 'Linux' : '';
  const br = /Edg\//.test(ua) ? 'Edge'
    : /OPR\//.test(ua) ? 'Opera'
    : /Firefox/.test(ua) ? 'Firefox'
    : /Chrome/.test(ua) ? 'Chrome'
    : /Safari/.test(ua) ? 'Safari' : '';
  const t = [os, br].filter(Boolean).join(' · ');
  return t || ua.slice(0, 40);
}

//==============================================================================
// 启动
//==============================================================================
// 无条件先拉站点配置。
//
// 放在「未登录」分支里是不够的：令牌过期时走的是 enterApp 失败后的
// 回退路径，那条路同样会停在登录页，但不经过这里 ——
// 结果是登录过的人再来，看到的还是老样子的两步注册表单。
// consumeQuickLoginHash 处理「快捷登录」链接。
//
// 令牌放在 fragment（# 后面）而不是查询串里：fragment 不会进服务端
// 日志、不会随 Referer 发给第三方。用掉后立刻从地址栏抹掉，
// 免得它躺在历史记录里 —— 虽然它只有 60 秒且一次性。
async function consumeQuickLoginHash(){
  const m = /(?:^|[#&])quick=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const r = await api('/v1/auth/quick-login',
      {method:'POST', body: JSON.stringify({token: m[1]})});
    token = r.access_token; localStorage.setItem(TK, token);
    toast('已免密登录');
    return true;
  }catch(e){
    toast(e.message || '登录链接已失效', 'err');
    return false;
  }
}

async function boot(){
  // 并行拉：两者互不依赖，串起来只是让首屏多等一个来回。
  await Promise.all([loadSiteConfig(), loadAppearance()]);
  await consumeQuickLoginHash();
  if (token) enterApp();
  else {
    $('authView').classList.remove('hide');
    $('appView').classList.add('hide');
  }
}
boot();
