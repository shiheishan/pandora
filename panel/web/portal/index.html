<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>潘多拉面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d5efc'/%3E%3Cpath d='M32 13l15 7v11c0 10-6.4 17.3-15 20-8.6-2.7-15-10-15-20V20l15-7z' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
<style>
/* ============================================================================
   设计系统
   间距严格走 4px 网格；圆角、阴影、动效各自成阶。
   克制是关键：渐变只出现在 logo、主 CTA、推荐卡边框三处。
   ========================================================================= */
:root{
  /* 类型尺度：每档之间肉眼可辨，不再有 0.5px 的伪层级 */
  --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:15px; --fs-lg:17px; --fs-xl:19px; --fs-2xl:22px; --fs-3xl:26px; --fs-4xl:32px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;

  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:999px;

  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:130ms; --t-base:200ms; --t-slow:320ms;

  --brand:#6d5efc;
  --brand-2:#a855f7;
  --brand-soft:rgba(109,94,252,.14);
  /* 紫底上的紫字：直接用 --brand 只有 3.5，读起来发虚 */
  --brand-on-soft:#9c92ff;
  --ok:#22c55e; --ok-soft:rgba(34,197,94,.13);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.13);
  --err:#f0616d; --err-soft:rgba(240,97,109,.13);
  /* 角标那种「小字压实色」的场合，--err 太亮，白字浮在上面 */
  --err-strong:#d6273a;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",
         "PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",
         system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
}

/* 深色（默认）*/
[data-theme="dark"]{
  --bg:#08090c;
  --bg-elev:#0d0f14;
  --surface:#101319;
  --surface-2:#161a22;
  --surface-3:#1c212b;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --fg:#e9ebef;
  --fg-2:#98a0af;
  --fg-3:#7a8292;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 4px 20px -4px rgba(0,0,0,.55);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.7);
  --glow:radial-gradient(1200px 500px at 50% -20%,rgba(109,94,252,.16),transparent 70%);
}
/* 浅色 */
[data-theme="light"]{
  --ok:#00841d; --warn:#b15a00; --err:#cc3d49;
  /* 语义色在白底上必须压深，亮色版本只适合深色卡片 */
  --bg:#fbfbfd;
  --bg-elev:#fff;
  --surface:#fff;
  --surface-2:#f6f7fa;
  --surface-3:#eef0f5;
  --line:rgba(16,20,32,.08);
  --line-2:rgba(16,20,32,.14);
  --fg:#0f1319;
  --fg-2:#5b6474;
  --fg-3:#697283;
  --brand-on-soft:#5546d6;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 20px -4px rgba(16,24,40,.1);
  --shadow-lg:0 16px 48px -12px rgba(16,24,40,.16);
  --glow:radial-gradient(1200px 500px at 50% -20%,rgba(109,94,252,.1),transparent 70%);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:var(--fs-base);line-height:1.6;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:'';position:fixed;inset:0;background:var(--glow);
  pointer-events:none;z-index:0;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:-.02em}
.hide{display:none!important}

/* --------------------------------------------------------------- 滚动条 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-full);
  border:3px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--fg-3)}

/* =========================================================== 通用组件 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:38px;padding:0 var(--sp-4);border:1px solid transparent;
  border-radius:var(--r-md);background:var(--surface-2);color:var(--fg);
  font-size:var(--fs-sm);font-weight:550;cursor:pointer;white-space:nowrap;
  transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),
             transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.btn-primary{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;
  box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 20px -8px rgba(109,94,252,.7);
}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 2px 4px rgba(0,0,0,.2),0 10px 28px -8px rgba(109,94,252,.8)}
.btn-ghost{background:transparent;border-color:var(--line-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--fg-3)}
.btn-sm{height:31px;padding:0 var(--sp-3);font-size:var(--fs-xs);border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn-icon{width:34px;height:34px;padding:0;border-radius:var(--r-md);
  background:transparent;color:var(--fg-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--fg)}

/* 按钮内联加载态 */
.spin{
  width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:spin .6s linear infinite;opacity:.85;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 输入 */
.field{margin-bottom:var(--sp-4)}
.field label{
  display:block;font-size:var(--fs-xs);font-weight:550;color:var(--fg-2);
  margin-bottom:var(--sp-2);letter-spacing:.01em;
}
.input{
  width:100%;height:42px;padding:0 var(--sp-4);
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);font-size:var(--fs-base);
  transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),
             background var(--t-fast) var(--ease);
}
.input::placeholder{color:var(--fg-3)}
.input:hover{border-color:var(--line-2)}
.input:focus{
  outline:none;border-color:var(--brand);background:var(--bg-elev);
  box-shadow:0 0 0 3px var(--brand-soft);
}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:48px}
.pw-toggle{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;padding:0;display:grid;place-items:center;
  border:0;border-radius:var(--r-sm);background:transparent;color:var(--fg-2);
  cursor:pointer;transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);
}
.pw-toggle:hover{color:var(--fg);background:var(--surface-3)}
.pw-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.pw-toggle svg{pointer-events:none}
.pwd-policy{margin-top:var(--sp-2);font-size:var(--fs-xs);color:var(--fg-2)}
.pwd-policy.ok{color:var(--ok)}
.pwd-policy.err{color:var(--err)}
select.input{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M4 6l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}

/* 卡片 */
/* ---- 通知 ---- */
.bell-wrap{position:relative}
.bell-dot{
  position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--r-full);background:var(--err-strong);color:#fff;
  font-size:var(--fs-2xs);font-weight:700;line-height:16px;text-align:center;
  /* 描边让角标压在铃铛上时边界依然清晰，不至于糊成一团 */
  box-shadow:0 0 0 2px var(--surface);
  transform:scale(0);transition:transform var(--t-base) var(--ease-out);
}
.bell-dot.on{transform:scale(1)}

.notif-panel{
  position:absolute;top:calc(100% + 10px);right:0;width:min(380px,calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  z-index:60;overflow:hidden;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;
  transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease-out);
}
.notif-panel.open{opacity:1;transform:none;pointer-events:auto}
.notif-head{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line);
}
.notif-head b{font-size:var(--fs-sm);letter-spacing:-.01em}
.notif-head .spacer{flex:1}
.notif-list{max-height:min(420px,60vh);overflow-y:auto;overscroll-behavior:contain}
.notif-item{
  display:block;width:100%;text-align:left;padding:var(--sp-4) var(--sp-5);
  border:0;border-bottom:1px solid var(--line);background:transparent;
  cursor:pointer;transition:background var(--t-fast) var(--ease);
}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--surface-2)}
.notif-item .t{
  display:flex;align-items:center;gap:var(--sp-2);
  font-size:var(--fs-sm);font-weight:600;color:var(--fg);margin-bottom:3px;
}
/* 未读用一个小圆点标记，而不是整行变色 —— 整行高亮在一屏都是未读时
   会变成满屏色块，反而看不出重点 */
.notif-item .t::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--brand);flex:none;transition:opacity var(--t-base) var(--ease);
}
.notif-item.read .t::before{opacity:0}
.notif-item.read .t{color:var(--fg-2);font-weight:500}
.notif-item .b{font-size:var(--fs-xs);line-height:1.55;color:var(--fg-2)}
.notif-item .d{font-size:var(--fs-2xs);color:var(--fg-3);margin-top:5px}
.notif-empty{padding:var(--sp-10) var(--sp-5);text-align:center;color:var(--fg-3);font-size:var(--fs-sm)}

/* ---- 订阅链接 ---- */
.sublink{
  margin:var(--sp-4) var(--sp-6) var(--sp-6);
  padding:var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);
}
.sublink-row{display:flex;align-items:center;gap:var(--sp-2)}
.sublink-url{
  flex:1;min-width:0;font-family:var(--mono);font-size:var(--fs-2xs);color:var(--fg-2);
  /* 链接很长，省略中间不如省略末尾 —— 用户靠开头的域名认出是哪个站 */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:7px 10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);user-select:all;
}
.sublink-meta{
  display:flex;flex-wrap:wrap;gap:var(--sp-4);
  margin-top:var(--sp-3);font-size:var(--fs-2xs);color:var(--fg-3);
}
.sublink-meta b{color:var(--fg-2);font-weight:600}
.sublink-warn{
  display:flex;gap:var(--sp-2);align-items:flex-start;
  margin-top:var(--sp-3);padding:var(--sp-3);
  background:var(--warn-soft);border-radius:var(--r-sm);
  font-size:var(--fs-xs);line-height:1.5;color:var(--warn);
}

/* ---- 订阅节点安全预览 ---- */
.subnodes{
  margin:var(--sp-4) var(--sp-6) 0;padding:var(--sp-4);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);
}
.subnodes-head{display:flex;align-items:center;gap:var(--sp-3)}
.subnodes-head>div:first-child{min-width:0;flex:1}
.subnodes-list{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),320px));
  gap:var(--sp-3);justify-content:start;margin-top:var(--sp-3);
}
.subnode-item{
  min-width:0;padding:var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);
}
.subnode-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sm);font-weight:600}
.subnode-meta{margin-top:4px;color:var(--fg-3);font-size:var(--fs-2xs)}
.subnodes-state{margin-top:var(--sp-3);color:var(--fg-3);font-size:var(--fs-xs)}

.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:var(--fs-2xs);background:var(--surface-2);color:var(--fg-2)}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-err{background:var(--err-soft);color:var(--err)}

.sect{font-size:var(--fs-xs);color:var(--fg-2);font-weight:600;margin:var(--sp-4) 0 var(--sp-2)}

/* ---- 公告 ---- */
.ann{
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--fg-3);border-radius:var(--r-md);
  padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-3);
}
.ann-head{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm)}
.ann-tag{
  color:#fff;font-size:var(--fs-2xs);font-weight:600;
  padding:1px 7px;border-radius:var(--r-full);flex:0 0 auto;
}
.ann-pin{
  font-size:var(--fs-2xs);color:var(--brand);background:var(--brand-soft);
  padding:1px 7px;border-radius:var(--r-full);flex:0 0 auto;
}
.ann-body{
  margin-top:var(--sp-2);color:var(--fg-2);font-size:var(--fs-sm);
  line-height:1.75;white-space:pre-wrap;
}

/* ---- 一键导入 ---- */
.imp-qr{
  display:flex;flex-direction:column;align-items:center;
  margin-top:var(--sp-5);padding-top:var(--sp-5);
  border-top:1px solid var(--line);
}
/* 白底二维码在深色主题下会太刺眼，压一点亮度但保证对比度仍够扫 */
.imp-qr svg{border-radius:var(--r-sm);opacity:.92}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-2)}
.imp-item{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:var(--sp-3) var(--sp-4);text-align:left;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;
  transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);
}
.imp-item:hover{border-color:var(--brand);background:var(--surface-3)}
.imp-item:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.imp-name{font-size:var(--fs-sm);font-weight:600;color:var(--fg)}
.imp-os{font-size:var(--fs-2xs);color:var(--fg-3)}

.card{
  min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
}
.card-pad{padding:var(--sp-6)}
.card-head{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--line);
}
.card-head h3{font-size:var(--fs-base)}
.card-head .spacer{flex:1}

/* 徽章 */
.badge{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:var(--r-full);font-size:var(--fs-2xs);font-weight:600;
  background:var(--surface-3);color:var(--fg-2);letter-spacing:.01em;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-err{background:var(--err-soft);color:var(--err)}
.badge-brand{background:var(--brand-soft);color:var(--brand)}
.badge-plain::before{display:none}

/* 骨架屏 */
.sk{
  background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--r-sm);
}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Toast */
#toasts{position:fixed;top:var(--sp-4);right:var(--sp-4);z-index:100;
  display:flex;flex-direction:column;gap:var(--sp-2);pointer-events:none}
.toast{
  display:flex;align-items:flex-start;gap:var(--sp-3);min-width:280px;max-width:400px;
  padding:var(--sp-3) var(--sp-4);background:var(--bg-elev);
  border:1px solid var(--line-2);border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);font-size:var(--fs-sm);pointer-events:auto;
  animation:toastIn var(--t-slow) var(--ease-out);
}
.toast.out{animation:toastOut var(--t-base) var(--ease) forwards}
.toast svg{flex:0 0 auto;margin-top:2px}
.toast-body{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.toast-ok svg{color:var(--ok)} .toast-err svg{color:var(--err)}
.toast-info svg{color:var(--brand)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96)}
  to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px) scale(.96)}}

/* ==================================================== 登录 / 注册 */
#authView{
  position:relative;z-index:1;min-height:100vh;
  display:grid;place-items:center;padding:var(--sp-6);
}
.auth-shell{width:100%;max-width:396px;animation:rise var(--t-slow) var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.auth-brand{text-align:center;margin-bottom:var(--sp-8)}
.auth-brand .mark{margin:0 auto var(--sp-4)}
.auth-brand h1{font-size:var(--fs-2xl);letter-spacing:-.02em}
.auth-brand p{margin:var(--sp-2) 0 0;color:var(--fg-2);font-size:var(--fs-sm)}

.seg{
  display:flex;gap:2px;padding:3px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--sp-6);
}
.seg button{
  flex:1;height:32px;border:0;border-radius:7px;background:transparent;
  color:var(--fg-2);font-size:var(--fs-sm);font-weight:550;cursor:pointer;
  transition:all var(--t-fast) var(--ease);
}
.seg button.on{background:var(--bg-elev);color:var(--fg);box-shadow:var(--shadow-sm)}

.step-hint{
  display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-5) 0 var(--sp-3);
  font-size:var(--fs-xs);font-weight:600;color:var(--fg-3);text-transform:uppercase;
  letter-spacing:.06em;
}
.step-hint::after{content:'';flex:1;height:1px;background:var(--line)}

/* ==================================================== 应用外壳 */
#appView{position:relative;z-index:1;display:flex;min-height:100vh}
.side-mask{display:none}

aside{
  width:236px;flex:0 0 236px;border-right:1px solid var(--line);
  background:var(--bg-elev);display:flex;flex-direction:column;
  padding:var(--sp-5) var(--sp-3);position:sticky;top:0;height:100vh;
}
.side-brand{display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-3) var(--sp-6)}
.side-brand strong{font-size:var(--fs-md);letter-spacing:-.01em}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
/* 插槽：后台塞进来的内容，给一点默认间距，其余交给主题的自定义 CSS */
.slot:empty{display:none}
.slot{margin:var(--sp-4) 0}
.slot p{margin:0 0 var(--sp-2)}
.slot p:last-child{margin-bottom:0}
.slot a{color:var(--brand-on-soft)}
.slot table{width:100%;border-collapse:collapse}
.slot th,.slot td{padding:var(--sp-2);border-bottom:1px solid var(--line);text-align:left}
.nav-item{
  display:flex;align-items:center;gap:var(--sp-3);height:38px;padding:0 var(--sp-3);
  border:0;border-radius:var(--r-md);background:transparent;color:var(--fg-2);
  font-size:var(--fs-sm);font-weight:500;cursor:pointer;text-align:left;width:100%;
  transition:all var(--t-fast) var(--ease);
}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.on{background:var(--brand-soft);color:var(--brand-on-soft);font-weight:600}
.nav-item svg{flex:0 0 auto;opacity:.9}
.side-foot{border-top:1px solid var(--line);padding-top:var(--sp-3);margin-top:var(--sp-3)}
.side-user{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);
  border-radius:var(--r-md);
}
.avatar{
  width:30px;height:30px;flex:0 0 auto;border-radius:var(--r-full);
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;
}
.side-user .who{flex:1;min-width:0}
.side-user .who b{display:block;font-size:var(--fs-xs);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .who span{font-size:var(--fs-2xs);color:var(--fg-3)}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:60px;flex:0 0 60px;display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-8);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-elev) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:var(--fs-lg);letter-spacing:-.015em}
.topbar .spacer{flex:1}
.content{padding:clamp(var(--sp-4),2vw,var(--sp-10));max-width:1600px;width:100%;margin:0 auto}
.page{min-width:0;animation:fade var(--t-base) var(--ease-out)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ==================================================== 概览 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,232px),1fr));
  gap:var(--sp-4);margin-bottom:var(--sp-6)}
.stat{
  position:relative;overflow:hidden;padding:var(--sp-5);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  transition:border-color var(--t-base) var(--ease),transform var(--t-base) var(--ease);
}
.stat:hover{border-color:var(--line-2);transform:translateY(-2px)}
.stat-top{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.stat-ico{
  width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);
}
.stat-ico.g{background:var(--ok-soft);color:var(--ok)}
.stat-ico.y{background:var(--warn-soft);color:var(--warn)}
.stat-label{font-size:var(--fs-xs);color:var(--fg-2);font-weight:500}
.stat-val{font-size:var(--fs-3xl);font-weight:660;letter-spacing:-.03em;line-height:1.25}
.stat-val small{font-size:var(--fs-sm);font-weight:500;color:var(--fg-2);margin-left:3px}
.stat-sub{font-size:var(--fs-xs);color:var(--fg-3);margin-top:var(--sp-1)}

/* 用量条 */
.meter{height:6px;border-radius:var(--r-full);background:var(--surface-3);
  overflow:hidden;margin-top:var(--sp-3)}
.meter i{display:block;height:100%;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  transition:width var(--t-slow) var(--ease-out)}
.meter.w i{background:linear-gradient(90deg,var(--warn),#fb923c)}
.meter.d i{background:linear-gradient(90deg,var(--err),#f87171)}

/* 环形进度 */
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .track{stroke:var(--surface-3)}
.ring .bar{stroke:url(#ringGrad);
  transition:stroke-dashoffset 900ms var(--ease-out)}
.ring-mid{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
}
.ring-mid b{display:block;font-size:var(--fs-2xl);font-weight:670;letter-spacing:-.03em}
.ring-mid span{font-size:var(--fs-2xs);color:var(--fg-3)}

.usage-row{display:flex;align-items:center;gap:var(--sp-8);flex-wrap:wrap}
.usage-facts{flex:1;min-width:200px;display:flex;flex-direction:column;gap:var(--sp-4)}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-4)}
.fact .k{font-size:var(--fs-sm);color:var(--fg-2)}
.fact .v{font-size:var(--fs-base);font-weight:600}

/* 表格 */
.tbl-wrap{max-width:100%;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;padding:var(--sp-3) var(--sp-4);font-size:var(--fs-2xs);font-weight:600;
  color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--line);
}
.tbl td{padding:var(--sp-4);border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--t-fast) var(--ease)}
.tbl tbody tr:hover{background:var(--surface-2)}

/* ==================================================== 套餐 */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,272px),380px));
  justify-content:center;gap:var(--sp-5)}
.plan{
  position:relative;display:flex;flex-direction:column;padding:var(--sp-6);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  transition:transform var(--t-base) var(--ease),border-color var(--t-base) var(--ease),
             box-shadow var(--t-base) var(--ease);
}
.plan:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow-md)}
.plan.feat{border-color:transparent;background:
  linear-gradient(var(--surface),var(--surface)) padding-box,
  linear-gradient(135deg,var(--brand),var(--brand-2)) border-box;
  box-shadow:0 0 0 1px transparent,0 12px 40px -16px rgba(109,94,252,.55)}
.plan-tag{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  height:21px;padding:0 11px;border-radius:var(--r-full);
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  font-size:var(--fs-2xs);font-weight:650;display:grid;place-items:center;letter-spacing:.02em;
  box-shadow:0 4px 14px -4px rgba(109,94,252,.7);
}
.plan h4{font-size:var(--fs-md);margin-bottom:var(--sp-1)}
.plan .desc{font-size:var(--fs-xs);color:var(--fg-2);min-height:36px}
.plan .amt{display:flex;align-items:baseline;gap:3px;margin:var(--sp-5) 0 var(--sp-1)}
.plan .amt b{font-size:var(--fs-4xl);font-weight:680;letter-spacing:-.035em;line-height:1}
.plan .amt .cur{font-size:var(--fs-md);font-weight:600;color:var(--fg-2);align-self:flex-start;
  margin-top:3px}
.plan .amt .per{font-size:var(--fs-sm);color:var(--fg-3);font-weight:500}
.plan .amt .save{margin-left:auto;align-self:center;height:20px;padding:0 8px;
  border-radius:var(--r-full);background:var(--ok-soft);color:var(--ok);
  font-size:var(--fs-2xs);font-weight:650;display:grid;place-items:center}
.plan li b{color:var(--fg);font-weight:640}
.plan ul{list-style:none;margin:var(--sp-5) 0;padding:0;
  display:flex;flex-direction:column;gap:var(--sp-3);flex:1}
.plan li{display:flex;align-items:flex-start;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--fg-2)}
.plan li svg{flex:0 0 auto;color:var(--ok);margin-top:3px}

/* ==================================================== 工单 */
.tk-list{display:flex;flex-direction:column;gap:var(--sp-3)}
.tk-item{
  display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-5);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  cursor:pointer;text-align:left;width:100%;
  transition:border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);
}
.tk-item:hover{border-color:var(--line-2);transform:translateX(2px)}
.tk-main{flex:1;min-width:0}
.tk-main b{display:block;font-size:var(--fs-base);font-weight:600;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-meta{font-size:var(--fs-xs);color:var(--fg-3);display:flex;gap:var(--sp-3);flex-wrap:wrap}
.tk-thread{display:flex;flex-direction:column;gap:var(--sp-4);
  padding:var(--sp-6);max-height:52vh;overflow-y:auto}
.msg{display:flex;flex-direction:column;gap:5px;max-width:82%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.system{align-self:center;max-width:100%}
.msg-who{font-size:var(--fs-2xs);color:var(--fg-3)}
.msg-body{
  padding:var(--sp-3) var(--sp-4);border-radius:var(--r-lg);font-size:var(--fs-sm);
  background:var(--surface-2);border:1px solid var(--line);white-space:pre-wrap;
  word-break:break-word;line-height:1.65;
}
.msg.mine .msg-body{background:var(--brand-soft);border-color:transparent;color:var(--fg)}
.msg.system .msg-body{background:transparent;border:0;color:var(--fg-3);
  font-size:var(--fs-xs);text-align:center;padding:2px}
.tk-compose{border-top:1px solid var(--line);padding:var(--sp-4) var(--sp-6) var(--sp-6)}
textarea.input{height:auto;min-height:88px;padding:var(--sp-3) var(--sp-4);
  resize:vertical;line-height:1.6;font-family:inherit}

/* ==================================================== 空状态 */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--sp-16) var(--sp-6);text-align:center;
}
.empty svg{color:var(--fg-3);opacity:.55;margin-bottom:var(--sp-4)}
.empty h4{font-size:var(--fs-base);margin-bottom:var(--sp-2)}
.empty p{margin:0 0 var(--sp-5);color:var(--fg-2);font-size:var(--fs-sm);max-width:320px}
.empty-actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;justify-content:center}

/* ==================================================== 弹窗 */
.mask{
  position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:var(--sp-5);
  background:rgba(4,5,8,.62);backdrop-filter:blur(6px);
  animation:fadeIn var(--t-base) var(--ease);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:432px;background:var(--bg-elev);border:1px solid var(--line-2);
  border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;
  animation:pop var(--t-slow) var(--ease-out);
  display:flex;flex-direction:column;max-height:calc(100vh - var(--sp-10));
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:var(--sp-5) var(--sp-6);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.modal-head h3{flex:1;font-size:var(--fs-md)}
.modal-body{padding:var(--sp-6);overflow-y:auto;flex:1 1 auto}
.modal-foot{display:flex;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6) var(--sp-6);flex:0 0 auto}
.modal-foot .btn{flex:1}

.sum{background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-5)}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;
  gap:var(--sp-4);padding:var(--sp-2) 0;font-size:var(--fs-sm)}
.sum-row .k{color:var(--fg-2)}
.sum-row.total{border-top:1px solid var(--line);margin-top:var(--sp-2);
  padding-top:var(--sp-3);font-size:var(--fs-md)}
.sum-row.total .v{font-weight:680;letter-spacing:-.02em}

/* 开发环境提示条 */
.devbar{
  position:relative;z-index:2;display:flex;align-items:center;gap:var(--sp-2);
  padding:7px var(--sp-6);background:var(--warn-soft);color:var(--warn);
  font-size:var(--fs-xs);font-weight:500;border-bottom:1px solid var(--line);
}

/* ==================================================== 响应式 */
@media(max-width:1100px){
  aside{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);
    transition:transform var(--t-base) var(--ease);box-shadow:var(--shadow-lg)}
  aside.open{transform:none}
  .side-mask{display:block;position:fixed;inset:0;z-index:49;border:0;padding:0;
    background:rgba(4,5,8,.58);backdrop-filter:blur(3px);opacity:0;pointer-events:none;
    transition:opacity var(--t-base) var(--ease)}
  aside.open + .side-mask{opacity:1;pointer-events:auto}
  .topbar{padding:0 var(--sp-5)}
  .content{padding:var(--sp-5)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .usage-row{gap:var(--sp-5)}
  .btn,.btn-icon,.pw-toggle{min-height:44px}
  .btn-icon,.pw-toggle{min-width:44px}
  .pw-wrap .input{padding-right:56px}
  body.nav-drawer-open{overflow:hidden}
}
@media(max-width:560px){

  #authView{padding:max(var(--sp-4),env(safe-area-inset-top)) max(var(--sp-4),env(safe-area-inset-right)) max(var(--sp-4),env(safe-area-inset-bottom)) max(var(--sp-4),env(safe-area-inset-left))}
  .auth-shell{max-width:420px}
  aside{width:min(86vw,300px);flex-basis:min(86vw,300px)}
  .topbar{height:54px;flex-basis:54px;padding-left:max(var(--sp-3),env(safe-area-inset-left));
    padding-right:max(var(--sp-3),env(safe-area-inset-right))}
  .topbar h2{font-size:var(--fs-md)}
  .content{padding:var(--sp-3);padding-left:max(var(--sp-3),env(safe-area-inset-left));
    padding-right:max(var(--sp-3),env(safe-area-inset-right));padding-bottom:max(var(--sp-3),env(safe-area-inset-bottom))}
  .stats{grid-template-columns:1fr;gap:var(--sp-3);margin-bottom:var(--sp-4)}
  .card{border-radius:var(--r-md)}
  .card-head{align-items:flex-start;flex-wrap:wrap;white-space:normal}
  .card-pad,.card-head{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .tbl-wrap>.tbl{min-width:620px}
  .plan .amt{flex-wrap:wrap}
  .plan .amt .save{margin-left:0}
  .usage-row{justify-content:center}
  .usage-facts{width:100%;min-width:0}
	.subnodes,.sublink{margin-left:var(--sp-4);margin-right:var(--sp-4)}
	.subnodes-list{grid-template-columns:1fr}
  .mask{padding:var(--sp-2);align-items:end}
  .modal{max-height:calc(100dvh - var(--sp-4));border-radius:var(--r-lg) var(--r-lg) 0 0}
  #toasts{left:var(--sp-3);right:var(--sp-3);top:var(--sp-3)}
  .toast{min-width:0;max-width:none;width:100%}
}
@media(min-width:1400px){
  .page>.card:only-child .empty{min-height:320px}
}
@media(min-width:1800px){
  .auth-shell{max-width:456px}
  .auth-brand{margin-bottom:var(--sp-10)}
  .auth-brand .mark{width:54px;height:54px}
}
@media(min-width:2560px){
  :root{--fs-2xs:13px;--fs-xs:14px;--fs-sm:15px;--fs-base:16px;--fs-md:18px;
    --fs-lg:20px;--fs-xl:24px;--fs-2xl:30px;--fs-3xl:38px;--fs-4xl:48px}
  aside{width:276px;flex-basis:276px;padding:var(--sp-6) var(--sp-4)}
  .nav-item{height:44px}
  .topbar{height:70px;flex-basis:70px;padding:0 var(--sp-10)}
  /* Keep the user and admin shells on the same ultra-wide canvas.  A 1920px
     cap left almost half of a 4K viewport as inert gutters. */
  .content{max-width:3200px;padding:var(--sp-10)}
  .stats{grid-template-columns:repeat(4,minmax(300px,1fr));gap:var(--sp-5);max-width:none;margin-inline:auto}
  .card-pad{padding:var(--sp-8)}
  .page>.card:only-child .empty{min-height:400px}
  .auth-shell{max-width:620px}
  .auth-brand{margin-bottom:var(--sp-12)}
  .auth-brand .mark{width:64px;height:64px;margin-bottom:var(--sp-5)}
  .auth-brand h1{font-size:34px}
  .auth-brand p{font-size:17px}
  .auth-shell>.card.card-pad{padding:36px}
  .auth-shell .field{margin-bottom:20px}
  .auth-shell .field label{font-size:14px;margin-bottom:10px}
  .auth-shell .input{height:52px;font-size:17px}
  .auth-shell .btn{height:48px;font-size:16px}
  .auth-shell .seg{margin-bottom:30px}
  .auth-shell .seg button{height:40px;font-size:16px}
  .auth-shell .pw-toggle{width:42px;height:42px;right:5px}
  .auth-shell .pw-wrap .input{padding-right:56px}
}
@media(min-width:1101px){#btnMenu{display:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5efc"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5efc"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>

<div id="toasts"></div>

<!-- ═══════════════════════════ 未登录 ═══════════════════════════ -->
<section id="authView">
  <div class="auth-shell">
    <div id="slot-portal-login-notice" class="slot"></div>
    <div class="auth-brand">
      <svg class="mark" width="46" height="46" viewBox="0 0 46 46" fill="none">
        <rect width="46" height="46" rx="12" fill="url(#markGrad)"/>
        <path d="M23 12l8 3.6v6.2c0 4.8-3.2 9.2-8 10.7-4.8-1.5-8-5.9-8-10.7v-6.2L23 12z"
              stroke="#fff" stroke-width="2.1" stroke-linejoin="round" fill="none"/>
        <path d="M19.6 22.6l2.5 2.5 4.6-4.9" stroke="#fff" stroke-width="2.1"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 data-brand-name>潘多拉面板</h1>
      <p data-brand-tagline>订阅、节点与用量的统一控制台</p>
    </div>

    <div class="card card-pad">
      <div class="seg">
        <button class="on" id="loginTab" data-tab="login">登录</button>
        <button class="hide" id="registerTab" data-tab="register"
                aria-disabled="true" disabled>注册</button>
      </div>

      <!-- 登录 -->
      <form id="tabLogin" autocomplete="on">
        <div class="field">
          <label for="loginEmail">邮箱</label>
          <input class="input" id="loginEmail" type="email" placeholder="you@example.com"
                 autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">密码</label>
          <div class="pw-wrap">
            <input class="input" id="loginPass" type="password"
                   autocomplete="current-password" required>
            <button class="pw-toggle" id="toggleLoginPass" type="button"
                    aria-label="显示密码" aria-controls="loginPass"
                    aria-pressed="false" title="显示密码">
              <svg id="loginPassEye" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="btnLogin" type="submit">登录</button>
      </form>

      <!-- 注册 -->
      <form id="tabRegister" class="hide" autocomplete="on" aria-hidden="true" inert>
        <div class="step-hint">第 1 步 · 验证邮箱</div>
        <div class="field">
          <label for="regEmail">邮箱</label>
          <input class="input" id="regEmail" type="email" placeholder="you@example.com"
                 autocomplete="username">
        </div>
        <button class="btn btn-ghost btn-block" id="btnRegStart" type="button">获取验证码</button>

        <div id="regStep2" class="hide">
          <div class="step-hint">第 2 步 · 设置密码</div>

<script>
'use strict';
//==============================================================================
// 状态
//==============================================================================
const TK = 'aegis_token', THK = 'aegis_theme';
const PORTAL_CLIENT_VERSION='1.0.0', PORTAL_LOCALE='zh-CN';
const $ = id => document.getElementById(id);
let token = localStorage.getItem(TK) || '';
let needVerify = true;
let registrationMode = 'closed';
let regTok = '', cache = {me:null, subs:null, plans:null}, curOrder = null;

//==============================================================================
// 主题
//==============================================================================
// 深浅色。和站点主题（applySiteTheme）是两回事：这个只切 data-theme，
// 决定用哪一套背景/前景变量；那个注入品牌色之类的 token，两套配色下都生效。
//
// 名字不能再叫 applyTheme——下面还有一个同名函数，函数声明会被提升，
// 后定义的直接把这个覆盖掉，结果是切换按钮点了没反应、localStorage 里
// 存的偏好也读不出来，页面只靠 <html data-theme="dark"> 硬撑着。
function applyColorScheme(mode){
  document.documentElement.dataset.theme = mode;
  localStorage.setItem(THK, mode);
  $('icoMoon').classList.toggle('hide', mode === 'light');
  $('icoSun').classList.toggle('hide', mode !== 'light');
}
applyColorScheme(localStorage.getItem(THK) ||
  (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('btnTheme').onclick = () =>
  applyColorScheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

//==============================================================================
// Toast
//==============================================================================
const ICO = {
  ok:'<path d="M20 6L9 17l-5-5"/>',
  err:'<circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/>'
};
function toast(msg, kind = 'info', ms = 4200){
  const el = document.createElement('div');
  el.className = 'toast toast-' + kind;
  el.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    ICO[kind] + '</svg><div class="toast-body"></div>';
  el.querySelector('.toast-body').textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
}

//==============================================================================
// API
//==============================================================================
async function api(path, opts = {}){
  let body = opts.body;
  const plainBody = body !== null && typeof body === 'object' && !Array.isArray(body) &&
    Object.getPrototypeOf(body) === Object.prototype;
  if (plainBody) body = JSON.stringify(body);
  const h = Object.assign({}, opts.headers || {});
  const hasContentType = Object.keys(h).some(k => k.toLowerCase() === 'content-type');
  if (!hasContentType && (plainBody || typeof body === 'string')) {
    h['Content-Type'] = 'application/json';
  }
  if (token) h.Authorization = 'Bearer ' + token;
  if (opts.idem) h['Idempotency-Key'] = opts.idem;

  const res = await fetch(path, {method: opts.method || 'GET', headers: h, body});
  const txt = await res.text();
  let data; try{ data = txt ? JSON.parse(txt) : {}; }catch(_){ data = {raw: txt}; }

  if (!res.ok){
    const e = new Error((data.error && data.error.message) || ('请求失败 · HTTP ' + res.status));
    e.status = res.status; e.code = data.error && data.error.code;
    throw e;
  }
  return data;
}
function newIdemKey(){return crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random())}
function idemAttempt(makeKey=newIdemKey){
  let fingerprint='',key='';
  return {
    keyFor(payload){
      const next=JSON.stringify(payload||{});
      if(next!==fingerprint){fingerprint=next;key=makeKey()}
      return key;
    },
    reset(){fingerprint='';key=''}
  };
}
function parseCNYMinor(value){
  const text=String(value||'').trim();
  const match=/^(?:0|[1-9]\d*)(?:\.(\d{1,2}))?$/.exec(text);
  if(!match) return null;
  const parts=text.split('.');
  const amount=Number(parts[0] + ((parts[1]||'') + '00').slice(0,2));
  return Number.isSafeInteger(amount)&&amount>0?amount:null;
}
// 邀请链接：/?invite=CODE
//
// 读到就直接切到注册页并把码填好。要求用户自己从地址栏抄一遍，
// 等于这条链接白发了 —— 分享出去的链接必须自己把事办完。
// loadSiteConfig 决定注册表单长什么样。
//
// 关闭邮箱验证时，「获取验证码 → 填码 → 创建账号」这三步里
// 中间两步是空转。直接收起来，让注册回到「填邮箱密码点确定」——
// 多一步就多一批人放弃。
async function loadSiteConfig(){
  registrationMode = 'closed';
  needVerify = true;
  try{
    const c = await api('/v1/site-config');
    if (!['closed','invite_only','open'].includes(c.registration_mode)) {
      throw new Error('站点注册配置无效');
    }
    registrationMode = c.registration_mode;
    needVerify = !!c.email_verification;
  }catch(_){
    // 配置拉取、解析或枚举异常都保持 closed。注册策略只能由后端明确放开，
    // 不能因为数据库或网络故障回退到开放注册。
    registrationMode = 'closed';
    needVerify = true;
  }

  const invite = new URLSearchParams(location.search).get('invite');
  const inviteCode = invite ? invite.trim().toUpperCase() : '';
  const canShowRegistration = registrationMode === 'open' ||
    (registrationMode === 'invite_only' && !!inviteCode);
  const registerTab = $('registerTab');
  registerTab.classList.toggle('hide', !canShowRegistration);
  registerTab.disabled = !canShowRegistration;
  registerTab.setAttribute('aria-disabled', String(!canShowRegistration));

  const registerForm = $('tabRegister');
  registerForm.setAttribute('aria-hidden', String(!canShowRegistration));
  if (!canShowRegistration) {
    registerForm.classList.add('hide');
    registerForm.setAttribute('inert', '');
    $('loginTab').click();
	const active = document.activeElement;
	if (active === document.body || active === registerTab || registerForm.contains(active)) {
	  $('loginTab').focus({preventScroll:true});
	}
  } else {
    registerForm.removeAttribute('inert');
  }

  const inviteInput = $('regInvite');
	const inviteField = inviteInput.closest('.field');
	const startButton = $('btnRegStart');
	if (inviteField && startButton && inviteField.nextElementSibling !== startButton) {
	  startButton.before(inviteField);
	}
  const inviteRequired = registrationMode === 'invite_only';
  inviteInput.required = inviteRequired;
  inviteInput.setAttribute('aria-required', String(inviteRequired));
  $('regInviteLabel').textContent = inviteRequired ? '邀请码' : '邀请码 · 选填';
  if (inviteCode && canShowRegistration) {
    inviteInput.value = inviteCode;
    registerTab.click();
    history.replaceState(null, '', location.pathname);
    toast('已带入邀请码 ' + inviteCode, 'info', 5000);
  }

  if (needVerify || !canShowRegistration) return;

  const codeField = $('regCode').closest('.field');
  if (codeField) codeField.hidden = true;
  const sendBtn = $('btnRegStart');
  if (sendBtn) sendBtn.hidden = true;
  // 分步提示没有意义了：现在只有一步
  document.querySelectorAll('#tabRegister .step-hint').forEach(el => el.hidden = true);
  // 第二步的内容直接摊开
  $('regStep2').classList.remove('hide');
}

function busy(btn, on, label){
  if (on){
    btn.dataset.label = btn.innerHTML;
    btn.innerHTML = '<span class="spin"></span>' + (label || '');
    btn.disabled = true;
  } else {
    if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
    btn.disabled = false;
  }
}

//==============================================================================
// 格式化
//==============================================================================
const EXP = {JPY:0, KRW:0, VND:0, TWD:0, CLP:0, ISK:0};
function money(minor, cur){
  const e = cur in EXP ? EXP[cur] : 2;
  const neg = minor < 0, v = Math.abs(minor);
  let s;
  if (e === 0) s = String(v);
  else { const p = String(v).padStart(e + 1, '0'); s = p.slice(0, -e) + '.' + p.slice(-e); }
  return (neg ? '-' : '') + s;
}
const CUR_SYM = {CNY:'¥', USD:'$', EUR:'€', GBP:'£', JPY:'¥'};
function bytes(n){
  if (n === null || n === undefined) return '不限';
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0, v = Number(n);
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2)) + ' ' + u[i];
}
const INTV = {day:'天', week:'周', month:'月', quarter:'季', year:'年', one_time:'一次性'};
const SUB_ST = {
  pending:['待激活','warn'], trialing:['试用中','brand'], active:['生效中','ok'],
  past_due:['已逾期','err'], grace:['宽限期','warn'], paused:['已暂停',''],
  cancelled:['已取消',''], expired:['已过期','err']
};
function fmtDate(s){
  if (!s) return '—';
  const d = new Date(s);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function daysLeft(s){
  if (!s) return null;
  return Math.ceil((new Date(s) - Date.now()) / 86400000);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

//==============================================================================
// 认证
//==============================================================================
function bindPasswordToggle(button, input, eye){
  button.onclick = () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    const label = show ? '隐藏密码' : '显示密码';
    button.setAttribute('aria-label', label);
    button.setAttribute('aria-pressed', String(show));
    button.title = label;
    eye.innerHTML = show
      ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 4.2A10.7 10.7 0 0112 4c6.5 0 10 8 10 8a17.8 17.8 0 01-2.1 3.2M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8a10.3 10.3 0 005.4-1.6"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  };
}

bindPasswordToggle($('toggleLoginPass'), $('loginPass'), $('loginPassEye'));

document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  if (b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  $('tabLogin').classList.toggle('hide', b.dataset.tab !== 'login');
  $('tabRegister').classList.toggle('hide', b.dataset.tab !== 'register');
  $('tabRegister').setAttribute('aria-hidden', String(b.dataset.tab !== 'register'));
});

$('tabLogin').onsubmit = async ev => {
  ev.preventDefault();
  const btn = $('btnLogin');
  busy(btn, true, '登录中');
  try{
    const r = await api('/v1/auth/login', {method:'POST', body: JSON.stringify({
      email: $('loginEmail').value.trim(), password: $('loginPass').value })});
    token = r.access_token; localStorage.setItem(TK, token);
    toast('登录成功', 'ok', 2000);
    enterApp();
  }catch(e){ toast(e.message, 'err'); }
  finally{ busy(btn, false); }
};

$('btnRegStart').onclick = async () => {
  if (registrationMode === 'closed') return toast('当前未开放注册', 'err');
  const email = $('regEmail').value.trim();
  if (!email) return toast('请填写邮箱', 'err');
  const inviteCode = $('regInvite').value.trim().toUpperCase();

let passwordLetterRE=null, passwordDigitRE=null;
try{
  passwordLetterRE=new RegExp('\\p{L}','u');
  passwordDigitRE=new RegExp('\\p{Nd}','u');
  if(!passwordLetterRE.test('字')||!passwordDigitRE.test('１')){
    passwordLetterRE=null;passwordDigitRE=null;
  }
}catch(_){
  passwordLetterRE=null;passwordDigitRE=null;
}

function utf8ByteLength(value){
  if(typeof TextEncoder==='function')return new TextEncoder().encode(value).length;
  let bytes=0;
  for(const char of value){
    const point=char.codePointAt(0);
    bytes+=point<=0x7f?1:point<=0x7ff?2:point<=0xffff?3:4;
  }
  return bytes;
}

function passwordPolicyError(password){
  if(!passwordLetterRE||!passwordDigitRE)return '当前浏览器不支持 Unicode 密码校验，请升级浏览器';
  if (Array.from(password).length < 8) return '密码至少需要8个字符';
  if(utf8ByteLength(password)>256)return '密码不能超过256个 UTF-8 字节';
  if(!passwordLetterRE.test(password)||!passwordDigitRE.test(password))return '密码必须同时包含字母和数字';
  return '';
}

function updateRegistrationPasswordState(){
  const input=$('regPass'), hint=$('regPassPolicy');
  const hasPassword=input.value.length>0;
  const error=passwordPolicyError(input.value);
  hint.textContent=hasPassword?(error||'密码规则已满足'):'至少8位且同时包含字母和数字，最多256个 UTF-8 字节';
  hint.classList.toggle('ok',hasPassword&&!error);
  hint.classList.toggle('err',hasPassword&&!!error);
  input.setAttribute('aria-invalid',String(hasPassword&&!!error));
}
$('regPass').addEventListener('input',updateRegistrationPasswordState);

//---------------------------------------------------------------------------
// 实时刷新
//
// 服务端在数据变化时推一条通知过来，页面自己重新拉数据 —— 不需要手动刷新。
//
// 没用 EventSource 而是 fetch + ReadableStream：EventSource 不允许设置
// 请求头，令牌只能塞进 URL，那样它会出现在 nginx 访问日志、浏览器历史
// 和 Referer 里。手写解析多几十行，换掉的是一处真实的凭据泄露面。
//---------------------------------------------------------------------------
let rtAbort = null;      // 当前连接的中止控制器
let rtTimer = null;      // 刷新防抖
let rtBackoff = 1000;    // 重连退避

// 一次业务操作常常连带改好几张表（下单会写 orders、subscriptions、
// quota_balances…），于是会连着收到好几条通知。防抖把它们合成一次拉取，
// 否则页面会在半秒内重复加载三四遍。
function scheduleRefresh(){
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    loadNotifications();
    loadAll().then(() => {
      // 工单详情页有自己的数据，需要单独刷
      if (curPage === 'support' && typeof renderSupport === 'function') renderSupport();
      else go(curPage);
    }).catch(() => {});
  }, 250);
}

function stopRealtime(){
  if (rtAbort){ rtAbort.abort(); rtAbort = null; }
  clearTimeout(rtTimer);
}

async function startRealtime(){
  const token = localStorage.getItem(TK);
  if (!token) return;

  stopRealtime();
  rtAbort = new AbortController();

  try{
    const res = await fetch('/v1/events', {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: rtAbort.signal,
    });
    if (!res.ok || !res.body){
      // 401 说明登录已失效，重连再多次也没用
      if (res.status === 401) return;
      throw new Error('SSE ' + res.status);
    }

    rtBackoff = 1000;   // 连上了，退避归零
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // SSE 用空行分帧。可能一次读到半帧，也可能一次读到好几帧，
      // 所以要在缓冲区里按空行切，剩下的留到下次。
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0){
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        handleFrame(frame);
      }
    }
  }catch(e){
    if (rtAbort && rtAbort.signal.aborted) return;   // 是我们主动断的
  }

  // 断线重连，退避上限 30 秒 —— 服务端重启时所有客户端会同时断开，
  // 固定间隔重连会形成一波打在刚起来的进程上。
  if (localStorage.getItem(TK)){
    setTimeout(startRealtime, rtBackoff);
    rtBackoff = Math.min(rtBackoff * 2, 30000);
  }
}

function handleFrame(frame){
  let ev = 'message';
  for (const line of frame.split('\n')){
    if (line.startsWith(':')) return;              // 心跳
    if (line.startsWith('event:')) ev = line.slice(6).trim();
  }
  if (ev === 'message') return;
  // 所有业务事件一律触发刷新。
  //
  // 不按事件类型分别处理：那样每加一种事件都要在这里补一个分支，
  // 漏掉就是「某个页面不刷新」。统一重新拉取的代价是多几次请求，
  // 但保证了「界面永远等于数据库」这个性质。
  scheduleRefresh();
}

function renderNotifications(list, unread){
  const dot = $('bellDot');
  dot.textContent = unread > 99 ? '99+' : String(unread);
  dot.classList.toggle('on', unread > 0);

  const box = $('notifList');
  if(!list.length){
    box.innerHTML = '<div class="notif-empty">还没有通知</div>';
    return;
  }
  box.innerHTML = list.map(n => `
    <button class="notif-item${n.read_at ? ' read' : ''}" data-id="${esc(n.id)}">
      <div class="t">${esc(n.subject || '通知')}</div>
      <div class="b">${esc(n.body || '')}</div>
      <div class="d">${n.sent_at ? fmtDateTime(n.sent_at) : ''}</div>
    </button>`).join('');

  box.querySelectorAll('.notif-item').forEach(el => {
    el.onclick = async () => {
      if(el.classList.contains('read')) return;
      el.classList.add('read');
      // 先改界面再发请求：已读是个无关紧要的状态，
      // 等一个来回才变灰会让点击显得迟钝
      try{ await api('/v1/me/notifications/' + el.dataset.id + '/read', {method:'POST'}); }
      catch(e){}
      loadNotifications();
    };
  });
}

function toggleNotif(open){
  notifOpen = open === undefined ? !notifOpen : open;
  $('notifPanel').classList.toggle('open', notifOpen);
  $('btnBell').setAttribute('aria-expanded', String(notifOpen));
  if(notifOpen) loadNotifications();
}

async function loadAll(){
  try{
    // 公告与其它数据一起并行拉：概览页第一屏就要用它，
    // 晚一步会让页面先渲染一次再往下跳
    const [me, subs, plans, ann] = await Promise.all([
      api('/v1/me'), api('/v1/me/subscriptions'), api('/v1/plans'),
      api('/v1/me/announcements').catch(() => ({announcements: []})),
    ]);
    // 链接单独拉：它失败不该让整个概览页空掉
    await loadSubLinks();
    subNodeStates.clear();
    cache = {me, subs: subs.subscriptions || [], plans: plans.plans || [],
             announcements: ann.announcements || []};
    popCriticalAnnouncement(cache.announcements);

    $('userEmail').textContent = me.email || '—';
    $('userEmail').title = me.email || '';
    $('userStatus').textContent = me.status === 'active' ? '账号正常' : (me.status || '');
    $('avatar').textContent = (me.email || '?').charAt(0).toUpperCase();
  }catch(e){
    if (e.status === 401){
      token = ''; localStorage.removeItem(TK);
      setSidebar(false,false);
      $('appView').classList.add('hide'); $('authView').classList.remove('hide');
      toast('登录已过期，请重新登录', 'err');
      return;
    }
    toast('数据载入失败：' + e.message, 'err');
  }
}

// 已读状态存在 localStorage 而不是数据库：为「看过一条通知」建一张
// user × announcement 的表，换来的只是跨设备记忆一次弹窗 ——

const ANN_READ = 'aegis_ann_read';

function annRead(){
  try{ return JSON.parse(localStorage.getItem(ANN_READ) || '[]'); }
  catch(_){ return []; }
}
function markAnnRead(id){
  const r = annRead();
  if (!r.includes(id)){ r.push(id); localStorage.setItem(ANN_READ, JSON.stringify(r.slice(-100))); }
}

const ANN_STYLE = {
  info:     {bar:'var(--fg-3)',   label:''},
  notice:   {bar:'var(--brand)',  label:'提示'},
  warning:  {bar:'var(--warn)',   label:'注意'},
  critical: {bar:'var(--err)',    label:'紧急'},
};

function renderAnnouncements(list){
  if (!list || !list.length) return '';
  // 只在概览页顶部铺开，正文折起来 —— 公告再重要也不该把用量和到期挤下去
  return list.slice(0, 3).map(a => {
    const st = ANN_STYLE[a.severity] || ANN_STYLE.info;
    return '<div class="ann" style="border-left-color:' + st.bar + '">' +
      '<div class="ann-head">' +
        (st.label ? '<span class="ann-tag" style="background:' + st.bar + '">' +
          st.label + '</span>' : '') +
        (a.pinned ? '<span class="ann-pin">置顶</span>' : '') +
        '<b>' + esc(a.title) + '</b>' +
        '<span class="spacer"></span>' +
        '<span class="sub num">' + fmtDate(a.published_at) + '</span>' +
      '</div>' +
      '<div class="ann-body">' + esc(a.body) + '</div>' +
    '</div>';
  }).join('');
}

// 紧急公告弹一次窗。
//
// 只对 critical 弹，而且每条只弹一次 —— 每次进面板都糊一脸弹窗，
// 用户学会的第一件事就是闭着眼点关闭，那时候真出事也没人看了。
function popCriticalAnnouncement(list){
  const read = annRead();
  const hit = (list || []).find(a => a.severity === 'critical' && !read.includes(a.id));
  if (!hit) return;

  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
  '<div class="modal" role="dialog" aria-modal="true" aria-label="重要公告">' +
    '<div class="modal-head"><h3 style="color:var(--err)">' + esc(hit.title) + '</h3></div>' +
    '<div class="modal-body"><div style="white-space:pre-wrap;line-height:1.8">' +
      esc(hit.body) + '</div></div>' +
    '<div class="modal-foot"><button class="btn btn-primary" id="annOk">我知道了</button></div>' +
  '</div>';
  document.body.appendChild(m);
  m.querySelector('#annOk').onclick = () => { markAnnRead(hit.id); m.remove(); };
}

      dl === null ? '' : (dl < 0 ? '' : '天'),
      '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
      dl !== null && dl <= 7 ? 'y' : '', dl !== null && dl >= 0 ? 'num' : '') +
  '</div>' +

  '<div class="card" style="margin-bottom:var(--sp-6)">' +
    '<div class="card-head"><h3>用量</h3><div class="spacer"></div>' +
      '<span class="badge badge-plain">本计费周期</span></div>' +
    '<div class="card-pad"><div class="usage-row">' +
      '<div class="ring">' +
        '<svg width="132" height="132" viewBox="0 0 132 132">' +
          '<circle class="track" cx="66" cy="66" r="56"/>' +
          '<circle class="bar" cx="66" cy="66" r="56" stroke-dasharray="' + C +
            '" stroke-dashoffset="' + (C - C * remainPct / 100) + '"/>' +
        '</svg>' +
        '<div class="ring-mid"><b class="num">' +
          (lim ? Math.round(remainPct) + '%' : '∞') +
          '</b><span>' + (lim ? '剩余' : '不限量') + '</span></div>' +
      '</div>' +
      '<div class="usage-facts">' +
        fact('已用流量', bytes(used)) +

//==============================================================================
// 订阅
//==============================================================================
//---------------------------------------------------------------------------
// 二维码。
//
// 自己实现而不是引库：Artifact 与本项目都禁止外部依赖，而一个只需要
// byte 模式的编码器不到两百行 —— 为它拉一个几十 KB 的通用库不划算。
//
// 只支持 byte 模式 + M 级纠错，够覆盖订阅链接（80–120 字符）。
// 输入超过当前版本容量时自动升版，超出 version 10 就放弃并让调用方降级到复制链接。

const QR_ECC_M = 0;   // 纠错等级 M 在编码表里的索引

// 每个版本在 M 级纠错下的：总码字数、纠错码字数/块、块数（组1）、块数（组2）
const QR_SPEC = {
  1:  [26,   10, 1, 0],
  2:  [44,   16, 1, 0],
  3:  [70,   26, 1, 0],
  4:  [100,  18, 2, 0],
  5:  [134,  24, 2, 0],
  6:  [172,  16, 4, 0],
  7:  [196,  18, 4, 0],
  8:  [242,  22, 2, 2],
  9:  [292,  22, 3, 2],
  10: [346,  26, 4, 1],
};

// 伽罗瓦域 GF(256) 的对数表，Reed-Solomon 要用
const QR_EXP = new Uint8Array(512);
const QR_LOG = new Uint8Array(256);
(function initGF(){
  let x = 1;
  for (let i = 0; i < 255; i++){
    QR_EXP[i] = x;
    QR_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;    // 本原多项式
  }
  for (let i = 255; i < 512; i++) QR_EXP[i] = QR_EXP[i - 255];
})();

function gfMul(a, b){
  if (a === 0 || b === 0) return 0;
  return QR_EXP[QR_LOG[a] + QR_LOG[b]];
}

// 生成多项式：(x - a^0)(x - a^1)...(x - a^(n-1))
function rsGenerator(n){
  let poly = [1];
  for (let i = 0; i < n; i++){
    const next = new Array(poly.length + 1).fill(0);
    for (let j = 0; j < poly.length; j++){
      next[j] ^= poly[j];
      next[j + 1] ^= gfMul(poly[j], QR_EXP[i]);
    }
    poly = next;
  }
  return poly;
}

function rsEncode(data, ecLen){
  const gen = rsGenerator(ecLen);
  const res = new Array(ecLen).fill(0);
  for (const byte of data){
    const factor = byte ^ res[0];
    res.shift();
    res.push(0);
    for (let i = 0; i < gen.length - 1; i++){
      res[i] ^= gfMul(gen[i + 1], factor);
    }
  }
  return res;
}

// 各版本的对齐图案中心坐标
const QR_ALIGN = {
  1: [], 2: [6,18], 3: [6,22], 4: [6,26], 5: [6,30],
  6: [6,34], 7: [6,22,38], 8: [6,24,42], 9: [6,26,46], 10: [6,28,50],
};

// version 7 起必须画版本信息：右上和左下各一块 6×3。
//
// 漏掉它的后果不是「少个装饰」——那 36 个格子会被当成数据区填进码字，
// 整个流往后错位，扫描器读出来的是一堆纠错都救不回来的乱码。
// version 1–6 没有这个区域，所以这个错只在长内容时才暴露。
const QR_VERSION_INFO = {
  7: 0x07C94, 8: 0x085BC, 9: 0x09A99, 10: 0x0A4D3,
};

function qrEncode(text){
  const bytes = new TextEncoder().encode(text);

  // 挑一个装得下的最小版本。
  //
  // 上限卡在 6 而不是 10：version 7 起要画版本信息块，那部分实现过一次
  // 但独立解码器验出码字仍然错位，没查清之前不能放出去 ——
  // 一个「看着像二维码、扫出来是乱码」的图比没有二维码更糟，
  // 用户会以为是自己手机的问题而反复重试。
  //
  // version 6 能装 106 字节，覆盖绝大多数订阅链接。
  // 超出就返回 null，调用方降级到「复制链接」。
  let version = 0, spec = null;
  for (let v = 1; v <= 6; v++){
    const sp = QR_SPEC[v];
    const blocks = sp[2] + sp[3];
    const capacity = sp[0] - sp[1] * blocks;
    // 按位算而不是按字节：4 位模式 + 8/16 位长度 + 数据。
    // 按字节向上取整会白白浪费掉一个字节的容量，
    // 让刚好卡在边界的链接被迫升版甚至被拒
    const lenBits = v < 10 ? 8 : 16;
    if (4 + lenBits + bytes.length * 8 <= capacity * 8){
      version = v; spec = sp; break;
    }
  }
  if (!version) return null;   // 装不下，调用方降级到复制链接

  const [totalCw, ecPerBlock, g1, g2] = spec;
  const blocks = g1 + g2;
  const dataCw = totalCw - ecPerBlock * blocks;

  // --- 位流 ---
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(0b0100, 4);                                  // byte 模式
  push(bytes.length, version < 10 ? 8 : 16);
  for (const b of bytes) push(b, 8);
  // 结束符最多 4 个 0，然后补到字节边界
  for (let i = 0; i < 4 && bits.length < dataCw * 8; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  // 交替填充字节直到填满
  const pads = [0xec, 0x11];
  let pi = 0;
  while (bits.length < dataCw * 8){ push(pads[pi++ % 2], 8); }

  const dataBytes = [];
  for (let i = 0; i < bits.length; i += 8){
    let b = 0;
    for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    dataBytes.push(b);
  }

  // --- 分块并算纠错 ---
  const shortLen = Math.floor(dataCw / blocks);
  const dataBlocks = [], ecBlocks = [];
  let off = 0;
  for (let i = 0; i < blocks; i++){
    const len = shortLen + (i >= g1 ? 1 : 0);
    const blk = dataBytes.slice(off, off + len);
    off += len;
    dataBlocks.push(blk);
    ecBlocks.push(rsEncode(blk, ecPerBlock));
  }

  // 交错：先按列取数据码字，再取纠错码字
  const finalBytes = [];
  const maxData = Math.max(...dataBlocks.map(b => b.length));
  for (let i = 0; i < maxData; i++){
    for (const blk of dataBlocks) if (i < blk.length) finalBytes.push(blk[i]);
  }
  for (let i = 0; i < ecPerBlock; i++){
    for (const blk of ecBlocks) finalBytes.push(blk[i]);
  }

  // --- 铺矩阵 ---
  const size = version * 4 + 17;
  const mat = Array.from({length: size}, () => new Array(size).fill(null));

  const setFinder = (r, c) => {
    for (let i = -1; i <= 7; i++){
      for (let j = -1; j <= 7; j++){
        const rr = r + i, cc = c + j;
        if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
        const on = (i >= 0 && i <= 6 && (j === 0 || j === 6)) ||
                   (j >= 0 && j <= 6 && (i === 0 || i === 6)) ||
                   (i >= 2 && i <= 4 && j >= 2 && j <= 4);
        mat[rr][cc] = on ? 1 : 0;
      }
    }
  };
  setFinder(0, 0); setFinder(0, size - 7); setFinder(size - 7, 0);

  // 定位线
  for (let i = 8; i < size - 8; i++){
    const v = i % 2 === 0 ? 1 : 0;
    if (mat[6][i] === null) mat[6][i] = v;
    if (mat[i][6] === null) mat[i][6] = v;
  }

  // 对齐图案。
  //
  // 排除规则必须按坐标判断，不能看格子是否已被占用：
  // (6, 22) 这类位置的中心正好落在定位线上，按「已占用就跳过」会漏掉它，
  // 那 25 个格子随后被当成数据区填进码字，整个流往后错位。
  // 标准只排除三个角 —— 与定位图案重叠的 (first,first)/(first,last)/(last,first)。
  const align = QR_ALIGN[version];
  const first = align[0], last = align[align.length - 1];
  for (const r of align){
    for (const c of align){
      if ((r === first && c === first) || (r === first && c === last) ||
          (r === last && c === first)) continue;
      for (let i = -2; i <= 2; i++){
        for (let j = -2; j <= 2; j++){
          mat[r + i][c + j] = (Math.abs(i) === 2 || Math.abs(j) === 2 || (i === 0 && j === 0)) ? 1 : 0;
        }
      }
    }
  }

  mat[size - 8][8] = 1;   // 固定的黑点

  // 版本信息（version ≥ 7）。要在填数据之前占好位，
  // 否则之字形填充会把数据写进这两块区域
  const vinfo = QR_VERSION_INFO[version];
  if (vinfo !== undefined){
    for (let i = 0; i < 18; i++){
      const bit = (vinfo >> i) & 1;
      const r = Math.floor(i / 3), c = i % 3;
      mat[r][size - 11 + c] = bit;   // 右上
      mat[size - 11 + c][r] = bit;   // 左下
    }
  }

  // 预留格式信息位
  const reserved = [];
  for (let i = 0; i < 9; i++){
    if (mat[8][i] === null){ mat[8][i] = 0; reserved.push([8, i]); }
    if (mat[i][8] === null){ mat[i][8] = 0; reserved.push([i, 8]); }
  }
  for (let i = size - 8; i < size; i++){
    if (mat[8][i] === null){ mat[8][i] = 0; reserved.push([8, i]); }
    if (mat[i][8] === null){ mat[i][8] = 0; reserved.push([i, 8]); }
  }
  const isReserved = (r, c) => reserved.some(p => p[0] === r && p[1] === c);

  // --- 之字形填数据 ---
  let bitIdx = 0;
  const dataBits = [];
  for (const b of finalBytes){ for (let i = 7; i >= 0; i--) dataBits.push((b >> i) & 1); }

  let upward = true;
  for (let col = size - 1; col > 0; col -= 2){
    if (col === 6) col--;               // 跳过定位列
    for (let n = 0; n < size; n++){
      const row = upward ? size - 1 - n : n;
      for (let k = 0; k < 2; k++){
        const c = col - k;
        if (mat[row][c] !== null) continue;
        // mask 0：(row + col) % 2 == 0 时翻转
        const bit = bitIdx < dataBits.length ? dataBits[bitIdx++] : 0;
        mat[row][c] = ((row + c) % 2 === 0) ? bit ^ 1 : bit;
      }
    }
    upward = !upward;
  }

  // --- 格式信息（纠错 M + mask 0）---
  const fmtData = (QR_ECC_M << 3) | 0;       // ECC 位 + mask 号
  let fmt = fmtData << 10;
  for (let i = 4; i >= 0; i--){
    if (fmt & (1 << (i + 10))) fmt ^= 0b10100110111 << i;
  }
  fmt = ((fmtData << 10) | fmt) ^ 0b101010000010010;

  const fmtBit = i => (fmt >> i) & 1;
  for (let i = 0; i <= 5; i++) mat[8][i] = fmtBit(i);
  mat[8][7] = fmtBit(6); mat[8][8] = fmtBit(7); mat[7][8] = fmtBit(8);
  for (let i = 9; i <= 14; i++) mat[14 - i][8] = fmtBit(i);
  for (let i = 0; i <= 7; i++) mat[size - 1 - i][8] = fmtBit(i);
  for (let i = 8; i <= 14; i++) mat[8][size - 15 + i] = fmtBit(i);

  return mat;
}

// 把矩阵画成 SVG。用 SVG 而不是 Canvas：缩放不糊，
// 而且用户可以直接右键保存图片
function qrSVG(text, px){
  const mat = qrEncode(text);
  if (!mat) return null;
  const n = mat.length, quiet = 2, total = n + quiet * 2;
  const rects = [];
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++){
      if (mat[r][c]) rects.push('M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z');
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px +
    '" viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges">' +
    '<rect width="' + total + '" height="' + total + '" fill="#fff"/>' +
    '<path d="' + rects.join('') + '" fill="#000"/></svg>';
}

// 一键导入。
//
// 拿到订阅链接之后，用户还要打开客户端、找到「从剪贴板导入」、粘贴、确认 ——
// 这四步里每一步都在流失人。深链把它压成一次点击。
//
// 服务端按 User-Agent 决定返回 Clash YAML 还是 sing-box JSON，
// 所以这里所有客户端共用同一个订阅地址，不需要按客户端拼不同的 URL。
const CLIENTS = [
  {id:'clash',    name:'Clash Verge / mihomo', os:'桌面',
   link: u => 'clash://install-config?url=' + encodeURIComponent(u) + '&name=Pandora%20Panel'},
  {id:'stash',    name:'Stash',                os:'iOS / macOS',
   link: u => 'stash://install-config?url=' + encodeURIComponent(u)},
  {id:'shadowrocket', name:'Shadowrocket',     os:'iOS',
   link: u => 'sub://' + b64url(u)},
  {id:'singbox',  name:'sing-box',             os:'全平台',
   link: u => 'sing-box://import-remote-profile?url=' + encodeURIComponent(u)},
  {id:'surge',    name:'Surge',                os:'iOS / macOS',
   link: u => 'surge:///install-config?url=' + encodeURIComponent(u)},
  {id:'loon',     name:'Loon',                 os:'iOS',
   link: u => 'loon://import?sub=' + encodeURIComponent(u)},
  {id:'quantumult', name:'Quantumult X',       os:'iOS',
   link: u => 'quantumult-x:///update-configuration?remote-resource=' +
     encodeURIComponent(JSON.stringify({server_remote:[u + ', tag=Pandora Panel']}))},
  // v2rayN / NekoBox 这类没有注册深链协议，只能走复制。
  // 与其给一个点了没反应的按钮，不如直说
  {id:'manual',   name:'v2rayN / NekoBox 等',  os:'手动',
   link: null},
];

// base64url：Shadowrocket 的 sub:// 要的是 URL 安全变体，
// 带 + / = 的标准 base64 会在跳转时被截断
function b64url(str){
  return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

    '<div class="modal-head"><h3>导入到客户端</h3>' +

        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +

      '<div class="imp-grid">' +

        '这时用下面的链接手动导入。' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn btn-ghost" data-close>关闭</button></div>' +

  // 编码失败（链接过长）时不显示空白框，直接不渲染 —— 下面还有复制链接兜底
  const svg = qrSVG(url, 168);

      svg + '<div class="hint" style="margin-top:var(--sp-2)">手机客户端可直接扫码导入</div>';
  }

    const f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = c.link(url);
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 2000);

  });

let subLinks = {};   // subscription_id -> 链接信息
const subNodeStates = new Map();

async function loadSubLinks(){

// subLinkBlock 渲染一条订阅下面的链接区块。

  // 只提示不阻断：家里几台设备加手机流量切换，四五个来源是正常的，
  // 真正异常的是十几二十个 —— 那基本只能是链接被转出去了。
  const many = l.distinct_sources_24h >= 8;

  return '<div class="sublink">' +
    '<div class="sublink-row">' +
      '<div class="sublink-url" id="su-' + esc(subId) + '">' + esc(l.url) + '</div>' +
      '<button class="btn btn-sm btn-primary" onclick="openImportModal(\'' + esc(subId) + '\')">' +

        'title="在当前到期日基础上延长">续费</button> ' +
      '<button class="btn btn-sm btn-ghost" onclick="rotateSubLink(\'' + esc(subId) + '\')" ' +
        'title="换一条新链接，旧的立即失效">重置</button>' +
    '</div>' +
    '<div class="sublink-meta">' +
      '<span>已拉取 <b>' + (l.fetch_count || 0) + '</b> 次</span>' +
      '<span>最近 <b>' + (l.last_fetched_at ? fmtDateTime(l.last_fetched_at) : '从未') + '</b></span>' +
      '<span>24 小时来源 <b>' + (l.distinct_sources_24h || 0) + '</b> 个</span>' +
    '</div>' +
    (many ?
      '<div class="sublink-warn">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px">' +
        '<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>' +
        '<path d="M12 9v4M12 17h.01"/></svg>' +
        '<div>近 24 小时有 ' + l.distinct_sources_24h + ' 个不同来源拉取这条链接。' +
        '如果不是你本人的设备，建议点「重置」换一条。</div>' +
      '</div>' : '') +
  '</div>';
}

function subNodeBlock(subId, subStatus){
  if(!['active','trialing','grace'].includes(subStatus)){
    return '<div class="subnodes"><div class="subnodes-head"><div><b>套餐节点</b>' +
      '<div class="sub">当前订阅不可用，恢复有效状态后才能查看节点。</div></div></div></div>';
  }
  const state = subNodeStates.get(subId) || {status:'idle', expanded:false, nodes:[]};
  if(!subNodeStates.has(subId)) subNodeStates.set(subId, state);
  return '<div class="subnodes">' +
    '<div class="subnodes-head"><div><b>套餐节点</b>' +
      '<div class="sub">仅显示名称、协议和流量倍率，不展示连接参数。</div></div>' +
      '<button class="btn btn-sm btn-ghost" data-sub-nodes-toggle="' + esc(subId) + '" ' +
        'aria-expanded="' + String(state.expanded) + '" aria-controls="sn-' + esc(subId) + '">' +
        (state.expanded ? '收起节点' : '查看节点') + '</button></div>' +
    '<div id="sn-' + esc(subId) + '" role="status" aria-live="polite">' +
      renderSubNodeState(subId, state) + '</div></div>';
}

function renderSubNodeState(subId, state){
  if(!state.expanded) return '';
  if(state.status === 'loading') return '<div class="subnodes-state">正在读取可用节点…</div>';
  if(state.status === 'error') return '<div class="subnodes-state">节点暂时加载失败。 ' +
    '<button class="btn btn-sm btn-ghost" data-sub-nodes-retry="' + esc(subId) + '">重试</button></div>';
  if(state.status === 'ready' && !state.nodes.length) return '<div class="subnodes-state">当前没有可用节点</div>';
  if(state.status !== 'ready') return '';
  return '<div class="subnodes-list">' + state.nodes.map(node => {
    const rate = Number(node.traffic_rate);
    const safeRate = Number.isFinite(rate) && rate > 0 ? rate : 1;
    return '<div class="subnode-item"><div class="subnode-name" title="' + esc(node.name || '未命名节点') + '">' +
      esc(node.name || '未命名节点') + '</div><div class="subnode-meta">' +
      esc(node.protocol || 'unknown') + ' · ' + safeRate.toFixed(2) + '× 流量倍率</div></div>';
  }).join('') + '</div>';
}

function bindSubNodeButtons(root){
  root.querySelectorAll('[data-sub-nodes-toggle]').forEach(button => {
    button.onclick = () => toggleSubNodes(button.dataset.subNodesToggle);
  });
  root.querySelectorAll('[data-sub-nodes-retry]').forEach(button => {
    button.onclick = () => toggleSubNodes(button.dataset.subNodesRetry, true);
  });
}

function renderSubNodeRegion(subId){
  const state = subNodeStates.get(subId);
  const region = document.getElementById('sn-' + subId);
  const button = document.querySelector('[data-sub-nodes-toggle="' + CSS.escape(subId) + '"]');
  if(!state || !region || !button) return;
  region.innerHTML = renderSubNodeState(subId, state);
  button.setAttribute('aria-expanded', String(state.expanded));
  button.textContent = state.expanded ? '收起节点' : '查看节点';
  bindSubNodeButtons(region);
}

async function toggleSubNodes(subId, retry){
  let state = subNodeStates.get(subId) || {status:'idle', expanded:false, nodes:[]};
  if(retry){ state = {status:'idle', expanded:true, nodes:[]}; subNodeStates.set(subId, state); }
  else state.expanded = !state.expanded;
  renderSubNodeRegion(subId);
  if(!state.expanded || state.status === 'ready' || state.status === 'loading') return;

  state.status = 'loading';
  renderSubNodeRegion(subId);
  const requestedState = state;
  try{
    const response = await api('/v1/me/subscriptions/' + encodeURIComponent(subId) + '/nodes');
    if(subNodeStates.get(subId) !== requestedState) return;
    requestedState.nodes = (response.nodes || []).map(node => ({
      name: String(node.name || ''), protocol: String(node.protocol || ''),
      traffic_rate: Number(node.traffic_rate),
    }));
    requestedState.status = 'ready';
  }catch(_){
    if(subNodeStates.get(subId) !== requestedState) return;
    requestedState.status = 'error';
  }
  renderSubNodeRegion(subId);
}

async function copySubLink(subId){
  const l = subLinks[subId];
  if(!l) return;
  try{
    await navigator.clipboard.writeText(l.url);
    toast('订阅链接已复制');
  }catch(e){
    // 非 HTTPS 或旧浏览器下 clipboard 不可用。
    // 选中文本让用户自己按 Ctrl+C，比弹一句「复制失败」有用。
    const el = $('su-' + subId);
    if(el){
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      toast('已选中，请按 Ctrl+C 复制', 'warn');
    }
  }
}

async function rotateSubLink(subId){
  if(!confirm('重置后旧链接立即失效，所有设备都需要重新导入新的订阅链接。确定继续？')) return;
  try{
    await api('/v1/me/subscriptions/' + encodeURIComponent(subId) + '/rotate', {method:'POST'});
    await loadSubLinks();
    subNodeStates.delete(subId);
    renderSubs();
    toast('已生成新链接，请重新导入到客户端');
  }catch(e){
    toast('重置失败：' + (e.message || '请稍后再试'), 'err');
  }
}

const METRIC = {'traffic.bytes':'流量', 'devices.active':'设备数',
                'requests.count':'请求数', 'concurrent.sessions':'并发连接'};
function quotaBlock(qs){
  let h = '<div class="card-pad" style="border-top:1px solid var(--line);' +
          'display:flex;flex-direction:column;gap:var(--sp-5)">';
  qs.forEach(q => {
    const isB = q.metric === 'traffic.bytes';
    const lim = q.limit === null || q.limit === undefined ? null : Number(q.limit);
    const used = Number(q.consumed || 0);
    const pct = lim ? Math.min(100, used / lim * 100) : 0;
    const tone = pct >= 90 ? 'd' : pct >= 70 ? 'w' : '';
    h += '<div>' +
      '<div class="fact" style="margin-bottom:var(--sp-2)">' +
        '<span class="k">' + (METRIC[q.metric] || esc(q.metric)) + '</span>' +
        '<span class="v num">' + (isB ? bytes(used) : used) + ' / ' +
          (lim === null ? '不限' : (isB ? bytes(lim) : lim)) + '</span>' +
      '</div>' +
      '<div class="meter ' + tone + '"><i style="width:' + (lim ? pct : 0) + '%"></i></div>' +
    '</div>';
  });
  return h + '</div>';
}

function renderPlans(){
  const el = $('pagePlans'), plans = cache.plans;
  if (plans === null){ el.innerHTML = skeleton(); return; }
  if (!plans.length){
    el.innerHTML = emptyState('暂无可售套餐', '管理员尚未上架任何套餐。', '');
    return;
  }

  // 推荐档取中间价位而非最便宜的那档：最低价通常是引流款，
  // 中间档才是真正想主推的（大多数订阅产品都这么标）。
  const featPlanId = plans.length > 2 ? plans[Math.floor(plans.length / 2)].id : null;

  const cards = [];
  plans.forEach(p => (p.prices || []).forEach(pr => cards.push({p, pr})));

  let h = '<div class="plans">';
  cards.forEach(c => {
    const {p, pr} = c;
    // 同一套餐的多个价格里，只把周期最长的那张标为推荐
    const longest = (p.prices || []).reduce((a, b) =>
      intervalDays(b.billing_interval) * (b.interval_count || 1) >
      intervalDays(a.billing_interval) * (a.interval_count || 1) ? b : a, p.prices[0]);
    const feat = p.id === featPlanId && pr.id === longest.id;

    const traffic = (p.quotas || []).find(q => q.metric === 'traffic.bytes');
    const devQ    = (p.quotas || []).find(q => q.metric === 'devices.active');
    const devices = p.max_devices ?? (devQ && devQ.limit);

    // 年付相对月付省多少
    let save = '';
    const monthly = (p.prices || []).find(x => x.billing_interval === 'month');
    if (monthly && pr.billing_interval === 'year'){
      const full = monthly.unit_amount * 12;
      if (full > pr.unit_amount){
        save = '省 ' + Math.round((1 - pr.unit_amount / full) * 100) + '%';
      }
    }

    h += '<div class="plan' + (feat ? ' feat' : '') + '">' +
      (feat ? '<div class="plan-tag">最受欢迎</div>' : '') +
      '<h4>' + esc(p.name) + '</h4>' +
      '<div class="desc">' + esc(p.description || p.code || '') + '</div>' +
      '<div class="amt">' +
        '<span class="cur">' + (CUR_SYM[pr.currency] || pr.currency) + '</span>' +
        '<b class="num">' + money(pr.unit_amount, pr.currency) + '</b>' +
        '<span class="per">/ ' + (pr.interval_count > 1 ? pr.interval_count : '') +
          (INTV[pr.billing_interval] || pr.billing_interval) + '</span>' +
        (save ? '<span class="save">' + save + '</span>' : '') +
      '</div>' +
      '<ul>' +
        (traffic ? li('<b>' + (traffic.limit === null ? '不限流量'
                    : bytes(traffic.limit)) + '</b> / ' +
                    (traffic.period === 'cycle' ? '计费周期' : traffic.period)) : '') +
        (devices ? li('最多 <b>' + devices + '</b> 台设备同时在线') : '') +
        li(pr.trial_days > 0 ? '含 ' + pr.trial_days + ' 天免费试用' : '下单即时开通') +
        li('用量实时统计，可随时取消') +
      '</ul>' +
      '<button class="btn ' + (feat ? 'btn-primary' : 'btn-ghost') + ' btn-block" ' +
        'data-plan="' + esc(p.id) + '" data-price="' + esc(pr.id) + '">立即购买</button>' +
    '</div>';
  });
  el.innerHTML = h + '</div>';

  el.querySelectorAll('button[data-price]').forEach(b =>
    b.onclick = () => openConfirmModal(b.dataset.plan, b.dataset.price));
}
function intervalDays(i){
  return {day:1, week:7, month:30, quarter:91, year:365, one_time:36500}[i] || 30;
}
// 注意：t 允许含 <b> 等标签，调用点必须保证其中的动态部分已转义或为数字。
function li(t){
  return '<li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M20 6L9 17l-5-5"/></svg><span>' + t + '</span></li>';
}

const TK_STATUS = {

      '<div class="card-pad">' +
