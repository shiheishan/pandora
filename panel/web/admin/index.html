const WD_ST = {
  requested: ['待审核', 'badge-warn'],
  reviewing: ['审核中', 'badge-warn'],
  approved:  ['待打款', 'badge-brand'],
  processing:['打款中', 'badge-brand'],
  paid:      ['已打款', 'badge-ok'],
  rejected:  ['已拒绝', 'badge-plain'],
  failed:    ['打款失败', 'badge-err'],
  returned:  ['已退回', 'badge-plain'],
};

async function viewCommission(v){
  let [ov, wd] = await Promise.all([
    api('/v1/commission/overview'),
    api('/v1/withdrawals'),
  ]);
  ov = ov || {}; wd = wd || {};
  const list = wd.withdrawals || [];
  const cur = 'CNY';

  const rows = list.map(w => {
    const st = WD_ST[w.status] || [w.status, 'badge-plain'];
    // 提现额远超历史佣金说明数据有问题，标出来让人先看一眼再打钱
    const odd = w.amount > w.earned_total;
    const acts = w.status === 'requested' || w.status === 'reviewing'
      ? '<button class="btn btn-sm btn-primary" data-ok="' + esc(w.id) + '">批准</button> ' +
        '<button class="btn btn-sm btn-ghost" data-no="' + esc(w.id) + '">拒绝</button>'
      : (w.status === 'approved'
          ? '<button class="btn btn-sm btn-primary" data-pay="' + esc(w.id) + '">标记已打款</button>'
          : '<span class="sub">—</span>');
    return '<tr' + (odd ? ' style="background:var(--err-soft)"' : '') + '>' +
      '<td>' + esc(w.email) + '</td>' +
      '<td class="r num"><b>' + money(w.amount, w.currency) + '</b>' +
        (odd ? '<div class="sub" style="color:var(--err)">超过累计佣金 ' +
               money(w.earned_total, w.currency) + '</div>' : '') + '</td>' +
      '<td class="mono" style="max-width:220px;word-break:break-all">' +
        esc(w.payout_detail || '（无）') + '</td>' +
      '<td><span class="badge ' + st[1] + '">' + st[0] + '</span>' +
        (w.reject_reason ? '<div class="sub">' + esc(w.reject_reason) + '</div>' : '') + '</td>' +
      '<td class="sub num">' + dt(w.requested_at) + '</td>' +
      '<td class="r">' + acts + '</td>' +
    '</tr>';
  }).join('');

  v.innerHTML =
    '<div class="card" style="margin-bottom:var(--sp-5)">' +
      '<div class="card-head"><h3>分销概况</h3><div class="spacer"></div>' +
        '<button class="btn btn-ghost btn-sm" id="cmCfg">分销设置</button></div>' +
      '<div class="card-pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));' +
        'gap:var(--sp-4)">' +
        cmStat('当前费率', num(ov.rate_percent) + '%') +
        cmStat('冻结中', money(num(ov.pending), cur)) +
        cmStat('可提现', money(num(ov.available), cur)) +
        cmStat('累计打款', money(num(ov.paid_out), cur)) +
        cmStat('本月计提', money(num(ov.this_month), cur)) +
        cmStat('待审提现', String(num(ov.waiting_withdrawals)),
               num(ov.waiting_withdrawals) > 0 ? 'var(--warn)' : '') +
        cmStat('待复核佣金', String(num(ov.need_review)),
               num(ov.need_review) > 0 ? 'var(--warn)' : '') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>提现申请</h3>' +
        (list.length ? '<span class="badge badge-plain">' + list.length + '</span>' : '') +
      '</div>' +
      (list.length ? '<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr>' +
        '<th>用户</th><th class="r">金额</th><th>收款方式</th><th>状态</th>' +
        '<th>申请时间</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : emptyRow('还没有提现申请',
    '分销伙伴发起提现后会出现在这里，等待你审核和打款。')) +
      '<div class="sub" style="padding:var(--sp-4) var(--sp-6);font-size:var(--fs-2xs);line-height:1.6">' +
        '批准只是同意，钱还没出去；实际转账后再点「标记已打款」，' +
        '那一步才会记账。收款信息在数据库里是加密的，这里的明文只在页面上存在。' +
      '</div>' +
    '</div>';

  v.querySelector('#cmCfg').onclick = () => openCommissionConfig(ov);
  v.querySelectorAll('[data-ok]').forEach(b =>
    b.onclick = () => reviewWd(b.dataset.ok, 'approve'));
  v.querySelectorAll('[data-no]').forEach(b =>
    b.onclick = () => openRejectWd(b.dataset.no));
  v.querySelectorAll('[data-pay]').forEach(b =>
    b.onclick = () => openPayWd(b.dataset.pay));
}

function cmStat(label, val, color){
  return '<div><div class="sub" style="font-size:var(--fs-2xs)">' + label + '</div>' +
    '<div class="num" style="font-size:var(--fs-xl);font-weight:600;margin-top:2px' +
    (color ? ';color:' + color : '') + '">' + val + '</div></div>';
}

async function reviewWd(id, action, reason){
  try{
    await api('/v1/withdrawals/' + id + '/review', {method:'POST',
      body: JSON.stringify({action, reason: reason || ''})});
    toast(action === 'approve' ? '已批准' : '已拒绝', 'ok', 2000);
    render();
  }catch(e){ toast(e.message, 'err'); }
}

function openRejectWd(id){
  const m = modal('拒绝提现',
    '<div class="field" style="margin-bottom:0"><label for="wdR">拒绝理由</label>' +
      '<input class="input" id="wdR" placeholder="用户会看到这段话">' +
      '<div class="hint">写清楚原因，否则用户只会开工单来问。</div></div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="wdRok">确认拒绝</button>');
  m.querySelector('#wdRok').onclick = async () => {
    const r = m.querySelector('#wdR').value.trim();
    if(!r){ toast('请填写理由', 'err'); return; }
    m.remove();
    await reviewWd(id, 'reject', r);
  };
}

function openPayWd(id){
  const m = modal('标记已打款',
    '<div class="field" style="margin-bottom:0"><label for="wdRef">转账流水号</label>' +
      '<input class="input mono" id="wdRef" placeholder="例如 ALIPAY-20260727-0001">' +
      '<div class="hint">这一步会记账，表示钱已经离开平台。日后对账靠这个流水号。</div>' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="wdPok">确认已打款</button>');
  m.querySelector('#wdPok').onclick = async ev => {
    const ref = m.querySelector('#wdRef').value.trim();
    if(!ref){ toast('请填写流水号', 'err'); return; }
    busy(ev.currentTarget, true, '记账中');
    try{
      await api('/v1/withdrawals/' + id + '/paid', {method:'POST',
        body: JSON.stringify({payout_reference: ref})});
      m.remove();
      toast('已记录打款', 'ok', 2000);
      render();
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };
}

function openCommissionConfig(ov){
  const m = modal('分销设置',
    '<div class="field"><label for="cfRate">佣金比例（%）</label>' +
      '<input class="input" id="cfRate" type="number" min="0" max="50" step="1" value="' +
        ov.rate_percent + '">' +
      '<div class="hint">填 10 表示订单成交额的 10% 归推荐人。填 0 关闭分销。</div></div>' +
    '<div class="field"><label for="cfFreeze">冻结天数</label>' +
      '<input class="input" id="cfFreeze" type="number" min="0" max="90" step="1" value="' +
        ov.freeze_days + '">' +
      '<div class="hint">佣金产生后要过多久才能提现。这段时间用来兜住退款和盗刷 —— ' +
        '设成 0 意味着骗子可以当场把钱提走。</div></div>' +
    '<div class="field" style="margin-bottom:0"><label for="cfMin">最低提现金额（元）</label>' +
      '<input class="input" id="cfMin" type="number" min="0" step="0.01" value="' +
        (ov.min_withdraw / 100) + '"></div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="cfOk">保存</button>');
  m.querySelector('#cfOk').onclick = async ev => {
    busy(ev.currentTarget, true, '保存中');
    try{
      await api('/v1/commission/config', {method:'POST', body: JSON.stringify({
        rate_percent: parseInt(m.querySelector('#cfRate').value || '0', 10),
        freeze_days:  parseInt(m.querySelector('#cfFreeze').value || '0', 10),
        min_withdraw: Math.round(parseFloat(m.querySelector('#cfMin').value || '0') * 100),
      })});
      m.remove();
      toast('已保存', 'ok', 2000);
      render();
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };
}

      '<div class="card-head"><h3>发信配置</h3><div class="spacer"></div>' +

      '<div class="card-pad">' +
        '<div class="grid2">' +
          fld('SMTP 服务器', '<input class="input" id="mHost" value="' +
              esc(c.smtp_host) + '" placeholder="smtp.example.com">',
    '邮件服务商给的发信地址。注意：本机 25/465/587 出站被封时，SMTP 发不出去。') +
          fld('端口', '<input class="input" id="mPort" type="number" min="1" max="65535" value="' +
              c.smtp_port + '">') +
          fld('加密方式',
              '<select class="input" id="mEnc">' +
              '<option value="ssl"' + (c.encryption==='ssl'?' selected':'') + '>SSL / TLS（常用 465）</option>' +
              '<option value="tls"' + (c.encryption==='tls'?' selected':'') + '>STARTTLS（常用 587）</option>' +
              '<option value="none"' + (c.encryption==='none'?' selected':'') + '>不加密（不建议）</option>' +
              '</select>',
    'SSL 通常配 465 端口，TLS 配 587。选错会连不上邮件服务器。') +
          fld('用户名', '<input class="input" id="mUser" value="' +
              esc(c.smtp_username) + '" autocomplete="off">') +
          fld('密码', '<input class="input" id="mPass" type="password" autocomplete="new-password" ' +
              'placeholder="' + (c.has_password ? '已设置，留空则不修改' : '未设置') + '">',
              c.has_password ? '要清空密码请填一个减号 -' : '') +
          fld('发件人地址', '<input class="input" id="mFrom" value="' +
              esc(c.from_address) + '" placeholder="noreply@example.com">',
    '用户收到邮件时显示的寄件人。多数服务商要求它和已验证的域名一致。') +
          fld('发件人名称', '<input class="input" id="mName" value="' +
              esc(c.from_name) + '">') +
        '</div>' +
        '<div style="display:flex;gap:var(--sp-3);margin-top:var(--sp-4);flex-wrap:wrap">' +
          '<button class="btn btn-primary" id="mSave">保存</button>' +
          '<button class="btn btn-ghost" id="mTest">发送测试邮件</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>注册验证</h3></div>' +
      '<div class="card-pad">' +
        fld('注册模式',
          '<select class="input" id="mRegistrationMode">' +
            '<option value="closed"' + (c.registration_mode==='closed'?' selected':'') +
              '>关闭注册（推荐）</option>' +
            '<option value="invite_only"' + (c.registration_mode==='invite_only'?' selected':'') +
              '>仅邀请码注册</option>' +
            '<option value="open"' + (c.registration_mode==='open'?' selected':'') +
              '>开放注册</option>' +
          '</select>',
          '默认关闭。邀请码模式只允许持有有效邀请码的访客创建账号；后端会在开始和完成注册时分别校验。') +
        '<label style="display:flex;align-items:flex-start;gap:var(--sp-3);cursor:pointer">' +
          '<input type="checkbox" id="mVerify" style="margin-top:3px"' +
            (c.email_verification ? ' checked' : '') + '>' +
          '<span><b>注册时验证邮箱</b>' +
            '<div class="sub" style="margin-top:4px;line-height:1.7">' +
              '开启后用户注册要先收验证码。' +
              '<b>这依赖发信配置</b> —— SMTP 没配好就开，验证码发不出去，' +
              '结果是谁也注册不了，而这个故障在监控上只表现为注册量归零。' +
            '</div>' +
          '</span>' +
        '</label>' +
      '</div>' +
    '</div>';

  v.querySelector('#mSave').onclick = saveMail;
  v.querySelector('#mTest').onclick = testMail;

  // Telegram 与 SMTP 是两套独立通道，各自加载：
  // 一边配错了不该把另一边的入口也拖没。
  if (can('security.audit.read')){
    const tgBox = document.createElement('div');
    tgBox.style.marginTop = 'var(--sp-5)';
    v.appendChild(tgBox);
    renderTelegramSettings(tgBox);
  }
  v.querySelector('#mVerify').onchange = saveMail;
  v.querySelector('#mRegistrationMode').onchange = saveMail;

  // 模板区块单独加载：SMTP 配置和模板内容是两件事，
  // 模板取不到不该把整页拖垮
  if (can('ops.notification.read')){
    const box = document.createElement('div');
    box.id = 'mailTplBox';
    box.style.marginTop = 'var(--sp-5)';
    v.appendChild(box);
    renderMailTemplates(box);
  }
}

async function viewAppearance(v){
  const [themes, slots] = await Promise.all([
    api('/v1/themes').then(r => r.themes || []),
    api('/v1/slots').then(r => r.slots || []),
  ]);

  const active = themes.find(t => t.is_active);
  v.innerHTML =
    '<div class="card" style="margin-bottom:var(--sp-5)">' +
      '<div class="card-head"><h3>主题</h3><div class="spacer"></div>' +
        '<span class="sub">生效中：' + esc(active ? active.name : '无') + '</span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>主题</th><th>主色</th><th>自定义 CSS</th><th class="r"></th>' +
      '</tr></thead><tbody>' +
      themes.map(t =>
        '<tr>' +
          '<td><b>' + esc(t.name) + '</b>' +
            (t.is_active ? ' <span class="badge badge-ok">生效中</span>' : '') +
            (t.is_builtin ? ' <span class="badge badge-plain">内置</span>' : '') +
            '<div class="sub mono">' + esc(t.code) + '</div></td>' +
          '<td>' + swatch(t.tokens && t.tokens.brand) + '</td>' +
          '<td class="sub num">' + ((t.custom_css || '').length || '—') +
            ((t.custom_css || '').length ? ' 字符' : '') + '</td>' +
          '<td class="r" style="white-space:nowrap">' +
            (can('platform.appearance.write')
              ? (t.is_active ? '' :
                  '<button class="btn btn-sm btn-ghost" data-th-act="' + esc(t.code) + '">启用</button> ') +
                '<button class="btn btn-sm btn-ghost" data-th-edit="' + esc(t.code) + '">' +
                  (t.is_builtin ? '另存为' : '编辑') + '</button>' +
                (t.is_builtin || t.is_active ? '' :
                  ' <button class="btn btn-sm btn-ghost" data-th-del="' + esc(t.code) + '">删除</button>')
              : '') +
          '</td>' +
        '</tr>').join('') +
      '</tbody></table></div>' +
      (can('platform.appearance.write')
        ? '<div class="card-pad"><button class="btn btn-primary" id="thNew">新建主题</button></div>'
        : '') +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>页面插槽</h3><div class="spacer"></div>' +
        '<span class="sub">后台写、用户端显示。HTML 会按白名单净化</span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>位置</th><th>内容</th><th>状态</th><th class="r"></th>' +
      '</tr></thead><tbody>' +
      slots.map(x =>
        '<tr>' +
          '<td><b>' + esc(x.label) + '</b><div class="sub">' + esc(x.where) + '</div>' +
            '<div class="sub mono">' + esc(x.key) + '</div></td>' +
          '<td class="sub">' + (x.content
            ? esc(x.content.replace(/<[^>]*>/g, ' ').trim().slice(0, 46)) +
              (x.content.length > 46 ? '…' : '')
            : '（空）') + '</td>' +
          '<td>' + (x.enabled && x.content
            ? '<span class="badge badge-ok">显示中</span>'
            : '<span class="badge badge-plain">未显示</span>') + '</td>' +
          '<td class="r">' + (can('platform.appearance.write')
            ? '<button class="btn btn-sm btn-ghost" data-slot="' + esc(x.key) + '">编辑</button>'
            : '') + '</td>' +
        '</tr>').join('') +
      '</tbody></table></div>' +
    '</div>';

  v.querySelectorAll('[data-th-act]').forEach(b => b.onclick = async ev => {
    busy(ev.currentTarget, true, '切换中');
    try{
      await api('/v1/themes/' + encodeURIComponent(b.dataset.thAct) + '/activate', {method:'POST'});
      toast('主题已切换', 'ok'); render();
    }catch(e){ toast(e.message, 'err', 7000); busy(ev.currentTarget, false); }

  v.querySelectorAll('[data-th-del]').forEach(b => b.onclick = async ev => {
    busy(ev.currentTarget, true, '删除中');

      await api('/v1/themes/' + encodeURIComponent(b.dataset.thDel), {method:'DELETE'});

  });

  if (nb) nb.onclick = () => themeModal(null);
  v.querySelectorAll('[data-slot]').forEach(b => b.onclick = () =>
    slotModal(slots.find(x => x.key === b.dataset.slot)));
}

function swatch(color){
  if (!color) return '<span class="sub">—</span>';
  return '<span style="display:inline-flex;align-items:center;gap:6px">' +
    '<span style="width:14px;height:14px;border-radius:4px;border:1px solid var(--line);' +
      'background:' + esc(color) + '"></span>' +
    '<span class="mono sub">' + esc(color) + '</span></span>';
}

// TOKEN_FIELDS 是给界面用的取值清单。
// 键名就是 portal 里的 CSS 变量名 —— 前端拿到什么就 setProperty 什么，
// 中间没有映射表，所以这里写错一个名字的后果是「改了没反应」，
// 而不是某处悄悄崩掉。

  ['brand',         '主色',       '按钮、链接、选中态'],
  ['brand-2',       '辅色',       '渐变的另一端'],
  ['brand-soft',    '主色浅底',   '选中项的背景，建议用 rgba'],
  ['brand-on-soft', '浅底上的字', '要能在浅底上读清'],
  ['r-lg',          '圆角',       '卡片圆角，如 14px'],
];

    '<div class="grid2">' +

          '小写字母开头，只能有字母数字和 - _。存好后不能改。') +
      fld('主题名称', '<input class="input" id="thName" value="' +

    '</div>' +
    '<div class="sect">配色</div>' +
    '<div class="grid2">' +
      TOKEN_FIELDS.map(([k, label, hint]) =>
        fld(label, '<input class="input mono" data-tk="' + k + '" value="' +
            esc(tk[k] || '') + '" placeholder="留空则沿用默认">', hint)).join('') +
    '</div>' +
    '<div class="sect">品牌文案</div>' +
    '<div class="grid2">' +
      fld('站点名称', '<input class="input" id="thSite" value="' +
          esc(br.site_name || '') + '">', '会替换页面标题和侧栏上的名字') +
      fld('标语', '<input class="input" id="thTag" value="' +
          esc(br.tagline || '') + '">', '显示在登录页') +
    '</div>' +
    '<div class="sect">自定义 CSS</div>' +
    fld('', '<textarea class="input mono" id="thCSS" rows="10" ' +
        'style="resize:vertical" placeholder=".card{box-shadow:none}">' +
        esc((t && t.custom_css) || '') + '</textarea>',
        '外部 @import 和外链 url() 会被移除 —— 它们会把访问记录送到第三方。' +
        '内嵌图片（data:image）和站内路径可以用。'),
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="thSave">保存</button>', true);

  m.querySelector('#thSave').onclick = async ev => {
    const tokens = {};
    m.querySelectorAll('[data-tk]').forEach(i => {
      const val = i.value.trim();
      if (val) tokens[i.dataset.tk] = val;
    });
    const payload = {
      code: m.querySelector('#thCode').value.trim().toLowerCase(),
      name: m.querySelector('#thName').value.trim(),
      tokens,
      branding: {
        site_name: m.querySelector('#thSite').value.trim(),
        tagline: m.querySelector('#thTag').value.trim(),
      },
      custom_css: m.querySelector('#thCSS').value,
    };
    if (!payload.code || !payload.name) return toast('标识和名称都要填', 'err');
    busy(ev.currentTarget, true, '保存中');
    try{
      const r = await api('/v1/themes', {method:'POST', body: payload});
      m.remove();
      reportDropped(r.dropped, '主题已保存');
      render();
    }catch(e){ toast(e.message, 'err', 8000); busy(ev.currentTarget, false); }
  };
}

function slotModal(x){
  const m = modal('编辑「' + esc(x.label) + '」',
    '<div class="sub" style="margin-bottom:var(--sp-3);line-height:1.8">' +
      '位置：' + esc(x.where) + '<br>' +
      '这段内容会显示给<b>所有用户</b>。可以用 p、a、img、ul、table 这类标签；' +
      'script、form、input、iframe 和 on* 事件属性会被丢掉 —— ' +
      '它们能在用户浏览器里做的事远超过「展示一段说明」。</div>' +
    fld('内容（HTML）', '<textarea class="input mono" id="slBody" rows="12" ' +
        'style="resize:vertical">' + esc(x.content || '') + '</textarea>',
    '支持 HTML。会原样渲染给用户，注意不要粘进不受信任的脚本。') +
    '<label style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">' +
      '<input type="checkbox" id="slOn"' + (x.enabled ? ' checked' : '') + '>' +
      '<span>启用（关掉则内容保留但不显示）</span></label>',

// reportDropped 把服务端净化时丢掉的东西摆给管理员看。
// 悄悄改掉他写的内容，会让人以为没保存上然后一遍遍重贴同一段被过滤的代码。
function reportDropped(dropped, okMsg){
  if (!dropped || !dropped.length){ toast(okMsg, 'ok'); return; }
  modal('已保存，但有内容被移除',
    '<div class="sub" style="margin-bottom:var(--sp-3)">' +
      '出于安全考虑，下面这些被去掉了：</div>' +
    '<ul style="margin:0;padding-left:20px;line-height:2">' +
      dropped.map(d => '<li>' + esc(d) + '</li>').join('') + '</ul>',
    '<button class="btn btn-primary" data-close>知道了</button>');
}

//---------------------------------------------------------------------------
// 插件钩子
//---------------------------------------------------------------------------
//
// 插件跑在它自己的进程里，面板只往外发签过名的 HTTP 请求。
// 所以这一页管的是「往哪发、发什么、发成功没有」，而不是「装了什么包」。

async function viewPlugins(v){
  const d = await api('/v1/plugin-hooks');

  v.innerHTML =
    '<div class="card" style="margin-bottom:var(--sp-5)"><div class="card-pad">' +
      '<div class="sub" style="line-height:1.9">' +
        '插件通过 <b>出站 webhook</b> 接入：面板在事件发生时，往你填的地址 POST 一段 JSON，' +
        '带 <span class="mono">X-Pandora-Signature</span> 头（HMAC-SHA256，签的是' +
        '「时间戳.请求体」）。你的插件校验签名后自己决定做什么。' +
        '<br>刻意不做「上传插件包自动执行」：那等于给后台开一个任意代码执行入口，' +
        '一个被盗的管理员账号就能拿走整台机器。' +
      '</div>' +
    '</div></div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>已接入的插件</h3><div class="spacer"></div>' +
        (can('platform.plugin.write')
          ? '<button class="btn btn-primary btn-sm" id="hkNew">接入插件</button>' : '') +
      '</div>' +
      (hooks.length
        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
            '<th>插件</th><th>订阅事件</th><th>投递</th><th>状态</th><th class="r"></th>' +
          '</tr></thead><tbody>' +
          hooks.map(h =>
            '<tr>' +
              '<td><b>' + esc(h.name) + '</b>' +
                (h.description ? '<div class="sub">' + esc(h.description) + '</div>' : '') +
                '<div class="sub mono" style="word-break:break-all">' +
                  esc(h.endpoint_url) + '</div></td>' +
              '<td class="sub">' + (h.events || []).map(esc).join('<br>') + '</td>' +
              '<td class="sub">' +
                (h.queued_count ? '排队 ' + h.queued_count + '<br>' : '') +
                (h.failed_count
                  ? '<span style="color:var(--err)">7 天内失败 ' + h.failed_count + '</span><br>'
                  : '') +
                (h.last_sent_at ? '最近 ' + esc(h.last_sent_at) : '还没发过') +
              '</td>' +
              '<td>' + (h.enabled
                ? '<span class="badge badge-ok">已启用</span>'
                : '<span class="badge badge-plain">未启用</span>') +
                (h.has_secret ? '' :
                  '<div class="sub" style="color:var(--warn)">没有签名密钥</div>') + '</td>' +
              '<td class="r" style="white-space:nowrap">' +
                '<button class="btn btn-sm btn-ghost" data-hk-log="' + esc(h.code) + '">日志</button> ' +
                (can('platform.plugin.write')
                  ? '<button class="btn btn-sm btn-ghost" data-hk-test="' + esc(h.code) + '">测试</button> ' +
                    '<button class="btn btn-sm btn-ghost" data-hk-edit="' + esc(h.code) + '">编辑</button> ' +
                    '<button class="btn btn-sm btn-ghost" data-hk-del="' + esc(h.code) + '">删除</button>'
                  : '') +
              '</td>' +
            '</tr>').join('') +
          '</tbody></table></div>'
        : '<div class="card-pad sub">还没有接入任何插件。</div>') +
    '</div>';

  const nb = v.querySelector('#hkNew');
  if (nb) nb.onclick = () => hookModal(null, events);
  v.querySelectorAll('[data-hk-edit]').forEach(b => b.onclick = () =>
    hookModal(hooks.find(h => h.code === b.dataset.hkEdit), events));
  v.querySelectorAll('[data-hk-del]').forEach(b => b.onclick = async ev => {
    busy(ev.currentTarget, true, '删除中');
    try{
      await api('/v1/plugin-hooks/' + encodeURIComponent(b.dataset.hkDel), {method:'DELETE'});
      toast('已删除', 'ok'); render();
    }catch(e){ toast(e.message, 'err', 7000); busy(ev.currentTarget, false); }
  });
  v.querySelectorAll('[data-hk-test]').forEach(b => b.onclick = async ev => {
    busy(ev.currentTarget, true, '发送中');
    try{
      const r = await api('/v1/plugin-hooks/' + encodeURIComponent(b.dataset.hkTest) + '/test',
        {method:'POST'});
      toast('测试事件已送达（HTTP ' + r.response_code + '）', 'ok');
    }catch(e){ toast(e.message, 'err', 9000); }
    finally{ busy(ev.currentTarget, false); }
  });
  v.querySelectorAll('[data-hk-log]').forEach(b => b.onclick = () =>
    hookLogModal(b.dataset.hkLog));
}

function hookModal(h, events){
  const sel = new Set((h && h.events) || []);
  const m = modal(h ? '编辑「' + esc(h.name) + '」' : '接入插件',
    '<div class="grid2">' +
      fld('插件标识', '<input class="input mono" id="hkCode" value="' +
          esc(h ? h.code : '') + '" placeholder="my-plugin" ' + (h ? 'readonly' : '') + '>',
          '小写字母开头。存好后不能改。') +
      fld('插件名称', '<input class="input" id="hkName" value="' +
          esc(h ? h.name : '') + '">') +
    '</div>' +
    fld('说明', '<input class="input" id="hkDesc" value="' +
        esc(h ? h.description : '') + '">') +
    fld('回调地址', '<input class="input mono" id="hkURL" value="' +
        esc(h ? h.endpoint_url : '') + '" placeholder="https://your-plugin.example/hook">',
        '必须是 https，且不能指向内网 —— 否则面板就成了扫内网的跳板。') +
    fld('签名密钥', '<input class="input mono" id="hkSecret" type="password" ' +
        'autocomplete="new-password" placeholder="' +
        (h && h.has_secret ? '已设置，留空则不修改' : '留空会自动生成一个') + '">',
        '存库加密，之后任何界面都不会再显示。') +
    '<div class="sect">订阅事件</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));' +
      'gap:var(--sp-2)">' +
      events.map(e =>
        '<label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">' +
          '<input type="checkbox" data-ev="' + esc(e.Name || e.name) + '"' +
            (sel.has(e.Name || e.name) ? ' checked' : '') + ' style="margin-top:3px">' +
          '<span><span class="mono">' + esc(e.Name || e.name) + '</span>' +
            '<div class="sub">' + esc(e.Desc || e.desc || '') + '</div></span>' +
        '</label>').join('') +
    '</div>' +
    '<div class="sect">投递</div>' +
    '<div class="grid2">' +
      fld('超时（毫秒）', '<input class="input" id="hkTO" type="number" min="500" max="30000" ' +
          'value="' + (h ? h.timeout_ms : 5000) + '">',
    '调用回调地址的等待上限，超过就算这次投递失败并重试。') +
      fld('最大尝试次数', '<input class="input" id="hkTries" type="number" min="1" max="10" ' +
          'value="' + (h ? h.max_attempts : 5) + '">',
          '失败按 1、2、4、8 分钟退避重试。对方返回 4xx 时不重试。') +
    '</div>' +
    '<label style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer;' +
      'margin-top:var(--sp-3)">' +
      '<input type="checkbox" id="hkOn"' + (h && h.enabled ? ' checked' : '') + '>' +
      '<span>启用</span></label>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="hkSave">保存</button>', true);

  m.querySelector('#hkSave').onclick = async ev => {
    const evs = [...m.querySelectorAll('[data-ev]:checked')].map(i => i.dataset.ev);
    busy(ev.currentTarget, true, '保存中');
    try{
      const r = await api('/v1/plugin-hooks', {method:'POST', body:{
        code: m.querySelector('#hkCode').value.trim().toLowerCase(),
        name: m.querySelector('#hkName').value.trim(),
        description: m.querySelector('#hkDesc').value.trim(),
        endpoint_url: m.querySelector('#hkURL').value.trim(),
        secret: m.querySelector('#hkSecret').value,
        events: evs,
        enabled: m.querySelector('#hkOn').checked,
        timeout_ms: parseInt(m.querySelector('#hkTO').value || '5000', 10),
        max_attempts: parseInt(m.querySelector('#hkTries').value || '5', 10),
      }});
      m.remove();
      if (r.secret) showHookSecret(r.secret, r.secret_hint);
      else toast('已保存', 'ok');
      render();
    }catch(e){ toast(e.message, 'err', 9000); busy(ev.currentTarget, false); }
  };
}

function showHookSecret(secret, hint){
  const m = modal('签名密钥',
    '<div class="sub" style="margin-bottom:var(--sp-3);color:var(--warn);line-height:1.8">' +
      esc(hint || '只显示这一次。') + '</div>' +
    '<div class="mono" id="hkSec" style="word-break:break-all;padding:var(--sp-3);' +
      'background:var(--surface-2);border-radius:var(--r-md)">' + esc(secret) + '</div>',
    '<button class="btn btn-ghost" id="hkSecCopy">复制</button>' +
    '<button class="btn btn-primary" data-close>我已保存</button>');
  m.querySelector('#hkSecCopy').onclick = async () => {
    try{ await navigator.clipboard.writeText(secret); toast('已复制', 'ok'); }
    catch(_){ toast('复制失败，请手动选中', 'err'); }
  };
}

async function hookLogModal(code){
  const m = modal('投递日志 · ' + esc(code), '<div class="sub">载入中…</div>',
    '<button class="btn btn-primary" data-close>关闭</button>', true);
  const body = m.querySelector('.modal-body');
  try{
    const rows = (await api('/v1/plugin-hooks/' + encodeURIComponent(code) +
      '/deliveries')).deliveries || [];
    body.innerHTML = rows.length
      ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>事件</th><th>状态</th><th>尝试</th><th>结果</th><th>时间</th>' +
        '</tr></thead><tbody>' +
        rows.map(r =>
          '<tr><td class="mono sub">' + esc(r.event) + '</td>' +
          '<td>' + hookStatusBadge(r.status) + '</td>' +
          '<td class="num">' + r.attempts + '</td>' +
          '<td class="sub">' + (r.response_code ? 'HTTP ' + r.response_code : '') +
            (r.error_message ? '<div style="color:var(--err)">' +
              esc(r.error_message) + '</div>' : '') + '</td>' +
          '<td class="sub num">' + esc(r.sent_at || r.created_at) + '</td></tr>').join('') +
        '</tbody></table></div>'
      : '<div class="sub">还没有投递记录。</div>';
  }catch(e){
    body.innerHTML = '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
  }
}

function hookStatusBadge(s){
  if (s === 'sent') return '<span class="badge badge-ok">已送达</span>';
  if (s === 'failed') return '<span class="badge badge-warn">失败</span>';
  if (s === 'suppressed') return '<span class="badge badge-plain">已跳过</span>';
  return '<span class="badge badge-plain">排队中</span>';
}

              '开启后用户可在「账号安全」里绑定，到期提醒和流量预警会同时推到 Telegram。' +
              '没绑定的用户不受影响 —— 他们的 Telegram 通知会被直接跳过，' +
              '不会算成发送失败。' +
            '</div></span>' +
        '</label>' +
        '<div class="sub" style="margin-top:var(--sp-4);line-height:1.8">' +
          '还要在 Telegram 那边设置 Webhook，Bot 收到的消息才会送回来：' +
          '<div class="mono" style="margin-top:6px;word-break:break-all;font-size:12px">' +
            'https://api.telegram.org/bot&lt;TOKEN&gt;/setWebhook?url=' +
            esc(location.origin.replace(/\/admin.*$/, '')) +
            '/v1/webhooks/telegram/&lt;任取一段随机字符&gt;</div>' +
          '地址里那段随机字符就是凭证 —— Telegram 只会把消息推给这个地址，' +
          '所以别把它贴到公开的地方。' +
        '</div>' +
        '<div style="display:flex;gap:var(--sp-3);margin-top:var(--sp-4);flex-wrap:wrap">' +

      }catch(e){ toast(e.message, 'err', 8000); busy(ev.currentTarget, false); }
    };
  };
}

function bulkFilter(){
  const sub = $('bkSub').value;
  const f = {
    status: $('bkStatus').value,
    group_id: $('bkGroup').value,
    query: $('bkQuery').value.trim(),
  };
  if (sub === 'yes' || sub === 'no') f.has_active_sub = (sub === 'yes');
  return f;
}

            ? '<button class="btn btn-ghost" id="bkExport">导出 CSV</button>' : '') +
          (can('ops.notification.write')
            ? '<button class="btn btn-ghost" id="bkMail">群发邮件</button>' : '') +
        '</div>' +
        '<div id="bkResult" style="margin-top:var(--sp-4)"></div>' +
      '</div>' +
    '</div>' +
    (can('iam.user.write')
      ? '<div class="card">' +
          '<div class="card-head"><h3>批量生成账号</h3></div>' +
          '<div class="card-pad">' +
            '<div class="sub" style="margin-bottom:var(--sp-3);line-height:1.8">' +
              '给经销商或线下渠道预制账号用。口令由系统生成，' +
              '<b>只在生成后这一次显示</b> —— 库里存的是哈希，之后谁也取不回来。' +
            '</div>' +
            '<div class="grid2">' +
              fld('生成数量', '<input class="input" id="bgCount" type="number" ' +
                  'min="1" max="500" value="10">',
    '一次最多生成的账号数。生成后可以导出为 CSV 交给分销商。') +
              fld('邮箱前缀', '<input class="input" id="bgPrefix" value="user" ' +
                  'autocomplete="off">', '实际邮箱形如 user00001@域名') +
              fld('邮箱域名', '<input class="input" id="bgDomain" ' +
                  'placeholder="example.com" autocomplete="off">',
    '批量账号的邮箱后缀，比如填 example.com 就生成 xxx@example.com。') +
              fld('归入分组',
                '<select class="input" id="bgGroup"><option value="">不归组</option>' +
                groups.map(g => '<option value="' + esc(g.id) + '">' + esc(g.name) +
                  '</option>').join('') + '</select>',
    '批量生成的账号会直接落到这个分组里。') +
            '</div>' +
            fld('用途说明', '<input class="input" id="bgReason" ' +
                'placeholder="例如：交付给 XX 渠道 10 个账号" autocomplete="off">',
                '会写进审计日志，至少 5 个字。') +
            '<button class="btn btn-primary" id="bgGo" style="margin-top:var(--sp-3)">' +
              '生成</button>' +
          '</div>' +
        '</div>'
      : '');

  const box = () => v.querySelector('#bkResult');

  v.querySelector('#bkPrev').onclick = async ev => {
    busy(ev.currentTarget, true, '统计中');
    try{
      const r = await api('/v1/users/bulk/preview', {method:'POST', body: bulkFilter()});
      box().innerHTML =
        '<div class="sum"><b>命中 ' + r.total + ' 个用户</b>' +
        ((r.samples || []).length
          ? '<div class="sub" style="margin-top:6px;word-break:break-all">' +
            (r.samples||[]).map(esc).join('、') + (num(r.total) > (r.samples||[]).length ? ' …' : '') + '</div>'
          : '<div class="sub" style="margin-top:6px">没有匹配的用户。</div>') +
        '</div>';
    }catch(e){ toast(e.message, 'err', 7000); }
    finally{ busy(ev.currentTarget, false); }
  };

  const exportBtn = v.querySelector('#bkExport');
  if (exportBtn) exportBtn.onclick = async ev => {
    // 导出要带鉴权头，所以不能用普通的 <a download>：
    // 浏览器发起的下载请求不会带上 Authorization。
    busy(ev.currentTarget, true, '导出中');
    try{
      const f = bulkFilter();
      const q = new URLSearchParams();
      Object.keys(f).forEach(k => { if (f[k] !== '' && f[k] !== undefined) q.set(k, f[k]); });
      q.set('limit', '5000');
      const res = await fetch(ADMIN_BASE + '/v1/users/bulk/export?' + q.toString(),
        {headers:{Authorization:'Bearer ' + token}});
      if (!res.ok){
        const t = await res.text();
        let msg = '导出失败 HTTP ' + res.status;
        try{ msg = JSON.parse(t).error.message; }catch(_){}
        throw new Error(msg);
      }
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'users.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('已开始下载', 'ok');
    }catch(e){ toast(e.message, 'err', 8000); }
    finally{ busy(ev.currentTarget, false); }
  };

  const mailBtn = v.querySelector('#bkMail');
  if (mailBtn) mailBtn.onclick = () => {
    const f = bulkFilter();
    const m = modal('群发邮件',
      '<div class="sub" style="margin-bottom:var(--sp-3);line-height:1.8">' +
        '发出去就收不回来了。发之前先按「预览命中」确认这一批是谁。' +
        '关掉了营销通知的用户会被自动跳过。</div>' +
      fld('主题', '<input class="input" id="bmSub" autocomplete="off">') +
      fld('正文', '<textarea class="input" id="bmBody" rows="10" ' +
          'style="resize:vertical"></textarea>',
          '纯文本。收信人的邮箱地址互不可见 —— 每人一封独立的信。'),
      '<button class="btn btn-ghost" data-close>取消</button>' +
      '<button class="btn btn-primary" id="bmGo">确认群发</button>', true);
    m.querySelector('#bmGo').onclick = async ev => {
      const subject = m.querySelector('#bmSub').value.trim();
      const body = m.querySelector('#bmBody').value.trim();
      if (subject.length < 2) return toast('请填写主题', 'err');
      if (body.length < 10) return toast('正文太短了', 'err');
      busy(ev.currentTarget, true, '排队中');
      try{
        const r = await api('/v1/users/bulk/mail', {method:'POST',
          headers:{'Idempotency-Key': idemKey()},
          body: Object.assign({}, f, {subject, body})});
        m.remove();
        toast('已排入 ' + r.queued + ' 封' +
          (r.skipped ? '，跳过 ' + r.skipped + ' 个关闭了营销通知的用户' : ''), 'ok', 8000);
      }catch(e){ toast(e.message, 'err', 8000); busy(ev.currentTarget, false); }
    };
  };

  const genBtn = v.querySelector('#bgGo');
  if (genBtn) genBtn.onclick = async ev => {
    const count = parseInt(v.querySelector('#bgCount').value || '0', 10);
    const reason = v.querySelector('#bgReason').value.trim();
    if (!count || count < 1) return toast('数量要大于 0', 'err');
    if (reason.length < 5) return toast('用途说明至少 5 个字', 'err');
    busy(ev.currentTarget, true, '生成中');
    try{
      const r = await api('/v1/users/bulk/generate', {method:'POST',
        headers:{'Idempotency-Key': idemKey()},
        body:{count, email_prefix: v.querySelector('#bgPrefix').value.trim(),
              email_domain: v.querySelector('#bgDomain').value.trim(),
              group_id: v.querySelector('#bgGroup').value, reason}});
      showGeneratedUsers(r);
    }catch(e){ toast(e.message, 'err', 8000); }
    finally{ busy(ev.currentTarget, false); }
  };
}

// showGeneratedUsers 把明文口令摆出来，并且只摆这一次。
// 所以「复制全部」要显眼 —— 关掉窗口就真的没有了。
function showGeneratedUsers(r){
  const tsv = (r.users || []).map(u => u.email + '\t' + u.password).join('\n');

    '<div class="sub" style="margin-bottom:var(--sp-3);color:var(--warn);line-height:1.8">' +
      esc(r.warning || '口令只在这一次返回，关闭后无法再查。') + '</div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>邮箱</th><th>口令</th></tr></thead>' +
    '<tbody>' + (r.users || []).map(u =>
      '<tr><td class="mono">' + esc(u.email) + '</td>' +

    '</tbody></table></div>',
    '<button class="btn btn-ghost" id="guCopy">复制全部</button>' +
    '<button class="btn btn-primary" data-close>我已保存</button>', true);

    try{ await navigator.clipboard.writeText(tsv); toast('已复制，可直接粘进表格', 'ok'); }
    catch(_){ toast('复制失败，请手动选中表格内容', 'err'); }
  };
}

const RESET_REASON = {renewal:'续费', cycle_roll:'周期滚动', manual:'人工', gift_card:'礼品卡'};

async function viewTrafficResets(v){
  const [st, log] = await Promise.all([
    api('/v1/traffic-resets/stats').catch(() => null),
    api('/v1/traffic-resets?limit=100'),
  ]);

  const byReason = (st && st.by_reason) || {};
  v.innerHTML =
    (st
      ? '<div class="stats" style="margin-bottom:var(--sp-5)">' +
          stat('近 30 天重置', String(num(st.last_30_days))) +
          stat('其中人工重置', String(num(st.manual_count))) +
          stat('清掉的已用量', fmtBytes(num(st.freed_bytes))) +
          stat('按原因', Object.keys(byReason).length
            ? Object.keys(byReason).map(k =>
                (RESET_REASON[k] || k) + ' ' + num(byReason[k])).join('，')
            : '—') +
        '</div>'
      : '') +
    '<div class="card">' +
      '<div class="card-head"><h3>重置记录</h3><div class="spacer"></div>' +
        '<select class="input" id="trReason" style="width:auto">' +
          '<option value="">全部原因</option>' +
          Object.keys(RESET_REASON).map(k => '<option value="' + k + '">' +
            RESET_REASON[k] + '</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="tbl-wrap" id="trBox"></div>' +
    '</div>';

  renderResetRows((log || {}).logs || []);
  v.querySelector('#trReason').onchange = async e => {
    const r = e.target.value;
    try{
      const out = await api('/v1/traffic-resets?limit=100' +
        (r ? '&reason=' + encodeURIComponent(r) : ''));
      renderResetRows(out.logs || []);
    }catch(err){ toast(err.message, 'err'); }
  };
}

function renderResetRows(rows){
  if (!rows.length){
    $('trBox').innerHTML = '<div class="card-pad sub">还没有重置记录。</div>';
    return;
  }
  $('trBox').innerHTML =
    '<table class="tbl"><thead><tr><th>用户</th><th>原因</th>' +
      '<th>清零前已用</th><th>操作人</th><th>时间</th></tr></thead><tbody>' +
    rows.map(x =>
      '<tr><td><b>' + esc(x.user_email) + '</b>' +
        (x.plan_name ? '<div class="sub">' + esc(x.plan_name) + '</div>' : '') + '</td>' +
      '<td><span class="badge ' + (x.reason === 'manual' ? 'badge-warn' : 'badge-plain') +
        '">' + (RESET_REASON[x.reason] || esc(x.reason)) + '</span>' +
        (x.note ? '<div class="sub">' + esc(x.note) + '</div>' : '') + '</td>' +
      '<td class="num">' + fmtBytes(x.consumed_before) + '</td>' +
      '<td class="sub">' + esc(x.actor_email || '系统') + '</td>' +
      '<td class="sub num">' + dt(x.created_at) + '</td></tr>').join('') +
    '</tbody></table>';
}

// manualResetTraffic 由用户详情页调用 —— 重置总是针对某一个具体的人，
// 在流量页上放一个「挑个用户」的选择器只会多绕一步。
function manualResetTrafficDialog(userId, email, after){
  const m = modal('清零 ' + esc(email) + ' 的本周期流量',
    '<div class="sub" style="margin-bottom:var(--sp-3);line-height:1.8">' +
      '把这个用户本周期的已用流量归零，可用额度立刻恢复。' +
      '不影响到期时间，也不改套餐。这一步会记进重置日志，撤不回来。</div>' +
    fld('原因', '<input class="input" id="mrNote" autocomplete="off" ' +
        'placeholder="例如：节点故障导致误计费">', '至少 5 个字，会写进日志。'),
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="mrGo">确认清零</button>');
  m.querySelector('#mrGo').onclick = async ev => {
    const note = m.querySelector('#mrNote').value.trim();
    if (note.length < 5) return toast('原因至少 5 个字', 'err');
    busy(ev.currentTarget, true, '处理中');
    try{
      const r = await api('/v1/users/' + encodeURIComponent(userId) + '/traffic-reset',
        {method:'POST', headers:{'Idempotency-Key': idemKey()}, body:{note}});
      m.remove();
      toast('已清零，释放 ' + fmtBytes(r.freed_bytes), 'ok');
      if (after) after();
    }catch(e){ toast(e.message, 'err', 8000); busy(ev.currentTarget, false); }
  };
}

//---------------------------------------------------------------------------
//
// 模板表和渲染早就在跑了（到期提醒、流量预警走的就是它），
// 缺的一直是让人改措辞的入口 —— 想动一个字得连数据库。
//
// 变量白名单在后端是硬约束：模板里写了未声明的变量，用户收到的邮件里
// 就会明晃晃地留着 {{xxx}}。这里把可用变量摆在编辑框旁边，
// 点一下就插入，省得靠记。

const TPL_CHANNEL = {email:'邮件', inapp:'站内信'};

async function renderMailTemplates(box){
  box.innerHTML = '<div class="card card-pad sub">模板加载中…</div>';
  let list;
  try{ list = (await api('/v1/mail/templates')).templates || []; }
  catch(e){
    box.innerHTML = '<div class="card card-pad sub" style="color:var(--err)">' +
      '模板加载失败：' + esc(e.message) + '</div>';
    return;
  }

  const rows = list.map(t =>
    '<tr>' +
      '<td><b>' + esc(t.subject) + '</b>' +
        '<div class="sub mono">' + esc(t.code) + ' · ' + (TPL_CHANNEL[t.channel] || t.channel) + '</div>' +
        (t.description ? '<div class="sub">' + esc(t.description) + '</div>' : '') + '</td>' +
      '<td>' + (t.is_default
        ? '<span class="badge badge-plain">默认内容</span>'
        : '<span class="badge badge-ok">已自定义</span>') +
        '<div class="sub">v' + t.version + '</div></td>' +
      '<td class="sub num">' + dt(t.updated_at) + '</td>' +
      '<td class="r" style="white-space:nowrap">' +
        (can('platform.settings.write')
          ? '<button class="btn btn-sm btn-ghost" data-tpledit="' + esc(t.code) +
            '" data-ch="' + esc(t.channel) + '">编辑</button>' : '') +
        (t.channel === 'email' && can('billing.provider.write')
          ? ' <button class="btn btn-sm btn-ghost" data-tpltest="' + esc(t.code) +
            '" data-ch="' + esc(t.channel) + '">测试发送</button>' : '') +
      '</td>' +
    '</tr>').join('');

  box.innerHTML =
    '<div class="card">' +
      '<div class="card-head"><h3>通知模板</h3><div class="spacer"></div>' +
        '<span class="badge badge-plain">' + list.length + ' 个</span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>模板</th><th>状态</th><th>更新时间</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card-pad sub" style="line-height:1.8">' +
        '模板的标识（code）由代码决定，后台只能改内容、不能新建 —— ' +
        '新建一个没有代码调用的 code，只会让人以为配了就会发。<br>' +
        '正文里的 <span class="mono">{{变量}}</span> 会在发送时替换成实际值。' +
        '只能用该模板声明过的变量，用了别的保存时会被挡下。' +
      '</div>' +
    '</div>';

  const byKey = {};
  list.forEach(t => { byKey[t.code + '|' + t.channel] = t; });

  box.querySelectorAll('[data-tpledit]').forEach(b => b.onclick = () =>
    openTemplateEditor(byKey[b.dataset.tpledit + '|' + b.dataset.ch], box));
  box.querySelectorAll('[data-tpltest]').forEach(b => b.onclick = () =>
    testTemplate(byKey[b.dataset.tpltest + '|' + b.dataset.ch]));
}

function openTemplateEditor(t, box){
  if (!t) return;
  const vars = (t.allowed_variables || []).map(v =>
    '<button type="button" class="btn btn-sm btn-ghost mono" data-insvar="' + esc(v) + '">' +
    '{{' + esc(v) + '}}</button>').join(' ');

  const m = modal('编辑模板 · ' + esc(t.code),
    '<div class="sub" style="margin-bottom:var(--sp-4);line-height:1.7">' +
      (t.description ? esc(t.description) + '<br>' : '') +
      '渠道：' + (TPL_CHANNEL[t.channel] || esc(t.channel)) +
      '　当前版本：v' + t.version +
    '</div>' +
    '<div class="field"><label for="tplSubject">主题</label>' +
      '<input class="input" id="tplSubject" maxlength="200" value="' + esc(t.subject) + '">' +
    '</div>' +
    '<div class="field"><label for="tplBody">正文</label>' +
      '<textarea class="input" id="tplBody" rows="10" style="font-family:var(--font-mono);' +
        'line-height:1.7">' + esc(t.body) + '</textarea>' +
      '<div class="hint">可用变量（点击插入到光标处）：<br>' + (vars || '这个模板没有变量') + '</div>' +
    '</div>' +
    '<div class="field" style="margin-bottom:0"><label>预览</label>' +
      '<div class="card card-pad" id="tplPreview" style="background:var(--surface-2)"></div>' +
      '<div class="hint">用示例值渲染，实际发送时会替换成该用户的真实数据。</div>' +
    '</div>',
    (t.is_default ? '' :
      '<button class="btn btn-ghost" id="tplReset">恢复默认</button>') +
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="tplSave">保存</button>', true);

  const subjEl = m.querySelector('#tplSubject');
  const bodyEl = m.querySelector('#tplBody');
  const prevEl = m.querySelector('#tplPreview');

  // 本地预览：和后端 RenderPreview 用同一套示例值。
  // 两边不一致的话，管理员会看到「预览一个样、收到的邮件另一个样」。
  const SAMPLE = {site:'潘多拉面板', plan:'旗舰套餐', days:'3',
    expires_at:'2026-08-31 23:59', percent:'85', remaining:'3.2 GB',
    order_no:'AO20260804-XXXXXX', subject:'无法连接节点'};
  const fill = str => str.replace(/{{s*([a-z_][a-z0-9_]*)s*}}/g,
    (mm, name) => (name in SAMPLE) ? SAMPLE[name] : mm);
  const refresh = () => {
    prevEl.innerHTML = '<b>' + esc(fill(subjEl.value)) + '</b>' +
      '<div style="margin-top:var(--sp-3);white-space:pre-wrap">' +
      esc(fill(bodyEl.value)) + '</div>';
  };
  subjEl.oninput = refresh; bodyEl.oninput = refresh; refresh();

  m.querySelectorAll('[data-insvar]').forEach(b => b.onclick = () => {
    const tag = '{{' + b.dataset.insvar + '}}';
    const pos = bodyEl.selectionStart ?? bodyEl.value.length;
    bodyEl.value = bodyEl.value.slice(0, pos) + tag + bodyEl.value.slice(pos);
    bodyEl.focus();
    bodyEl.selectionStart = bodyEl.selectionEnd = pos + tag.length;
    refresh();
  });

  m.querySelector('#tplSave').onclick = async ev => {
    busy(ev.currentTarget, true, '保存中');
    try{
      await api('/v1/mail/templates', {method:'POST', body: JSON.stringify({
        code: t.code, channel: t.channel,
        subject: subjEl.value, body: bodyEl.value})});
      m.remove();
      toast('模板已保存', 'ok', 2500);
      renderMailTemplates(box);
    }catch(e){ toast(e.message, 'err', 9000); busy(ev.currentTarget, false); }
  };

  const rst = m.querySelector('#tplReset');
  if (rst) rst.onclick = async ev => {
    if (!await askDanger({
    title:'恢复默认模板',
    what:'把这个邮件模板还原成系统内置的版本。',
    consequences:['你现在改过的内容会被<b>直接覆盖，不保留备份</b>。'],
    confirmText:'恢复默认'})) return;
    busy(ev.currentTarget, true, '恢复中');
    try{
      await api('/v1/mail/templates/reset', {method:'POST',
        body: JSON.stringify({code: t.code, channel: t.channel})});
      m.remove();
      toast('已恢复默认', 'ok', 2500);
      renderMailTemplates(box);
    }catch(e){ toast(e.message, 'err', 8000); busy(ev.currentTarget, false); }
  };
}

async function testTemplate(t){
  if (!t) return;
  const to = prompt('把这个模板的测试邮件发到哪个地址？');
  if (!to) return;
  try{
    const r = await api('/v1/mail/templates/test', {method:'POST',
      body: JSON.stringify({code: t.code, channel: t.channel, to: to.trim()})});
    toast('已发送：' + r.subject, 'ok', 5000);
  }catch(e){ toast(e.message, 'err', 10000); }
}

// tip 生成标签旁边那个小问号。
//
// 用 <span> 而不是 <button>：它在 <label> 里面，做成按钮点一下会把
// 焦点抢走、还会触发 label 的默认行为跳到输入框。tabindex=0 保证
// 键盘也能停上去看说明。
function tip(text){
  return '<span class="tip" tabindex="0" role="note" data-tip="'+esc(text)+'">?</span>';
}

function fld(label, input, hint){
  return '<div class="field"><label>' + label + (hint ? tip(hint) : '') + '</label>' +
    input + '</div>';
}

function mailPayload(){
  return {
    smtp_host: $('mHost').value.trim(),
    smtp_port: parseInt($('mPort').value || '465', 10),
    encryption: $('mEnc').value,
    smtp_username: $('mUser').value.trim(),
    smtp_password: $('mPass').value,   // 空 = 不改
    from_address: $('mFrom').value.trim(),
    from_name: $('mName').value.trim(),
    email_verification: $('mVerify').checked,
    registration_mode: $('mRegistrationMode').value,
  };
}

async function saveMail(ev){
  const btn = ev && ev.currentTarget && ev.currentTarget.tagName === 'BUTTON'
    ? ev.currentTarget : null;
  if (btn) busy(btn, true, '保存中');
  try{
    await api('/v1/settings/mail', {method:'POST', body: JSON.stringify(mailPayload())});
    toast('已保存', 'ok', 2000);
    render();
  }catch(e){
    toast(e.message, 'err', 6000);
    if (btn) busy(btn, false);
    render();   // 校验失败时把开关拨回真实状态，避免界面和后端说法不一致
  }
}

async function testMail(ev){
  const to = prompt('把测试邮件发到哪个地址？');
  if (!to) return;
  const btn = ev.currentTarget;
  busy(btn, true, '发送中');
  try{
    // 先存再发：管理员刚改完的配置如果没保存，测出来的是旧配置，
    // 那种「测试通过但实际发不出去」比测试失败更误导人
    await api('/v1/settings/mail', {method:'POST', body: JSON.stringify(mailPayload())});
    await api('/v1/settings/mail/test', {method:'POST', body: JSON.stringify({to})});
    toast('已发出，去收件箱看看（也翻一下垃圾邮件）', 'ok', 6000);
  }catch(e){ toast(e.message, 'err', 9000); }
  finally{ busy(btn, false); }
}

//---------------------------------------------------------------------------
// 节点分组
//---------------------------------------------------------------------------
//
// 分组是节点与套餐之间唯一的连接点：节点归到分组，套餐绑定分组。
// 这层关系断了的表现很隐蔽 —— 用户照常下单付款，拿到的订阅里一个节点都没有。

async function openPlanPools(planId){
  const m = modal('可用节点分组', '<div id="ppBody">加载中…</div>',
    '<button class="btn btn-ghost" data-close>关闭</button>' +
    (can('catalog.publish')?'<button class="btn btn-primary" id="ppSave" disabled>保存</button>':''));

  let data;
  try{ data = await api('/v1/plans/' + planId + '/pools'); }
  catch(e){
    m.querySelector('#ppBody').innerHTML =
      '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
    return;
  }

  const pools = data.pools || [];
  const editable=can('catalog.publish')&&data.editable&&data.version_id&&Number(data.row_version)>0;
  m.querySelector('#ppBody').innerHTML =
    '<div class="notice"><b>'+(editable?'草稿版本可编辑':'只读节点分组')+'</b>'+ 
      '<div class="sub" style="margin-top:6px">'+(editable
        ?'保存会绑定到当前草稿版本，并使用行版本防止覆盖其他管理员的修改。'
        :'当前没有可编辑草稿版本，或账号缺少 catalog.publish 权限。')+'</div></div>'+ 
    (pools.length
      ? '<div style="display:flex;flex-direction:column;gap:var(--sp-2)">' +
        pools.map(p =>
          '<label style="display:flex;align-items:center;gap:var(--sp-3);' +
            'padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);' +
            'border-radius:var(--r-sm);cursor:pointer">' +
            '<input type="checkbox" class="ppItem" value="' + esc(p.id) + '"' +
              (p.bound ? ' checked' : '') + (editable?'':' disabled') + '>' +
            '<span style="flex:1">' + esc(p.name) + '</span>' +
            (p.active_nodes > 0
              ? '<span class="badge badge-ok">' + p.active_nodes + ' 个节点</span>'
              : '<span class="badge badge-plain">空</span>') +
          '</label>').join('') + '</div>'
      : '<div class="sub">还没有节点分组，先去节点页建一个。</div>') +
    '<div class="hint" style="margin-top:var(--sp-3);line-height:1.7">' +
      '买了这个套餐的用户，能用到的就是这里勾中的分组下的节点。' +
      '一个都不勾等于卖一份空订阅 —— 用户付了钱，客户端里什么都没有。' +
    '</div>';

  const save=m.querySelector('#ppSave');
  if(!save)return;
  if(!editable){save.remove();return}
  save.disabled=false;
  save.onclick = async ev => {
    const ids = Array.from(m.querySelectorAll('.ppItem:checked')).map(x => x.value);
    if (!ids.length && !await askDanger({
    title:'没有选择任何节点分组',
    what:'这个套餐将不绑定任何线路。',
    consequences:[
      '买了这个套餐的用户，<b>订阅里一条线路都没有</b>，客户端会是空的。',
      '如果只是暂时没建好分组，建议先别上架。'],
    confirmText:'仍然保存',danger:false})) return;
    busy(ev.currentTarget, true, '保存中');
    try{
      await api('/v1/plans/' + planId + '/pools', {method:'POST',
        headers:{'Idempotency-Key':idemKey()},body:{version_id:data.version_id,
          expected_version_row_version:data.row_version,pool_ids:ids}});
      m.remove();
      toast('已更新可用分组', 'ok', 2000);
      render();
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };
}

async function openPoolManager(){
  const m = modal('节点分组', '<div id="pmBody">加载中…</div>',
    '<button class="btn btn-ghost" data-close>关闭</button>', true);
  await renderPoolManager(m);
}

async function renderPoolManager(m){
  let pools;
  try{ pools = (await api('/v1/node-pools')).pools || []; }
  catch(e){
    m.querySelector('#pmBody').innerHTML =
      '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
    return;
  }

  const rows = pools.map(p =>
    '<tr>' +
      '<td><b>' + esc(p.name) + '</b><div class="sub mono">' + esc(p.code) + '</div></td>' +
      '<td class="sub">' + (p.region ? esc(p.region) : '—') + '</td>' +
      '<td class="r num">' + p.active_nodes + ' / ' + p.nodes + '</td>' +
      // 被零个套餐使用的分组不一定是错的（可能刚建），但配着节点却没人用
      // 就是明显的浪费，标出来
      '<td class="r">' + (p.plans > 0
        ? '<span class="num">' + p.plans + '</span>'
        : (p.nodes > 0
            ? '<span class="badge badge-warn">没有套餐在用</span>'
            : '<span class="sub">0</span>')) + '</td>' +
      '<td class="r">' +
        '<button class="btn btn-sm btn-ghost" data-ren="' + esc(p.id) +
          '" data-name="' + esc(p.name) + '">改名</button> ' +
        '<button class="btn btn-sm btn-ghost" data-del="' + esc(p.id) + '">删除</button>' +
      '</td>' +
    '</tr>').join('');

  m.querySelector('#pmBody').innerHTML =
    '<div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap">' +
      '<input class="input" id="pmName" placeholder="新分组名称，例如 香港专线" style="flex:1;min-width:180px">' +
      '<input class="input" id="pmRegion" placeholder="地区（选填）" style="width:120px">' +
      '<button class="btn btn-primary" id="pmAdd" style="flex:none">新建</button>' +
    '</div>' +
    (pools.length
      ? '<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr>' +
        '<th>分组</th><th>地区</th><th class="r">在线/总数</th>' +
        '<th class="r">被套餐使用</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : emptyRow('还没有分组',
    '分组用来把节点分类，套餐通过绑定分组决定用户能用哪些线路。至少建一个，否则套餐上架后用户没有线路可用。')) +
    '<div class="hint" style="margin-top:var(--sp-3);line-height:1.7">' +
      '节点要归到分组里，套餐再绑定分组，用户才能看到这些节点。' +
      '在套餐页每一行的「节点分组」里做绑定。' +
    '</div>';

  m.querySelector('#pmAdd').onclick = async ev => {
    const name = m.querySelector('#pmName').value.trim();
    if (!name){ toast('请填写分组名称', 'err'); return; }
    busy(ev.currentTarget, true, '创建中');
    try{
      await api('/v1/node-pools', {method:'POST', body: JSON.stringify({
        name, region: m.querySelector('#pmRegion').value.trim() })});
      toast('已创建', 'ok', 1800);
      await renderPoolManager(m);
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };

  m.querySelectorAll('[data-ren]').forEach(b => b.onclick = async () => {
    const name = prompt('新的分组名称', b.dataset.name);
    if (!name || name === b.dataset.name) return;
    try{
      await api('/v1/node-pools/' + b.dataset.ren, {method:'POST',
        body: JSON.stringify({name})});
      toast('已改名', 'ok', 1800);
      await renderPoolManager(m);
    }catch(e){ toast(e.message, 'err'); }
  });

  m.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!await askDanger({
    title:'删除分组',
    what:'删除这个分组。',
    consequences:[
      '分组里的成员不会被删，只是不再归属于它。',
      '绑定了这个分组的套餐会失去对应的线路授权，记得回去改。'],
    confirmText:'删除分组'})) return;
    try{
      await api('/v1/node-pools/' + b.dataset.del, {method:'DELETE'});
      toast('已删除', 'ok', 1800);
      await renderPoolManager(m);
    }catch(e){ toast(e.message, 'err', 6000); }
  });
}

//---------------------------------------------------------------------------
// 公告
//---------------------------------------------------------------------------

const ANN_SEV = {
  info:     ['普通', 'badge-plain'],
  notice:   ['提示', 'badge-brand'],
  warning:  ['警告', 'badge-warn'],
  critical: ['紧急', 'badge-err'],
};
const ANN_ST = {
  draft:     ['草稿', 'badge-plain'],
  scheduled: ['待发布', 'badge-warn'],
  published: ['已发布', 'badge-ok'],
  withdrawn: ['已撤回', 'badge-plain'],
};

async function viewAnnouncements(v){
  const r = await api('/v1/announcements');
  const list = r.announcements || [];
  const plans = r.plans || [];
  const planName = {};
  plans.forEach(p => { planName[p.id] = p.name; });
  list.forEach(a => (a.plan_targets || []).forEach(p => { planName[p.id] = p.name; }));

  const rows = list.map(a => {
    const sev = ANN_SEV[a.severity] || [a.severity, 'badge-plain'];
    const st = ANN_ST[a.status] || [a.status, 'badge-plain'];
    const scope = (a.target_plan_ids || []).length
      ? '限 ' + a.target_plan_ids.map(id => esc(planName[id] || '已删套餐')).join('、')
      : '全体用户';
    return '<tr>' +
      '<td>' + (a.pinned ? '<span class="badge badge-brand">置顶</span> ' : '') +
        '<b>' + esc(a.title) + '</b>' +
        '<div class="sub" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;' +
          'white-space:nowrap">' + esc(a.body) + '</div></td>' +
      '<td><span class="badge ' + sev[1] + '">' + sev[0] + '</span></td>' +
      '<td><span class="badge ' + st[1] + '">' + st[0] + '</span></td>' +
      '<td class="sub">' + scope + '</td>' +
      '<td class="sub num">' + (a.publish_at ? dt(a.publish_at) : '—') +
        (a.expires_at ? '<div class="sub">至 ' + dt(a.expires_at) + '</div>' : '') + '</td>' +
      '<td class="r">' +
        (a.status !== 'withdrawn'
          ? '<button class="btn btn-sm btn-ghost" data-edit="' + esc(a.id) + '">编辑</button> '
          : '') +
        (a.status !== 'withdrawn'
          ? '<button class="btn btn-sm btn-ghost" data-wd="' + esc(a.id) + '">撤回</button>'
          : '') +
      '</td>' +
    '</tr>';
  }).join('');

  v.innerHTML =
    '<div class="card">' +
      '<div class="card-head"><h3>公告</h3>' +
        (list.length ? '<span class="badge badge-plain">' + list.length + '</span>' : '') +
        '<div class="spacer"></div>' +
        '<button class="btn btn-primary btn-sm" id="annNew">发布公告</button>' +
      '</div>' +
      (list.length ? '<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr>' +
        '<th>标题</th><th>级别</th><th>状态</th><th>可见范围</th><th>时间</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        : emptyRow('还没有公告',
    '公告显示在用户面板首页顶部，用来发维护通知、活动信息。点右上角「发布公告」。')) +
      '<div class="sub" style="padding:var(--sp-4) var(--sp-6);font-size:var(--fs-2xs);line-height:1.7">' +
        '撤回不会删除记录 —— 公告是已经对外说过的话，删掉等于假装没说过。' +
        '撤回后用户端不再展示，但历史可查。' +
      '</div>' +
    '</div>';

  v.querySelector('#annNew').onclick = () => openAnnounceForm(null, plans);
  v.querySelectorAll('[data-edit]').forEach(b => b.onclick = () =>
    openAnnounceForm(list.find(x => x.id === b.dataset.edit), plans));
  const withdrawKeys = new Map();
  v.querySelectorAll('[data-wd]').forEach(b => b.onclick = async () => {
    if (!await askDanger({
    title:'撤回公告',
    what:'把这条公告从用户面板上撤下来。',
    consequences:[
      '用户端立即不再显示，已经看过的人不受影响。',
      '公告内容会保留，之后可以重新发布。'],
    confirmText:'撤回公告',danger:false})) return;
    try{
      const item = list.find(x => x.id === b.dataset.wd);
      if (!item) throw new Error('公告已刷新，请重新打开');
      if (!withdrawKeys.has(item.id)) withdrawKeys.set(item.id, idemKey());
      await api('/v1/announcements/' + encodeURIComponent(item.id) + '/withdraw', {method:'POST',
        headers:{'Idempotency-Key':withdrawKeys.get(item.id)},
        body:JSON.stringify({expected_version:Number(item.version)})});
      toast('已撤回', 'ok', 2000);
      render();
    }catch(e){ toast(e.message, 'err'); }
  });
}

function openAnnounceForm(a, plans){
  const cur = a || {severity:'info', pinned:false, target_plan_ids:[]};
  const currentTargets = cur.plan_targets || [];
  const planMap = new Map((plans || []).map(p => [p.id, p]));
  currentTargets.forEach(p => { if (!planMap.has(p.id)) planMap.set(p.id, p); });
  const availablePlans = Array.from(planMap.values());
  const unavailableTargets = currentTargets.filter(p => p.status === 'missing');
  const lv = (v, t) => '<option value="' + v + '"' +
    (cur.severity === v ? ' selected' : '') + '>' + t + '</option>';
  const localDateTime = value => {
    if (!value) return '';
    const d = new Date(value);
    if (!Number.isFinite(d.getTime())) return '';
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  };

  const body =
    '<div class="field"><label for="anTitle">标题</label>' +
      '<input class="input" id="anTitle" value="' + esc(cur.title || '') + '" ' +
        'placeholder="例如：8 月 3 日凌晨节点维护"></div>' +
    '<div class="field"><label for="anBody">正文</label>' +
      '<textarea class="input" id="anBody" rows="5" ' +
        'placeholder="说清楚影响范围和时间。用户最想知道的是「我会不会断网、断多久」">' +
        esc(cur.body || '') + '</textarea></div>' +
    '<div class="grid2">' +
      '<div class="field"><label for="anSev">级别</label>' +
        '<select class="input" id="anSev">' +
          lv('info','普通 · 一般通知') + lv('notice','提示 · 需要留意') +
          lv('warning','警告 · 可能影响使用') + lv('critical','紧急 · 会弹窗提醒') +
        '</select></div>' +
      '<div class="field"><label for="anPin">置顶</label>' +
        '<select class="input" id="anPin">' +
          '<option value="0"' + (cur.pinned ? '' : ' selected') + '>不置顶</option>' +
          '<option value="1"' + (cur.pinned ? ' selected' : '') + '>置顶显示</option>' +
        '</select></div>' +
      '<div class="field"><label for="anFrom">发布时间</label>' +
        '<input class="input" id="anFrom" type="datetime-local" value="'+esc(localDateTime(cur.publish_at))+'">' +
        '<div class="hint">留空立即发布；填未来时间会到点自动发。</div></div>' +
      '<div class="field"><label for="anTo">下线时间</label>' +
        '<input class="input" id="anTo" type="datetime-local" value="'+esc(localDateTime(cur.expires_at))+'">' +
        '<div class="hint">留空表示一直显示。</div></div>' +
    '</div>' +
    '<div class="field" style="margin-bottom:0"><label>可见范围</label>' +
      '<div id="anPlans" style="max-height:130px;overflow:auto;border:1px solid var(--line);' +
        'border-radius:var(--r-sm);padding:var(--sp-3)">' +
        (availablePlans.map(p => {
          const selected = (cur.target_plan_ids || []).includes(p.id);
          const unavailable = p.status === 'missing';
          const inactive = p.status !== 'active';
          return (
          '<label style="display:flex;align-items:center;gap:var(--sp-2);padding:3px 0;' +
            'font-size:var(--fs-sm);cursor:'+(unavailable?'not-allowed':'pointer')+'">' +
            '<input type="checkbox" class="anPlan" value="' + esc(p.id) + '"' +
              (selected ? ' checked' : '') + (unavailable ? ' disabled' : '') + '>' +
            esc(p.name) + (inactive ? ' <span class="sub">('+esc(p.status)+')</span>' : '') + '</label>');
        }).join('') || '<div class="sub">没有可选套餐</div>') +
      '</div>' +
      '<div class="hint">不勾选表示所有用户可见。勾选后只有买了对应套餐的人能看到。</div>' +
      (unavailableTargets.length ? '<div class="callout warn" style="margin-top:var(--sp-3)">存在已删除的定向套餐。为避免静默扩大受众，本公告暂不可保存，请先恢复套餐数据。</div>' : '') +
    '</div>';

  const m = modal(a ? '编辑公告' : '发布公告', body,
    '<button class="btn btn-ghost" data-close>取消</button>' +
    (cur.status === 'published' ? '' :
      '<button class="btn btn-ghost" id="anDraft"'+(unavailableTargets.length?' disabled':'')+'>存草稿</button>') +
    '<button class="btn btn-primary" id="anPub"'+(unavailableTargets.length?' disabled':'')+'>' +
      (cur.status === 'published' ? '保存已发布公告' : '发布') + '</button>', true);

  let pendingKey = '', pendingFingerprint = '';
  const save = async (publish, ev) => {
    const title = m.querySelector('#anTitle').value.trim();
    const text = m.querySelector('#anBody').value.trim();
    if (!title || !text){ toast('标题和正文都要填', 'err'); return; }
    const fromValue = m.querySelector('#anFrom').value;
    const toValue = m.querySelector('#anTo').value;
    const payload = {
      title, body: text,
      severity: m.querySelector('#anSev').value,
      pinned: m.querySelector('#anPin').value === '1',
      target_plan_ids: Array.from(m.querySelectorAll('.anPlan:checked')).map(x => x.value),
      publish_at: fromValue ? new Date(fromValue).toISOString() : '',
      expires_at: toValue ? new Date(toValue).toISOString() : '',
      publish,
      expected_version: a ? Number(a.version) : 0,
    };
    const fingerprint = JSON.stringify(payload);
    if (pendingFingerprint !== fingerprint) {
      pendingFingerprint = fingerprint;
      pendingKey = idemKey();
    }
    busy(ev.currentTarget, true, '保存中');
    try{
      await api('/v1/announcements' + (a ? '/' + encodeURIComponent(a.id) : ''), {method:'POST',
        headers:{'Idempotency-Key':pendingKey}, body:JSON.stringify(payload)});
      m.remove();
      toast(publish ? '已发布' : '已存草稿', 'ok', 2000);
      render();
    }catch(e){ toast(e.message, 'err', 6000); busy(ev.currentTarget, false); }
  };
  const draftButton = m.querySelector('#anDraft');
  if(draftButton) draftButton.onclick = ev => save(false, ev);
  m.querySelector('#anPub').onclick = ev => save(true, ev);
}

async function viewContentPages(v){

    esc((p.target_platforms||[]).join('、')||'全部平台')+'</td><td class="sub">'+dt(p.updated_at)+'</td><td class="r">'+
    (p.is_latest_in_audience?'<button class="btn btn-sm btn-ghost" data-content-edit="'+p.id+'" data-latest-version="'+p.latest_version+'">新版本</button> ':'<span class="sub">历史版本</span> ')+
    (p.status==='archived'?'':'<button class="btn btn-sm btn-ghost" data-content-archive="'+p.id+'" data-version="'+p.version+'">归档</button>')+

// 把 (interval, count) 快照翻成运营说的话。
//
// 没有周期就是一次性买断，不是「数据缺失」——留空会让人以为订单坏了。
function intervalText(interval,count){
  const n=Number(count||0);
  if(!interval)return '一次性';
  const named={month:{1:'月付',3:'季付',6:'半年付',12:'年付'},year:{1:'年付'}}[interval];
  if(named&&named[n])return named[n];
  const unit={day:'天',week:'周',month:'个月',year:'年'}[interval]||interval;
  return n>0?('每 '+n+' '+unit):('按'+unit);
}

        ['partially_refunded','部分退款'],['refunded','已退款']],s.status)+'</select>'+

      tip('两端都是闭区间：选到 8 月 20 日，那一整天的单都算在内。留空表示不限。')+
      '<button class="btn btn-ghost" id="ogo">搜索</button>'+
      '<div class="rev-control-group">'+
        [['7','近 7 天'],['30','近 30 天'],['0','本月']].map(x=>
          '<button class="btn btn-sm" data-ord-range="'+x[0]+'">'+x[1]+'</button>').join('')+
        ((s.from||s.to)?'<button class="btn btn-sm" data-ord-range="clear">清除</button>':'')+
      '</div>'+
      manualBtn+
    '</div>'+
    (r.orders.length?'<div class="tbl-wrap"><table class="tbl order-table" data-sticky-actions><thead><tr>'+
      '<th>单号</th><th>用户</th><th>类型</th><th>套餐</th><th>周期</th><th>状态</th><th class="r">金额</th>'+

  // 用本地日期而不是 toISOString() —— 后者按 UTC 切，东八区的凌晨会
  // 落到前一天，「本月」在月初头八小时会多算上个月最后一天。
  const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+

  v.querySelectorAll('[data-order-detail]').forEach(b=>b.onclick=()=>openOrderDetail(b.dataset.orderDetail));
  bindPager('orders');
}

      await api('/v1/orders/'+orderId+'/cancel',{method:'POST',headers:{'Idempotency-Key':idemKey()},
        body:{expected_state_version:o.state_version,reason}});
      m.remove();toast('订单已取消，相关占用已释放','ok');render();
    }catch(e){
      toast(e.status===409?'订单状态已变化，已重新载入详情':e.message,'err',7000);
      if(e.status===409){m.remove();openOrderDetail(orderId)}else busy(b,false);
    }
  };
}
