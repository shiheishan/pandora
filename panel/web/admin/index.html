function catalogLocalDateTime(value){
  if(!value)return '';
  const d=new Date(value);if(Number.isNaN(d.getTime()))return '';
  const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,16);
}
function catalogISO(value){return value?new Date(value).toISOString():null}
function catalogNullableInt(value){
  const raw=String(value??'').trim();if(raw==='')return null;
  const n=Number(raw);return Number.isInteger(n)?n:NaN;
}

async function openPlanEditor(planId){

  let plan=null,groups=[],pools=[];
  try{
    // 编辑和新建都要节点分组：改套餐时「卖哪些线路」和「多少钱」是最常
    // 改的两样，以前得保存完再去另外两个弹窗里改。
    const requests=[can('iam.user.read')?api('/v1/user-groups'):Promise.resolve({groups:[]}),
      can('node.read')?api('/v1/node-pools'):Promise.resolve({pools:[]})];
    if(planId)requests.push(api('/v1/plans/'+planId));
    const out=await Promise.all(requests);
    groups=out[0].groups||[];
    pools=out[1].pools||[];
    if(planId)plan=out[2].plan;
  }catch(e){toast(e.message,'err');return}
  const cur=plan||{code:'',name:'',description:'',visibility:'public',visible_group_ids:[],
    allow_new_purchase:true,allow_renewal:true,allow_upgrade:true,sort_order:0};
  const canReadGroups=can('iam.user.read');
  const groupChecks=groups.length?groups.map(g=>
    '<label class="check"><input type="checkbox" class="planGroup" value="'+esc(g.id)+'" '+
      ((cur.visible_group_ids||[]).includes(g.id)?'checked':'')+'> '+esc(g.name)+'</label>').join('')
    :'<span class="sub">'+(canReadGroups?'尚无用户组；选择“分组可见”前请先创建用户组。':'当前角色没有 iam.user.read；仍可创建公开、登录可见或隐藏套餐。')+'</span>';
  const body='<form id="planForm">'+
    '<div class="grid2"><div class="field"><label for="planCode">套餐代码</label>'+ 
      '<input class="input mono" id="planCode" maxlength="64" required value="'+esc(cur.code)+'" placeholder="standard_100g"></div>'+ 
    '<div class="field"><label for="planName">套餐名称</label>'+ 
      '<input class="input" id="planName" maxlength="120" required value="'+esc(cur.name)+'"></div></div>'+ 
    '<div class="field"><label for="planDescription">说明</label>'+ 
      '<textarea class="input" id="planDescription" rows="3">'+esc(cur.description||'')+'</textarea></div>'+ 
    '<div class="grid2"><div class="field"><label for="planVisibility">可见范围</label>'+ 
      '<select class="input" id="planVisibility">'+opts([
        ['public','公开'],['authenticated','登录用户'],['group','指定用户组'],
        ['hidden','隐藏'],['invite_only','仅邀请（当前禁止发布）']],cur.visibility)+'</select></div>'+ 
    '<div class="field"><label for="planSort">排序</label>'+ 
      '<input class="input" id="planSort" type="number" value="'+Number(cur.sort_order||0)+'"></div></div>'+ 
    '<div class="field"><label>指定用户组</label><div class="check-grid">'+groupChecks+'</div></div>'+ 
    '<div class="grid2"><div class="field"><label for="planVisibleFrom">开始展示</label>'+ 
      '<input class="input" id="planVisibleFrom" type="datetime-local" value="'+catalogLocalDateTime(cur.visible_from)+'"></div>'+ 
    '<div class="field"><label for="planVisibleUntil">结束展示</label>'+ 
      '<input class="input" id="planVisibleUntil" type="datetime-local" value="'+catalogLocalDateTime(cur.visible_until)+'"></div></div>'+ 
    '<div class="grid2"><div class="field"><label for="planLimit">每用户购买上限</label>'+ 
      '<input class="input" id="planLimit" type="number" min="1" value="'+esc(cur.purchase_limit_per_user??'')+'" placeholder="留空不限"></div>'+ 
    '<div class="field"><label for="planStock">总库存</label>'+ 
      '<input class="input" id="planStock" type="number" min="0" value="'+esc(cur.stock_total??'')+'" placeholder="留空不限"></div></div>'+ 
    '<div class="check-grid">'+
      '<label class="check"><input id="planBuy" type="checkbox" '+(cur.allow_new_purchase?'checked':'')+'> 允许新购</label>'+ 
      '<label class="check"><input id="planRenew" type="checkbox" '+(cur.allow_renewal?'checked':'')+'> 允许续费</label>'+ 
      '<label class="check"><input id="planUpgrade" type="checkbox" '+(cur.allow_upgrade?'checked':'')+'> 允许升级</label>'+ 
    '</div>'+
    // 新建时把「卖什么、卖多少钱、用哪些线路」放进同一屏。
    //
    // 这三样原先分散在保存之后的三个弹窗里，谁也没提示还有后续步骤，
    // 于是最常见的结果是建出一个没有价格、没有线路的草稿，在列表里
    // 和正常套餐长得一模一样，直到用户反馈买不了才发现。
    //
    // 编辑时不出现：改基本资料不该顺手动价格，价格有自己的生效与
    // 归档语义，混在一起容易误伤在售的价格。
    (function(){
      // 编辑时把当前的额度、价格、线路回填进去。原先这一段只在新建时
      // 出现，改套餐得另开三个弹窗；而「改流量」「改价格」「加线路」
      // 恰恰是运营最常做的三件事。
      const ver=plan&&plan.versions?
        plan.versions.find(v=>v.id===plan.current_version_id):null;
      const curTraffic=(()=>{
        if(!ver||!ver.quotas)return '';
        const q=ver.quotas.find(x=>x.metric==='traffic.bytes');
        return q&&q.limit?Math.round(q.limit/1073741824):'';
      })();
      const curDevices=ver&&ver.max_devices!=null?ver.max_devices:'';
      const curPools=new Set((ver&&ver.pool_ids)||[]);
      const priceOf=(interval,count)=>{
        const list=(plan&&plan.prices)||[];
        const hit=list.find(x=>x.status==='active'&&
          x.billing_interval===interval&&Number(x.interval_count)===count);
        return hit?(hit.unit_amount/100).toFixed(2):'';
      };
      return ''+
      '<div class="sect">卖什么</div>'+
      '<div class="grid2">'+
        fld('每月流量（GB）',
          '<input class="input" id="planTraffic" type="number" min="0" value="'+curTraffic+'" placeholder="留空 = 不限流量">',
    '每个计费周期用户能用多少流量，用完按套餐设置停服。留空表示不限。')+
        fld('设备数上限',
          '<input class="input" id="planDevices" type="number" min="0" value="'+curDevices+'" placeholder="留空 = 不限设备">',
    '同时在线的设备数。超出后新设备会被拒绝。留空表示不限。')+
      '</div>'+
      '<div class="sect">卖多少钱</div>'+
      '<p class="sub" style="margin:-4px 0 10px">按需要填，留空的档位不会创建。'+
        '至少填一档才能上架。</p>'+
      '<div class="grid2">'+
        fld('月付（元）','<input class="input" id="price_m1" type="number" min="0" step="0.01" value="'+priceOf('month',1)+'" placeholder="如 9.90">',
    '填 9.9 就是每月 9 元 9 角。留空则不提供这个周期。')+
        fld('季付（元）','<input class="input" id="price_m3" type="number" min="0" step="0.01" value="'+priceOf('month',3)+'" placeholder="3 个月">',
    '三个月一付的总价，不是每月单价。留空则不提供。')+
        fld('半年付（元）','<input class="input" id="price_m6" type="number" min="0" step="0.01" value="'+priceOf('month',6)+'" placeholder="6 个月">',
    '六个月一付的总价。留空则不提供。')+
        fld('年付（元）','<input class="input" id="price_y1" type="number" min="0" step="0.01" value="'+priceOf('year',1)+'" placeholder="12 个月">',
    '十二个月一付的总价。留空则不提供。')+
      '</div>'+
      '<div class="sect">用哪些线路</div>'+
      '<div class="check-grid">'+
        (pools.length
          // 标出每个分组有几个在服节点，并把空分组直接禁选。
          // 后端会拒绝「一个可服务节点都没有」的分组，但那是在整屏表单
          // 填完提交之后才说 —— 不如在这里就讲清楚哪个能选。
          ? pools.map(x=>{
              const n=Number(x.active_nodes||0);
              return '<label class="check'+(n?'':' is-off')+'">'+
                '<input type="checkbox" class="planPool" value="'+esc(x.id)+'"'+
                (curPools.has(x.id)?' checked':'')+(n?'':' disabled')+'> '+esc(x.name)+
                '<span class="sub" style="margin-left:6px">'+
                (n?n+' 个在服节点':'暂无在服节点，不能选')+'</span></label>';
            }).join('')
          : '<span class="sub">还没有节点分组。先去「节点 → 管理分组」建一个，'+
            '否则用户买了也没有线路可用。</span>')+
      '</div>'+
      (plan?'':'<label class="check" style="margin-top:12px">'+
        '<input id="planPublish" type="checkbox" checked> '+
        '立即上架（取消勾选则存为草稿）</label>');
    })()+
    '</form>';
  const m=modal(plan?'编辑套餐':'新建套餐',body,
    '<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-brand" id="planSave">保存</button>',true);
  const groupOption=$('planVisibility').querySelector('option[value="group"]');
  if(groupOption&&!canReadGroups)groupOption.disabled=true;
  if(!canReadGroups&&cur.visibility==='group')$('planVisibility').disabled=true;
  $('planSave').onclick=async()=>{
    const limit=catalogNullableInt($('planLimit').value),stock=catalogNullableInt($('planStock').value);
    if(Number.isNaN(limit)||Number.isNaN(stock))return toast('购买上限和库存必须是整数','err');
    const visibility=$('planVisibility').value;
    const payload={
      code:$('planCode').value.trim(),name:$('planName').value.trim(),
      description:$('planDescription').value.trim()||null,visibility,
      visible_group_ids:visibility==='group'?(canReadGroups
        ?[...m.querySelectorAll('.planGroup:checked')].map(x=>x.value)
        :(cur.visible_group_ids||[])):[],
      visible_from:catalogISO($('planVisibleFrom').value),visible_until:catalogISO($('planVisibleUntil').value),
      allow_new_purchase:$('planBuy').checked,allow_renewal:$('planRenew').checked,
      allow_upgrade:$('planUpgrade').checked,purchase_limit_per_user:limit,stock_total:stock,
      sort_order:Number($('planSort').value||0)
    };
    if(plan)payload.expected_row_version=plan.row_version;

    // 新建走一步建成：套餐 + 流量/设备额度 + 价格 + 节点分组 + 上架，
    // 一次提交。后端任何一步失败会把已建的部分撤掉，不留半成品草稿。
    if(!plan){
      const yuan=id=>{
        const raw=$(id).value.trim();
        if(!raw)return null;
        const n=Number(raw);
        if(!Number.isFinite(n)||n<=0)return NaN;
        return Math.round(n*100);   // 元 → 分
      };
      const tiers=[['price_m1','month',1],['price_m3','month',3],
                   ['price_m6','month',6],['price_y1','year',1]];
      const prices=[];
      for(const [id,interval,count] of tiers){
        const cents=yuan(id);
        if(cents===null)continue;
        if(Number.isNaN(cents))return toast('价格必须是大于 0 的数字','err');
        prices.push({billing_interval:interval,interval_count:count,
                     unit_amount:cents,currency:'CNY',trial_days:0});
      }
      const traffic=catalogNullableInt($('planTraffic').value);
      const devices=catalogNullableInt($('planDevices').value);
      if(Number.isNaN(traffic)||Number.isNaN(devices))
        return toast('流量和设备数必须是整数','err');
      const publish=$('planPublish').checked;
      const poolIDs=[...m.querySelectorAll('.planPool:checked')].map(x=>x.value);
      if(publish&&!prices.length)
        return toast('要上架至少填一档价格，否则用户看得到却买不了','err');
      if(publish&&!poolIDs.length)
        return toast('要上架就得选节点分组，否则买了也没有线路可用','err');

      const full=Object.assign({},payload,{
        traffic_gb:traffic,max_devices:devices,
        pool_ids:poolIDs,prices:prices,publish:publish});
      delete full.visible_from;delete full.visible_until;
      const b=$('planSave');busy(b,true,'创建中');
      try{
        const r=await api('/v1/plans/complete',
          {method:'POST',headers:{'Idempotency-Key':idemKey()},body:full});
        m.remove();
        toast(r.published
          ? '套餐已创建并上架，用户现在就能买'
          : '套餐已存为草稿（未上架）','ok');
        render();
      }catch(e){toast(e.message,'err',7000)}finally{busy(b,false)}
      return;
    }

    // 编辑也一次改完：资料、额度、价格、线路走同一个接口，后端按各自的
    // 语义处理（额度开新版本、价格归档重建、线路立即生效）。
    const yuan2=id=>{
      const raw=$(id).value.trim();
      if(!raw)return null;
      const n=Number(raw);
      if(!Number.isFinite(n)||n<=0)return NaN;
      return Math.round(n*100);
    };
    const tiers2=[['price_m1','month',1],['price_m3','month',3],
                  ['price_m6','month',6],['price_y1','year',1]];
    const prices2=[];
    for(const [id,interval,count] of tiers2){
      const cents=yuan2(id);
      if(cents===null)continue;
      if(Number.isNaN(cents))return toast('价格必须是大于 0 的数字','err');
      prices2.push({billing_interval:interval,interval_count:count,
                    unit_amount:cents,currency:'CNY',trial_days:0});
    }
    const traffic2=catalogNullableInt($('planTraffic').value);
    const devices2=catalogNullableInt($('planDevices').value);
    if(Number.isNaN(traffic2)||Number.isNaN(devices2))
      return toast('流量和设备数必须是整数','err');
    const full2=Object.assign({},payload,{
      traffic_gb:traffic2,max_devices:devices2,
      prices:prices2,
      pool_ids:[...m.querySelectorAll('.planPool:checked')].map(x=>x.value)});
    delete full2.visible_from;delete full2.visible_until;

    const b=$('planSave');busy(b,true,'保存中');
    try{
      const r=await api('/v1/plans/'+plan.id+'/complete',
        {method:'PUT',headers:{'Idempotency-Key':idemKey()},body:full2});
      m.remove();
      // 逐条说清改了什么、什么时候生效。「保存成功」说不清额度是立刻变了
      // 还是只对新用户生效 —— 那恰恰是改套餐时最需要确认的事。
      const lines=(r&&r.changed)||[];
      toast(lines.length?lines.join('；'):'套餐已更新','ok',
            lines.length>1?9000:4000);
      render();
    }catch(e){toast(e.message,'err',7000)}finally{busy(b,false)}
  };
}

    '<div class="card-head" style="margin-top:18px"><h3>价格</h3><div class="spacer"></div>'+

      toast('价格已归档','ok');reopen()}catch(e){toast(e.message,'err',7000);busy(b,false)}
  });

//---------------------------------------------------------------- 通用片段
function opts(list,cur){
  return list.map(([v,l])=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+l+'</option>').join('');
}
function sw(id,on,disabled){
  return '<label class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+
    (disabled?' disabled':'')+'><i></i></label>';
}
// 空状态。第二个参数说明「这是什么、现在该做什么」。
//
// 原先只有一句「还没有优惠券」——对第一次用面板的人这是死胡同：
// 知道没有了，然后呢？优惠券是干什么的？在哪建？全站 26 处空状态，
// 只有 3 处顺带写了下一步，其余都停在这句话上。
//
// hint 省略时行为和以前一样，所以老的调用点不用动。
function emptyRow(msg,hint){
  return '<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+
    '<circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/></svg><p>'+msg+'</p>'+
    (hint?'<p class="empty-hint">'+hint+'</p>':'')+'</div>';
}
function pager(total,offset,key,size){
  size=size||25;
  const from=total?offset+1:0, to=Math.min(offset+size,total);
  return '<div class="pager"><span>'+from+'–'+to+' / 共 '+total+'</span><div class="spacer"></div>'+
    '<button class="btn btn-sm btn-ghost" data-pg="'+key+'" data-d="-1"'+
      (offset<=0?' disabled':'')+'>上一页</button>'+
    '<button class="btn btn-sm btn-ghost" data-pg="'+key+'" data-d="1"'+
      (to>=total?' disabled':'')+'>下一页</button></div>';
}
function bindPager(key,size){
  size=size||25;
  document.querySelectorAll('button[data-pg="'+key+'"]').forEach(b=>b.onclick=()=>{
    state[key].offset=Math.max(0,state[key].offset+Number(b.dataset.d)*size);
    render();
  });
}
// 点下去立刻出现的加载骨架。
//
// 七个弹窗过去是 async 函数，在 await 拿到数据之前一个像素都不画：
// 点了「编辑」，界面完全没反应，直到接口回来弹窗才凭空出现。慢的不是
// 渲染，是压根还没开始渲染 —— 而用户只知道「点了没用」，于是再点一次。
//
// 用法是在函数最开头调用它，拿到数据、真弹窗建好之后再 close()。
// 关闭顺序是先建新的再删旧的，两层 mask 叠一帧，看上去就是内容替换，
// 不会闪一下黑屏。
// 把次要操作收进一个「⋯」菜单。
//
// 传进来的是已经渲染好的按钮 HTML —— 它们保留原有的 data-* 属性，
// 所以各表格现有的事件绑定（r.querySelector('[data-sv-edit]') 之类）
// 一行都不用改，只是元素换了个位置。
function actMenu(buttons){
  const items=buttons.filter(Boolean);
  if(!items.length)return '';
  return '<details class="act-more"><summary title="更多操作" aria-label="更多操作">⋯</summary>'+
    '<div class="act-menu">'+items.join('')+'</div></details>';
}

// 菜单打开时挂到 body 上再定位，关闭时放回原处。
//
// 为什么非得搬家：.page 上有一个进场动画留下的
// transform: matrix(1,0,0,1,0,5)。CSS 规定任何非 none 的 transform 都会
// 给后代的 position:fixed 建立新的包含块 —— fixed 从此相对 .page 而不是
// 视口定位。表现是「坐标算对了，渲染却错位」：实测算出 left=1073，
// 浏览器画在 1312，菜单整个飞到屏幕外。光看代码永远看不出来，因为
// 罪魁祸首在一个毫不相干的祖先的动画属性里。
//
// 搬到 body 之后 fixed 才真的相对视口。搬家不影响事件：按钮的 onclick
// 在表格渲染后、菜单打开前就绑好了，绑定跟着元素走。
const actMenuHome=new WeakMap();

// 收拾挂在 body 上、宿主已经不在文档里的菜单。
//
// closeActMenu 只管「正常关掉」这一条路。还有一条：菜单开着的时候表格
// 重绘了（列表是轮询刷新的，随时可能发生），innerHTML 一换，那个
// <details> 就没了，而菜单还挂在 body 上 —— 没有任何人再会去收它。
// 实测重绘一次泄漏一个，全部关闭后仍有残留。它们是 fixed 定位的，
// 积够了还会挡在页面上。
//
// 所以每次挂新菜单之前先扫一遍：宿主还在文档里就还给它，不在就删掉。
function reapOrphanActMenus(){
  document.querySelectorAll('body > .act-menu').forEach(menu=>{
    const host=menu.__actHost;
    if(host&&document.contains(host)){
      host.appendChild(menu);
      menu.style.left=menu.style.top='';
    }else{
      menu.remove();
    }
  });
}

function positionActMenu(det){
  const menu=det.querySelector('.act-menu')||actMenuHome.get(det);
  if(!menu)return;
  if(menu.parentElement!==document.body){
    reapOrphanActMenus();
    actMenuHome.set(det,menu);
    menu.__actHost=det;
    document.body.appendChild(menu);
  }
  const r=det.getBoundingClientRect();
  menu.style.visibility='hidden';
  const mw=menu.offsetWidth,mh=menu.offsetHeight;
  let left=r.right-mw, top=r.bottom+4;
  // 右侧先夹再夹左侧，顺序不能反。操作列在表格最右，而 .tbl-wrap 可以
  // 比视口更宽（横向滚动），右对齐算出来的 left 可能超出视口。
  if(left+mw>window.innerWidth-8)left=window.innerWidth-mw-8;
  if(left<8)left=8;
  if(top+mh>window.innerHeight-8)top=r.top-mh-4;
  if(top<8)top=8;
  menu.style.left=left+'px';
  menu.style.top=top+'px';
  menu.style.visibility='';
}

// 关闭时把菜单收回 details 里。不收回的话，下次表格重绘会连同 details
// 一起换掉，而菜单还孤零零留在 body 上，越积越多。
function closeActMenu(det){
  det.open=false;
  const menu=actMenuHome.get(det);
  if(menu&&menu.parentElement===document.body){
    det.appendChild(menu);
    menu.style.left=menu.style.top='';
  }
}

// 一次只开一个；点菜单里的按钮、点外面、按 Esc、滚动都关掉。
//
// 滚动时关闭而不是跟随：菜单是 fixed 的，表格一横滚它就会飘在
// 错误的行上方，那比直接收起来更让人困惑。
document.addEventListener('toggle',e=>{
  const det=e.target;
  if(!(det instanceof HTMLElement)||!det.classList.contains('act-more'))return;
  if(!det.open)return;
  document.querySelectorAll('details.act-more[open]').forEach(o=>{if(o!==det)closeActMenu(o)});
  positionActMenu(det);
},true);
document.addEventListener('click',e=>{
  const inMenu=e.target.closest('.act-menu');
  if(inMenu){
    // 点的是菜单项：让它的原有 onclick 先跑完，再收起菜单。
    // 搬到 body 后菜单不再是 details 的后代，得靠 WeakMap 找回它的宿主。
    let det=inMenu.closest('details.act-more');
    if(!det)document.querySelectorAll('details.act-more[open]').forEach(o=>{
      if(actMenuHome.get(o)===inMenu)det=o;});
    if(det)setTimeout(()=>closeActMenu(det),0);
    return;
  }
  if(e.target.closest('.act-more>summary'))return;
  document.querySelectorAll('details.act-more[open]').forEach(closeActMenu);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('details.act-more[open]').forEach(closeActMenu);
});
window.addEventListener('scroll',()=>{
  document.querySelectorAll('details.act-more[open]').forEach(closeActMenu);
},true);

// 给「点开一个弹窗」这件事统一套上加载骨架。
//
// 一开始是往每个函数体里插两行：开头 loadingModal()、出错时 close()。
// 但实测接口失败后有 8 个函数留下转圈不消失的骨架 —— 这些函数的错误
// 出口形态五花八门：空的 catch(_){}、catch(e){return toast(...)}、
// 还有弹窗内部按钮自己的 catch（那种不该关骨架）。逐个打补丁既容易漏，
// 也分不清哪个 catch 属于「加载失败」、哪个属于「弹窗里的操作失败」。
//
// 改成在外面包一层：函数返回的 promise 无论 resolve 还是 reject 都关掉
// 骨架。成功路径上 modal() 早就把它顶掉了，这里的 close() 是空操作；
// 失败路径上它就是唯一的收尾。函数内部一行都不用改。
function withSkeleton(title,fn){
  return function(){
    const wait=loadingModal(title);
    let r;
    try{ r=fn.apply(this,arguments); }
    catch(e){ wait.close(); throw e; }
    Promise.resolve(r).then(()=>wait.close(),()=>wait.close());
    return r;
  };
}

// 危险操作确认。返回 Promise<boolean>，用法和 confirm 一样：
//
//   if(!await askDanger({...})) return;
//
// 替掉原生 confirm 的三个理由：
//   · 原生弹窗只有一段纯文本，说不清「会发生什么」和「能不能撤回」
//     这两件不同的事，而这恰恰是按删除之前唯一想知道的；
//   · 它长得和面板毫无关系，看起来像浏览器出了故障；
//   · 按钮永远写着「确定」，点下去之前不知道自己在确定什么。
//
// opts: {title, what, consequences:[], confirmText, danger}
function askDanger(opts){
  return new Promise(resolve=>{
    const items=(opts.consequences||[]).filter(Boolean);
    const body=
      (opts.what?'<p class="danger-what">'+opts.what+'</p>':'')+
      (items.length?'<div class="danger-box"><ul>'+
        items.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>':'');
    const m=modal(opts.title||'确认操作',body,
      '<button class="btn" data-close>取消</button>'+
      '<button class="btn '+(opts.danger===false?'btn-brand':'btn-danger')+'" data-go>'+
        (opts.confirmText||'确认')+'</button>');
    let done=false;
    const finish=v=>{if(done)return;done=true;m.remove();resolve(v)};
    m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>finish(false));
    m.onclick=e=>{if(e.target===m)finish(false)};
    m.querySelector('[data-go]').onclick=()=>finish(true);
    setTimeout(()=>{const g=m.querySelector('[data-go]');if(g)g.focus()},50);
  });
}

function loadingModal(title){
  const m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-busy="true">'+
    '<div class="modal-head"><h3>'+title+'</h3>'+
      '<button class="btn-icon" data-close aria-label="关闭">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="modal-body" style="display:flex;align-items:center;gap:10px;'+
      'color:var(--fg-3);padding:28px var(--sp-5)">'+
      '<span class="spin"></span>正在载入…</div></div>';
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  m.onclick=e=>{if(e.target===m)close()};
  document.addEventListener('keydown',function k(e){
    if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  return {close,el:m};
}

function modal(title,body,foot,wide){
  const m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+
    '<div class="modal-head"><h3>'+title+'</h3>'+
      '<button class="btn-icon" data-close aria-label="关闭">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="modal-body">'+body+'</div>'+
    '<div class="modal-foot">'+foot+'</div></div>';
  document.body.appendChild(m);
  // 顶掉正在转圈的加载骨架。放在 append 之后，两层 mask 只叠一帧，
  // 视觉上是内容替换而不是先黑一下再出现。
  document.querySelectorAll('.mask [aria-busy="true"]').forEach(sk=>{
    const host=sk.closest('.mask');
    if(host&&host!==m)host.remove();
  });
  requestAnimationFrame(()=>enhanceScrollableTables(m));
  const close=()=>m.remove();
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  m.onclick=e=>{if(e.target===m)close()};
  document.addEventListener('keydown',function k(e){
    if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  return m;
}

//---------------------------------------------------------------- 加载骨架
// 放在这里而不是各函数内部：函数声明已经提升完毕，可以整批换掉。
// 顺序上必须在 enter() 之前，否则首屏触发的弹窗还是旧的那一版。
[['openManualOrderModal','人工开单'],
 ['openAdminNodeEditor','节点'],
 ['openAssignGroup','调整用户组'],
 ['openContentEditor','内容页'],
 ['openOrderDetail','订单详情'],
 ['openPlanEditor','套餐'],
 ['openPlanManager','套餐管理'],
 ['openPlanPriceEditor','套餐定价']].forEach(([name,title])=>{
  const fn=window[name];
  if(typeof fn==='function')window[name]=withSkeleton(title,fn);
});

//---------------------------------------------------------------- 启动
if(token)enter();
else{$('authView').classList.remove('hide');$('appView').classList.add('hide')}
</script>
</body>
</html>
