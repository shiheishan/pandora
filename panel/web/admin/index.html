//---------------------------------------------------------------- 概览
// 备份状态横幅：只在有问题时才占地方。
//
// 备份原本是彻底的盲区 —— 面板上看不到它跑没跑。但也不能因此在概览页
// 常驻一张「备份正常」的绿卡：那种卡片看两天就变成背景，真出事那天
// 同样没人注意。所以正常时压成一行灰字，出问题才升级成告警块。
//
// 分三档：
//   alert —— 一份备份都没有，或者最近一份超过 48 小时。这两种情况下
//            今天出事就没得恢复，必须立刻查 systemd timer。
//   warn  —— 备份在跑，但缺校验文件或没配异地。能恢复，但少一层保障。
//   平常  —— 一行「最近备份 X 小时前 · N 份 · 共 Y」，看一眼就过。
function backupBanner(st){
  if(!st||!st.backup)return '';
  const b=st.backup, db=st.database||{};
  const dbLine=db.size_bytes?'数据库 '+fmtBytes(db.size_bytes)+
    ' · 连接 '+num(db.connections)+'/'+num(db.max_connections):'';

  if(b.readable===false){
    return '<div class="stat warn" style="margin-bottom:var(--sp-5)">'+
      '<div class="stat-label">备份状态未知</div>'+
      '<div class="stat-val" style="font-size:var(--fs-lg)">面板读不到备份目录</div>'+
      '<div class="stat-sub">'+esc(b.message||'')+'</div></div>';
  }

  const bad=[], soft=[];
  if(!Number(b.count)) bad.push('备份目录里一份加密备份都没有');
  else if(b.stale) bad.push('最近一份备份是 '+num(b.latest_age_hours)+
    ' 小时前的，正常应该每天一份');
  // 「有备份但没钥匙」比「没有备份」更危险：数字看着健康，实际一份都
  // 恢复不了，而且不出事永远不会发现。所以它排在最前面。
  if(b.identity_configured===false)
    bad.unshift(b.identity_hint||'没有配置解密私钥，现有备份无法解开');
  if(Number(b.count)&&Number(b.missing_checksum)>0)
    soft.push(num(b.missing_checksum)+' 份缺 .sha256 校验文件，恢复前无法验证完整性');
  if(!b.offsite_configured)
    soft.push('没有配异地备份，这台机器整机故障时本地备份会一起丢');

  if(bad.length){
    return '<div class="stat alert" style="margin-bottom:var(--sp-5)">'+
      '<div class="stat-label">备份告警</div>'+
      '<div class="stat-val" style="font-size:var(--fs-lg)">'+esc(bad[0])+'</div>'+
      '<div class="stat-sub">'+esc(bad.concat(soft).slice(1).join('；')||
        '用 systemctl status aegis-backup.timer 确认定时器还在')+'</div></div>';
  }
  if(soft.length){
    return '<div class="stat warn" style="margin-bottom:var(--sp-5)">'+
      '<div class="stat-label">备份能用，但缺一层保障</div>'+
      '<div class="stat-val" style="font-size:var(--fs-lg)">'+esc(soft[0])+'</div>'+
      '<div class="stat-sub">最近备份 '+num(b.latest_age_hours)+' 小时前 · 共 '+
      num(b.count)+' 份 · '+fmtBytes(b.total_bytes)+
      (soft.length>1?' · '+esc(soft.slice(1).join('；')):'')+'</div></div>';
  }
  return '<div class="sub" style="margin-bottom:var(--sp-5)">备份正常：最近一份 '+
    num(b.latest_age_hours)+' 小时前 · 共 '+num(b.count)+' 份 · '+
    fmtBytes(b.total_bytes)+' · 已配异地 · 可解密'+(dbLine?' · '+dbLine:'')+'</div>';
}

async function viewOverview(v){
  const rs=state.revenue;
  if(!['CNY','USD'].includes(rs.currency))rs.currency='CNY';
  if(![7,30,90].includes(rs.days))rs.days=30;
  if(!['amount','orders'].includes(rs.metric))rs.metric='amount';
  const activityPromise=can('security.audit.read')
    ? api('/v1/stats/timeseries?days='+rs.days).catch(e=>({points:[],unavailable:true,error:e.message}))
    : Promise.resolve({points:[],unavailable:true,error:'需要 security.audit.read 权限'});
  // 系统状态拿不到不该让整页失败：它是附加信息，概览页本身不依赖它。
  const sysPromise=can('security.audit.read')
    ? api('/v1/system/status').catch(()=>null) : Promise.resolve(null);
  let [o,series,history,activity,sys]=await Promise.all([
    api('/v1/overview'),api('/v1/revenue/timeseries?currency='+rs.currency+'&days='+rs.days),
    api('/v1/revenue/adjustments?currency='+rs.currency),activityPromise,sysPromise]);
  // 接口返回 JSON null 时（而不是抛错）后面每一处取值都会炸
  o=o||{};series=series||{};history=history||{};activity=activity||{};
  if(rs.metric==='orders'&&activity.unavailable)rs.metric='amount';
  const rev=(o.revenue||[]).find(x=>x.currency===rs.currency)||{currency:rs.currency};
  // 概览是登录后的落地页。这三块原来是裸的三层访问（o.users.total），
  // 后端少给一段，整页就变成「载入失败」——其余七八张卡片本来都能画。
  const subs=o.subscriptions||{}, usr=o.users||{}, ord=o.orders||{};
  const periodActual=(series.points||[]).reduce((n,p)=>n+p.actual_credit-p.actual_debit,0),
    periodAdjustment=(series.points||[]).reduce((n,p)=>n+p.adjustment,0),
    periodDisplayed=periodActual+periodAdjustment;
  const orderPoints=activity.points||[],periodOrders=orderPoints.reduce((n,p)=>n+Number(p.orders||0),0),
    peakOrders=orderPoints.reduce((best,p)=>Number(p.orders||0)>Number(best.orders||0)?p:best,{day:'—',orders:0}),
    averageOrders=orderPoints.length?(periodOrders/orderPoints.length).toFixed(1):'0.0';
  const amountMode=rs.metric==='amount';
  const summary=amountMode
    ? '<div class="mini"><div class="k">实际净收入（账本）</div><div class="v">'+money(periodActual,rs.currency)+'</div></div>'+ '<div class="mini"><div class="k">报表调整（追加记录）</div><div class="v">'+money(periodAdjustment,rs.currency)+'</div></div>'+ '<div class="mini"><div class="k">展示收入</div><div class="v">'+money(periodDisplayed,rs.currency)+'</div></div>'
    : '<div class="mini"><div class="k">订单创建事件</div><div class="v num">'+periodOrders+'</div></div>'+ '<div class="mini"><div class="k">日均订单事件</div><div class="v num">'+averageOrders+'</div></div>'+ '<div class="mini"><div class="k">单日峰值</div><div class="v num">'+Number(peakOrders.orders||0)+'</div><div class="stat-sub">'+esc(peakOrders.day||'—')+'</div></div>';
  const chart=amountMode
    ? '<div class="rev-legend"><span><i class="actual"></i>实际净收入</span><span><i class="adjust"></i>调整额（柱）</span><span><i class="displayed"></i>展示收入</span></div>'+revenueSVG(series.points||[],rs.currency)+'<div class="rev-scope-note">金额来自不可变账本与追加写报表调整，按租户时区逐日聚合；不同币种从不混加。</div>'
    : '<div class="rev-legend"><span><i class="orders"></i>订单创建事件量</span></div>'+orderVolumeSVG(orderPoints)+'<div class="rev-scope-note">订单量来自审计事件 <span class="mono">order.created</span>，覆盖所选时间范围内全部币种，不代表已支付或已履约订单数。</div>';
  const detail=amountMode
    ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th class="r">实际贷方</th><th class="r">实际借方</th><th class="r">实际净额</th><th class="r">调整</th><th class="r">展示收入</th></tr></thead><tbody>'+ (series.points||[]).map(p=>'<tr><td class="num">'+p.date+'</td><td class="r num">'+money(p.actual_credit,rs.currency)+'</td><td class="r num">'+money(p.actual_debit,rs.currency)+'</td><td class="r num">'+money(p.actual_credit-p.actual_debit,rs.currency)+'</td><td class="r num">'+money(p.adjustment,rs.currency)+'</td><td class="r num"><b>'+money(p.displayed_net,rs.currency)+'</b></td></tr>').join('')+ '</tbody></table></div>'
    : (orderPoints.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th class="r">订单创建事件</th><th class="r">注册事件</th><th class="r">成功登录</th><th class="r">唯一来源数</th></tr></thead><tbody>'+orderPoints.map(p=>'<tr><td class="num">'+esc(p.day)+'</td><td class="r num"><b>'+Number(p.orders||0)+'</b></td><td class="r num">'+Number(p.registered||0)+'</td><td class="r num">'+Number(p.logins||0)+'</td><td class="r num">'+Number(p.unique_ips||0)+'</td></tr>').join('')+'</tbody></table></div>':emptyRow(activity.error||'暂无订单事件数据'));
  v.innerHTML=
    '<div class="stats">'+stat('今日展示收入',money(rev.today||0,rs.currency),'实际 '+money(rev.actual_today||0,rs.currency)+' · 调整 '+money(rev.adjustment_today||0,rs.currency))+
    stat('生效订阅',num(subs.active),'试用中 '+num(subs.trialing)+' · 7 日内到期 '+num(subs.expiring_7_days))+
    stat('用户总数',num(usr.total),'今日新增 '+num(usr.today)+' · 7 日 '+num(usr.last_7_days))+
    stat('待支付订单',num(ord.pending),'今日成交 '+num(ord.paid_today))+'</div>'+
    (num(o.ledger_drift_accounts)>0?'<div class="stat alert" style="margin-bottom:var(--sp-5)"><div class="stat-label">账本一致性告警</div><div class="stat-val num">'+o.ledger_drift_accounts+' 个账户余额漂移</div><div class="stat-sub">缓存余额与分录求和不一致，需立即排查</div></div>':'')+
    backupBanner(sys)+
    '<div class="card"><div class="card-head"><h3>经营趋势</h3><div class="spacer"></div><div class="rev-controls">'+
      '<div class="rev-control-group"><span class="rev-control-label">币种</span>'+['CNY','USD'].map(c=>'<button class="btn btn-sm '+(c===rs.currency?'on':'')+'" data-rev-cur="'+c+'"'+(amountMode?'':' disabled title="订单事件量不按币种拆分"')+'>'+c+'</button>').join('')+'</div>'+
      '<div class="rev-control-group"><span class="rev-control-label">维度</span>'+[['amount','金额'],['orders','订单量']].map(x=>'<button class="btn btn-sm '+(x[0]===rs.metric?'on':'')+'" data-rev-metric="'+x[0]+'"'+(x[0]==='orders'&&activity.unavailable?' disabled title="'+esc(activity.error||'订单量接口不可用')+'"':'')+'>'+x[1]+'</button>').join('')+'</div>'+
      '<div class="rev-control-group"><span class="rev-control-label">时间</span>'+['7','30','90'].map(d=>'<button class="btn btn-sm '+(Number(d)===rs.days?'on':'')+'" data-rev-days="'+d+'">'+d+' 天</button>').join('')+'</div>'+
      (amountMode&&can('billing.adjustment.write')?'<button class="btn btn-sm btn-primary" id="btnRevenueAdjust">新增报表调整</button>':'')+
    '</div></div><div class="rev-summary">'+summary+'</div><div class="rev-chart-box">'+chart+'</div></div>'+ 
    '<div class="card"><div class="card-head"><h3>'+(amountMode?'收入逐日明细':'订单事件逐日明细')+'</h3></div>'+detail+'</div>'+revenueHistory(history.adjustments||[],rs.currency)+dashboardShell();
  document.querySelectorAll('[data-rev-cur]').forEach(b=>b.onclick=()=>{rs.currency=b.dataset.revCur;render()});
  document.querySelectorAll('[data-rev-days]').forEach(b=>b.onclick=()=>{rs.days=Number(b.dataset.revDays);render()});
  document.querySelectorAll('[data-rev-metric]').forEach(b=>b.onclick=()=>{rs.metric=b.dataset.revMetric;render()});
  if($('btnRevenueAdjust'))$('btnRevenueAdjust').onclick=()=>openRevenueAdjustment(rs.currency);
  document.querySelectorAll('[data-rev-reverse]').forEach(b=>b.onclick=()=>reverseRevenueAdjustment(b.dataset.revReverse));
  const generation=++dashboardGeneration;
  initializeDashboardCards();
  renderDashboardTrafficCard();
  renderDashboardBacklogCard();
  await loadDashboardCards(generation);
}

function dashboardShell(){
  return '<section class="dashboard-ops" aria-labelledby="dashboardOpsTitle">'+
    '<div class="card-head" style="padding-left:0;padding-right:0"><h3 id="dashboardOpsTitle">运营健康</h3></div>'+
    '<div class="dashboard-ops-grid"><article class="card" id="dashboardTrafficCard"></article>'+
    '<article class="card" id="dashboardBacklogCard"></article></div>'+
    '<div class="dashboard-scope">流量来自节点追加写原始上报，经严格条目分类并排除 10 秒近似重复；不是计费账本。历史已删除订阅可能进入未归属流量。通知积压来自投递记录，不代表 worker 在线。</div>'+
    '</section>';
}

function dashboardAllowed(kind){
  if(kind==='nodes')return can('metering.read')&&can('node.read');
  if(kind==='users')return can('metering.read')&&can('iam.user.read');
  return can('ops.notification.read');
}
function dashboardMissing(kind){
  const required=kind==='nodes'?['metering.read','node.read']:
    kind==='users'?['metering.read','iam.user.read']:['ops.notification.read'];
  return required.filter(p=>!can(p)).join('、');
}
function initializeDashboardCards(){
  const ds=state.dashboardTraffic;
  if(!['24h','7d','30d'].includes(ds.range))ds.range='7d';
  if(![5,10,20].includes(ds.limit))ds.limit=10;
  if(!['nodes','users'].includes(ds.tab))ds.tab='nodes';
  if(!dashboardAllowed(ds.tab)){
    if(dashboardAllowed('nodes'))ds.tab='nodes';
    else if(dashboardAllowed('users'))ds.tab='users';
  }
  dashboardCache={
    nodes:dashboardAllowed('nodes')?{status:'loading'}:{status:'permission',missing:dashboardMissing('nodes')},
    users:dashboardAllowed('users')?{status:'loading'}:{status:'permission',missing:dashboardMissing('users')},
    backlog:dashboardAllowed('backlog')?{status:'loading'}:{status:'permission',missing:dashboardMissing('backlog')}
  };
}
function dashboardStillActive(generation){
  return generation===dashboardGeneration&&page==='overview'&&!!$('dashboardTrafficCard');
}
function dashboardTrafficPath(kind,snapshotAt){
  const ds=state.dashboardTraffic;
  return '/v1/dashboard/traffic/'+kind+'?range='+encodeURIComponent(ds.range)+'&limit='+ds.limit+
    (snapshotAt?'&snapshot_at='+encodeURIComponent(snapshotAt):'');
}
function dashboardSettled(result){
  return result.status==='fulfilled'?{status:'ready',data:result.value}:{status:'error',message:result.reason&&result.reason.message||'请求失败'};
}
async function loadDashboardCards(generation){
  const tasks=[loadDashboardTraffic(generation),loadDashboardBacklog(generation)];
  await Promise.allSettled(tasks);
}
async function loadDashboardTraffic(generation){
  const run=++dashboardTrafficRun,ds=state.dashboardTraffic;
  const permitted=['nodes','users'].filter(dashboardAllowed);
  if(!permitted.length)return;
  const first=permitted.includes(ds.tab)?ds.tab:permitted[0];
  const second=permitted.find(kind=>kind!==first);
  const firstResult=(await Promise.allSettled([api(dashboardTrafficPath(first,''))]))[0];
  if(!dashboardStillActive(generation)||run!==dashboardTrafficRun)return;
  dashboardCache[first]=dashboardSettled(firstResult);
  renderDashboardTrafficCard();
  if(!second)return;
  const anchor=firstResult.status==='fulfilled'&&firstResult.value&&firstResult.value.snapshot_at||'';
  const secondResult=(await Promise.allSettled([api(dashboardTrafficPath(second,anchor))]))[0];
  if(!dashboardStillActive(generation)||run!==dashboardTrafficRun)return;
  dashboardCache[second]=dashboardSettled(secondResult);
  renderDashboardTrafficCard();
}
async function loadDashboardBacklog(generation){
  if(!dashboardAllowed('backlog'))return;
  const run=++dashboardBacklogRun;
  const result=(await Promise.allSettled([api('/v1/dashboard/backlog/notifications')]))[0];
  if(!dashboardStillActive(generation)||run!==dashboardBacklogRun)return;
  dashboardCache.backlog=dashboardSettled(result);
  renderDashboardBacklogCard();
}
async function retryDashboardTraffic(kind){
  if(!dashboardAllowed(kind))return;
  const generation=dashboardGeneration,run=++dashboardTrafficRun;
  dashboardCache[kind]={status:'loading'};renderDashboardTrafficCard();
  const other=kind==='nodes'?'users':'nodes';
  const otherData=dashboardCache[other]&&dashboardCache[other].status==='ready'?dashboardCache[other].data:null;
  const result=(await Promise.allSettled([api(dashboardTrafficPath(kind,otherData&&otherData.snapshot_at||''))]))[0];
  if(!dashboardStillActive(generation)||run!==dashboardTrafficRun)return;
  dashboardCache[kind]=dashboardSettled(result);renderDashboardTrafficCard();
}
async function reloadDashboardTraffic(){
  const generation=dashboardGeneration;
  for(const kind of ['nodes','users'])if(dashboardAllowed(kind))dashboardCache[kind]={status:'loading'};
  renderDashboardTrafficCard();
  await loadDashboardTraffic(generation);
}
async function reloadDashboardBacklog(){
  if(!dashboardAllowed('backlog'))return;
  dashboardCache.backlog={status:'loading'};renderDashboardBacklogCard();
  await loadDashboardBacklog(dashboardGeneration);
}

const DASHBOARD_BYTE_RE=/^(0|[1-9][0-9]*)$/;
function groupDashboardDecimal(value){
  return value.replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function dashboardBytes(value){
  const decimal=String(value??'');
  if(!DASHBOARD_BYTE_RE.test(decimal))return '无效字节值';
  const exact=groupDashboardDecimal(decimal)+' B';
  if(typeof BigInt!=='function')return exact;
  const units=['B','KiB','MiB','GiB','TiB','PiB','EiB'],base=1024n;
  let amount=BigInt(decimal),unit=0,divisor=1n;
  while(amount/divisor>=base&&unit<units.length-1){divisor*=base;unit++}
  if(unit===0)return exact;
  const whole=amount/divisor,fraction=(amount%divisor)*100n/divisor;
  return exact+'（'+groupDashboardDecimal(whole.toString())+(fraction===0n?'':'.'+fraction.toString().padStart(2,'0').replace(/0+$/,''))+' '+units[unit]+'）';
}
function dashboardCount(value){return esc(value===null||value===undefined?'0':String(value))}
function dashboardSummary(data,kind){
  const totals=data.totals||{},ranking=data.ranking||{};
  const other=kind==='nodes'?ranking.other_node_bytes:ranking.other_user_bytes;
  return '<div class="dashboard-summary">'+
    dashboardMini('上报总量',dashboardBytes(totals.reported_bytes))+
    dashboardMini('已归属',dashboardBytes(totals.attributed_bytes))+
    dashboardMini('本页排行',dashboardBytes(ranking.returned_bytes))+
    dashboardMini('未归属',dashboardBytes(totals.unattributed_bytes))+
    dashboardMini('排行外',dashboardBytes(other))+'</div>';
}
function dashboardMini(label,value){
  return '<div class="mini"><div class="k">'+label+'</div><div class="v num">'+value+'</div></div>';
}
function dashboardQuality(data){
  const q=data.quality||{},invalidReports=String(q.invalid_report_count??'0'),invalidEntries=String(q.invalid_entry_count??'0');
  const invalid=invalidReports!=='0'||invalidEntries!=='0';
  const duplicate=String(q.duplicate_report_count??'0');
  if(!invalid&&duplicate==='0')return '';
  return '<div class="dashboard-notice" role="status" aria-live="polite">'+
    (invalid?'部分上报含无效数据：invalid reports '+esc(invalidReports)+'，invalid entries '+esc(invalidEntries)+'。有效排行仍正常展示。 ':'')+
    (duplicate!=='0'?'已排除近似重复报告 '+esc(duplicate)+' 份。':'')+'</div>';
}
function dashboardTrafficBody(kind,result){
  const label=kind==='nodes'?'节点':'用户';
  if(!result||result.status==='loading')return '<div class="dashboard-state" role="status" aria-live="polite" aria-label="'+label+'流量排行加载中"><div class="sk" style="height:14px;width:62%"></div><div class="sk" style="height:14px;width:82%"></div><p>'+label+'流量排行加载中</p></div>';
  if(result.status==='permission')return '<div class="dashboard-state" role="status" aria-live="polite"><p>未请求'+label+'流量排行：缺少 '+esc(result.missing)+' 权限。</p></div>';
  if(result.status==='error')return '<div class="dashboard-state error" role="alert" aria-live="assertive"><p>'+esc(result.message)+'</p><button class="btn btn-sm" data-dashboard-retry="'+kind+'" aria-label="重试'+label+'流量排行">重试</button></div>';
  const data=result.data||{},items=Array.isArray(data.items)?data.items:[],totals=data.totals||{};
  // Node ranking intentionally includes valid bytes even when no current
  // subscription can attribute them; only the user ranking has no identity
  // rows in the fully-unattributed case.
  const allUnattributed=kind==='users'&&totals.reported_bytes!=='0'&&totals.attributed_bytes==='0';
  const notice=allUnattributed?'<div class="dashboard-notice" role="status" aria-live="polite">全部上报流量均未归属；仅显示 reported / unattributed 汇总，不生成匿名排行。</div>':'';
  const ranking=allUnattributed?'':!items.length?'<div class="dashboard-state" role="status" aria-live="polite"><p>所选时间范围暂无非零严格有效流量条目</p></div>':dashboardTrafficTable(kind,items);
  return dashboardSummary(data,kind)+notice+dashboardQuality(data)+ranking+
    '<div class="dashboard-scope">统计窗口 '+esc(data.range||'—')+' · 快照 '+esc(dt(data.snapshot_at))+' · '+esc(data.basis||'严格有效非重复上报')+'</div>';
}
function dashboardTrafficTable(kind,items){
  const nodes=kind==='nodes';
  return '<div class="tbl-wrap"><table class="tbl dashboard-traffic-table"><thead><tr><th>'+(nodes?'节点':'脱敏用户')+'</th><th class="r">上行</th><th class="r">下行</th><th class="r">总量</th><th class="r">'+(nodes?'报告 / 条目':'订阅 / 条目')+'</th><th>最后上报</th></tr></thead><tbody>'+items.map(item=>{
    const identity=nodes?'<span class="email">'+esc(item.display_name||item.name||item.node_id)+'</span><div class="sub mono">'+esc(item.node_id)+'</div>':'<span class="email">'+esc(item.email_masked||'***')+'</span><div class="sub mono">'+esc(item.user_id)+'</div>';

function revenueSVG(points,currency){
  if(!points.length)return emptyRow('暂无收入数据',
    '有成交之后，这里会按天显示收入曲线。');
  const W=1000,H=280,L=64,R=18,T=22,B=44, vals=[];
  points.forEach(p=>vals.push(p.actual_credit-p.actual_debit,p.adjustment,p.displayed_net));
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(lo===hi)hi=lo+1;
  const x=i=>L+i*(W-L-R)/Math.max(1,points.length-1), y=n=>T+(hi-n)*(H-T-B)/(hi-lo);
  const path=key=>points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(key(p)).toFixed(1)).join(' ');
  const ticks=[0,.25,.5,.75,1].map(f=>{const n=hi-(hi-lo)*f,yy=y(n);return '<path d="M'+L+' '+yy+'H'+(W-R)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" fill="var(--fg-3)" font-size="11">'+esc(money(Math.round(n),currency))+'</text>'}).join('');
  const bw=Math.max(2,Math.min(12,(W-L-R)/points.length*.55));
  const bars=points.map((p,i)=>{const yy=y(p.adjustment),z=y(0),h=Math.max(1,Math.abs(z-yy));return '<rect x="'+(x(i)-bw/2)+'" y="'+Math.min(yy,z)+'" width="'+bw+'" height="'+h+'" rx="2" fill="var(--warn)" opacity=".48"><title>'+p.date+' 调整 '+money(p.adjustment,currency)+'</title></rect>'}).join('');
  const labels=points.map((p,i)=>i===0||i===points.length-1||i%Math.ceil(points.length/7)===0?'<text x="'+x(i)+'" y="'+(H-14)+'" text-anchor="middle" fill="var(--fg-3)" font-size="11">'+p.date.slice(5)+'</text>':'').join('');
  const dots=points.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.displayed_net)+'" r="3" fill="var(--brand)"><title>'+p.date+'\n实际 '+money(p.actual_credit-p.actual_debit,currency)+'\n调整 '+money(p.adjustment,currency)+'\n展示 '+money(p.displayed_net,currency)+'</title></circle>').join('');
  return '<svg class="rev-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+currency+' 收入趋势">'+ticks+bars+'<path d="'+path(p=>p.actual_credit-p.actual_debit)+'" fill="none" stroke="var(--fg-2)" stroke-width="2"/><path d="'+path(p=>p.displayed_net)+'" fill="none" stroke="var(--brand)" stroke-width="3"/>'+dots+labels+'</svg>';
}

function parseMinorAmount(value){
  const s=String(value).trim();if(!/^-?\d+(\.\d{1,2})?$/.test(s))return null;
  const neg=s[0]==='-',parts=s.replace('-','').split('.'),n=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));
  return Number.isSafeInteger(n)?(neg?-n:n):null;
}
function idemKey(){return crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random())}
function idemAttempt(makeKey=idemKey){
  let fingerprint='',key='';
  return {
    keyFor(payload){
      const next=JSON.stringify(payload||{});
      if(next!==fingerprint){fingerprint=next;key=makeKey()}
      return key;
    },
    reset(){fingerprint='';key=''}
  };
}

//---------------------------------------------------------------------------
// 人工单与线下收款（XBD-015）
//---------------------------------------------------------------------------
//
// 人工单：直接给用户开一张已履约的订单（赠送、补偿、线下成交）。
//   走的是和用户自助下单完全相同的那条路，只是全额减免。所以订阅、配额、
//   订单项快照、库存占用的行为一模一样 —— 不会出现「赠送的订阅少个字段」。
//   赠送不产生收入：订单金额为 0，营收报表不受影响。
//
// 线下收款：用户银行转账付了钱，把待支付订单结清。
//   合成一笔 offline 渠道的收款，复用支付回调的整条结算链路，
//   优惠券核销、余额解冻、佣金计提一个不少。
//   凭证号即幂等口径：同一张银行流水不会被入账两次。

function openMarkPaidModal(o){
  const m = modal('标记为已支付 · ' + esc(o.order_no),
    '<dl class="kv" style="margin:0 0 var(--sp-4)">' +
      '<dt>用户</dt><dd>' + esc(o.user_email || '—') + '</dd>' +

      '<input class="input" id="mpRef" maxlength="128" placeholder="银行流水号 / 收据编号">' +
      '<div class="hint">这个号同时是幂等依据：同一张凭证不会被重复入账。</div>' +
    '</div>' +
    '<div class="field" style="margin-bottom:0"><label for="mpReason">收款说明</label>' +
      '<input class="input" id="mpReason" maxlength="500" placeholder="例如：客户对公转账已到账，见附件回单">' +
      '<div class="hint">至少 5 个字，会写进审计。</div>' +
    '</div>' +
    '<div class="card card-pad sub" style="margin-top:var(--sp-4);line-height:1.7">' +
      '确认后这笔钱会按真实收入入账，订阅立即开通，和用户在线支付的结果完全一致。' +
      '如果钱其实没到，事后只能通过工单人工处理。' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="mpGo">确认已收款</button>');

  m.querySelector('#mpGo').onclick = async ev => {
    const reference = m.querySelector('#mpRef').value.trim();
    const reason = m.querySelector('#mpReason').value.trim();
    if (!reference){ toast('请填写线下凭证号', 'err'); return; }
    if ([...reason].length < 5){ toast('请写清收款说明，至少 5 个字', 'err'); return; }
    busy(ev.currentTarget, true, '入账中');

      await api('/v1/orders/' + o.id + '/mark-paid', {method:'POST',

      toast('已入账，订阅已开通', 'ok', 3500);
      render();
    }catch(e){ toast(e.message, 'err', 9000); busy(ev.currentTarget, false); }
  };
}

//
// 三种卡型：
//   通用卡 —— 送余额 / 流量 / 延长到期 / 重置流量
//   套餐卡 —— 直接开通一个套餐
//   盲盒   —— 从奖池里按权重随机抽一个
//
// 生码是高风险操作：一次能造出几千张能换真钱的凭证，所以要重认证。
// 「已发出金额」摆在最上面 —— 这是这一页唯一一个和钱直接相关的数字。

const GC_TYPE = {general:'通用卡', plan:'套餐卡', mystery:'盲盒'};
const GC_CODE_ST = {unused:['未使用','badge-ok'], used:['已兑换','badge-plain'],
  disabled:['已停用','badge-warn'], expired:['已过期','badge-plain']};

const gcState = {tab:'templates', templateID:'', codeStatus:'', offset:0};

async function viewGiftCards(v){
  const [list, stats] = await Promise.all([
    api('/v1/gift-cards'), api('/v1/gift-cards/stats')
  ]);
  // list||{} 而不是只写 list.templates||[]：接口整个返回 null 时，
  // 后者在读 .templates 的那一刻就已经抛了，兜底根本轮不到。
  const templates = (list || {}).templates || [];

  const rows = templates.map(t =>
    '<tr>' +
      '<td><b>' + esc(t.name) + '</b>' +
        (t.description ? '<div class="sub">' + esc(t.description) + '</div>' : '') + '</td>' +
      '<td><span class="badge badge-plain">' + (GC_TYPE[t.type] || esc(t.type)) + '</span></td>' +
      '<td class="sub">' + giftRewardText(t) + '</td>' +
      '<td>' + (t.status === 'active'
        ? '<span class="badge badge-ok">进行中</span>'
        : '<span class="badge badge-warn">已暂停</span>') + '</td>' +
      '<td class="r num">' + num(t.code_used) + ' / ' + num(t.code_total) + '</td>' +
      '<td class="r" style="white-space:nowrap">' +
        (can('marketing.giftcard.write')
          ? '<button class="btn btn-sm btn-ghost" data-gcedit="' + esc(t.id) + '">编辑</button> ' +
            '<button class="btn btn-sm btn-primary" data-gcgen="' + esc(t.id) +
              '" data-name="' + esc(t.name) + '">生成卡密</button> '
          : '') +
        '<button class="btn btn-sm btn-ghost" data-gccodes="' + esc(t.id) + '">卡密</button>' +
      '</td>' +
    '</tr>').join('');

  v.innerHTML =
    '<div class="stats" style="margin-bottom:var(--sp-4)">' +
      stat('已发出余额', money(num(stats.balance_out), 'CNY'), '礼品卡送出去的真金白银') +
      stat('已发出流量', fmtBytes(num(stats.traffic_out)), '') +
      stat('卡密', num(stats.codes_used) + ' / ' + num(stats.codes_total),
           '已兑换 / 总数，未用 ' + num(stats.codes_unused)) +
      stat('活动', String(num(stats.templates)), '进行中的礼品卡模板') +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h3>礼品卡活动</h3><div class="spacer"></div>' +
        (can('marketing.giftcard.write')
          ? '<button class="btn btn-primary" id="gcNew">新建礼品卡</button>' : '') +
      '</div>' +
      (templates.length
        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>名称</th><th>类型</th><th>奖励</th><th>状态</th>' +
          '<th class="r">已兑/总数</th><th></th></tr></thead><tbody>' +
          rows + '</tbody></table></div>'
        : emptyRow('还没有礼品卡活动',
    '礼品卡是一批可以兑换余额或套餐的卡密，适合做推广和补偿。先建一个活动，再在活动里批量生成卡密。')) +
    '</div>' +
    '<div id="gcCodesBox" style="margin-top:var(--sp-4)"></div>';

  const nb = v.querySelector('#gcNew');
  if (nb) nb.onclick = () => openGiftEditor(null);
  v.querySelectorAll('[data-gcedit]').forEach(b => b.onclick = () =>
    openGiftEditor(templates.find(t => t.id === b.dataset.gcedit)));
  v.querySelectorAll('[data-gcgen]').forEach(b => b.onclick = () =>
    openGenerateCodes(b.dataset.gcgen, b.dataset.name));
  v.querySelectorAll('[data-gccodes]').forEach(b => b.onclick = () =>
    renderGiftCodes(v.querySelector('#gcCodesBox'), b.dataset.gccodes));
}

function giftRewardText(t){
  const r = t.rewards || {};
  if (t.type === 'mystery'){
    const total = (r.pool || []).reduce((a, p) => a + (p.weight || 0), 0) || 1;
    return (r.pool || []).map(p =>
      esc(p.label) + ' ' + Math.round(p.weight / total * 100) + '%').join('、');
  }
  if (t.type === 'plan') return '开通套餐';
  const parts = [];
  if (r.balance) parts.push('余额 ' + money(r.balance, 'CNY'));
  if (r.traffic_bytes) parts.push('流量 ' + fmtBytes(r.traffic_bytes));
  if (r.expire_days) parts.push('延长 ' + r.expire_days + ' 天');
  if (r.reset_quota) parts.push('重置流量');
  return parts.join('、') || '—';
}

function openGiftEditor(t){
  const isNew = !t;
  t = t || {type:'general', status:'active', rewards:{}, conditions:{}, limits:{}};
  const r = t.rewards || {}, c = t.conditions || {}, l = t.limits || {};

  const m = modal(isNew ? '新建礼品卡' : '编辑 · ' + esc(t.name),
    '<div class="field"><label for="gcName">名称</label>' +
      '<input class="input" id="gcName" maxlength="120" value="' + esc(t.name || '') + '"></div>' +
    '<div class="field"><label for="gcDesc">说明（用户兑换前会看到）</label>' +
      '<input class="input" id="gcDesc" maxlength="500" value="' + esc(t.description || '') + '"></div>' +
    '<div class="field"><label for="gcType">卡型</label>' +
      '<select class="input" id="gcType"' + (isNew ? '' : ' disabled') + '>' +
        ['general','plan','mystery'].map(k =>
          '<option value="' + k + '"' + (t.type === k ? ' selected' : '') + '>' +
          GC_TYPE[k] + '</option>').join('') +
      '</select>' +
      (isNew ? '<div class="hint">建好之后不能改：已发出去的码是按当时的卡型生成的。</div>'
             : '<div class="hint">卡型不可修改。</div>') +
    '</div>' +
    '<div id="gcRewardBox"></div>' +
    '<div class="field"><label for="gcMaxUse">每人最多兑换次数</label>' +
      '<input class="input" id="gcMaxUse" type="number" min="0" value="' +
        (l.max_use_per_user || 0) + '">' +
      '<div class="hint">0 表示不限。</div></div>' +
    '<div class="field" style="margin-bottom:0"><label>领取条件</label>' +
      '<label style="display:flex;gap:var(--sp-2);align-items:center;margin-top:var(--sp-2)">' +
        '<input type="checkbox" id="gcNewOnly"' + (c.new_user_only ? ' checked' : '') +
        '> 仅从未付费的新用户</label>' +
      '<label style="display:flex;gap:var(--sp-2);align-items:center;margin-top:var(--sp-2)">' +
        '<input type="checkbox" id="gcPaidOnly"' + (c.paid_user_only ? ' checked' : '') +
        '> 仅付过费的用户</label>' +
      '<div class="hint">两个都勾等于谁都不能兑，保存时会被挡下。</div>' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="gcSave">保存</button>', true);

  const box = m.querySelector('#gcRewardBox');
  const typeSel = m.querySelector('#gcType');
  const drawRewards = () => {
    const ty = typeSel.value;
    if (ty === 'general'){
      box.innerHTML =
        '<div class="field"><label for="gcBal">送余额（元）</label>' +
          '<input class="input" id="gcBal" type="number" min="0" step="0.01" value="' +
          ((r.balance || 0) / 100) + '"></div>' +
        '<div class="field"><label for="gcTraffic">送流量（GB）</label>' +
          '<input class="input" id="gcTraffic" type="number" min="0" step="0.1" value="' +
          ((r.traffic_bytes || 0) / (1024*1024*1024)) + '"></div>' +
        '<div class="field"><label for="gcDays">延长到期（天）</label>' +
          '<input class="input" id="gcDays" type="number" min="0" value="' +
          (r.expire_days || 0) + '"></div>' +
        '<label style="display:flex;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-4)">' +
          '<input type="checkbox" id="gcReset"' + (r.reset_quota ? ' checked' : '') +
          '> 兑换后把本周期已用流量清零</label>';
    } else if (ty === 'plan'){
      box.innerHTML = '<div class="field"><label for="gcPlan">兑换的套餐</label>' +
        '<select class="input" id="gcPlan"><option value="">加载中…</option></select>' +
        '<div class="hint">兑换后立即开通，等同于一张人工单。</div></div>';
      api('/v1/plans').then(d => {
        const sel = m.querySelector('#gcPlan');
        if (!sel) return;
        sel.innerHTML = (d.plans || []).filter(p => p.status === 'active')
          .map(p => '<option value="' + esc(p.id) + '"' +
            (r.plan_id === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
      }).catch(() => {});
    } else {
      const pool = (r.pool && r.pool.length) ? r.pool
        : [{label:'', weight:70, balance:0}, {label:'', weight:30, balance:0}];
      box.innerHTML = '<div class="field"><label>奖池</label>' +
        '<div id="gcPool">' + pool.map((p, i) => giftPoolRow(p, i)).join('') + '</div>' +
        '<button type="button" class="btn btn-sm btn-ghost" id="gcAddPrize" ' +
          'style="margin-top:var(--sp-2)">加一档</button>' +
        '<div class="hint">权重是相对值，填 70/20/10 和 7/2/1 效果一样。' +
          '权重为 0 等于永远抽不到，保存时会被挡。</div></div>';
      m.querySelector('#gcAddPrize').onclick = () => {
        const el = document.createElement('div');
        el.innerHTML = giftPoolRow({label:'', weight:10, balance:0},
          m.querySelectorAll('.gc-prize').length);
        m.querySelector('#gcPool').appendChild(el.firstElementChild);
      };
    }
  };
  typeSel.onchange = drawRewards;
  drawRewards();

  m.querySelector('#gcSave').onclick = async ev => {
    const ty = typeSel.value;
    const rewards = {};
    if (ty === 'general'){
      rewards.balance = Math.round(Number(m.querySelector('#gcBal').value || 0) * 100);
      rewards.traffic_bytes = Math.round(
        Number(m.querySelector('#gcTraffic').value || 0) * 1024*1024*1024);
      rewards.expire_days = Number(m.querySelector('#gcDays').value || 0);
      rewards.reset_quota = m.querySelector('#gcReset').checked;
    } else if (ty === 'plan'){
      rewards.plan_id = m.querySelector('#gcPlan').value;
    } else {
      rewards.pool = [...m.querySelectorAll('.gc-prize')].map(row => ({
        label: row.querySelector('[data-pl]').value.trim(),
        weight: Number(row.querySelector('[data-pw]').value || 0),
        balance: Math.round(Number(row.querySelector('[data-pb]').value || 0) * 100),
      }));
    }
    busy(ev.currentTarget, true, '保存中');
    try{
      await api('/v1/gift-cards', {method:'POST', body: JSON.stringify({
        id: t.id || '', name: m.querySelector('#gcName').value.trim(),
        description: m.querySelector('#gcDesc').value.trim(),
        type: ty, status: t.status || 'active', rewards,
        conditions: {
          new_user_only: m.querySelector('#gcNewOnly').checked,
          paid_user_only: m.querySelector('#gcPaidOnly').checked,
        },
        limits: {max_use_per_user: Number(m.querySelector('#gcMaxUse').value || 0)},
      })});
      m.remove(); toast('已保存', 'ok', 2500); render();
    }catch(e){ toast(e.message, 'err', 9000); busy(ev.currentTarget, false); }
  };
}

function giftPoolRow(p, i){
  return '<div class="gc-prize" style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-2)">' +
    '<input class="input" data-pl placeholder="奖品名" value="' + esc(p.label || '') + '" style="flex:2">' +
    '<input class="input" data-pw type="number" min="1" placeholder="权重" value="' +
      (p.weight || 0) + '" style="flex:1">' +
    '<input class="input" data-pb type="number" min="0" step="0.01" placeholder="送多少元" value="' +
      ((p.balance || 0) / 100) + '" style="flex:1">' +
  '</div>';
}

function openGenerateCodes(templateID, name){
  const m = modal('生成卡密 · ' + esc(name),
    '<div class="field"><label for="gcCount">数量</label>' +
      '<input class="input" id="gcCount" type="number" min="1" max="5000" value="100">' +
      '<div class="hint">一次最多 5000 个。</div></div>' +
    '<div class="field"><label for="gcPrefix">前缀（可选）</label>' +
      '<input class="input" id="gcPrefix" maxlength="8" placeholder="例如 CNY" ' +
        'style="text-transform:uppercase">' +
      '<div class="hint">只能是大写字母和数字，方便区分批次。</div></div>' +
    '<div class="field" style="margin-bottom:0"><label for="gcExpire">有效期（可选）</label>' +
      '<input class="input" id="gcExpire" type="date">' +
      '<div class="hint">留空表示长期有效。</div></div>' +
    '<div class="card card-pad sub" style="margin-top:var(--sp-4);line-height:1.7">' +
      '生成的卡密可以直接兑换成余额、流量或套餐。' +
      '生成后请及时导出保存 —— 卡密本身在后台可以查到，但一旦泄漏就等于把钱送人。' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="gcGenGo">生成</button>');

  m.querySelector('#gcGenGo').onclick = async ev => {
    const count = Number(m.querySelector('#gcCount').value || 0);
    if (count < 1){ toast('数量至少 1 个', 'err'); return; }
    const date = m.querySelector('#gcExpire').value;
    busy(ev.currentTarget, true, '生成中');
    try{
      const r = await api('/v1/gift-cards/' + templateID + '/codes', {method:'POST',
        headers:{'Idempotency-Key': idemKey()},
        body: JSON.stringify({count, prefix: m.querySelector('#gcPrefix').value.trim().toUpperCase(),
          expires_at: date ? new Date(date + 'T23:59:59').toISOString() : ''})});
      m.remove();
      toast('已生成 ' + r.count + ' 个卡密', 'ok', 4000);
      render();
    }catch(e){ toast(e.message, 'err', 9000); busy(ev.currentTarget, false); }
  };
}

async function renderGiftCodes(box, templateID){
  box.innerHTML = '<div class="card card-pad sub">卡密加载中…</div>';
  let d;
  try{ d = await api('/v1/gift-cards/codes?template_id=' + templateID + '&limit=100'); }
  catch(e){
    box.innerHTML = '<div class="card card-pad sub" style="color:var(--err)">' +
      esc(e.message) + '</div>';
    return;
  }
  const rows = (d.codes || []).map(c => {
    const st = GC_CODE_ST[c.status] || [c.status, 'badge-plain'];
    return '<tr><td class="mono">' + esc(c.code) + '</td>' +
      '<td><span class="badge ' + st[1] + '">' + st[0] + '</span></td>' +
      '<td class="sub">' + esc(c.used_email || '—') +
        (c.used_at ? '<div class="sub">' + dt(c.used_at) + '</div>' : '') + '</td>' +
      '<td class="sub num">' + (c.expires_at ? dt(c.expires_at) : '长期') + '</td>' +
      '<td class="r">' +
        (c.status === 'unused' && can('marketing.giftcard.write')
          ? '<button class="btn btn-sm btn-ghost" data-gctoggle="' + esc(c.id) +
            '" data-on="1">停用</button>'
          : c.status === 'disabled' && can('marketing.giftcard.write')
          ? '<button class="btn btn-sm btn-ghost" data-gctoggle="' + esc(c.id) +
            '" data-on="0">恢复</button>' : '') +
      '</td></tr>';
  }).join('');

  box.innerHTML = '<div class="card">' +
    '<div class="card-head"><h3>卡密（共 ' + d.total + '）</h3><div class="spacer"></div>' +
      '<button class="btn btn-ghost btn-sm" id="gcExport">导出 CSV</button></div>' +
    (rows
      ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>卡密</th><th>状态</th><th>使用者</th><th>有效期</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : emptyRow('这个活动还没有生成卡密',
    '活动本身只是模板，要先生成卡密才能发给用户。点「生成卡密」，填数量即可。')) +
    (d.total > 100 ? '<div class="card-pad sub">只显示前 100 个，完整列表请导出 CSV。</div>' : '') +
  '</div>';

  // 导出走 fetch：这个接口要鉴权，而 <a download> 发不出 Authorization 头。
  // 拿到内容后用 Blob 触发下载，效果和直接点链接一样。
  box.querySelector('#gcExport').onclick = async ev => {
    busy(ev.currentTarget, true, '导出中');
    try{
      const res = await fetch(ADMIN_BASE + '/v1/gift-cards/codes/export?template_id=' +
        encodeURIComponent(templateID), {headers:{Authorization:'Bearer ' + token}});
      if (!res.ok) throw new Error('导出失败（HTTP ' + res.status + '）');
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'gift-codes.csv';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){ toast(e.message, 'err', 7000); }
    finally{ busy(ev.currentTarget, false); }
  };

  box.querySelectorAll('[data-gctoggle]').forEach(b => b.onclick = async () => {
    try{
      await api('/v1/gift-cards/codes/' + b.dataset.gctoggle + '/toggle',
        {method:'POST', body: JSON.stringify({disabled: b.dataset.on === '1'})});
      toast('已更新', 'ok', 2000);
      renderGiftCodes(box, templateID);
    }catch(e){ toast(e.message, 'err', 7000); }
  });
}


// tone: 'alert' | 'warn' | 'ok'，省略则是中性。
//
// 只给「要不要管」这件事上色。一排数字里如果每张都有颜色，等于每张
// 都没有颜色 —— 所以正常值一律保持中性，只有需要动手的才跳出来。
function stat(label,val,sub,tone){
  return '<div class="stat'+(tone?' '+tone:'')+'"><div class="stat-label">'+label+'</div>'+
    '<div class="stat-val num">'+val+'</div>'+
    (sub?'<div class="stat-sub">'+sub+'</div>':'')+'</div>';
}

//---------------------------------------------------------------- 用户
const ND_ST = {
  active:['在役','ok'], canary:['灰度','brand'], standby:['待命','warn'],
  bootstrapping:['引导中','warn'], attesting:['验证中','warn'],
  installing:['安装中','warn'], validating:['自检中','warn'],
  draining:['排空中','warn'], maintenance:['维护中','warn'],
  unhealthy:['异常','err'], quarantined:['已隔离','err'],
  retired:['已退役',''], destroyed:['已销毁','']
};

function fmtBytes(n){
  if(!n) return '0 B';
  const u=['B','KB','MB','GB','TB','PB'];let i=0,v=Math.abs(n);
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return (i===0?v:v.toFixed(v>=100?0:v>=10?1:2))+' '+u[i];
}
function fmtUptime(sec){
  if(!sec) return '—';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  return d>0?(d+' 天 '+h+' 小时'):(h>0?(h+' 小时 '+m+' 分'):(m+' 分'));
}
function gauge(label,used,total,unit){
  const pct = total>0 ? Math.min(100, used/total*100) : 0;
  const tone = pct>=90?'d':pct>=75?'w':'';
  return '<div class="gauge"><div class="gauge-top"><span class="k">'+label+'</span>'+
    '<span class="v">'+(unit==='%'?pct.toFixed(0)+'%':
      (used+' / '+total+' '+unit+' · '+pct.toFixed(0)+'%'))+'</span></div>'+
    '<div class="gauge-bar '+tone+'"><i style="width:'+pct+'%"></i></div></div>';
}

// 折线图用内联 SVG 手绘：CSP 禁止外部脚本，引不了图表库。
// 只画一条线加一层填充，够看趋势就行 —— 探针面板的作用是「一眼看出不对劲」，
// 不是做精确的数据分析。
function sparkline(points, pick, opts){
  opts = opts || {};
  const W=600, H=120, PAD=4;
  if(!points.length) return '<div class="muted" style="padding:24px;text-align:center">暂无数据</div>';

  const vals = points.map(pick);
  let max = Math.max(...vals, opts.min || 0);
  if(max<=0) max = 1;
  if(opts.nice) max = max*1.15;

  const n = vals.length;
  const x = i => n<2 ? W/2 : PAD + i*(W-2*PAD)/(n-1);
  const y = v => H-PAD - (v/max)*(H-2*PAD);

  let d='', area='';
  vals.forEach((v,i)=>{
    d += (i===0?'M':'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
  });
  area = d + 'L'+x(n-1).toFixed(1)+' '+(H-PAD)+' L'+x(0).toFixed(1)+' '+(H-PAD)+' Z';

  const id = 'g'+Math.random().toString(36).slice(2,8);
  const color = opts.color || 'var(--brand)';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/>'+
      '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" '+
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    '</svg>';
}

//---------------------------------------------------------------- 服务器
const SV_ST={draft:['草稿',''],ready:['就绪','ok'],draining:['排空中','warn'],
  maintenance:['维护','warn'],unhealthy:['异常','err'],quarantined:['隔离','err'],
  retired:['已退役','']};

function serverResource(s){
  const parts=[];
  if(s.cpu_cores)parts.push(s.cpu_cores+' 核');
  if(s.memory_mb)parts.push((s.memory_mb/1024).toFixed(1)+' GB 内存');
  if(s.disk_gb)parts.push(s.disk_gb+' GB 磁盘');
  return parts.join(' / ')||'尚未上报';
}

// 实际占用率。规格（几核几 G）回答不了「这台还吃得下节点吗」，
// 占用率才行；三项取最大值当作这台机器的压力。
// null 表示没探针数据 —— 和「占用 0%」是两回事，不能混。
function serverLoad(s){
  const cpu=s.cpu_bp==null?null:Math.min(100,Math.round(s.cpu_bp/100));
  const mem=(s.mem_total_mb>0&&s.mem_used_mb!=null)
    ?Math.min(100,Math.round(s.mem_used_mb*100/s.mem_total_mb)):null;
  const disk=(s.disk_total_gb>0&&s.disk_used_gb!=null)
    ?Math.min(100,Math.round(s.disk_used_gb*100/s.disk_total_gb)):null;
  const known=[cpu,mem,disk].filter(x=>x!=null);
  return {cpu,mem,disk,peak:known.length?Math.max(...known):null};
}

const LOAD_HIGH=85;
function loadBar(label,pct,detail){
  if(pct==null)return '';
  const tone=pct>=LOAD_HIGH?'var(--err)':pct>=70?'var(--warn)':'var(--brand)';
  return '<div class="load-row"><span class="load-k">'+label+'</span>'+
    '<span class="load-track"><span class="load-fill" style="width:'+pct+'%;background:'+tone+'"></span></span>'+
    '<span class="load-v">'+pct+'%</span>'+
    (detail?'<span class="load-d">'+esc(detail)+'</span>':'')+'</div>';
}

function serverLoadCell(s){
  const l=serverLoad(s);
  if(l.peak==null)return '<span class="sub">无探针数据</span>';
  const gb=mb=>(mb/1024).toFixed(1)+' GB';
  // used 和 total 是 node_metrics 同一行的两个可空列，理论上同进同出，
  // 但列本身允许为空。只判 total 的话，used 缺失就会印出「NaN GB / 3.8 GB」。
  const pair=(u,t,fmt)=>(u!=null&&t)?fmt(u)+' / '+fmt(t):'';
  return loadBar('CPU',l.cpu,'')+
    loadBar('内存',l.mem,pair(s.mem_used_mb,s.mem_total_mb,gb))+
    loadBar('磁盘',l.disk,pair(s.disk_used_gb,s.disk_total_gb,v=>v+' GB'));
}

async function viewServers(v){
  const d=await api('/v1/servers');
  const list=d.servers||[], online=list.filter(s=>s.heartbeat_online).length;
  const nodes=list.reduce((n,s)=>n+Number(s.node_count||0),0);
  const active=list.reduce((n,s)=>n+Number(s.active_node_count||0),0);
  // serving 才是订阅真正会下发的数量：标了在役、而且上报过心跳。
  // 只看 active 会把「建了但没装 agent」的节点也算成运力。
  const serving=list.reduce((n,s)=>n+Number(s.serving_node_count||0),0);
  const neverSeen=list.reduce((n,s)=>n+Number(s.never_seen_node_count||0),0);
  v.innerHTML=
    '<div class="stats">'+
      // 卡片要回答的是「要不要我管」，不是「这个数字怎么算出来的」。
      //
      // 「在线 Agent 1」孤零零一个数看不出好坏；写成「19 台里 18 台
      // 没装 Agent」，问题一眼就在那儿。
      stat('服务器',list.length,'物理或虚拟宿主')+
      stat('在线 Agent',online,
        online>=list.length?'全部已接入':
        (list.length-online)+' 台还没接入，装了 Agent 才能下发配置和收流量',
        online>=list.length?'ok':(list.length&&online===0?'alert':'warn'))+
      // 主数字给 serving 而不是 active：这张卡回答的是「现在有多少运力」，
      // 而一个从没上报过心跳的节点，订阅下发时会被直接跳过，它不是运力。
      // 之前主数字取 active，面板会说有 4 个节点在服务，实际只下发得出 2 个。
      stat('承载节点',serving,
        (neverSeen
          ? neverSeen+' 个标了在役却从没上报心跳，多半是没装 Agent，不会下发给用户'
          : '全部在役节点都在正常上报')+
        (nodes>active?' · 另有 '+(nodes-active)+' 个未投入或已退役':''),
        neverSeen?(serving?'warn':'alert'):'')+
      (function(){
        const hi=list.filter(s=>{const p=serverLoad(s).peak;return p!=null&&p>=LOAD_HIGH}).length;
        return stat('高负载',hi,
          hi?'CPU/内存/磁盘任一 ≥ '+LOAD_HIGH+'%，考虑扩容或迁走节点'
            :'没有机器逼近资源上限',
          hi?'warn':'ok');
      })()+
      (function(){
        const bad=list.filter(s=>['unhealthy','quarantined'].includes(s.status)).length;
        return stat('需关注',bad,bad?'自检没过或被风控隔离，点开看原因':'没有异常或被隔离的机器',
          bad?'alert':'ok');
      })()+
    '</div>'+
    '<div class="card"><div class="toolbar">'+
      (can('node.write')?'<button class="btn btn-primary btn-sm" id="svAdd">新增服务器</button>':'')+
      '<input class="input" id="svSearch" placeholder="搜索名称、地区、主机名或 IP">'+
      '<select class="input" id="svStatus"><option value="">全部状态</option>'+
        Object.entries(SV_ST).map(([k,x])=>'<option value="'+k+'">'+x[0]+'</option>').join('')+
      '</select><span class="badge badge-plain">共 '+list.length+' 台</span></div>'+
      (list.length?'<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr><th>服务器</th><th>状态</th><th>Agent / 心跳</th><th style="min-width:200px">负载</th><th>规格</th><th>承载</th><th>更新时间</th><th></th></tr></thead><tbody id="svRows">'+
        list.map(s=>serverRow(s)).join('')+'</tbody></table></div>':
        '<div class="empty"><h4>还没有服务器</h4><p>先创建宿主记录，再把逻辑节点明确归属到该服务器。</p></div>')+
    '</div>';
  const add=v.querySelector('#svAdd');if(add)add.onclick=()=>openServerEditor(null);
  const filter=()=>{
    const q=v.querySelector('#svSearch').value.trim().toLowerCase(), st=v.querySelector('#svStatus').value;
    v.querySelectorAll('#svRows tr').forEach(r=>{
      const s=list.find(x=>x.id===r.dataset.id), hay=[s.name,s.region,s.hostname,s.public_ipv4,s.public_ipv6].join(' ').toLowerCase();
      r.classList.toggle('hide',!!((q&&!hay.includes(q))||(st&&s.status!==st)));
    });
  };
  v.querySelector('#svSearch').oninput=filter;v.querySelector('#svStatus').onchange=filter;
  bindServerActions(v,list);
}

function serverRow(s){
  const ip=s.public_ipv4||s.public_ipv6||'未上报 IP';
  const capacity=Math.max(1,Number(s.capacity_nodes||32));
  const pct=Math.min(100,Math.round(Number(s.node_count||0)*100/capacity));
  return '<tr data-id="'+esc(s.id)+'"><td><b>'+esc(s.name)+'</b><div class="sub">'+
    esc([s.region,s.hostname,ip].filter(Boolean).join(' · '))+'</div></td><td>'+badge(SV_ST,s.status)+'</td>'+
    '<td><span class="dot '+(s.heartbeat_online?'on':'off')+'" style="display:inline-block;margin-right:7px"></span>'+
      esc(s.agent_version||'无 Agent')+'<div class="sub">'+(s.last_heartbeat_at?dt(s.last_heartbeat_at):'从未心跳')+'</div></td>'+
    '<td>'+serverLoadCell(s)+'</td>'+
    '<td>'+esc(serverResource(s))+'<div class="sub">'+esc([s.architecture,s.os_name].filter(Boolean).join(' · '))+'</div></td>'+
    '<td><b>'+Number(s.active_node_count||0)+' / '+Number(s.node_count||0)+'</b><div class="sub">容量 '+capacity+' · '+pct+'%</div></td>'+
    '<td>'+dt(s.updated_at)+'</td><td class="r" style="white-space:nowrap">'+
      // 主操作只留「详情」—— 接入命令、负载、承载的节点、改状态在详情页里
      // 一屏都有。原先五个按钮平铺、每个点开一个弹窗，看完一台机器要点
      // 三四次，还得自己记住看到哪儿了。
      '<button class="btn btn-sm btn-ghost" data-sv-detail>详情</button> '+
      (can('node.provision')?'<button class="btn btn-sm btn-ghost" data-sv-boot'+
        (s.agent_version?' title="这台已经接入过，重新签发用于重装"':'')+'>接入命令</button> ':'')+
      actMenu([
        '<button class="btn btn-sm btn-ghost" data-sv-nodes>承载的节点</button>',
        can('node.write')?'<button class="btn btn-sm btn-ghost" data-sv-edit>编辑</button>':'',
        can('node.lifecycle')?'<button class="btn btn-sm btn-ghost" data-sv-status>状态</button>':'',
        can('node.lifecycle')?'<button class="btn btn-sm btn-danger" data-sv-del'+((s.status!=='retired'||Number(s.active_node_count)>0)?' disabled title="'+(s.status!=='retired'?'先把服务器退役才能删除':'还有 '+s.active_node_count+' 个在服节点，先退役或迁走它们')+'"':'')+'>删除</button>':''
      ])+
    '</td></tr>';

function bindServerActions(v,list){
  v.querySelectorAll('#svRows tr').forEach(r=>{
    const s=list.find(x=>x.id===r.dataset.id);
    const detail=r.querySelector('[data-sv-detail]');if(detail)detail.onclick=()=>openServerDetail(s);
    const nodes=r.querySelector('[data-sv-nodes]');if(nodes)nodes.onclick=()=>openServerNodes(s);
    const boot=r.querySelector('[data-sv-boot]');if(boot)boot.onclick=()=>openServerBootstrap(s);
    const edit=r.querySelector('[data-sv-edit]');if(edit)edit.onclick=()=>openServerEditor(s);
    const status=r.querySelector('[data-sv-status]');if(status)status.onclick=()=>openServerStatus(s);
    const del=r.querySelector('[data-sv-del]');if(del)del.onclick=()=>deleteServer(s,del);
  });
}

// 新建时只问名字和备注。
//
// 主机名、IP、架构、操作系统这些，Agent 接入的第一秒就会上报——让人
// 先手抄一遍，既是白干，又给了抄错的机会：抄错的值会一直显示到 Agent
// 覆盖它为止，中间这段时间面板上写的是假的。
// 编辑时才展开这些字段，用于「机器还没接进来，但想先记一笔」。
function serverEditorBody(s){
  const val=k=>esc((s&&s[k])||'');
  const head=
    fld('服务器名称 *','<input class="input" id="svName" maxlength="120" value="'+val('name')+'" '+
      'placeholder="如 香港ready01" required>')+
    fld('地区','<input class="input" id="svRegion" maxlength="80" value="'+val('region')+'" '+
      'placeholder="如 HK / Tokyo，选填">')+
    fld('备注','<textarea class="input" id="svNotes" maxlength="2000" '+
      'style="height:76px;padding-top:10px" placeholder="关于此服务器的可选备注">'+val('notes')+'</textarea>');
  if(!s){
    // 新建时只问名字、地区、备注，外加一个启用开关。
    //
    // 第一次用的人最先卡住的不是「填什么」，而是「我到底要不要建这个」——
    // 服务器和节点在面板里是两层东西，标题下面那句话就是回答它。
    return '<p class="sub" style="margin:-4px 0 var(--sp-4)">'+
        '当你希望一台机器承载多个节点时，先建一条服务器记录，'+
        '再把节点挂到它上面。只有一个节点的话，直接去「节点」页新建即可。</p>'+
      head+
      // 这里刻意不放「建好后立即启用」开关。后端 CreateServerInput 没有
      // 这个字段，而 DecodeJSON 开了 DisallowUnknownFields —— 传上去
      // 直接 400，等于把新建功能打坏，换来一个装饰品。
      // 需要建好先不启用的话，列表里的「状态」按钮可以改。
      '<div class="notice" style="margin-top:var(--sp-3)">保存后会直接给你一条接入命令。'+
      '在机器上跑一遍，主机名、IP、架构、CPU/内存/磁盘都由 Agent 自己报上来，不用在这里填。</div>';
  }
  return head+
    '<div class="hint" style="margin:var(--sp-4) 0 var(--sp-2);font-weight:600;color:var(--fg-2)">'+
      '机器资产（Agent 接入后会自动覆盖，这里填的只是接入前的占位）</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:var(--sp-3)">'+
    fld('主机名','<input class="input" id="svHost" maxlength="255" value="'+val('hostname')+'">')+
    fld('公网 IPv4','<input class="input" id="svIPv4" value="'+val('public_ipv4')+'">')+
    fld('公网 IPv6','<input class="input" id="svIPv6" value="'+val('public_ipv6')+'">')+
    fld('内网 IPv4','<input class="input" id="svPrivate" value="'+val('private_ipv4')+'">')+
    fld('架构','<input class="input" id="svArch" maxlength="40" value="'+val('architecture')+'" placeholder="amd64 / arm64">')+
    fld('操作系统','<input class="input" id="svOS" maxlength="120" value="'+val('os_name')+'">')+
    fld('节点容量','<input class="input" id="svCapacity" type="number" min="1" max="10000" value="'+Number((s&&s.capacity_nodes)||32)+'">',
    '这台服务器最多能承载几个逻辑节点，只用于面板上的容量提示，不会真的限制。')+
    '</div>'+
    '<div class="hint">Agent 版本、心跳和实时 CPU/内存/磁盘只能由 Agent 上报，不能在后台伪造。</div>';
}

function serverPayload(m){
  // 新建表单里没有资产那几格，取不到就当空——不能直接 .value，
  // 那会在「新建」时抛 null 异常，表单卡住而且没有任何提示。
  const val=id=>{const el=m.querySelector('#'+id);return el?el.value.trim():''};
  const cap=m.querySelector('#svCapacity');
  return {name:val('svName'),region:val('svRegion'),
    hostname:val('svHost'),public_ipv4:val('svIPv4'),
    public_ipv6:val('svIPv6'),private_ipv4:val('svPrivate'),
    architecture:val('svArch'),os_name:val('svOS'),
    capacity_nodes:Number((cap&&cap.value)||32),notes:val('svNotes')};
}

function openServerEditor(s){
  const m=modal(s?'编辑服务器':'新增服务器',serverEditorBody(s),
    '<button class="btn btn-ghost" data-close>取消</button>'+
    // 按钮直说按下去会发生什么。新建之后紧接着弹接入命令，
    // 写「保存」会让人以为到此为止。
    '<button class="btn btn-primary" id="svSave">'+(s?'保存':'创建并取接入命令')+'</button>',true);
  m.querySelector('#svSave').onclick=async()=>{
    const b=m.querySelector('#svSave'),body=serverPayload(m);
    if(!body.name)return toast('请输入服务器名称','err');
    if(s)body.row_version=s.row_version;
    busy(b,true,'保存中');
    try{
      const r=await api(s?'/v1/servers/'+s.id:'/v1/servers',
        {method:s?'PATCH':'POST',body:JSON.stringify(body)});
      m.remove();
      if(s){toast('服务器已更新','ok');render();return}
      toast('服务器已创建','ok');
      // 新建完直接把接入命令递到手上。让人自己回列表、找到刚建的那台、
      // 再点一次「接入命令」，中间任何一步走神，机器就永远没接进来，
      // 而列表里多了一条空壳记录。
      const created=(r&&(r.server||r))||{};
      if(created.id)openServerBootstrap(created); else render();
    }
    catch(e){toast(e.status===409?'数据已变化，请刷新后重试':e.message,'err');}
    finally{busy(b,false)}
  };
}

// 一台服务器的接入命令。
//
// 令牌绑定这台服务器：机器接进来会挂到这条记录上，而不是另建一条。
// 这是「先建记录、后接机器」能对上号的关键——以前签发的令牌只认节点名，
// 同一台物理机在列表里出现两次就是这么来的。
// 一台服务器的详情页：接入命令、负载、关联节点、状态操作，一屏看完。
//
// 之前这些散在三个弹窗里 —— 想看命令点「接入命令」，想看节点点「节点」，
// 想改状态点「状态」，每次都要先回列表再点下一个。而这三件事恰恰是
// 对着同一台机器做的，中间还得自己记住它叫什么。
//
// 对着 xboard 的机器详情页做的：它把 machine 的 8 个接口（fetch /
// getToken / installCommand / nodes / history …）聚成一页，人打开就
// 什么都看见了。我们的数据本来就够，只是没聚起来。
//
// 一处不照抄：xboard 的安装命令是 GET，随时能看，因为它的机器 token
// 是长期的。我们签的是 20 分钟一次性引导令牌 —— 那个安全模型不倒退，
// 改的是交互：打开详情页就自动签一张摆在那儿，不用再点一次按钮。
// 管理员替用户换一条订阅链接。
//
// 换完旧链接立刻失效，用户的客户端要重新导入。这个后果必须写在确认框里
// ——不然客服会以为只是「刷新一下」，换完不通知用户，用户第二天发现
// 全部线路消失。
function openRotateSubscription(subId,email){
  const m=modal('换订阅链接 · '+esc(email),
    '<div class="danger-box"><ul>'+
      '<li><b>旧链接立刻失效</b>。用户当前所有客户端都会拉不到线路，'+
        '必须重新导入新链接。</li>'+
      '<li>适用于链接被分享出去、流量被盗用的情况。</li>'+
      '<li>新链接只显示这一次 —— 关掉窗口就再也取不出来。</li>'+
    '</ul></div>'+
    fld('原因','<input class="input" id="rsReason" maxlength="500" '+
      'placeholder="如：用户工单 #456 报告订阅被盗用">',
      '至少 5 个字，会写进审计日志。')+
    '<div id="rsOut"></div>',
    '<button class="btn" data-close>取消</button>'+
    '<button class="btn btn-danger" id="rsGo">换发新链接</button>');
  const go=m.querySelector('#rsGo');
  go.onclick=async()=>{
    const reason=m.querySelector('#rsReason').value.trim();
    if(reason.length<5)return toast('请写清原因，至少 5 个字','err');
    busy(go,true,'换发中');
    try{
      const r=await api('/v1/subscriptions/'+subId+'/rotate',
        {method:'POST',headers:{'Idempotency-Key':idemKey()},body:{reason:reason}});
      go.remove();
      m.querySelector('#rsOut').innerHTML=
        '<div class="sect">新的订阅令牌</div>'+
        '<div class="token-box"><code>'+esc(r.token)+'</code></div>'+
        '<div style="margin-top:var(--sp-2)">'+
          '<button class="btn btn-sm btn-primary" id="rsCopy">复制</button></div>'+
        '<p class="hint" style="margin-top:var(--sp-3)">现在就把它交给用户 —— '+
        '关掉这个窗口之后系统里也取不出来了。旧链接已经作废。</p>';
      const cp=m.querySelector('#rsCopy');
      if(cp)cp.onclick=async()=>{
        try{await navigator.clipboard.writeText(r.token);toast('已复制','ok')}
        catch(_){toast('复制失败，请手动选中','err')}
      };
    }catch(e){busy(go,false);toast(e.message,'err',7000)}
  };
}

// 管理员替用户重置密码。
//
// 用户忘了密码时唯一的出路：找回密码没有实现，改密码要填旧密码，而这台
// 机器 SMTP 出站被封、邮件发不出去。在自助重置做出来之前，这条路让客服
// 至少能把人救回来。
//
// 新密码不回显、不进日志——管理员是自己填的，本来就知道；写进响应体
// 就会顺着截图和浏览器历史流出去。
function openResetUserPassword(userId,email){
  const m=modal('重置密码 · '+esc(email),
    '<div class="danger-box"><ul>'+
      '<li>这个用户<b>当前所有登录会话会被立即踢下线</b>，包括手机和客户端。</li>'+
      '<li>操作会记进审计：谁改的、什么时候、为什么。</li>'+
      '<li>新密码只显示在你这里，系统不会发给用户——改完请自己告诉他。</li>'+
    '</ul></div>'+
    fld('新密码',
      '<input class="input" type="text" id="rpNew" autocomplete="off" '+
      'placeholder="至少 8 位">',
      '故意用明文框而不是密码框：你需要看清楚再转告用户。')+
    fld('原因',
      '<input class="input" id="rpReason" maxlength="500" '+
      'placeholder="如：用户工单 #123 报告无法登录">',
      '至少 5 个字，会写进审计日志。')+
    '<div id="rpErr" class="hint" style="display:none;color:var(--err)"></div>',
    '<button class="btn" data-close>取消</button>'+
    '<button class="btn btn-danger" id="rpGo">重置并踢下线</button>');
  const err=m.querySelector('#rpErr');
  const go=m.querySelector('#rpGo');
  go.onclick=async()=>{
    const pw=m.querySelector('#rpNew').value;
    const reason=m.querySelector('#rpReason').value.trim();
    err.style.display='none';
    if(pw.length<8)return toast('密码至少 8 位','err');
    if(reason.length<5)return toast('请写清原因，至少 5 个字','err');
    busy(go,true,'重置中');
    try{
      await api('/v1/users/'+userId+'/reset-password',
        {method:'POST',headers:{'Idempotency-Key':idemKey()},
         body:{new_password:pw,reason:reason}});
      m.remove();
      toast('密码已重置，该用户的登录会话已全部失效。请把新密码告诉他','ok',9000);
    }catch(e){
      busy(go,false);
      err.textContent=e.message;err.style.display='';
    }
  };
}

async function openServerDetail(s){
  const m=modal(esc(s.name),'<div id="svdBody"></div>',
    '<button class="btn" data-close>关闭</button>',true);
  const close=()=>{m.remove();render()};
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);

  const st=SV_ST[s.status]||[s.status,'plain'];
  const load=serverLoad(s);
  const beat=s.last_heartbeat_at?dt(s.last_heartbeat_at):'从未心跳';
  const ip=s.public_ipv4||s.public_ipv6||'未上报 IP';

  m.querySelector('#svdBody').innerHTML=
    // ── 概况 ──
    '<div class="stats" style="margin-bottom:var(--sp-4)">'+
      stat('状态','<span class="badge badge-'+st[1]+'">'+st[0]+'</span>',
        (ND_LIFECYCLE[s.status]||''))+
      stat('Agent',s.agent_version?esc(s.agent_version):'未接入',
        s.agent_version?('最后心跳 '+beat):'装上 Agent 才能下发配置和收流量',
        s.agent_version?(s.stale?'warn':'ok'):'warn')+
      stat('承载节点',Number(s.node_count||0),
        Number(s.active_node_count||0)+' 个正在给用户用')+
    '</div>'+
    // ── 机器信息 ──
    '<div class="sect">机器</div>'+
    '<div class="kv">'+
      kvRow('地址',esc(ip))+
      kvRow('主机名',esc(s.hostname||'—'))+
      kvRow('规格',(s.cpu_cores?s.cpu_cores+' 核':'—')+
        (s.memory_mb?' / '+(s.memory_mb/1024).toFixed(1)+' GB 内存':'')+
        (s.disk_gb?' / '+s.disk_gb+' GB 磁盘':''))+
      kvRow('系统',esc([s.architecture,s.os_name].filter(Boolean).join(' · ')||'尚未上报'))+
    '</div>'+
    (load.peak==null?'':
      '<div class="sect">当前负载</div><div style="max-width:520px">'+
      loadBar('CPU',load.cpu,'')+
      loadBar('内存',load.mem,s.mem_used_mb!=null?
        (s.mem_used_mb/1024).toFixed(1)+' / '+(s.mem_total_mb/1024).toFixed(1)+' GB':'')+
      loadBar('磁盘',load.disk,s.disk_used_gb!=null?
        s.disk_used_gb+' / '+s.disk_total_gb+' GB':'')+
      '</div>')+
    // ── 接入命令（打开就签，不用再点一次）──
    '<div class="sect">接入命令</div><div id="svdCmd" class="hint">正在签发令牌…</div>'+
    // ── 关联节点 ──
    '<div class="sect">承载的节点</div><div id="svdNodes" class="hint">载入中…</div>'+
    // ── 操作 ──
    '<div class="sect">操作</div><div id="svdOps" style="display:flex;gap:var(--sp-2);flex-wrap:wrap"></div>';

  // 操作按钮：改状态、编辑资料、删除，就地做完，不用退回列表
  const ops=m.querySelector('#svdOps');
  ops.innerHTML=
    (can('node.write')?'<button class="btn btn-sm" id="svdEdit">编辑资料</button>':'')+
    (can('node.lifecycle')?'<button class="btn btn-sm" id="svdStatus">修改状态</button>':'')+
    (can('node.provision')?'<button class="btn btn-sm" id="svdRenew">重新签发接入命令</button>':'');
  const bind=(id,fn)=>{const b=m.querySelector('#'+id);if(b)b.onclick=fn};
  bind('svdEdit',()=>{m.remove();openServerEditor(s)});
  bind('svdStatus',()=>{m.remove();openServerStatus(s)});

  // 关联节点
  (async()=>{
    try{
      const r=await api('/v1/servers/'+s.id+'/nodes');
      const list=r.nodes||[];
      m.querySelector('#svdNodes').outerHTML=list.length
        ? '<div id="svdNodes" class="tbl-wrap"><table class="tbl"><thead><tr>'+
          '<th>节点</th><th>服务状态</th><th>协议</th><th>入口</th></tr></thead><tbody>'+
          list.map(n=>'<tr><td><b>'+esc(n.display_name||n.name)+'</b></td>'+
            '<td>'+badge(ND_SERVING,n.serving_status)+'</td>'+
            '<td>'+esc(n.node_type||'未配置')+'</td>'+
            '<td class="mono">'+esc(n.server_host||'—')+
              (n.server_port?':'+n.server_port:'')+'</td></tr>').join('')+
          '</tbody></table></div>'
        : '<div id="svdNodes" class="hint">这台机器上还没有节点。'+
          '接入之后到「节点」页新建，选这台服务器承载即可。</div>';
    }catch(e){
      m.querySelector('#svdNodes').textContent='节点列表载入失败：'+e.message;
    }
  })();

  // 接入命令
  const issue=async()=>{
    const box=m.querySelector('#svdCmd');
    if(!box)return;
    box.className='hint'; box.textContent='正在签发令牌…';
    try{
      const r=await api('/v1/servers/'+s.id+'/bootstrap-token',
        {method:'POST',headers:{'Idempotency-Key':idemKey()},
         body:{ttl_minutes:20}});
      // 命令由服务端拼。内核换代时命令形态会变，前端硬编码的话页面、
      // 文档、部署脚本要各改一遍，漏掉哪个就有人照着过时的命令装。
      if(!r.install_command)throw new Error('服务端未返回安装命令');
      box.className='';
      box.innerHTML=
        '<p class="hint" style="margin:0 0 var(--sp-2)">在这台机器上执行。'+
        '令牌 20 分钟内有效、只能用一次。</p>'+
        '<div class="token-box" style="background:var(--surface-2);'+
          'border-style:solid;border-color:var(--line)">'+
          '<code>'+esc(r.install_command)+'</code></div>'+
        '<div style="margin-top:var(--sp-2)">'+
          '<button class="btn btn-sm btn-primary" id="svdCopy">复制命令</button></div>';
      const cp=m.querySelector('#svdCopy');
      if(cp)cp.onclick=async()=>{
        try{await navigator.clipboard.writeText(r.install_command);toast('已复制','ok')}
        catch(_){toast('复制失败，请手动选中','err')}
      };
    }catch(e){
      box.className='';
      box.innerHTML='<div class="notice err">签发失败：'+esc(e.message)+'</div>';
    }
  };
  bind('svdRenew',issue);
  issue();
}

// 键值行。详情页里大量「标签 + 值」的排布，写死在各处会散成一片。

async function openServerBootstrap(s){
  const m=modal('接入命令 · '+esc(s.name),'<div id="svBsBody">正在签发令牌…</div>',
    '<button class="btn btn-primary" data-close>完成</button>',true);
  const close=()=>{m.remove();render()};
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  try{
    const r=await api('/v1/servers/'+s.id+'/bootstrap-token',
      {method:'POST',body:JSON.stringify({ttl_minutes:20})});
    // 命令由服务端拼。内核换代时命令形态会变，前端硬编码的话页面、
    // 文档、部署脚本要各改一遍，漏掉哪个就有人照着过时的命令装。
    if(!r.install_command) throw new Error('服务端未返回安装命令，已拒绝使用当前页面地址降级拼接');
    const cmd=r.install_command;
    m.querySelector('#svBsBody').innerHTML=
      '<div class="notice warn">令牌 20 分钟内有效，只能用一次，关掉这个窗口就再也看不到了。'+
      '过期了在服务器列表点「接入命令」重新签一张。</div>'+
      '<p class="hint" style="margin:var(--sp-4) 0 var(--sp-2)">在这台机器上执行：</p>'+
      '<div class="token-box" style="background:var(--surface-2);border-style:solid;'+
        'border-color:var(--line)"><code id="svBsCmd">'+esc(cmd)+'</code></div>'+
      '<div style="margin-top:var(--sp-3)"><button class="btn btn-sm" id="svBsCopy">复制命令</button></div>'+
      '<p class="hint" style="margin-top:var(--sp-4)">接入后主机名、IP、架构、CPU/内存/磁盘'+
      '会自动填到这台服务器上。</p>';
    const cp=m.querySelector('#svBsCopy');
    cp.onclick=async()=>{
      try{await navigator.clipboard.writeText(cmd);toast('已复制','ok')}
      catch(_){toast('复制失败，请手动选中','err')}
    };
  }catch(e){
    m.querySelector('#svBsBody').innerHTML=
      '<div class="notice err">签发失败：'+esc(e.message)+'</div>';
  }
}

function openServerStatus(s){
  const allowed={draft:['ready','maintenance','retired'],ready:['draining','unhealthy','quarantined'],
    draining:['ready','maintenance','retired'],maintenance:['ready','retired'],
    unhealthy:['draining','maintenance','quarantined','retired'],quarantined:['draining','maintenance','retired'],retired:[]};
  const options=(allowed[s.status]||[]);
  const m=modal('变更服务器状态',
    '<p class="muted" style="margin-top:0">'+esc(s.name)+' · 当前 '+esc((SV_ST[s.status]||[s.status])[0])+'</p>'+
    (options.length?fld('目标状态','<select class="input" id="svNext">'+options.map(k=>'<option value="'+k+'">'+SV_ST[k][0]+'</option>').join('')+'</select>',
    '改的是这台机器的生命周期，不是用户能不能用。要停止对用户下发请改「服务状态」。')+
      fld('原因','<input class="input" id="svReason" maxlength="500" placeholder="记录维护、排空或隔离原因">'):
      '<div class="empty"><p>已退役服务器没有后续状态。</p></div>'),
    '<button class="btn btn-ghost" data-close>取消</button>'+(options.length?'<button class="btn btn-primary" id="svStateSave">确认变更</button>':''));
  const save=m.querySelector('#svStateSave');if(!save)return;
  save.onclick=async()=>{busy(save,true,'提交中');try{
    await api('/v1/servers/'+s.id+'/status',{method:'POST',body:JSON.stringify({status:m.querySelector('#svNext').value,
      reason:m.querySelector('#svReason').value.trim(),row_version:s.row_version})});
    toast('服务器状态已更新','ok');m.remove();render();
  }catch(e){toast(e.message,'err')}finally{busy(save,false)}};
}

async function deleteServer(s,btn){
  if(!await askDanger({
    title:'删除服务器 '+esc(s.name),
    what:'把这台服务器的记录从面板里移除。',
    consequences:[
      '这只是删面板里的记录，<b>机器本身和上面跑的程序不会被动</b>，要停服务得自己上去关。',
      '历史流量统计和审计日志会保留，不受影响。',
      '删除后无法在界面上恢复；同一台机器要重新用时得走一遍接入流程。'],
    confirmText:'删除记录'}))return;
  busy(btn,true,'删除中');
  try{await api('/v1/servers/'+s.id,{method:'DELETE',body:JSON.stringify({row_version:s.row_version})});
    toast('服务器已删除','ok');render();
  }catch(e){
    const dep=e.fields||{}, details=Object.entries(dep).map(([k,x])=>k+'='+x).join('，');
    toast(e.message+(details?'（'+details+'）':''),'err',5000);
  }finally{busy(btn,false)}
}

  window.__nodeRows=list;

  // 每个都有节点，而选中一个空的只会得到一张空表。
  const typeOptions=[...new Set(list.map(n=>n.node_type).filter(Boolean))].sort();

// 在线：订阅数为主，IP 数只在两者不同时补一行。
// 相等时再写一遍 IP 数只是噪声；不等就意味着有人多设备或共享账号。
function nodeOnlineCell(n){
  const u=Number(n.online_users||0), ip=Number(n.online_ips||0);
  if(!u&&!ip)return '<span class="sub">0</span>';
  return '<b>'+u+'</b>'+(ip!==u?'<div class="sub">'+ip+' IP</div>':'');
}

// 倍率 1.00 是默认值，不高亮；偏离默认的才值得一眼看到——
// 那通常是刻意设的优惠或惩罚，配错了会直接影响计费。
function nodeRateCell(n){
  // 不能写 traffic_rate||1：倍率 0 是「这个节点不计流量」，是有意设的
  // 免费节点，被 || 吃成 1.00x 之后页面显示的和实际计费完全相反。
  const r=n.traffic_rate==null?1:Number(n.traffic_rate);
  const txt=r.toFixed(2)+'x';
  if(Math.abs(r-1)<0.005)return '<span class="sub">'+txt+'</span>';
  return '<span class="badge badge-'+(r>1?'warn':'ok')+'">'+txt+'</span>';
}

// 授权套餐。没绑套餐 = 这个节点谁都用不上，是个需要处理的状态，
// 不是「暂无数据」，所以标黄而不是打个横杠。
// nodeGrantsCell 列出能用到这个节点的套餐，一个套餐一个徽章。
//
// 顿号拼接的纯文本在套餐名带「·」或「-」时读不出边界，而这一列的用途
// 就是扫一眼确认「这个节点是不是发给了不该发的人」，边界必须清楚。
// toggleNodeVisibility 一键让节点对用户可见 / 不可见。
//
// 底下就是把 serving_status 在 active 和 disabled 之间切，但界面不该逼人
// 先学会这套状态机。对运营来说这只有一个含义：现在还发不发给用户。
//
// 关掉要确认，开启不用：关掉会立刻把正在连的用户踢下来，是有代价的动作；
// 开启最坏也就是多一条线路，代价可以忽略。给对称的两个方向配对称的阻力
// 是错的——那只会训练人闭眼点确认。
//
// 失败时把开关拨回去。不拨回来，界面显示的是「已开」而服务器上是「关着」，
// 下次刷新才会露馅，中间这段时间人会以为自己已经处理完了。
async function toggleNodeVisibility(n, sw){
  const turnOn = sw.checked;
  if(!turnOn){
    const ok = await askDanger({
      title:'停用节点 '+Number(n.node_no||0),
      what:'把「'+(n.display_name||n.name)+'」从用户的订阅里撤下来。',
      consequences:[
        '正在用这个节点的用户会被断开，需要重新拉订阅才能换到别的线路。',
        n.online_users>0?('现在有 '+n.online_users+' 个订阅在线上，都会受影响。')
                        :'当前没有在线用户，影响面很小。',
        '节点本身和它的协议配置都保留，随时可以开回来。'],
      confirmText:'停用'});
    if(!ok){ sw.checked = true; return; }
  }
  sw.disabled = true;
  try{
    await api('/v1/nodes/'+n.id+'/status',{method:'POST',body:JSON.stringify({
      row_version:n.row_version,
      status: turnOn?'active':'disabled',
      reason: turnOn?'后台开启显隐':'后台关闭显隐'})});
    toast(turnOn?'已启用，用户下次拉订阅就能拿到':'已停用，不再下发给用户','ok',3000);
    render();
  }catch(e){
    sw.checked = !turnOn;
    sw.disabled = false;
    toast(e.status===409?'这个节点刚被别人改过，正在重新载入':nodeError(e),'err',7000);
    if(e.status===409)render();
  }
}

function nodeGrantsCell(n){

    '<div class="sub">分组是「'+esc(n.pool_name||'—')+'」，但没有套餐用这个分组</div>';
  return g.slice(0,3).map(x=>'<span class="badge badge-plain">'+esc(x)+'</span>').join(' ')+
    (g.length>3?' <span class="sub">等 '+g.length+' 个</span>':'');
}

// 面板存 mkcp，从客户端配置抄来的写法是 kcp，两种都要能对上归属表
function ndNormalizeNetwork(v){
  const n=String(v||'tcp').toLowerCase().trim();
  return (n==='kcp'||n==='m-kcp')?'mkcp':n;
}
function ndFieldAppliesTo(key,network){
  const only=ND_FIELD_NETWORKS[key];
  if(!only)return true;
  return only.indexOf(ndNormalizeNetwork(network))>=0;
}

// 协议字段名现在用 xboard 那套，其中一部分是嵌套路径
// （network_settings.headers.Host、bandwidth.up）。表单内部一律按点号
// 路径定位，读写各用一个辅助函数把路径和对象对上。
//
// 不在表单里用扁平键再到提交时转换：那样「界面上的字段」和「发出去的
// JSON」就是两套名字，出错时对不上，而协议配置出错的表现往往只是连不上。
function protoGet(obj,path){
  let cur=obj;
  for(const seg of String(path).split('.')){
    if(cur==null||typeof cur!=='object')return undefined;
    cur=cur[seg];
  }
  return cur;
}
function protoSet(obj,path,value){
  const segs=String(path).split('.');
  let cur=obj;
  for(let i=0;i<segs.length-1;i++){
    const seg=segs[i];
    if(cur[seg]==null||typeof cur[seg]!=='object'||Array.isArray(cur[seg]))cur[seg]={};
    cur=cur[seg];
  }
  cur[segs[segs.length-1]]=value;
}

function protocolConfigFieldsHTML(schema,config,network){
  if(!schema)return '<div class="lock-note" style="grid-column:1/-1"><span>这是迁移前的只读配置。请选择一个稳定协议后，才能按新版 Schema 填写并保存。</span></div>';
  const cfg=(config&&typeof config==='object'&&!Array.isArray(config))?config:{};
  const required=new Set(schema.required||[]), sensitive=new Set(schema.sensitive_properties||[]);
  const enums=schema.enums||{};
  const currentNetwork=network!=null?network:(cfg.network||'tcp');
  const fields=(schema.allowed_properties||[])
    .filter(k=>!ND_REALITY_KEYS.has(k))
    .filter(k=>ndFieldAppliesTo(k,currentNetwork))
    .map(key=>{
    const label=esc(ND_PROTOCOL_FIELD_LABELS[key]||key)+(required.has(key)?' *':'');
    const propertyType=(schema.property_types||{})[key]||'string';
    if(key==='tls'&&propertyType!=='boolean'){
      return '<div class="field"><label>'+label+'</label><label class="proto-check">'+
        '<input type="checkbox" data-proto-field="'+esc(key)+'" data-proto-kind="boolean" disabled> 暂不可开启</label>'+
        '<span class="hint">证书签发、轮换与回滚闭环完成后再开放，当前稳定模式固定为 TLS 关闭。</span></div>';
    }
    if(propertyType==='json'||propertyType==='json-secret'){
      const raw=protoGet(cfg,key);
      const value=raw==null?'':JSON.stringify(raw,null,2);
      return fld(label,'<textarea class="input mono proto-json" rows="3" data-proto-field="'+esc(key)+'" data-proto-kind="json" placeholder="{}">'+esc(value)+'</textarea>',
        propertyType==='json-secret'?'请输入 JSON 对象；敏感子字段不会从后台回显，编辑已有混淆配置时请重新填写 password。':'请输入 JSON 对象；保存前会校验格式，范围字段使用 {"from":数值,"to":数值}。');
    }
    if(propertyType==='number'){
      const raw=protoGet(cfg,key);
      const value=raw==null?'':String(raw);
      return fld(label,'<input class="input mono" type="number" step="1" data-proto-field="'+esc(key)+'" data-proto-kind="number" value="'+esc(value)+'">',
        '请输入整数。');
    }
    if(propertyType==='boolean'){
      return '<div class="field"><label>'+label+'</label><label class="proto-check"><input type="checkbox" data-proto-field="'+esc(key)+'" data-proto-kind="boolean"'+(protoGet(cfg,key)===true?' checked':'')+'> 启用</label></div>';
    }
    const values=(key==='method'||key==='cipher')?(schema.methods||[]):(enums[key]||[]);
    if(values.length){
      const rawEnum=protoGet(cfg,key);
      const value=rawEnum==null?'':String(rawEnum);
      return fld(label,'<select class="input" data-proto-field="'+esc(key)+'" data-proto-kind="string">'+
        (required.has(key)?'':'<option value="">默认（不设置）</option>')+
        values.map(x=>'<option value="'+esc(x)+'"'+(value===String(x)?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>');
    }
    if(sensitive.has(key)){
      const stored=protoGet(cfg,key);
      const hasStored=typeof stored==='string'&&stored!==''&&!/^\*+$/.test(stored)&&stored!=='[redacted]';
      return fld(label,'<div class="pw-wrap"><input class="input" type="password" autocomplete="new-password" maxlength="128" data-proto-field="'+esc(key)+'" data-proto-kind="secret" data-proto-stored="'+(hasStored?'1':'0')+'" placeholder="'+(hasStored?'已设置；留空保留原值':'输入 8–128 个字符')+'">'+
        '<button class="pw-toggle proto-pw-toggle" type="button" aria-label="显示'+label+'" aria-pressed="false">'+
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>',
        hasStored?'为避免泄露，现有值不会显示；留空时保持不变。':'敏感值只在此输入框中临时显示，不会在页面回显已有值。');
    }
    const plain=protoGet(cfg,key);
    const value=plain==null?'':String(plain);
    const placeholder=key==='server_name'?'例如 edge.example.com':'';
    return fld(label,'<input class="input" data-proto-field="'+esc(key)+'" data-proto-kind="string" maxlength="253" value="'+esc(value)+'" placeholder="'+placeholder+'">');
  }).join('');
  return '<div class="proto-grid">'+(fields||'<div class="proto-note">该协议当前没有额外参数。</div>')+
    '<div class="proto-note">表单字段由服务端稳定 Schema 生成；切换协议会清空不兼容参数。</div></div>';
}

// 切换传输时重新渲染，只留下这种传输用得上的字段。
//
// 不过滤的话表单会一次性堆出三十多个输入框，其中大半和当前传输无关；
// 更糟的是后端会拒绝它们（「mtu 只在 network=mkcp 时有效」），于是
// 表单里能填、一保存就报错。
//
// 重渲染前先把已填的值收回来，否则管理员切一下传输，刚填的东西全没了。
function bindProtocolNetworkSwitch(root,schema,config){
  const select=[...root.querySelectorAll('[data-proto-field]')]
    .find(x=>x.dataset.protoField==='network');
  if(!select)return;
  select.onchange=()=>{
    const kept=Object.assign({},config||{});
    root.querySelectorAll('[data-proto-field]').forEach(input=>{
      const key=input.dataset.protoField;
      if(input.dataset.protoKind==='boolean'){kept[key]=input.checked;return}
      if(input.value!=='')kept[key]=input.value;
    });
    kept.network=select.value;
    renderProtocolConfigFields(root,schema,kept,select.value);
  };
}
function readProtocolConfigFields(root,schema,existingConfig,preserveStoredSecrets){
  if(!schema)throw new Error('请选择可写的稳定协议');
  const out={},required=new Set(schema.required||[]),sensitive=new Set(schema.sensitive_properties||[]);
  const old=(existingConfig&&typeof existingConfig==='object'&&!Array.isArray(existingConfig))?existingConfig:{};
  (schema.allowed_properties||[]).filter(k=>!ND_REALITY_KEYS.has(k)).forEach(key=>{
    const input=[...root.querySelectorAll('[data-proto-field]')].find(x=>x.dataset.protoField===key);
    // 当前传输用不上的字段不在表单里，也就不该被提交——把上一种传输
    // 残留的值一起发上去，后端会以「这个字段只在 network=X 时有效」拒掉。
    if(!input)return;
    if(input.dataset.protoKind==='boolean'){protoSet(out,key,input.checked);return}
    const value=input.value;
    if(input.dataset.protoKind==='json'){
      if(value.trim()!==''){
        try{protoSet(out,key,JSON.parse(value))}catch(e){throw new Error((ND_PROTOCOL_FIELD_LABELS[key]||key)+' 必须是合法 JSON')}
      }
      return;
    }
    if(input.dataset.protoKind==='number'){
      if(value.trim()!==''){
        const number=Number(value);
        if(!Number.isSafeInteger(number))throw new Error((ND_PROTOCOL_FIELD_LABELS[key]||key)+' 必须是整数');
        protoSet(out,key,number);
      }
      return;
    }
    if(value!==''){protoSet(out,key,value);return}
    const kept=protoGet(old,key);
    if(sensitive.has(key)&&preserveStoredSecrets&&input.dataset.protoStored==='1'&&typeof kept==='string'){
      protoSet(out,key,kept);return;
    }
    if(required.has(key))throw new Error((ND_PROTOCOL_FIELD_LABELS[key]||key)+'不能为空');
  });
  return out;
}

// realityPanelHTML 渲染 REALITY 配置块。

        '借用站点必须是真实在线、支持 TLS 1.3 与 HTTP/2、并且和这台机器' +
        '同地区的站点 —— 探测者会比较延迟。SNI 域名要和它的证书对得上，' +
        '否则握手一开始就穿帮。' +
      '</div>' +
      '<div class="grid2">' +
        fld('借用站点 *', '<input class="input mono" id="rlDest" value="' +
            esc(rs.dest||'') + '" placeholder="www.apple.com:443">',
            '要带端口。填域名，不能填 IP。') +
        fld('SNI 域名 *', '<input class="input mono" id="rlNames" value="' +
            esc(arr(rs.server_name)) + '" placeholder="www.apple.com">',
            '多个用逗号分隔。发给客户端的是第一个。') +
      '</div>' +
      '<div class="grid2">' +
        fld('客户端指纹', '<select class="input" id="rlFp">' +
            ['chrome','firefox','safari','ios','edge','random'].map(x =>
              '<option value="' + x + '"' +
              (((cfg&&cfg.utls)||'chrome')===x ? ' selected' : '') +
              '>' + x + '</option>').join('') + '</select>',
            '决定客户端伪装成哪种浏览器。不确定就用 chrome。') +
        fld('流控', '<select class="input" id="rlFlow">' +
            [['','不启用'],['xtls-rprx-vision','xtls-rprx-vision']].map(([v,t]) =>
              '<option value="' + v + '"' +
              ((cfg&&cfg.flow||'')===v ? ' selected' : '') +
              '>' + t + '</option>').join('') + '</select>',
            'vision 能降低被流量特征识别的概率，客户端要支持。') +
      '</div>' +
      '<div class="grid2">' +
        fld('Short ID', '<input class="input mono" id="rlSids" value="' +
            esc(arr(rs.short_id)) + '" placeholder="b5301d06">',
            '不超过 16 位十六进制，多个用逗号分隔。') +

            esc(rs.public_key||'') + '">',

          '只在保存时提交一次，之后任何界面都不会回显。') +
