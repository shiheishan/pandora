// bindRealityPanel 挂上开关与「生成」按钮。
function bindRealityPanel(root){
  const on = root.querySelector('#rlOn');
  if (!on) return;
  const box = root.querySelector('#rlBox');
  on.onchange = () => box.classList.toggle('hide', !on.checked);
  root.querySelector('#rlGen').onclick = async ev => {
    busy(ev.currentTarget, true, '生成中');
    try{
      const k = await api('/v1/nodes/reality-keypair', {method:'POST'});
      root.querySelector('#rlPriv').value = k.private_key;
      root.querySelector('#rlPub').value  = k.public_key;
      if (!root.querySelector('#rlSids').value.trim()){
        root.querySelector('#rlSids').value = k.short_id;
      }
      // 私钥这一刻在输入框里是明文可见的，但保存后就再也取不回来。
      // 换密钥意味着所有已经拿到订阅的客户端都要重新拉一次，
      // 这句提醒比事后收一堆「突然连不上」的工单便宜。
      root.querySelector('#rlGenNote').innerHTML =
        '<span style="color:var(--warn)">已生成。保存后私钥不再显示；' +
        '如果这是给已在用的节点换密钥，老客户端要重新拉订阅才能连上。</span>';
    }catch(e){ toast(e.message, 'err', 7000); }
    finally{ busy(ev.currentTarget, false); }
  };
}

// readRealityConfig 从面板读出配置，合并进 protocol_config。
function readRealityConfig(root, out, existing, isEdit, schema){
  const on = root.querySelector('#rlOn');
  if (!on) return out;
  if (!on.checked){
    // 关掉时把 REALITY 相关键一并去掉，而不是留一堆孤儿字段 ——
    // 后端的严格解码会因为它们和 tls=0 不自洽而报错。
    delete out.reality_settings;
    delete out.flow;
    // tls 三态：vless/vmess 用 0 表示不加密；Trojan 必须保持 TLS，
    // 因此退回普通 TLS 的 1。后端仍会要求 Trojan 的证书路径完整。
    out.tls = schema && schema.node_type === 'trojan' ? 1 : 0;
    return out;
  }
  const list = v => v.split(/[,，s]+/).map(x => x.trim()).filter(Boolean);
  // xboard 用 tls=2 表达 REALITY，没有单独的 security 字段。
  out.tls = 2;
  const first = arr => arr.length ? arr[0] : '';
  // xboard 的 server_name / short_id 是单个字符串，界面上仍然允许填多个
  // （逗号分隔），提交时取第一个——发给客户端的本来也只有第一个。
  const rs = {
    dest: root.querySelector('#rlDest').value.trim(),
    server_name: first(list(root.querySelector('#rlNames').value)),
    short_id: first(list(root.querySelector('#rlSids').value)),
    public_key: root.querySelector('#rlPub').value.trim(),
  };
  out.utls = root.querySelector('#rlFp').value;
  const flow = root.querySelector('#rlFlow').value;
  if (flow) out.flow = flow;

  const existingRS = (existing && existing.reality_settings) || {};
  const priv = root.querySelector('#rlPriv').value.trim();
  if (priv) rs.private_key = priv;
  else if (isEdit && typeof existingRS.private_key === 'string' && existingRS.private_key){
    rs.private_key = existingRS.private_key;
  } else {
    // 私钥读接口不回显，所以编辑一个已有节点时这里永远拿不到旧值。
    // 只能要求重新生成 —— 说清楚原因，否则「我没改密钥啊」会很困惑。
    throw new Error('私钥不会回显，请点「生成一对新密钥」。' +
      '换了密钥之后，已在用的客户端需要重新拉一次订阅。');
  }
  out.reality_settings = rs;
  return out;
}

    }catch(e){return toast(e.message,'err',9000)}
    // 开了 REALITY 就固定到 NativeCore，避免兼容内核改变数据面特征。
    // XBoard 形状用 tls=2 表达 REALITY；旧存量仍可能带 security=reality。
    if(Number(protocolConfig.tls)===2||protocolConfig.security==='reality')m.querySelector('#neKernel').value='pandora-native';
    const payload={name:m.querySelector('#neName').value.trim(),pool_id:m.querySelector('#nePool').value,display_name:m.querySelector('#neDisplay').value.trim(),node_type:neType.value,server_host:m.querySelector('#neHost').value.trim(),server_port:Number(m.querySelector('#nePort').value),kernel:m.querySelector('#neKernel').value,traffic_rate:Number(m.querySelector('#neRate').value),protocol_config:protocolConfig};
    if(n)payload.row_version=n.row_version;else{payload.server_id=m.querySelector('#neServer').value;payload.sort_order=Number(m.querySelector('#neSort').value||0)}
    busy(b,true,'保存中');try{await api(n?'/v1/nodes/'+n.id:'/v1/nodes',{method:n?'PATCH':'POST',headers:n?{}:{'Idempotency-Key':idemKey()},body:JSON.stringify(payload)});m.remove();toast(n?'节点已更新':'逻辑节点已创建','ok');render()}catch(e){toast(nodeError(e),'err',7000)}finally{busy(b,false)}
  };
}

// 要求手打节点名而不是点一下「确定」：这个动作会连带删掉该节点全部的
// 指标与流量上报（外键是 CASCADE），撤不回来。让手指慢一步。
function deleteAdminNode(n){

      '这会一并删掉这个节点的<b>全部指标、流量上报、路由与出站配置</b>，' +
      '并且撤不回来。<br>' +
      '用量统计和相关工单会保留，只是不再指向这个节点。' +
    '</div>' +
    fld('请输入节点名称以确认',
        '<input class="input mono" id="ndDelName" autocomplete="off" placeholder="' +

// 出站与分流的编辑器。
//
// 出站的 settings 与规则的 matcher 用 JSON 文本框而不是逐字段表单：
// 这两处的可用字段随协议和内核而变（sing-box 的 domain_suffix、
// xray 的 geosite…），做成固定表单反而限制住了能配的东西。
// 平台本来就不解释这些字段，原样下发给节点端。
async function initRouting(m, nodeId){
  const box = m.querySelector('#ndRouting');
  let data;
  try{ data = await api('/v1/nodes/'+nodeId+'/routing'); }
  catch(e){ box.innerHTML = '<div class="muted">读取失败：'+esc(e.message)+'</div>'; return; }

  let obs = data.outbounds || [], rts = data.routes || [];

  function obTagOptions(sel){
    // direct / block 是内建出站，任何时候都可选
    const tags = ['direct','block'].concat(obs.map(o=>o.tag).filter(Boolean));
    return [...new Set(tags)].map(t =>
      '<option'+(sel===t?' selected':'')+'>'+esc(t)+'</option>').join('');
  }

  const obRow = (o,i) =>
    '<div class="rt-row" data-ob="'+i+'">'+
      '<input class="input" data-f="tag" placeholder="标识" style="max-width:130px" '+
        'value="'+esc(o.tag||'')+'">'+
      '<select class="input" data-f="type" style="max-width:140px">'+
        ND_OB_TYPES.map(t=>'<option'+(o.type===t?' selected':'')+'>'+t+'</option>').join('')+
      '</select>'+
      '<textarea class="input mono" data-f="settings" rows="1" spellcheck="false" '+
        'placeholder="{}">'+esc(JSON.stringify(o.settings||{}))+'</textarea>'+
      '<button class="btn btn-ghost btn-sm" data-del-ob="'+i+'">删除</button>'+
    '</div>';

  const rtRow = (x,i) =>
    '<div class="rt-row" data-rt="'+i+'">'+
      '<textarea class="input mono" data-f="matcher" rows="1" spellcheck="false" '+
        'placeholder="留空=兜底；例 {&quot;domain_suffix&quot;:[&quot;netflix.com&quot;]}">'+
        esc(JSON.stringify(x.matcher||{}))+'</textarea>'+
      '<select class="input" data-f="outbound_tag" style="max-width:140px">'+
        obTagOptions(x.outbound_tag)+'</select>'+
      '<label class="muted" style="font-size:var(--fs-xs);white-space:nowrap">'+
        '<input type="checkbox" data-f="enabled"'+(x.enabled!==false?' checked':'')+'> 启用</label>'+
      '<button class="btn btn-ghost btn-sm" data-del-rt="'+i+'">删除</button>'+
    '</div>';

  // 每次重绘前把界面上的值收回内存，否则加一行会把已填的内容抹掉
  function collect(){
    box.querySelectorAll('[data-ob]').forEach(row=>{
      const i = +row.dataset.ob;
      obs[i].tag  = row.querySelector('[data-f=tag]').value.trim();
      obs[i].type = row.querySelector('[data-f=type]').value;
      obs[i]._raw = row.querySelector('[data-f=settings]').value;
    });
    box.querySelectorAll('[data-rt]').forEach(row=>{
      const i = +row.dataset.rt;
      rts[i]._raw = row.querySelector('[data-f=matcher]').value;
      rts[i].outbound_tag = row.querySelector('[data-f=outbound_tag]').value;
      rts[i].enabled = row.querySelector('[data-f=enabled]').checked;
    });
  }

  function bind(){
    box.querySelector('#rtAddOb').onclick = ()=>{
      collect(); obs.push({tag:'',type:'direct',settings:{}}); render();
    };
    box.querySelector('#rtAddRt').onclick = ()=>{
      collect(); rts.push({matcher:{},outbound_tag:'direct',enabled:true}); render();
    };
    box.querySelectorAll('[data-del-ob]').forEach(b=>b.onclick = ()=>{
      collect(); obs.splice(+b.dataset.delOb,1); render();
    });
    box.querySelectorAll('[data-del-rt]').forEach(b=>b.onclick = ()=>{
      collect(); rts.splice(+b.dataset.delRt,1); render();
    });
    box.querySelector('#rtSave').onclick = save;
  }

  function render(){
    box.innerHTML =
      '<h4 style="margin:0 0 var(--sp-2);font-size:var(--fs-sm)">出站</h4>'+
      (obs.length ? obs.map(obRow).join('')
        : '<div class="muted" style="font-size:var(--fs-xs);margin-bottom:var(--sp-2)">'+
          '未配置出站，全部流量直出。</div>')+
      '<button class="btn btn-ghost btn-sm" id="rtAddOb">+ 添加出站</button>'+
      '<h4 style="margin:var(--sp-4) 0 var(--sp-2);font-size:var(--fs-sm)">分流规则</h4>'+
      (rts.length ? rts.map(rtRow).join('')
        : '<div class="muted" style="font-size:var(--fs-xs);margin-bottom:var(--sp-2)">'+
          '未配置规则。</div>')+
      '<button class="btn btn-ghost btn-sm" id="rtAddRt">+ 添加规则</button>'+
      '<div style="margin-top:var(--sp-4)">'+
        '<button class="btn btn-primary btn-sm" id="rtSave">保存出站与分流</button>'+
      '</div>';
    bind();
  }

  async function save(){
    collect();
    // JSON 逐条校验并指明是第几条 —— 十几条规则里一句「解析失败」毫无用处
    const outbounds = [], routes = [];
    for(let i=0;i<obs.length;i++){
      if(!obs[i].tag) return toast('第 '+(i+1)+' 条出站缺少标识','err');
      let st;
      try{ st = JSON.parse(obs[i]._raw || '{}'); }
      catch(e){ return toast('第 '+(i+1)+' 条出站的参数不是合法 JSON','err'); }
      outbounds.push({tag:obs[i].tag, type:obs[i].type, settings:st});
    }
    for(let i=0;i<rts.length;i++){
      let mt;
      try{ mt = JSON.parse(rts[i]._raw || '{}'); }
      catch(e){ return toast('第 '+(i+1)+' 条规则的匹配条件不是合法 JSON','err'); }
      routes.push({priority:(i+1)*10, matcher:mt,
        outbound_tag:rts[i].outbound_tag, enabled:rts[i].enabled!==false});
    }
    try{
      const saved=await api('/v1/nodes/'+nodeId+'/routing',
        {method:'PUT', body: JSON.stringify({row_version:Number(m.dataset.nodeVersion),outbounds, routes})});
      m.dataset.nodeVersion=String(saved.row_version);
      toast('已保存，节点端下次同步时生效','ok');
    }catch(e){ toast(e.message,'err'); }
  }

  render();
}

        '<button class="btn-icon" data-close>'+
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'+
        '</button></div>'+
      '<div class="modal-body">'+

        '<div class="token-box"><code>'+esc(r.token)+'</code></div>'+
        '<p class="muted" style="margin:var(--sp-4) 0 var(--sp-2)">在目标机器上执行：</p>'+

// 协议与内核的可选值。两张表都刻意写死在前端 ——
// 它们不是数据，而是「这个版本的节点端支持什么」，
// 与后端二进制强绑定，从接口拉取反而会掩盖版本不匹配。
const ND_PROTOS = [
  ['','未配置'],
  ['vless','VLESS'], ['vmess','VMess'], ['trojan','Trojan'],
  ['shadowsocks','Shadowsocks'], ['hysteria','Hysteria'], ['hysteria2','Hysteria2'],
  ['tuic','TUIC'], ['anytls','AnyTLS'], ['naive','Naive'],
  ['socks','SOCKS'], ['http','HTTP'], ['v2ray','V2Ray（兼容）'],
  ['mieru','Mieru'], ['juicity','Juicity'], ['shadowtls','ShadowTLS（兼容）']
];
// 出站类型。与数据库的 CHECK 约束保持一致 ——
// 这里多一个少一个，保存时都会被数据库挡下来，不如一开始就对齐。
const ND_OB_TYPES = ['direct','block','socks','http','shadowsocks','vmess','vless',
  'trojan','hysteria','hysteria2','tuic','anytls','shadowtls','wireguard'];

const ND_KERNELS = [
  ['auto','NativeCore（自动）'],
  ['pandora-native','Pandora NativeCore'],
  ['sing-box','sing-box（迁移兼容）'],
  ['xray-core','xray-core（迁移兼容）']
];
// 只有两个内核都实现了的协议，选择内核才有意义
const ND_DUAL = ['vless','vmess','trojan'];

async function openNode(id){
  let n, met, schemas;
  try{
    const d = await api('/v1/nodes');
    n = (d.nodes||[]).find(x=>x.id===id);
    met = await api('/v1/nodes/'+id+'/metrics?minutes=60');
    const schemaData=await api('/v1/node-protocol-schemas');
    schemas=schemaData.schemas||[];
  }catch(e){ return toast(e.message,'err'); }
  if(!n) return toast('节点不存在','err');

  const st = ND_ST[n.status] || [n.status,''];
  const L = met.latest;
  const pts = met.points || [];
  const legacy=!!(n.node_type&&!protocolSchema(schemas,n.node_type));
  const firstStable=firstStableProtocol(schemas);
  const selectedType=!legacy&&protocolSchema(schemas,n.node_type)?n.node_type:(legacy?n.node_type:((firstStable&&firstStable.node_type)||''));
  let existingConfig=n.protocol_config||{},preserveProtocolConfig=!legacy;

  const m = document.createElement('div');

  '<div class="modal node-detail-modal">'+

        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'+
      '</button></div>'+

    '<div class="card-pad" style="max-height:66vh;overflow-y:auto">'+
      (L ? '<div class="stat-row">'+
        '<div class="mini"><div class="k">CPU</div><div class="v">'+L.cpu_percent.toFixed(1)+'%</div></div>'+
        '<div class="mini"><div class="k">内存</div><div class="v">'+

        '<div class="mini"><div class="k">负载</div><div class="v">'+L.load1.toFixed(2)+'</div></div>'+
        '<div class="mini"><div class="k">连接数</div><div class="v">'+L.tcp_conns+'</div></div>'+
        '<div class="mini"><div class="k">运行</div><div class="v" style="font-size:var(--fs-base)">'+

                 'Agent 需要至少两轮心跳才能算出 CPU 使用率。</div>')+

            '<input id="npRate" class="input" type="number" step="0.1" min="0.1" value="'+(n.traffic_rate||1)+'"></div>'+
          '<div class="field"><label>订阅显示名</label>'+
            '<input id="npName" class="input" value="'+esc(n.display_name||'')+'" placeholder="留空则用节点名"></div>'+
          '<button class="btn btn-primary btn-sm" id="npSave">保存服务配置</button>'+
        '</div>'+
      '</div>'+

      '<div class="card" style="margin-bottom:var(--sp-4)">'+
        '<div class="card-head"><h3>出站与分流</h3>'+
          '<span class="muted" style="font-size:var(--fs-xs)">规则自上而下匹配，命中即止</span>'+
        '</div>'+
        '<div class="card-pad" id="ndRouting"><div class="muted">加载中…</div></div>'+
      '</div>'+

      '<div class="card"><div class="card-head"><h3>节点信息</h3></div><div class="card-pad">'+
        '<dl class="kv">'+
          '<dt>节点 ID</dt><dd class="mono">'+esc(n.id)+'</dd>'+
          '<dt>公网地址</dt><dd class="mono">'+esc(n.public_ipv4||'—')+'</dd>'+
          '<dt>主机名</dt><dd class="mono">'+esc(n.hostname||'—')+'</dd>'+
          '<dt>资源池</dt><dd>'+esc(n.pool_name||'未分配')+'</dd>'+
          '<dt>Agent 版本</dt><dd>'+esc(n.agent_version||'—')+'</dd>'+
          '<dt>身份序号</dt><dd>'+(n.identity_serial??'—')+'</dd>'+
          '<dt>配置版本</dt><dd>'+(n.applied_config_version??'—')+
            ' / 期望 '+(n.desired_config_version??'—')+'</dd>'+
          '<dt>最后心跳</dt><dd>'+(n.last_heartbeat_at?fmtDT(n.last_heartbeat_at):'从未')+'</dd>'+
        '</dl>'+
      '</div></div>'+
    '</div>'+

    '<div class="modal-foot" style="flex-wrap:wrap">'+
      '<button class="btn btn-ghost btn-sm" id="ndToken">签发接入令牌</button>'+
      '<button class="btn btn-ghost btn-sm" id="ndRevoke">吊销身份</button>'+
      '<button class="btn btn-ghost btn-sm" id="ndDrain">排空</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(m);

  const close=()=>{m.remove();go('nodes')};
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  m.onclick=ev=>{if(ev.target===m)close()};

  // 内核选择只对两边都支持的协议有效。与其让用户选了不生效，
  // 不如直接说清楚 —— 静默忽略一个用户明确做过的选择是最糟的交互。
  const npType=m.querySelector('#npType'), npKernel=m.querySelector('#npKernel');
  const npFields=m.querySelector('#npProtocolFields');
  renderProtocolConfigFields(npFields,protocolSchema(schemas,npType.value),preserveProtocolConfig?existingConfig:{});
  const syncKernelHint=()=>{
    const dual=ND_DUAL.includes(npType.value);
    if(!dual&&npKernel.value==='xray-core'&&['hysteria2','tuic','anytls'].includes(npType.value))npKernel.value='auto';
    npKernel.disabled=!dual;
    m.querySelector('#npKernelHint').textContent = dual
      ? '该协议两个内核都支持，可以指定。'
      : (npType.value ? '该协议只有一种实现，此项不生效。' : '先选择协议。');
  };
  npType.onchange=()=>{preserveProtocolConfig=false;renderProtocolConfigFields(npFields,protocolSchema(schemas,npType.value),{});syncKernelHint()}; syncKernelHint();

  initRouting(m, id);

  m.querySelector('#npSave').onclick=async()=>{
    let proto;
    try{proto=readProtocolConfigFields(npFields,protocolSchema(schemas,npType.value),existingConfig,preserveProtocolConfig)}
    catch(e){return toast(e.message,'err')}
    try{
      const saved=await api('/v1/nodes/'+id+'/protocol', {method:'POST', body: JSON.stringify({
        row_version: Number(m.dataset.nodeVersion),
        node_type: npType.value,
        kernel: npKernel.value,
        server_host: m.querySelector('#npHost').value.trim(),
        server_port: Number(m.querySelector('#npPort').value)||0,
        traffic_rate: Number(m.querySelector('#npRate').value)||1,
        display_name: m.querySelector('#npName').value.trim(),
        protocol_config: proto
      })});
      m.dataset.nodeVersion=String(saved.row_version);
      existingConfig=proto;preserveProtocolConfig=true;
      n.node_type=npType.value;n.kernel=npKernel.value;n.protocol_config=proto;
      renderProtocolConfigFields(npFields,protocolSchema(schemas,npType.value),existingConfig);
      toast('已保存，节点端下次同步时生效','ok');
    }catch(e){ toast(e.message,'err'); }
  };

  m.querySelector('#ndToken').onclick = async ev=>{
    const b=ev.currentTarget; busy(b,true,'签发中');
    try{
      const r = await api('/v1/nodes/'+id+'/server-token',{method:'POST'});
      if(!r.panel_url) throw new Error('服务端未返回规范面板地址');
      const qnodeKernel=n.kernel==='xray-core'?'xray':(n.kernel==='sing-box'?'singbox':'native');
      const qnodeConfig='panel:\n  url: "'+r.panel_url+'"\n  token: "'+r.token+'"\n  node_uuid: "'+id+'"\n  node_type: "'+(n.node_type||'')+'"\n  auth_mode: bearer\nkernel:\n  type: '+qnodeKernel;
      const output='<div class="card-pad" id="ndTokenOutput"><div class="token-box"><code>'+esc(r.token)+'</code></div>'+
        '<p class="muted" style="margin-top:var(--sp-2)">'+esc(r.hint)+'</p>'+
        // 自研内核走一键安装：令牌只显示这一次，让人自己拼 node-id 和
        // token，抄错一个字符就是一次白跑的排查。
        (r.install_command?
          '<p class="muted" style="margin:var(--sp-3) 0 var(--sp-2)">Pandora 自研内核一键安装（在落地机上以 root 执行）：'+
          '<button class="btn btn-sm" id="ndCopyInstall" style="margin-left:var(--sp-2)">复制</button></p>'+
          '<div class="token-box" style="white-space:pre-wrap"><code id="ndInstallCmd">'+esc(r.install_command)+'</code></div>':'')+
        '<p class="muted" style="margin:var(--sp-3) 0 var(--sp-2)">QNode 安全接入配置（Bearer 模式，不把令牌写入 URL）：</p>'+
        '<div class="token-box" style="white-space:pre-wrap"><code>'+esc(qnodeConfig)+'</code></div></div>';
      const previous=m.querySelector('#ndTokenOutput');
      if(previous)previous.outerHTML=output;else m.querySelector('.modal-foot').insertAdjacentHTML('beforebegin',output);
      const copyBtn=m.querySelector('#ndCopyInstall');
      if(copyBtn)copyBtn.onclick=async()=>{
        try{ await navigator.clipboard.writeText(r.install_command); toast('已复制安装命令','ok'); }
        catch(err){ toast('复制失败，请手动选中','err'); }
      };
      busy(b,false);
    }catch(e){ toast(e.message,'err'); busy(b,false); }
  };
  m.querySelector('#ndRevoke').onclick = async ev=>{
    if(!await askDanger({
    title:'吊销节点身份',
    what:'作废这个节点当前的身份凭据。',
    consequences:[
      '这台机器上的 Agent <b>立刻失去访问权</b>，配置下发和流量上报同时中断。',
      '要恢复必须重新走一遍接入流程，拿新的接入命令在机器上执行。',
      '适合用在机器被入侵、或者凭据可能已经泄露的时候。'],
    confirmText:'吊销身份'})) return;
    const b=ev.currentTarget; busy(b,true,'处理中');
    try{
      await api('/v1/nodes/'+id+'/revoke-identity',{method:'POST'});
      toast('身份已吊销','ok'); close();
    }catch(e){ toast(e.message,'err'); busy(b,false); }
  };
  m.querySelector('#ndDrain').onclick = async ev=>{
    const b=ev.currentTarget; busy(b,true,'处理中');
    try{
      const saved=await api('/v1/nodes/'+id+'/status',{method:'POST',headers:{'Idempotency-Key':idemKey()},
        body:JSON.stringify({row_version:Number(m.dataset.nodeVersion),status:'draining',reason:'管理员手工排空'})});
      m.dataset.nodeVersion=String(saved.row_version);
      toast('节点已进入排空','ok'); close();
    }catch(e){ toast(e.message,'err'); busy(b,false); }
  };
}

const TK_ST = {
  open:['待处理','warn'], pending_agent:['待客服','warn'], pending_user:['待用户','brand'],
  escalated:['已升级','err'], resolved:['已解决','ok'], closed:['已关闭','']
};
const TK_PRIO = {urgent:['紧急','err'], high:['高','warn'], normal:['普通',''], low:['低','']};
const TK_CAT = {general:'一般咨询', billing:'账单与支付', subscription:'订阅与套餐',
                technical:'连接与技术', account:'账号与安全', abuse:'举报与投诉'};
let tkF = {status:'', priority:'', assignedTo:'', breached:false, q:''};
const ticketScanAttempt=idemAttempt();

async function viewTickets(v){
	const canWrite=can('ops.ticket.write');
  const qs = new URLSearchParams();
  if (tkF.status)   qs.set('status', tkF.status);
  if (tkF.priority) qs.set('priority', tkF.priority);
  if (tkF.assignedTo) qs.set('assigned_to', tkF.assignedTo);
  if (tkF.breached) qs.set('breached', '1');
  if (tkF.q)        qs.set('q', tkF.q);
  qs.set('limit', '50');

  const [d, assigneeData] = await Promise.all([
    api('/v1/tickets?' + qs.toString()),
    api('/v1/tickets/assignees').catch(() => ({assignees:[]})),
  ]);
  const assignees = assigneeData.assignees || [];
  const list = d.tickets || [];

  v.innerHTML =
    '<div class="tk-filters">' +
      '<input class="input" id="tkQ" placeholder="搜单号 / 标题 / 邮箱" value="' + esc(tkF.q) + '">' +
      sel('tkFStatus', tkF.status, [['','全部状态'],['open','待处理'],
        ['pending_agent','待客服'],['pending_user','待用户'],['escalated','已升级'],
        ['resolved','已解决'],['closed','已关闭']]) +
      sel('tkFPrio', tkF.priority, [['','全部优先级'],['urgent','紧急'],['high','高'],
        ['normal','普通'],['low','低']]) +
      sel('tkFAssignee', tkF.assignedTo, [['','全部负责人']].concat(assignees.map(a => [a.id, a.display_name || a.email]))) +
      '<button class="chip' + (tkF.breached ? ' on' : '') + '" id="tkFBreach">' +
        '仅看 SLA 超时</button>' +
      (canWrite?'<button class="btn btn-ghost btn-sm" id="tkScan">立即扫描升级</button>':
        '<span class="muted" id="tkReadOnlyNotice">当前角色仅可查看工单</span>') +
    '</div>' +
    '<div class="card"><div class="card-head"><h3>工单队列</h3><div class="spacer"></div>' +
      '<span class="badge badge-plain">共 ' + num(d.total) + ' 条</span></div>' +
      (list.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>单号</th><th>标题</th><th>提单人</th><th>分类</th>' +
        '<th>优先级</th><th>状态</th><th>负责人</th><th>最后更新</th></tr></thead><tbody>' +
        list.map(t => {
          const st = TK_ST[t.status] || [t.status,''];
          const pr = TK_PRIO[t.priority] || [t.priority,''];
          return '<tr style="cursor:pointer" data-id="' + esc(t.id) + '">' +
            '<td class="mono">' + esc(t.ticket_no) + '</td>' +
            '<td>' + esc(t.subject) +
              (t.sla_breached ? ' <span class="sla-warn">· 超时</span>' : '') + '</td>' +
            '<td class="mono">' + esc(t.user_email || '') + '</td>' +
            '<td>' + esc(TK_CAT[t.category] || t.category) + '</td>' +
            '<td><span class="badge badge-' + (pr[1] || 'plain') + '">' + pr[0] + '</span></td>' +
            '<td><span class="badge badge-' + (st[1] || 'plain') + '">' + st[0] + '</span></td>' +
            '<td>' + esc(t.assignee_email || '未分配') + '</td>' +
            '<td class="num">' + fmtDT(t.last_reply_at) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : emptyRow('没有符合条件的工单',
    '换个状态或负责人筛选试试。')) +
    '</div>';

  const reload = () => go('tickets');
  v.querySelector('#tkFStatus').onchange = e => { tkF.status = e.target.value; reload(); };
  v.querySelector('#tkFPrio').onchange   = e => { tkF.priority = e.target.value; reload(); };
  v.querySelector('#tkFAssignee').onchange = e => { tkF.assignedTo = e.target.value; reload(); };
  v.querySelector('#tkFBreach').onclick  = () => { tkF.breached = !tkF.breached; reload(); };
  v.querySelector('#tkQ').onkeydown = e => {
    if (e.key === 'Enter'){ tkF.q = e.target.value.trim(); reload(); }
  };
  if(canWrite){
    v.querySelector('#tkScan').onclick = async e => {
      const b = e.currentTarget, payload={scan:'overdue'};
      busy(b, true, '扫描中');
      try{
        const r = await api('/v1/tickets/escalate', {method:'POST',
          headers:{'Idempotency-Key':ticketScanAttempt.keyFor(payload)}});
        ticketScanAttempt.reset();
        toast(r.escalated > 0 ? ('已升级 ' + r.escalated + ' 个超时工单') : '没有需要升级的工单',
              r.escalated > 0 ? 'warn' : 'ok');
        reload();
      }catch(err){ toast(err.message, 'err'); busy(b, false); }
    };
  }
  v.querySelectorAll('tr[data-id]').forEach(tr =>
    tr.onclick = () => openTicketAdmin(tr.dataset.id));

  refreshTicketBadge(list, num(d.total));
}

function sel(id, val, opts){
  return '<select class="input" id="' + esc(id) + '">' +
    opts.map(o => '<option value="' + esc(o[0]) + '"' +
      (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') +
    '</select>';
}
function fmtDT(s){
  if (!s) return '—';
  const d = new Date(s), p = n => String(n).padStart(2,'0');
  return (d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// 侧边栏红点只统计「需要客服动作」的工单，已解决/待用户的不算 ——
// 否则数字长期挂着不归零，很快就会被无视。
async function refreshTicketBadge(){
  try{
    const d = await api('/v1/tickets?limit=1&status=');
    const need = (await api('/v1/tickets?limit=100')).tickets
      .filter(t => ['open','pending_agent','escalated'].includes(t.status)).length;
    const b = document.getElementById('tkBadge');
    if (!b) return;
    b.textContent = need > 99 ? '99+' : String(need);
    b.classList.toggle('hide', need === 0);
  }catch(_){}
}

async function openTicketAdmin(id){
	const canWrite=can('ops.ticket.write');
  let t;
  try { t = await api('/v1/tickets/' + id); }
  catch(e){ return toast(e.message, 'err'); }

  const st = TK_ST[t.status] || [t.status,''];
  const pr = TK_PRIO[t.priority] || [t.priority,''];
  let assigneeData = {assignees:[]};
  if (canWrite) {
    try { assigneeData = await api('/v1/tickets/assignees'); }
    catch (_) { assigneeData = {assignees:[]}; }
  }
  const assignees = assigneeData.assignees || [];
  const assigneeOptions = [['','取消指派']].concat(assignees.map(a => [a.id, a.display_name || a.email]));

  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
  '<div class="modal" style="max-width:720px" role="dialog" aria-modal="true">' +
    '<div class="modal-head">' +
      '<h3 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(t.subject) + '</h3>' +
      '<span class="badge badge-' + (pr[1]||'plain') + '">' + pr[0] + '</span>' +
      '<span class="badge badge-' + (st[1]||'plain') + '">' + st[0] + '</span>' +
      '<button class="btn-icon" data-close aria-label="关闭">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>' +

    '<div class="card-pad" style="border-bottom:1px solid var(--line);padding:var(--sp-4) var(--sp-6)">' +
      '<dl class="kv" style="margin:0">' +
        '<dt>单号</dt><dd class="mono">' + esc(t.ticket_no) + '</dd>' +
        '<dt>提单人</dt><dd class="mono">' + esc(t.user_email || '') + '</dd>' +
        '<dt>分类</dt><dd>' + esc(TK_CAT[t.category] || t.category) + '</dd>' +
        '<dt>首次响应</dt><dd>' +
          (t.first_responded_at ? fmtDT(t.first_responded_at)
            : '<span class="' + (t.sla_breached ? 'sla-warn' : '') + '">未响应' +
              (t.sla_breached ? '（已超时）' : '，截止 ' + fmtDT(t.sla_first_response_due)) +
              '</span>') + '</dd>' +
        '<dt>当前负责人</dt><dd>' + esc(t.assignee_email || '未分配') + '</dd>' +
      '</dl></div>' +

    '<div class="tk-thread" id="tkThread">' +
      (t.messages||[]).map(msg => {
        if (msg.author_kind === 'system'){
          return '<div class="msg system"><div class="msg-body">' + esc(msg.body) + '</div></div>';
        }
        const agent = msg.author_kind === 'agent';
        const cls = 'msg' + (agent ? ' agent' : '') + (msg.internal_note ? ' note' : '');
        const who = msg.internal_note ? '内部备注 · 用户不可见'
                                      : (agent ? '客服' : '用户');
        return '<div class="' + cls + '">' +
          '<span class="msg-who">' + who + ' · ' + fmtDT(msg.created_at) + '</span>' +
          '<div class="msg-body">' + esc(msg.body) + '</div></div>';
      }).join('') +
    '</div>' +

    (canWrite?'<div class="card-pad" style="border-top:1px solid var(--line)">' +
      '<div class="row" style="margin-bottom:var(--sp-3);align-items:end">' +
        '<label class="field" style="flex:1"><span>指派给</span>' +
          sel('tkAssignee', t.assigned_to || '', assigneeOptions) +
        '</label>' +
        '<button class="btn btn-ghost" id="tkAssign">保存指派</button>' +
      '</div>' +
      '<textarea class="input" id="tkBody" placeholder="回复用户，或记录内部备注…"></textarea>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:var(--sp-3) 0;' +
             'font-size:var(--fs-sm);color:var(--fg-2);cursor:pointer">' +
        '<input type="checkbox" id="tkInternal" style="width:15px;height:15px;cursor:pointer">' +
        '仅内部备注（用户看不到）</label>' +
      '<div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="tkSend">发送</button>' +
        '<button class="btn btn-ghost" id="tkResolve">标记已解决</button>' +
        '<button class="btn btn-ghost" id="tkClose2">关闭工单</button>' +
      '</div>' +
    '</div>':'<div class="card-pad muted" id="tkReadOnlyNotice" style="border-top:1px solid var(--line)">' +
      '当前角色仅可查看工单</div>') +
  '</div>';
  document.body.appendChild(m);

  const th = m.querySelector('#tkThread');
  th.scrollTop = th.scrollHeight;

	const onEsc=ev=>{if(ev.key==='Escape')dismiss()};
  const dismiss = () => { document.removeEventListener('keydown',onEsc);m.remove();go('tickets'); };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = dismiss);
  m.onclick = ev => { if (ev.target === m) dismiss(); };
	document.addEventListener('keydown',onEsc);

  if(canWrite){
    // 勾选内部备注时按钮文案跟着变，减少误发到用户那边的可能
    const cb=m.querySelector('#tkInternal'),sendBtn=m.querySelector('#tkSend');
    const replyAttempt=idemAttempt(),statusAttempt=idemAttempt(),assignAttempt=idemAttempt();
    cb.onchange=()=>{
      sendBtn.textContent=cb.checked?'保存内部备注':'发送';
      sendBtn.classList.toggle('btn-primary',!cb.checked);
      sendBtn.classList.toggle('btn-ghost',cb.checked);
    };

    m.querySelector('#tkAssign').onclick=async ev=>{
      const b=ev.currentTarget,assigned_to=m.querySelector('#tkAssignee').value;
      const payload={assigned_to};
      busy(b,true,'保存中');
      try{
        await api('/v1/tickets/'+id+'/assign',{method:'POST',
          headers:{'Idempotency-Key':assignAttempt.keyFor(payload)},body:JSON.stringify(payload)});
        assignAttempt.reset();m.remove();await openTicketAdmin(id);
        toast(assigned_to?'工单已指派':'已取消指派','ok',2000);
      }catch(e){toast(e.message,'err');busy(b,false)}
    };

    sendBtn.onclick=async ev=>{
      const b=ev.currentTarget,body=m.querySelector('#tkBody').value.trim();
      if(!body)return toast('请填写内容','err');
      const payload={body,internal_note:cb.checked};
      busy(b,true,'发送中');
      try{
        await api('/v1/tickets/'+id+'/reply',{method:'POST',
          headers:{'Idempotency-Key':replyAttempt.keyFor(payload)},body:JSON.stringify(payload)});
        replyAttempt.reset();m.remove();await openTicketAdmin(id);
        toast(cb.checked?'内部备注已保存':'回复已发送','ok',2000);
      }catch(e){toast(e.message,'err');busy(b,false)}
    };

    const setStatus=async(status,label,btn)=>{
      const payload={status,reason:''};busy(btn,true,'处理中');
      try{
        await api('/v1/tickets/'+id+'/status',{method:'POST',
          headers:{'Idempotency-Key':statusAttempt.keyFor(payload)},body:JSON.stringify(payload)});
        statusAttempt.reset();toast(label,'ok',2000);dismiss();
      }catch(e){toast(e.message,'err');busy(btn,false)}
    };
    m.querySelector('#tkResolve').onclick=e=>setStatus('resolved','已标记为解决',e.currentTarget);
    m.querySelector('#tkClose2').onclick=e=>setStatus('closed','工单已关闭',e.currentTarget);
  }
}

async function viewUsers(v){
  const s=state.users;
  const r=await api('/v1/users?q='+encodeURIComponent(s.q)+'&status='+s.status+
                    '&limit=25&offset='+s.offset);
  let rows='';
  r.users=r.users||[];r.users.forEach(u=>{
    rows+='<tr>'+
      '<td><div class="email">'+esc(u.email)+'</div>'+
        '<div class="sub mono">'+u.id.slice(0,18)+'…</div></td>'+
      '<td>'+badge(U_ST,u.status)+'</td>'+
      '<td>'+(u.active_plan?esc(u.active_plan):'<span class="sub">无</span>')+
        (u.subscription_count>1?' <span class="sub">+'+(u.subscription_count-1)+'</span>':'')+'</td>'+
      '<td class="r num">'+money(u.balance,u.currency)+'</td>'+
      '<td class="sub num">'+day(u.created_at)+'</td>'+
      '<td class="sub num">'+(u.last_login_at?dt(u.last_login_at):'从未')+'</td>'+
      '<td class="r"><button class="btn btn-sm btn-ghost" data-uid="'+u.id+'">详情</button></td>'+
    '</tr>';
  });

  v.innerHTML='<div class="card">'+
    '<div class="toolbar">'+
      '<input class="input" id="uq" placeholder="搜索邮箱或昵称…" value="'+esc(s.q)+'">'+
      '<select class="input" id="ust">'+opts([['','全部状态'],['active','正常'],
        ['suspended','已停用'],['banned','已封禁'],['pending','待验证']],s.status)+'</select>'+
      '<button class="btn btn-ghost" id="ugo">搜索</button>'+
      '<button class="btn btn-ghost" id="uGroups">管理分组</button>'+
    '</div>'+
    (r.users.length?'<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr>'+
      '<th>用户</th><th>状态</th><th>当前套餐</th><th class="r">余额</th>'+
      '<th>注册</th><th>最近登录</th><th></th></tr></thead><tbody>'+rows+
      '</tbody></table></div>'
      :emptyRow('没有匹配的用户',
    '换个关键词或筛选条件试试。'))+
    pager(num(r.total),s.offset,'users')+
  '</div>';

  const gm=document.getElementById('uGroups');
  if(gm)gm.onclick=openGroupManager;
  $('ugo').onclick=()=>{s.q=$('uq').value;s.status=$('ust').value;s.offset=0;render()};
  $('uq').onkeydown=e=>{if(e.key==='Enter')$('ugo').click()};
  v.querySelectorAll('button[data-uid]').forEach(b=>b.onclick=()=>userModal(b.dataset.uid));
  bindPager('users');
}

// loadProfile 拉取并渲染一个用户的行为画像。
async function loadProfile(id){
  const box = document.getElementById('upProf');
  if (!box) return;
  box.innerHTML = '<div class="sub">加载中…</div>';
  let p;
  try{ p = await api('/v1/users/' + id + '/profile'); }
  catch(e){
    box.innerHTML = '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
    return;
  }

  const ips = (p.ips || []).map(i =>
    '<tr>' +
      '<td class="mono">' + esc(i.ip || '（无密文）') + '</td>' +
      '<td class="r num">' + i.count + '</td>' +
      // accounts > 1 意味着这个地址下还有别的账号。共用出口是常态，
      // 所以只标出来，不下结论
      '<td class="r">' + (i.accounts > 1
        ? '<span class="badge badge-warn">' + i.accounts + ' 个账号</span>'
        : '<span class="sub">独占</span>') + '</td>' +
      '<td class="sub num">' + dt(i.last) + '</td>' +
    '</tr>').join('') || '<tr><td colspan="4" class="sub">无记录</td></tr>';

  const peers = (p.related || []).length
    ? '<div class="sub" style="padding:var(--sp-2) 0;line-height:1.7">同源账号：' +
      (p.related||[]).map(x => '<span class="badge badge-plain">' + esc(x.email) + '</span>').join(' ') +
      '</div>'
    : '';

  const fetches = (p.fetches || []).slice(0, 20).map(f =>
    '<tr>' +
      '<td class="mono">' + esc(f.ip || '—') + '</td>' +
      '<td>' + esc(f.family || '?') +
        (f.format ? ' <span class="sub">' + esc(f.format) + '</span>' : '') + '</td>' +
      '<td>' + (f.result === 'ok'
        ? '<span class="badge badge-ok">成功</span>'
        : '<span class="badge badge-plain">' + esc(f.result) + '</span>') + '</td>' +
      '<td class="sub num">' + dt(f.at) + '</td>' +
    '</tr>').join('') || '<tr><td colspan="4" class="sub">无拉取记录</td></tr>';

  // 7 天内的不同来源数是判断链接外泄最直接的信号。
  // 阈值设在 8：多设备加上移动网络换 IP，正常用户很难超过
  const n = p.fetch_sources_7d || 0;
  const warn = n >= 8
    ? '<div class="warn-box" style="margin:var(--sp-3) 0">近 7 天有 <b>' + n +
      '</b> 个不同来源拉取过该用户的订阅，明显高于单人多设备的正常范围，' +
      '这条链接很可能已被分享。</div>'
    : '<div class="sub" style="margin:var(--sp-2) 0">近 7 天不同来源：' + n + '</div>';

  const evs = (p.events || []).slice(0, 15).map(e =>
    '<tr><td>' + esc(e.action) + '</td>' +
    '<td>' + (e.outcome === 'success' ? '<span class="sub">成功</span>'
                                      : '<span class="badge badge-warn">' + esc(e.outcome) + '</span>') + '</td>' +
    '<td class="mono sub">' + esc(e.ip || '—') + '</td>' +
    '<td class="sub num">' + dt(e.at) + '</td></tr>').join('')
    || '<tr><td colspan="4" class="sub">无记录</td></tr>';

  box.innerHTML =
    '<div class="sub" style="margin-bottom:var(--sp-2)">常用来源</div>' +
    '<div class="tbl-wrap"><table class="tbl"><tbody>' + ips + '</tbody></table></div>' + peers +
    '<div class="sub" style="margin:var(--sp-4) 0 var(--sp-2)">订阅拉取</div>' + warn +
    '<div class="tbl-wrap"><table class="tbl"><tbody>' + fetches + '</tbody></table></div>' +
    '<div class="sub" style="margin:var(--sp-4) 0 var(--sp-2)">最近操作</div>' +
    '<div class="tbl-wrap"><table class="tbl"><tbody>' + evs + '</tbody></table></div>';
}

// 人工调整余额。
//
// 这是后台少数几个能凭空造钱的操作之一，所以理由是必填的，
// 而且会连同调整前后的数字一起进审计 —— 事后要能说清是谁、为什么。
function openAdjustBalance(userID, email, currency){
  const sym = SYM[currency] || '';
  const m = modal('调整余额 · ' + esc(email),
    '<div class="field"><label for="abAmt">调整金额（元）</label>' +
      '<input class="input" id="abAmt" type="number" step="0.01" placeholder="正数增加，负数扣减">' +
      '<div class="hint">例如填 10 表示给用户加 ' + sym + '10，填 -10 表示扣 ' + sym + '10。</div>' +
    '</div>' +
    '<div class="field" style="margin-bottom:0"><label for="abWhy">调整原因</label>' +
      '<input class="input" id="abWhy" placeholder="例如：节点故障补偿">' +
      '<div class="hint">至少 5 个字。这条理由会写进审计记录，且不可删改。</div>' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="abGo">确认调整</button>');

  m.querySelector('#abGo').onclick = async ev => {
    const yuan = parseFloat(m.querySelector('#abAmt').value || '0');
    const reason = m.querySelector('#abWhy').value.trim();
    if (!yuan){ toast('请填写调整金额', 'err'); return; }
    if (reason.length < 5){ toast('原因至少 5 个字', 'err'); return; }
    busy(ev.currentTarget, true, '提交中');
    try{
      const r = await api('/v1/users/' + userID + '/balance', {method:'POST',
        body: JSON.stringify({amount: Math.round(yuan * 100), reason, currency})});
      m.remove();
      toast('已调整，当前余额 ' + money(r.balance, currency), 'ok', 4000);
      render();
    }catch(e){ toast(e.message, 'err', 6000); busy(ev.currentTarget, false); }
  };
}

//---------------------------------------------------------------------------
// 用户分组
//---------------------------------------------------------------------------
//
// 分组本身只是个标签，值钱的是它驱动的四件事：套餐可见、专属价格、
// 优惠券限定、公告定向。所以列表里要把「正在被谁用」摆出来 ——
// 删组之前得让人看见影响面，而不是删完才发现有套餐从此没人看得到。

async function openGroupManager(){
  const m = modal('用户分组', '<div id="gmBody">加载中…</div>',
    '<button class="btn btn-ghost" data-close>关闭</button>', true);
  await renderGroupManager(m);
}

async function renderGroupManager(m){
  let groups;
  try{ groups = (await api('/v1/user-groups')).groups || []; }
  catch(e){
    m.querySelector('#gmBody').innerHTML =
      '<div class="sub" style="color:var(--err)">' + esc(e.message) + '</div>';
    return;
  }

  const rows = groups.map(g => {
    const used = g.plans + g.prices + g.coupons;
    return '<tr>' +
      '<td><b>' + esc(g.name) + '</b><div class="sub mono">' + esc(g.code) + '</div>' +
        (g.description ? '<div class="sub">' + esc(g.description) + '</div>' : '') + '</td>' +
      '<td class="r num">' + g.users + '</td>' +
      '<td class="sub">' + (used
        ? [g.plans && ('套餐 ' + g.plans), g.prices && ('专属价 ' + g.prices),
           g.coupons && ('券 ' + g.coupons)].filter(Boolean).join('、')
        : '<span class="sub">未被使用</span>') + '</td>' +
      '<td class="r">' +
        '<button class="btn btn-sm btn-ghost" data-gren="' + esc(g.id) +
          '" data-name="' + esc(g.name) + '">改名</button> ' +
        '<button class="btn btn-sm btn-ghost" data-gdel="' + esc(g.id) + '">删除</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  m.querySelector('#gmBody').innerHTML =
    '<div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap">' +
      '<input class="input" id="gmName" placeholder="分组名称，例如 VIP 用户" style="flex:1;min-width:170px">' +
      '<input class="input" id="gmDesc" placeholder="说明（选填）" style="flex:1;min-width:150px">' +
      '<button class="btn btn-primary" id="gmAdd" style="flex:none">新建</button>' +
    '</div>' +
    (groups.length
      ? '<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr>' +
        '<th>分组</th><th class="r">用户数</th><th>正在被使用</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : emptyRow('还没有分组',
    '分组用来把节点分类，套餐通过绑定分组决定用户能用哪些线路。至少建一个，否则套餐上架后用户没有线路可用。')) +
    '<div class="hint" style="margin-top:var(--sp-3);line-height:1.7">' +
      '分组可以用来：让某些套餐只对特定人可见、给不同人群不同价格、' +
      '限定优惠券的使用范围、把公告只发给相关的人。' +
    '</div>';

  m.querySelector('#gmAdd').onclick = async ev => {
    const name = m.querySelector('#gmName').value.trim();
    if (!name){ toast('请填写分组名称', 'err'); return; }
    busy(ev.currentTarget, true, '创建中');
    try{
      await api('/v1/user-groups', {method:'POST', body: JSON.stringify({
        name, description: m.querySelector('#gmDesc').value.trim() })});
      toast('已创建', 'ok', 1800);
      await renderGroupManager(m);
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };

  m.querySelectorAll('[data-gren]').forEach(b => b.onclick = async () => {
    const name = prompt('新的分组名称', b.dataset.name);
    if (!name || name === b.dataset.name) return;
    try{
      await api('/v1/user-groups/' + b.dataset.gren, {method:'POST',
        body: JSON.stringify({name})});
      toast('已改名', 'ok', 1800);
      await renderGroupManager(m);
    }catch(e){ toast(e.message, 'err'); }
  });

  m.querySelectorAll('[data-gdel]').forEach(b => b.onclick = async () => {
    if (!await askDanger({
    title:'删除分组',
    what:'删除这个分组。',
    consequences:[
      '分组里的成员不会被删，只是不再归属于它。',
      '绑定了这个分组的套餐会失去对应的线路授权，记得回去改。'],
    confirmText:'删除分组'})) return;
    try{
      await api('/v1/user-groups/' + b.dataset.gdel, {method:'DELETE'});
      toast('已删除', 'ok', 1800);
      await renderGroupManager(m);
    }catch(e){ toast(e.message, 'err', 6000); }
  });
}

async function openAssignGroup(userID, email){

  let groups = [];
  try{ groups = (await api('/v1/user-groups')).groups || []; }catch(_){}
  if (!groups.length){
    toast('还没有分组，先在用户页「管理分组」里建一个', 'warn', 5000);
    return;
  }
  const m = modal('设置分组 · ' + esc(email),
    '<div class="field" style="margin-bottom:0"><label for="agSel">所属分组</label>' +
      '<select class="input" id="agSel">' +
        '<option value="">未分组</option>' +
        groups.map(g => '<option value="' + esc(g.id) + '">' + esc(g.name) +
          '（' + g.users + ' 人）</option>').join('') +
      '</select>' +
      '<div class="hint">分组决定这个用户能看到哪些套餐、能用哪些券、以什么价格购买。</div>' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="agGo">保存</button>');

  m.querySelector('#agGo').onclick = async ev => {
    busy(ev.currentTarget, true, '保存中');
    try{
      await api('/v1/users/' + userID + '/group', {method:'POST',
        body: JSON.stringify({group_id: m.querySelector('#agSel').value})});
      m.remove();
      toast('已更新分组', 'ok', 2000);
      render();
    }catch(e){ toast(e.message, 'err'); busy(ev.currentTarget, false); }
  };
}

async function userModal(id){
  let u;
  try{u=await api('/v1/users/'+id)}catch(e){return toast(e.message,'err')}

  const subs=(u.subscriptions||[]).map(s=>
    '<tr><td>'+esc(s.plan_name)+' <span class="sub">v'+s.plan_version+'</span></td>'+
    '<td>'+badge(SUB_ST,s.status)+'</td>'+
    '<td class="sub num">'+day(s.current_period_end)+'</td>'+
    '<td class="r num">'+money(s.amount,s.currency)+'</td>'+
    // 订阅链接泄露是用户自己最搞不定的事：发到群里、被人盗用，
    // 回头流量用光来找客服。以前客服这边一个按钮都没有。
    '<td class="r">'+(can('iam.user.write')
      ? '<button class="btn btn-sm btn-ghost" data-rotate-sub="'+esc(s.id)+'">换链接</button>'
      : '')+'</td></tr>').join('')
    ||'<tr><td colspan="5" class="sub">无订阅</td></tr>';

  const ords=u.recent_orders.slice(0,8).map(o=>
    '<tr><td class="mono">'+esc(o.order_no)+'</td>'+
    '<td>'+badge(O_ST,o.status)+'</td>'+
    '<td class="r num">'+money(o.total_amount,o.currency)+'</td>'+
    '<td class="sub num">'+day(o.created_at)+'</td></tr>').join('')
    ||'<tr><td colspan="4" class="sub">无订单</td></tr>';

  const canWrite=can('iam.user.write');
  setTimeout(()=>{
    const sg=document.getElementById('uSetGrp');
    if(sg)sg.onclick=()=>openAssignGroup(id,u.email);
    const ab=document.getElementById('uAdjBal');
    if(ab)ab.onclick=()=>openAdjustBalance(id,u.email,u.currency);
    const rs=document.getElementById('uReset');
    if(rs)rs.onclick=()=>manualResetTrafficDialog(id,u.email,()=>render());
    const rp=document.getElementById('uResetPwd');
    if(rp)rp.onclick=()=>openResetUserPassword(id,u.email);
    document.querySelectorAll('[data-rotate-sub]').forEach(b=>{
      b.onclick=()=>openRotateSubscription(b.dataset.rotateSub,u.email);
    });
  },0);
  // 画像按需加载：解密来源地址是有代价的动作，不该每开一次详情就跑一遍
  setTimeout(()=>{
    const b=document.getElementById('upLoad');
    if(b)b.onclick=()=>loadProfile(id);
  },0);
  const m=modal('用户详情',
    '<dl class="kv">'+
      '<dt>邮箱</dt><dd>'+esc(u.email)+(u.email_verified?' <span class="badge badge-ok">已验证</span>':'')+'</dd>'+
      '<dt>用户 ID</dt><dd class="mono">'+esc(u.id)+'</dd>'+
      (can('iam.user.write')
        ? '<dt>登录密码</dt><dd><button class="btn btn-sm" id="uResetPwd">重置密码</button>'+
          '<span class="sub" style="margin-left:8px">用户忘记密码时由你代设一个</span></dd>'
        : '')+
      '<dt>状态</dt><dd>'+badge(U_ST,u.status)+'</dd>'+
      '<dt>风险等级</dt><dd>'+esc(u.risk_level)+'</dd>'+
      '<dt>用户分组</dt><dd><span id="uGrpName">'+esc(u.group_name||'未分组')+'</span>'+
        (can('iam.user.write')
          ? ' <button class="btn btn-sm btn-ghost" id="uSetGrp">修改</button>' : '')+'</dd>'+
      '<dt>余额</dt><dd class="num">'+money(u.balance,u.currency)+
        (can('billing.provider.write')
          ? ' <button class="btn btn-sm btn-ghost" id="uAdjBal">调整</button>' : '')+'</dd>'+
      '<dt>注册时间</dt><dd class="num">'+dt(u.created_at)+'</dd>'+
      '<dt>最近登录</dt><dd class="num">'+(u.last_login_at?dt(u.last_login_at):'从未')+'</dd>'+
      (u.roles.length?'<dt>管理角色</dt><dd>'+u.roles.map(r=>
        '<span class="badge badge-brand">'+esc(r)+'</span>').join(' ')+'</dd>':'')+
    '</dl>'+
    '<div class="sect">订阅'+
      (can('metering.reset.write')
        ? ' <button class="btn btn-sm btn-ghost" id="uReset">清零本周期流量</button>' : '')+
    '</div>'+
    '<div class="tbl-wrap"><table class="tbl"><tbody>'+subs+'</tbody></table></div>'+
    '<div class="sect">最近订单</div>'+
    '<div class="tbl-wrap"><table class="tbl"><tbody>'+ords+'</tbody></table></div>'+
    (can('security.audit.read')?
      '<div class="sect">行为画像</div>'+
      '<div id="upProf"><button class="btn btn-ghost btn-sm" id="upLoad">'+
      '加载来源与订阅拉取记录</button>'+
      '<div class="sub" style="margin-top:var(--sp-2);font-size:var(--fs-2xs)">'+
      '涉及解密来源地址，按需加载并留审计。</div></div>':'')+
    (canWrite?
      '<div class="sect">账号处置</div>'+
      '<div class="warn-box">'+
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
        'stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;margin-top:1px">'+
        '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/></svg>'+
        '<span>停用或封禁会立即吊销该用户全部会话与刷新令牌。操作写入不可删审计。</span></div>'+
      '<div class="field"><label>目标状态</label>'+
        '<select class="input" id="nst">'+opts([['active','恢复正常'],
          ['suspended','停用'],['banned','封禁']],u.status)+'</select></div>'+
      '<div class="field"><label>原因（停用/封禁必填）</label>'+
        '<textarea class="input" id="nrs" placeholder="例如：疑似批量注册滥用"></textarea></div>'
      :''),
    canWrite?'<button class="btn btn-ghost" data-close>关闭</button>'+
      '<button class="btn btn-danger" id="doSt">应用状态变更</button>'
      :'<button class="btn btn-ghost btn-block" data-close>关闭</button>',
    true);

  if(canWrite){
    m.querySelector('#doSt').onclick=async ev=>{
      const btn=ev.currentTarget;busy(btn,true,'提交中');
      try{
        await api('/v1/users/'+id+'/status',{method:'POST',body:JSON.stringify({
          status:m.querySelector('#nst').value,reason:m.querySelector('#nrs').value})});
        toast('账号状态已更新','ok');m.remove();render();
      }catch(e){
        // 高风险动作要求近期重认证：把 403 翻译成可操作的提示
        toast(e.code==='forbidden'
          ? e.message+'\n（该操作要求近期重新登录，请退出后重新登录再试）'
          : e.message,'err',7000);
        busy(btn,false);
      }
    };
  }
}

//---------------------------------------------------------------- 订单
async function viewDevices(v){
  const r = await api('/v1/devices');
  const mode = r.mode || 'loose', grace = r.grace ?? 1;
  const list = r.devices || [];
  const exceeded = list.filter(d => d.exceeded).length;

  const rows = list.map(d => {
    // 超限的整行标出来：这张表的用途就是快速找出异常账号，
    // 让人一行行比对数字是没意义的
    const cls = d.exceeded ? ' style="background:var(--err-soft)"' : '';

async function editDeviceLimit(subId, cur, overridden){
  const input = prompt(
    '设备数额度（0 表示不限制，留空恢复成套餐规定）', overridden ? String(cur) : '');
  if(input === null) return;
  const body = {};
  if(input.trim() === ''){
    // 传 null 而不是套餐当前的数值：套餐日后调额度时，
    // 手填进去的那些不会跟着变，会悄悄变成过期配置
    body.limit = null;
  }else{
    const n = parseInt(input, 10);
    if(isNaN(n) || n < 0 || n > 1000){ toast('请输入 0 到 1000 之间的数字', 'err'); return; }
    body.limit = n;
  }
  try{
    await api('/v1/subscriptions/' + subId + '/device-limit', {method:'POST', body});
    toast('已更新');
    render();
  }catch(e){ toast(e.message || '更新失败', 'err'); }
}

// sparkline 画一条折线。
//
// 自己画而不是引图表库：这里只需要几条折线，为它拉一个几百 KB 的依赖
// 不划算，而且图表库的默认样式head都要推翻重来。
function sparkline(points, series, w, h){
  if(!points.length) return '<div class="sub" style="padding:var(--sp-6);text-align:center">暂无数据</div>';
  const pad = {t:8, r:8, b:18, l:28};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = Math.max(1, ...points.flatMap(p => series.map(sr => p[sr.key])));
  const x = i => pad.l + (points.length === 1 ? iw/2 : i * iw / (points.length - 1));
  const y = v => pad.t + ih - (v / max) * ih;

  // 横向网格线：没有刻度参照的话，折线的绝对高度是读不出来的
  let g = '';
  for(let k = 0; k <= 2; k++){
    const v = Math.round(max * k / 2), yy = y(v);
    g += '<line class="spark-grid" x1="' + pad.l + '" y1="' + yy + '" x2="' + (w-pad.r) + '" y2="' + yy + '"/>' +
         '<text class="spark-lbl" x="2" y="' + (yy+3) + '">' + v + '</text>';
  }

  const lines = series.map(sr => {
    const d = points.map((p,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[sr.key]).toFixed(1)).join(' ');
    return '<path d="' + d + '" fill="none" stroke="' + sr.color + '" stroke-width="2" ' +
           'stroke-linejoin="round" stroke-linecap="round"/>';
  }).join('');

  // 日期标签只画首尾和中间，全画会挤成一团
  const marks = [0, Math.floor(points.length/2), points.length-1].filter((v,i,a) => a.indexOf(v) === i);
  const xl = marks.map(i =>
    '<text class="spark-lbl" x="' + x(i).toFixed(1) + '" y="' + (h-5) + '" text-anchor="middle">' +
    esc(points[i].day) + '</text>').join('');

  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    g + lines + xl + '</svg>';
}

// 访问明细的筛选条件。存在模块级变量里而不是读 DOM：重渲染会把输入框
// 整个替换掉，从 DOM 读的话每次筛选完输入框就空了。
const accessFilter = {category:'', user:'', ip:''};

function accessFilterQuery(){
  let q = '';
  if(accessFilter.category) q += '&category=' + encodeURIComponent(accessFilter.category);
  if(accessFilter.user)     q += '&user=' + encodeURIComponent(accessFilter.user);
  if(accessFilter.ip)       q += '&ip=' + encodeURIComponent(accessFilter.ip);
  return q;
}

// 筛选栏。IP 只支持精确匹配——库里存的是密文，查询靠哈希比对，
// 网段匹配需要明文，跟加密存储不兼容。
function accessFilterBar(){
  const opt = (v,t) => '<option value="' + v + '"' +
    (accessFilter.category === v ? ' selected' : '') + '>' + t + '</option>';
  return '<div style="display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;' +
      'padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--line)">' +
    '<select id="af-cat" class="inp" style="width:auto;min-width:110px">' +
      opt('', '全部分类') + opt('login','登录') + opt('register','注册') +
      opt('subscribe','订阅') + '</select>' +
    '<input id="af-user" class="inp" style="width:200px" placeholder="账号邮箱" ' +
      'value="' + esc(accessFilter.user) + '">' +
    '<input id="af-ip" class="inp mono" style="width:170px" placeholder="IP（精确）" ' +
      'value="' + esc(accessFilter.ip) + '">' +
    '<button id="af-go" class="btn btn-sm">筛选</button>' +
    (accessFilter.category || accessFilter.user || accessFilter.ip
      ? '<button id="af-clear" class="btn btn-sm btn-ghost">清空</button>' : '') +
  '</div>';
}

// 绑定筛选栏的事件。每次重渲染后都要重新调——元素是新建的。
function bindAccessFilter(rerender){
  const cat = document.getElementById('af-cat');
  const user = document.getElementById('af-user');
  const ip = document.getElementById('af-ip');
  const go = document.getElementById('af-go');
  const clear = document.getElementById('af-clear');
  if(!go) return;
  const apply = () => {
    accessFilter.category = cat.value;
    accessFilter.user = user.value.trim();
    accessFilter.ip = ip.value.trim();
    rerender();
  };
  go.onclick = apply;
  // 回车即筛选：填完 IP 还要去点按钮很别扭
  [user, ip].forEach(el => el.onkeydown = e => { if(e.key === 'Enter') apply(); });
  if(clear) clear.onclick = () => {
    accessFilter.category = accessFilter.user = accessFilter.ip = '';
    rerender();
  };
}

};

function accessRows(items){

        esc(a.user_agent || '—') + '</td>' +

}

// 券的状态是三态而不是两态：redeemed_count 用满之后数据库会把它
// 标成 exhausted，那和管理员手动停用是两回事，混在一起显示的话
// 「为什么这张券不能用了」就要靠猜。
const CP_STATUS = {
  active:   ['可用', 'badge-ok'],
  paused:   ['已停用', 'badge-plain'],
  exhausted:['已用完', 'badge-warn'],
  expired:  ['已过期', 'badge-plain'],
};

function couponValue(c){
  if (c.discount_type === 'percent'){
    // 存的是万分比，显示回百分比。界面只让填整数，所以正常情况下
    // 这里永远是「20% off」；只有绕过界面直接写库才会出现小数，
    // 那时候显示真值也比四舍五入成一个假数字强
    const pct = c.discount_value / 100;
    return (Number.isInteger(pct) ? pct : Number(pct.toFixed(2))) + '% off' +
      (c.max_discount ? '（封顶 ' + money(c.max_discount, c.currency) + '）' : '');
  }
  return '立减 ' + money(c.discount_value, c.currency);
}


//---------------------------------------------------------------------------
// 待处理款项（挂账）
//---------------------------------------------------------------------------
//
// 场景：用户取消了订单，但支付回调随后才到。钱收到了，订单却已经没了。
// 系统的处理是把这笔钱记进 late_payment_suspense 科目挂起来 —— 账是平的，
// 钱一分没丢。但在此之前没有任何界面能看到它，管理员不知道有待办，
// 用户问「我付了怎么没到账」也查不出来。这一页就是那个出口。
//
// 顺带一提，Xboard 遇到这种情况是一句 if 状态不是待支付就 return true，
// 钱直接丢弃、连记录都不留。所以这里不是补别人有的功能，是给我们自己
// 已经在产生的数据接上出口。

const LP_STATUS = {
  suspense:       ['待处理', 'badge-warn'],
  applied:        ['已转入余额', 'badge-ok'],
  refunded:       ['已退款', 'badge-plain'],
  refund_pending: ['退款处理中', 'badge-warn'],
  manual_review:  ['人工复核', 'badge-warn'],
};
const LP_KIND = {
  released_order: '订单已取消后到账',
  excess_capture: '重复/超额支付',
};

const lpState = {status:'', offset:0, limit:25};

async function viewLatePayments(v){
  const qs = new URLSearchParams({limit:lpState.limit, offset:lpState.offset});
  if (lpState.status) qs.set('status', lpState.status);
  const r = await api('/v1/late-payments?' + qs.toString());
  const list = r.cases || [];

  const filters = [['','全部'], ['suspense','待处理'], ['applied','已转入余额']]
    .map(f => '<button class="btn btn-sm ' +
      (lpState.status === f[0] ? 'btn-primary' : 'btn-ghost') +
      '" data-lpf="' + f[0] + '">' + f[1] + '</button>').join(' ');

  const rows = list.map(c => {
    const st = LP_STATUS[c.status] || [c.status, 'badge-plain'];
    const pending = c.status === 'suspense';
    return '<tr>' +
      '<td><b>' + esc(c.user_email) + '</b>' +
        '<div class="sub mono">' + esc(c.order_no) + '</div></td>' +
      '<td class="sub">' + esc(LP_KIND[c.case_kind] || c.case_kind) +
        '<div class="sub">订单当时状态：' + esc(c.order_status) + '</div></td>' +
      '<td class="r num"><b>' + money(c.amount, c.currency) + '</b></td>' +
      '<td><span class="badge ' + st[1] + '">' + st[0] + '</span>' +
        (c.resolution_reason ? '<div class="sub">' + esc(c.resolution_reason) + '</div>' : '') +
      '</td>' +
      '<td class="sub num">' + dt(c.received_at) +
        (c.resolved_at ? '<div class="sub">处理于 ' + dt(c.resolved_at) + '</div>' : '') +
      '</td>' +
      '<td class="r">' +
        (pending && can('billing.adjustment.write')
          ? '<button class="btn btn-sm btn-primary" data-lpapply="' + esc(c.id) +
            '" data-email="' + esc(c.user_email) + '" data-amt="' + c.amount +
            '" data-cur="' + esc(c.currency) + '">转入余额</button>'
          : '') +
      '</td></tr>';
  }).join('');

  const pages = Math.ceil((r.total || 0) / lpState.limit);
  const cur = Math.floor(lpState.offset / lpState.limit) + 1;

  v.innerHTML =
    (r.pending_amount > 0
      ? '<div class="stats" style="margin-bottom:var(--sp-4)">' +
          stat('待处理金额', money(r.pending_amount, 'CNY'),
               '已收到但订单已取消或重复支付，等你决定怎么处理') +
        '</div>'
      : '') +
    '<div class="card card-pad" style="margin-bottom:var(--sp-4);display:flex;gap:var(--sp-2);' +
      'flex-wrap:wrap;align-items:center">' + filters + '</div>' +
    (list.length
      ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>用户 / 订单</th><th>原因</th><th class="r">金额</th><th>状态</th>' +
          '<th>到账时间</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        (pages > 1
          ? '<div class="card-pad" style="display:flex;gap:var(--sp-2);align-items:center;' +
              'justify-content:flex-end"><span class="sub">第 ' + cur + ' / ' + pages + ' 页</span>' +
            '<button class="btn btn-sm btn-ghost" id="lpPrev"' + (cur <= 1 ? ' disabled' : '') +
              '>上一页</button>' +
            '<button class="btn btn-sm btn-ghost" id="lpNext"' + (cur >= pages ? ' disabled' : '') +
              '>下一页</button></div>'
          : '') + '</div>'
      : emptyRow('没有待处理的款项',
    '用户付款失败或金额对不上时会挂在这里等人工处理。空着是正常的。') ) +
    '<div class="card card-pad" style="margin-top:var(--sp-4)">' +
      '<div class="sub" style="line-height:1.8">' +
        '<b>什么时候会出现这里的记录？</b><br>' +
        '用户点了支付但中途取消订单，随后又在支付页面完成了付款；' +
        '或者同一笔订单被重复支付。这时候钱已经收到，订单却不能履约，' +
        '系统会把这笔钱挂在待处理科目上等你决定。<br><br>' +
        '<b>转入余额</b>会把钱记进该用户的账户余额，他可以直接用来下单。' +
        '整个过程走复式记账，不会绕开账本。<br>' +
        '<b>需要原路退回渠道</b>的，请让用户开工单，人工处理。' +
      '</div>' +
    '</div>';

  v.querySelectorAll('[data-lpf]').forEach(b => b.onclick = () => {
    lpState.status = b.dataset.lpf; lpState.offset = 0; render();
  });
  const prev = v.querySelector('#lpPrev'), next = v.querySelector('#lpNext');
  if (prev) prev.onclick = () => {
    lpState.offset = Math.max(0, lpState.offset - lpState.limit); render();
  };
  if (next) next.onclick = () => { lpState.offset += lpState.limit; render(); };

  v.querySelectorAll('[data-lpapply]').forEach(b => b.onclick = () =>
    openApplyLatePayment(b.dataset.lpapply, b.dataset.email,
      Number(b.dataset.amt), b.dataset.cur));
}

function openApplyLatePayment(id, email, amount, currency){
  const m = modal('转入用户余额',
    '<dl class="kv" style="margin:0 0 var(--sp-4)">' +
      '<dt>收款人</dt><dd>' + esc(email) + '</dd>' +
      '<dt>转入金额</dt><dd class="num"><b>' + money(amount, currency) + '</b></dd>' +
    '</dl>' +
    '<div class="field" style="margin-bottom:0">' +
      '<label for="lpReason">处理原因</label>' +
      '<input class="input" id="lpReason" maxlength="500" ' +
        'placeholder="例如：订单取消后支付到账，按用户要求转入余额">' +
      '<div class="hint">至少 5 个字。这条会写进审计，日后对账时需要靠它说明这笔钱去了哪。</div>' +
    '</div>',
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="lpGo">确认转入</button>');

  m.querySelector('#lpGo').onclick = async ev => {
    const reason = m.querySelector('#lpReason').value.trim();
    if ([...reason].length < 5){ toast('请写清处理原因，至少 5 个字', 'err'); return; }
    busy(ev.currentTarget, true, '处理中');
    try{
      await api('/v1/late-payments/' + id + '/apply-to-balance',
        {method:'POST', body: JSON.stringify({reason})});
      m.remove();
      toast('已转入用户余额', 'ok', 3000);
      render();
    }catch(e){ toast(e.message, 'err', 8000); busy(ev.currentTarget, false); }
  };
}

async function viewCoupons(v){
  const s = state.coupons;
  const [r, pl] = await Promise.all([
    api('/v1/coupons?q='+encodeURIComponent(s.q)+'&status='+s.status+
        '&limit=25&offset='+s.offset),
    can('catalog.read') ? api('/v1/plans') : Promise.resolve({plans:[]})
  ]);
  const list = r.coupons || [];
  // 券上存的是套餐 UUID。直接显示 UUID 等于没显示 ——
  // 管理员认得「基础版」，认不得 019fa1…
  const planName = {};
  (pl.plans || []).forEach(p => { planName[p.id] = p.name; });

  const rows = list.map(c => {
    const st = CP_STATUS[c.status] || [c.status, 'badge-plain'];
    // 有效期到了但状态还是 active 的券，数据库不会主动改状态 ——
    // 判断在下单时做。这里补一个显示上的修正，否则列表会说它可用
    const dead = c.valid_until && new Date(c.valid_until) < new Date();
    const badge = dead && c.status === 'active' ? CP_STATUS.expired : st;
    const quota = c.max_redemptions
      ? c.redeemed_count + ' / ' + c.max_redemptions
      : c.redeemed_count + ' / 不限';
    return '<tr>' +
      '<td><b class="mono">' + esc(c.code) + '</b>' +
        '<div class="sub">' + esc(c.name) + '</div></td>' +
      '<td>' + esc(couponValue(c)) + '</td>' +
      '<td class="sub">' + (c.min_order_amount > 0
        ? '满 ' + money(c.min_order_amount, c.currency) : '无门槛') +
        '<div class="sub">每人限 ' + c.max_redemptions_per_user + ' 次</div>' +
        '<div class="sub">' + ((c.applicable_plan_ids || []).length
          ? '限 ' + c.applicable_plan_ids.map(id =>
              esc(planName[id] || '已删除的套餐')).join('、')
          : '全部套餐') + '</div></td>' +
      '<td class="r num">' + quota + '</td>' +
      '<td class="r num">' + money(c.discounted_total, c.currency) + '</td>' +
      '<td class="sub num">' + (c.valid_until ? dt(c.valid_until) : '长期有效') + '</td>' +
      '<td><span class="badge ' + badge[1] + '">' + badge[0] + '</span></td>' +
      '<td class="r">' +
        (can('billing.order.read')?'<button class="btn btn-sm btn-ghost" data-redeem="' + esc(c.id) + '">明细</button> ':'') +
        (can('marketing.coupon.write') && c.status === 'paused'
          ? '<button class="btn btn-sm btn-ghost" data-on="' + esc(c.id) + '">启用</button>'
          : can('marketing.coupon.write')
            ? '<button class="btn btn-sm btn-ghost" data-off="' + esc(c.id) + '">停用</button>' : '') +
      '</td>' +
    '</tr>';
  }).join('');

  const filtering = !!(s.q || s.status);
  v.innerHTML =
    '<div class="card">' +
      '<div class="card-head"><h3>优惠券</h3>' +
        '<span class="badge badge-plain">' + num(r.total) + '</span>' +
        '<div class="spacer"></div>' +
        (can('marketing.coupon.write')?'<button class="btn btn-sm" id="cpBatch">批量生成</button> ' +
          '<button class="btn btn-primary btn-sm" id="cpNew">新建优惠券</button>':'') +
      '</div>' +
      '<div class="toolbar">' +
        '<input class="input" id="cpq" placeholder="搜索券码或活动名称…" value="' + esc(s.q) + '">' +
        '<select class="input" id="cpst">' + opts([['','全部状态'],['active','可用'],
          ['paused','已停用'],['exhausted','已用完'],['expired','已过期']], s.status) + '</select>' +
        '<button class="btn btn-ghost" id="cpgo">搜索</button>' +
      '</div>' +
      (list.length ? '<div class="tbl-wrap"><table class="tbl" data-sticky-actions><thead><tr>' +
        '<th>优惠码</th><th>优惠</th><th>条件</th><th class="r">已用</th>' +
        '<th class="r">累计减免</th><th>有效期</th><th>状态</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        : emptyRow(filtering ? '没有匹配的优惠券' : '还没有优惠券',
            filtering
              ? '换个券码、活动名称或状态试试。批量生成的券共用一个活动名称，按名称搜能把整批捞出来。'
              : '优惠券给指定套餐打折或减免，用户在结账时输入券码。' +
                '一张一张发用「新建优惠券」，做活动一次发几百张用「批量生成」。')) +
    pager(num(r.total), s.offset, 'coupons') +
    '</div>';

  const createButton=v.querySelector('#cpNew');
  if(createButton)createButton.onclick = () => openCouponForm(pl.plans || [], false);
  const batchButton=v.querySelector('#cpBatch');
  if(batchButton)batchButton.onclick = () => openCouponForm(pl.plans || [], true);
  v.querySelector('#cpgo').onclick = () => {
    s.q = v.querySelector('#cpq').value;
    s.status = v.querySelector('#cpst').value;
    s.offset = 0; render();
  };
  bindPager('coupons');
  v.querySelectorAll('[data-off]').forEach(b =>
    b.onclick = () => setCouponStatus(b.dataset.off, 'paused'));
  v.querySelectorAll('[data-on]').forEach(b =>
    b.onclick = () => setCouponStatus(b.dataset.on, 'active'));
  v.querySelectorAll('[data-redeem]').forEach(b =>
    b.onclick = () => openCouponRedemptions(b.dataset.redeem));
}

async function setCouponStatus(id, status){
  try{
    await api('/v1/coupons/' + id + '/status', {method:'POST',
      body: JSON.stringify({status})});
    toast(status === 'active' ? '已启用' : '已停用', 'ok', 2000);
    render();
  }catch(e){ toast(e.message, 'err'); }
}

// openCouponForm 单张创建与批量生成共用一张表单。
//
// 两者只差三个字段（券码 / 数量 / 前缀），其余折扣配置一模一样。
// 拆成两个弹窗的代价是：以后加一个「适用订单类型」，总有一边会忘记加，
// 而漏掉的那边不会报错，只会悄悄发出一批配置不对的券。
function openCouponForm(plans, batch){
  // 一个都不勾 = 全部套餐通用。这比强制勾选「全部」少一步，
  // 而且与后端「空数组表示不限」的语义一致
  // 只列在售套餐：给一张券限定已下架的套餐，结果是这张券永远用不出去
  const picker = (plans || []).filter(p => p.status === 'active').map(p =>
    '<label style="display:flex;align-items:center;gap:var(--sp-2);padding:3px 0;' +
      'font-size:var(--fs-sm);cursor:pointer">' +
      '<input type="checkbox" class="cpPlan" value="' + esc(p.id) + '">' +
      esc(p.name) + '</label>').join('') ||
    '<div class="sub">还没有在售套餐</div>';

  const body =
    '<div class="grid2">' +
      (batch
        ? '<div class="field"><label for="fCount">生成数量</label>' +
            '<input class="input" id="fCount" type="number" min="1" max="1000" value="100"></div>' +
          '<div class="field"><label for="fPrefix">券码前缀' +
            tip('可留空。填了之后券码长这样：SUMMER + 10 位随机字符，一眼能认出是哪次活动的。只能用大写字母和数字，最多 8 位。') +
            '</label><input class="input mono" id="fPrefix" placeholder="SUMMER" ' +
            'style="text-transform:uppercase" autocomplete="off"></div>'
        : '<div class="field"><label for="fCode">优惠码</label>' +
            '<input class="input mono" id="fCode" placeholder="SUMMER2026" ' +
              'style="text-transform:uppercase" autocomplete="off"></div>') +
      '<div class="field"><label for="fName">' +
        (batch ? '活动名称（必填）' : '名称（内部备注）') +
        (batch ? tip('这一批券唯一的抓手。券码是随机的，事后要靠活动名称在列表里把整批搜回来。') : '') +
        '</label><input class="input" id="fName" placeholder="夏季活动"></div>' +
      '<div class="field"><label for="fType">优惠方式</label>' +
        '<select class="input" id="fType">' +
          '<option value="percent">按百分比打折</option>' +
          '<option value="fixed">按固定金额立减</option>' +
        '</select></div>' +
      '<div class="field"><label for="fVal"><span id="fValLbl">优惠幅度（填 20 即减 20%，相当于 8 折）</span></label>' +
        '<input class="input" id="fVal" type="number" min="1" step="1" placeholder="20"></div>' +
      '<div class="field"><label for="fMaxD">封顶减免（元，仅百分比券）</label>' +
        '<input class="input" id="fMaxD" type="number" min="0" placeholder="不限"></div>' +
      '<div class="field"><label for="fMin">使用门槛（元）</label>' +
        '<input class="input" id="fMin" type="number" min="0" placeholder="0"></div>' +
      (batch
        ? '<div class="field"><label for="fTotal">每张券可核销次数' +
            tip('批量券默认一人一张、每张只能用一次。改大就等于同一个码能被反复使用，那生成多张就没有意义了。') +
            '</label><input class="input" id="fTotal" type="number" min="1" value="1"></div>'
        : '<div class="field"><label for="fTotal">总发放量</label>' +
            '<input class="input" id="fTotal" type="number" min="1" placeholder="不限"></div>') +
      '<div class="field"><label for="fPer">每人可用次数</label>' +
        '<input class="input" id="fPer" type="number" min="1" value="1"></div>' +
      '<div class="field"><label for="fFrom">生效时间</label>' +
        '<input class="input" id="fFrom" type="datetime-local"></div>' +
      '<div class="field"><label for="fUntil">结束时间</label>' +
        '<input class="input" id="fUntil" type="datetime-local"></div>' +
    '</div>' +
    '<div class="field" style="margin-top:var(--sp-3);margin-bottom:0">' +
      '<label>适用套餐</label>' +
      '<div id="cpPlanPicker" style="max-height:150px;overflow:auto;' +
        'border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-3)">' +
        picker + '</div>' +
      '<div class="hint">不勾选表示所有套餐都能用。</div>' +
    '</div>' +
    '<div class="hint" style="margin-top:var(--sp-3)">' +
      '金额按元填写，系统按最小货币单位存储。留空表示不限制。' +
    '</div>';

  const m = modal(batch ? '批量生成优惠券' : '新建优惠券', body,
    '<button class="btn btn-ghost" data-close>取消</button>' +
    '<button class="btn btn-primary" id="cpSave">' +
      (batch ? '生成' : '创建') + '</button>', true);

  const lbl = m.querySelector('#fValLbl');
  m.querySelector('#fType').onchange = ev => {
    lbl.textContent = ev.target.value === 'percent'
      ? '优惠幅度（填 20 即减 20%，相当于 8 折）' : '立减金额（元）';
  };

  m.querySelector('#cpSave').onclick = async ev => {
    const btn = ev.currentTarget;
    const g = id => m.querySelector('#' + id).value.trim();
    // 元转最小单位：只在提交这一处做。分散到多处早晚会漏掉一次，
    // 而漏掉的那次是把 30 元的券发成了 0.3 元
    const yuan = v => v === '' ? null : Math.round(parseFloat(v) * 100);
    const type = g('fType');
    const raw = g('fVal');
    if (batch){
      if (!g('fName')){ toast('批量生成必须填活动名称', 'err'); return; }
      const n = parseInt(g('fCount') || '0', 10);
      if (!(n >= 1 && n <= 1000)){ toast('生成数量需在 1 到 1000 之间', 'err'); return; }
    } else if (!g('fCode')){ toast('优惠码必填', 'err'); return; }
    if (raw === ''){ toast('优惠值必填', 'err'); return; }

    const payload = {
      code: batch ? '' : g('fCode').toUpperCase(),
      name: g('fName') || (batch ? '' : g('fCode').toUpperCase()),
      discount_type: type,
      // 百分比同样要换算：界面收 20，数据库存 2000
      discount_value: type === 'percent' ? parseInt(raw, 10) * 100 : yuan(raw),
      currency: 'CNY',
      max_discount: type === 'percent' ? yuan(g('fMaxD')) : null,
      min_order_amount: yuan(g('fMin')) || 0,
      // 批量模式下这个框问的是「每张券可核销次数」，留空按 1 张一次算；
      // 单张模式下它是总发放量，留空是不限。同一个字段，两种语义。
      max_redemptions: g('fTotal') === ''
        ? (batch ? 1 : null) : parseInt(g('fTotal'), 10),
      max_redemptions_per_user: parseInt(g('fPer') || '1', 10),
      applicable_plan_ids: Array.from(m.querySelectorAll('.cpPlan:checked'))
                                .map(x => x.value),
      valid_from: g('fFrom'),
      valid_until: g('fUntil'),
    };
    if (batch){
      payload.count = parseInt(g('fCount'), 10);
      payload.prefix = g('fPrefix').toUpperCase();
    }
    busy(btn, true, batch ? '生成中' : '创建中');
    try{
      if (batch){
        const res = await api('/v1/coupons/batch', {method:'POST', body: JSON.stringify(payload)});
        m.remove();
        showGeneratedCoupons(res);
      } else {
        await api('/v1/coupons', {method:'POST', body: JSON.stringify(payload)});
        m.remove();
        toast('优惠券已创建', 'ok', 2000);
      }
      render();
    }catch(e){ toast(e.message, 'err'); busy(btn, false); }
  };
}

// showGeneratedCoupons 把刚生成的券码摊出来给人拿走。
//
// 生成完只弹一句「已生成 500 张」是没用的：管理员接下来就要把这些码
// 发给渠道或贴进活动页，得先能拿到它们。券码不是密钥，事后在列表里
// 也查得到，所以这里不做「仅此一次」的恐吓，只是省掉一次翻页复制。
function showGeneratedCoupons(res){
  const codes = res.codes || [];
  const text = codes.join('\n');
  const body =
    '<div class="notice">已生成 <b class="num">' + codes.length + '</b> 张券，' +
      '活动名称「' + esc(res.name || '') + '」。' +
      '<div class="sub" style="margin-top:6px">这些券码已经保存好了，' +
      '之后在优惠券列表里按活动名称搜索就能再找到。</div></div>' +
    '<textarea class="input mono" id="cpCodes" readonly rows="12" ' +
      'style="margin-top:var(--sp-3);width:100%;resize:vertical">' + esc(text) + '</textarea>';
  const m = modal('券码已生成', body,
    '<button class="btn btn-ghost" data-close>关闭</button>' +
    '<button class="btn btn-primary" id="cpCopy">复制全部</button>', true);
  m.querySelector('#cpCopy').onclick = async ev => {
    const ta = m.querySelector('#cpCodes');
    try{
      await navigator.clipboard.writeText(text);
      toast('已复制 ' + codes.length + ' 个券码', 'ok', 2000);
    }catch(e){
      // 剪贴板 API 在非 HTTPS 或没授权时会被拒。选中让人自己按 Ctrl+C，
      // 总好过什么都不发生 —— 「点了没反应」是最难排查的一类问题。
      ta.focus(); ta.select();
      toast('浏览器不允许自动复制，已全选，请按 Ctrl+C', 'warn', 5000);
    }
    void ev;
  };
}
