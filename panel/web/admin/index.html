<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>潘多拉面板控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d5efc'/%3E%3Cpath d='M32 13l15 7v11c0 10-6.4 17.3-15 20-8.6-2.7-15-10-15-20V20l15-7z' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
<style>
/* 与用户门户同一套设计语言，但管理端更重信息密度：
   行高更紧、字号更小、表格优先于卡片。 */
:root{
  /* 类型尺度：每档之间肉眼可辨，不再有 0.5px 的伪层级 */
  --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:15px; --fs-lg:17px; --fs-xl:19px; --fs-2xl:22px; --fs-3xl:26px; --fs-4xl:32px;

  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --sp-8:32px;--sp-10:40px;--sp-16:64px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:999px;
  --ease:cubic-bezier(.4,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:130ms;--t-base:200ms;--t-slow:320ms;
  --brand:#6d5efc;--brand-2:#a855f7;--brand-soft:rgba(109,94,252,.14);
  --ok:#22c55e;--ok-soft:rgba(34,197,94,.13);
  --warn:#f59e0b;--warn-soft:rgba(245,158,11,.13);
  --err:#f0616d;--err-soft:rgba(240,97,109,.13);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",
         "PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#08090c;--bg-elev:#0d0f14;--surface:#101319;--surface-2:#161a22;--surface-3:#1c212b;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --fg:#e9ebef;--fg-2:#98a0af;--fg-3:#7a8292;--brand-on-soft:#9c92ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-md:0 4px 20px -4px rgba(0,0,0,.55);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.7);
  --glow:radial-gradient(1000px 420px at 70% -15%,rgba(109,94,252,.13),transparent 70%);
}
[data-theme="light"]{
  --ok:#00841d; --warn:#b15a00; --err:#cc3d49;
  /* 语义色在白底上必须压深，亮色版本只适合深色卡片 */
  --bg:#fbfbfd;--bg-elev:#fff;--surface:#fff;--surface-2:#f6f7fa;--surface-3:#eef0f5;
  --line:rgba(16,20,32,.08);--line-2:rgba(16,20,32,.14);
  --fg:#0f1319;--fg-2:#5b6474;--fg-3:#697283;--brand-on-soft:#5546d6;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 4px 20px -4px rgba(16,24,40,.1);
  --shadow-lg:0 16px 48px -12px rgba(16,24,40,.16);
  --glow:radial-gradient(1000px 420px at 70% -15%,rgba(109,94,252,.08),transparent 70%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:var(--fs-sm);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:var(--glow);
  pointer-events:none;z-index:0}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-size:var(--fs-2xs);letter-spacing:-.02em}
.hide{display:none!important}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-full);
  border:3px solid var(--bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:34px;padding:0 var(--sp-4);border:1px solid transparent;border-radius:var(--r-md);
  background:var(--surface-2);color:var(--fg);font-size:var(--fs-sm);font-weight:550;
  cursor:pointer;white-space:nowrap;transition:all var(--t-fast) var(--ease)}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
/* 先给纯色再叠渐变。只写 linear-gradient 的话，一旦渐变没画出来
   （降级渲染、某些截图/打印路径、强制配色），剩下的就是白字透明底——
   按钮整个消失，而不是难看一点。 */
.btn-primary{background-color:var(--brand);
  background-image:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px -8px rgba(109,94,252,.7)}
.btn-primary:hover{filter:brightness(1.08)}
/* .btn-brand 是 .btn-primary 的历史别名，套餐页等 5 处在用。
   一直没有定义，那几个主按钮长年退化成灰色普通按钮。 */
.btn-brand{background-color:var(--brand);
  background-image:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px -8px rgba(109,94,252,.7)}
.btn-brand:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--err-soft);color:var(--err);border-color:transparent}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-sm{height:28px;padding:0 var(--sp-3);font-size:var(--fs-xs);border-radius:var(--r-sm)}
.btn-block{width:100%;height:38px}
.btn-icon{width:30px;height:30px;padding:0;background:transparent;color:var(--fg-3);
  border:0;border-radius:var(--r-full);flex:0 0 auto;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.btn-icon:hover{background:var(--surface-2);color:var(--fg)}
.btn-icon:active{transform:scale(.94)}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.field{margin-bottom:var(--sp-4)}
/* 出站 / 分流编辑器（initRouting）：每行一个 grid，列宽由行内 max-width 控制。 */
.rt-row{display:grid;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2)}
.rt-row textarea.input{flex:1;min-height:38px;height:38px;font-size:var(--fs-xs);
  white-space:nowrap;overflow-x:auto}
/* 迷你趋势图：SVG 里的类要用 stroke/fill，继承的 color 管不到它们。 */
.spark{width:100%;height:auto;display:block}
.spark-grid{stroke:var(--line);stroke-width:1}
.spark-lbl{fill:var(--fg-3);font-size:9px}
.field label{display:block;font-size:var(--fs-xs);font-weight:550;color:var(--fg-2);
  margin-bottom:6px}
.input{width:100%;height:38px;padding:0 var(--sp-3);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);font-size:var(--fs-sm);
  transition:all var(--t-fast) var(--ease)}
.input:focus{outline:none;border-color:var(--brand);background:var(--bg-elev);
  box-shadow:0 0 0 3px var(--brand-soft)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:44px}
.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  display:grid;place-items:center;border:0;border-radius:var(--r-sm);background:transparent;
  color:var(--fg-3);cursor:pointer;transition:color var(--t-fast),background var(--t-fast)}
.pw-toggle:hover{color:var(--fg);background:var(--surface-3)}
.pw-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.pw-toggle svg{pointer-events:none}
textarea.input{height:auto;padding:var(--sp-3);resize:vertical;min-height:72px}
select.input{cursor:pointer;appearance:none;padding-right:34px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M4 6l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center}

.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);margin-bottom:var(--sp-5)}
.card-pad{padding:var(--sp-5)}
.card-head{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);
  border-bottom:1px solid var(--line)}
.card-head h3{font-size:var(--fs-base)}
.card-head .spacer{flex:1}

.badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;
  border-radius:var(--r-full);font-size:var(--fs-2xs);font-weight:600;background:var(--surface-3);
  color:var(--fg-2)}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-err{background:var(--err-soft);color:var(--err)}
.badge-brand{background:var(--brand-soft);color:var(--brand)}
.badge-plain::before{display:none}

.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--r-sm)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

#toasts{position:fixed;top:var(--sp-4);right:var(--sp-4);z-index:100;display:flex;
  flex-direction:column;gap:var(--sp-2);pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:var(--sp-3);min-width:260px;max-width:380px;
  padding:var(--sp-3) var(--sp-4);background:var(--bg-elev);border:1px solid var(--line-2);
  border-radius:var(--r-md);box-shadow:var(--shadow-lg);font-size:var(--fs-sm);pointer-events:auto;
  animation:toastIn var(--t-slow) var(--ease-out);white-space:pre-wrap}
.toast.out{animation:toastOut var(--t-base) var(--ease) forwards}
.toast-ok svg{color:var(--ok)}.toast-err svg{color:var(--err)}.toast-info svg{color:var(--brand)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px) scale(.96)}}

/* ---------- 登录 ---------- */
#authView{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;
  padding:var(--sp-6)}
.auth-shell{width:100%;max-width:376px;animation:rise var(--t-slow) var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.auth-brand{text-align:center;margin-bottom:var(--sp-6)}
.auth-brand h1{font-size:var(--fs-xl);margin-top:var(--sp-3)}
.auth-brand p{margin:6px 0 0;color:var(--fg-2);font-size:var(--fs-xs)}
.lock-note{display:flex;gap:var(--sp-2);align-items:flex-start;margin-top:var(--sp-4);
  padding:var(--sp-3);background:var(--warn-soft);color:var(--warn);
  border-radius:var(--r-md);font-size:var(--fs-2xs);line-height:1.5}

/* ---------- 外壳 ---------- */
#appView{position:relative;z-index:1;display:flex;min-height:100vh}
.side-mask{display:none}
aside{width:216px;flex:0 0 216px;border-right:1px solid var(--line);background:var(--bg-elev);
  display:flex;flex-direction:column;padding:var(--sp-4) var(--sp-3);position:sticky;
  top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-2) var(--sp-5)}
.side-brand strong{font-size:var(--fs-base)}
.side-brand .tag{font-size:var(--fs-2xs);padding:1px 6px;border-radius:var(--r-full);
  background:var(--brand-soft);color:var(--brand);font-weight:700;letter-spacing:.03em}
nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
/* 分组标题本身是折叠开关。24 个入口平铺时，找一个页面全靠从头扫到尾，
   而管理员日常只在两三组里打转——折叠让常用的那几组始终在一屏内。 */
.nav-grp{display:flex;flex-direction:column;gap:1px}
.nav-sec{display:flex;align-items:center;gap:var(--sp-2);width:100%;border:0;background:transparent;
  font-size:var(--fs-2xs);font-weight:650;color:var(--fg-3);text-transform:uppercase;
  letter-spacing:.07em;padding:var(--sp-4) var(--sp-3) var(--sp-2);cursor:pointer;text-align:left;
  font-family:inherit}
.nav-sec:hover{color:var(--fg-2)}
.nav-sec .chev{margin-left:auto;flex:0 0 auto;transition:transform var(--t-fast) var(--ease)}
.nav-sec[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav-sec[aria-expanded="false"]+.nav-grp-body{display:none}
/* 折叠起来的组里如果就是当前页，给个点提示，否则看上去像「当前页消失了」 */
.nav-sec .dot{width:5px;height:5px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.nav-grp-body{display:flex;flex-direction:column;gap:1px}
.nav-grp.hide{display:none}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);height:34px;padding:0 var(--sp-3);
  border:0;border-radius:var(--r-md);background:transparent;color:var(--fg-2);font-size:var(--fs-sm);
  font-weight:500;cursor:pointer;text-align:left;width:100%;
  transition:all var(--t-fast) var(--ease)}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.on{background:var(--brand-soft);color:var(--brand-on-soft);font-weight:600}
.nav-item:disabled{opacity:.35;cursor:not-allowed}
.nav-item:disabled:hover{background:transparent;color:var(--fg-2)}
/* 服务器负载条。文字百分比配一条实心条：扫一列机器时，眼睛先看到
   长度差异，再去读具体数字。 */
.load-row{display:flex;align-items:center;gap:6px;line-height:1.7;font-size:var(--fs-2xs)}
.load-k{width:26px;flex:0 0 auto;color:var(--fg-3)}
.load-track{flex:1;min-width:52px;height:5px;border-radius:var(--r-full);
  background:var(--surface-2);overflow:hidden}
.load-fill{display:block;height:100%;border-radius:var(--r-full)}
.load-v{width:32px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.load-d{flex:0 0 auto;color:var(--fg-3);white-space:nowrap}
.side-foot{border-top:1px solid var(--line);padding-top:var(--sp-3);margin-top:var(--sp-3)}
.side-user{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2)}
.avatar{width:28px;height:28px;flex:0 0 auto;border-radius:var(--r-full);
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;
  place-items:center;font-size:var(--fs-xs);font-weight:700}
.side-user .who{flex:1;min-width:0}
.side-user .who b{display:block;font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.side-user .who span{font-size:var(--fs-2xs);color:var(--fg-3)}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-6);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-elev) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);position:sticky;top:0;z-index:20}
.topbar h2{font-size:var(--fs-md)}
.topbar .spacer{flex:1}
.content{padding:clamp(var(--sp-4),1.8vw,var(--sp-8));max-width:1800px;width:100%;margin:0 auto}
.page{min-width:0;animation:fade var(--t-base) var(--ease-out)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- 统计 ---------- */
/* 下限按「5 张卡要能挤进最窄的桌面内容区」算：内容区约 950px、
   间距 16px×4，每张 177px 就够。196px 差一点，结果节点页和服务器页
   的第 5 张卡被挤到第二行单独占一整行，看着像出了错。
   再宽的屏幕 auto-fit 会把它们一起撑开，不会停在 168。 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,168px),1fr));
  gap:var(--sp-4);margin-bottom:var(--sp-5)}
.overview-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
  gap:var(--sp-5);align-items:start}
.overview-grid>.card{min-width:0;margin-bottom:0}
.rev-controls{display:flex;gap:var(--sp-3);align-items:flex-end;justify-content:flex-end;flex-wrap:wrap}
.rev-controls .btn.on{background:var(--brand-soft);color:var(--brand-on-soft);border-color:transparent}
.rev-control-group{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap}
.rev-control-label{font-size:var(--fs-2xs);color:var(--fg-3);font-weight:650;margin-right:var(--sp-1)}
.rev-chart{width:100%;height:auto;min-height:220px;display:block;overflow:visible}
.rev-legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--fg-2)}
.rev-legend i{display:inline-block;width:18px;height:3px;border-radius:3px;margin-right:6px;vertical-align:middle}
.rev-legend .actual{background:var(--fg-2)}.rev-legend .displayed{background:var(--brand)}.rev-legend .adjust{background:var(--warn)}
.rev-legend .orders{background:var(--brand)}
.rev-scope-note{font-size:var(--fs-2xs);color:var(--fg-3);line-height:1.6;margin-top:var(--sp-2)}
.rev-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3);padding:var(--sp-5)}
.rev-summary .mini{min-width:0}.rev-summary .v{overflow-wrap:anywhere}
.rev-chart-box{width:100%;max-width:1700px;margin-inline:auto;padding:0 var(--sp-5) var(--sp-5);overflow:hidden}
.dashboard-ops{margin-top:var(--sp-5)}
.dashboard-ops-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);
  gap:var(--sp-5);align-items:start}
.dashboard-ops-grid>.card{min-width:0;margin-bottom:0}
.dashboard-controls{display:flex;gap:var(--sp-2);align-items:flex-end;flex-wrap:wrap}
.dashboard-control{display:grid;gap:4px;color:var(--fg-3);font-size:var(--fs-2xs)}
.dashboard-control .input{height:34px;min-width:92px}
.dashboard-tabs{display:flex;gap:var(--sp-1);padding:var(--sp-3) var(--sp-5) 0;overflow-x:auto}
.dashboard-tabs .btn[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-on-soft);border-color:transparent}
.dashboard-panel{min-width:0}
.dashboard-state{min-height:170px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:var(--sp-3);padding:var(--sp-6);text-align:center;color:var(--fg-2)}
.dashboard-state p{max-width:68ch;overflow-wrap:anywhere}
.dashboard-state.error{color:var(--err)}
.dashboard-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:var(--sp-2);
  padding:var(--sp-4) var(--sp-5)}
.dashboard-summary .mini{min-width:0;padding:var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface-2)}
.dashboard-summary .k{font-size:var(--fs-2xs);color:var(--fg-3)}
.dashboard-summary .v{margin-top:4px;font-weight:650;overflow-wrap:anywhere}
.dashboard-notice{margin:0 var(--sp-5) var(--sp-4);padding:var(--sp-3);border-radius:var(--r-md);
  background:var(--warn-soft);color:var(--warn);font-size:var(--fs-xs);line-height:1.6;overflow-wrap:anywhere}
.dashboard-scope{margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--line);
  color:var(--fg-3);font-size:var(--fs-2xs);line-height:1.7;overflow-wrap:anywhere}
.dashboard-backlog-body{padding-bottom:var(--sp-4)}
.dashboard-backlog-status{margin:var(--sp-4) var(--sp-5);padding:var(--sp-3);border-radius:var(--r-md);
  background:var(--ok-soft);color:var(--ok);line-height:1.6}
.dashboard-backlog-status.backlogged{background:var(--err-soft);color:var(--err)}
.dashboard-unobservable{margin:0 var(--sp-5);padding:var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-md);color:var(--fg-2);font-size:var(--fs-xs);line-height:1.6}
.stat{padding:var(--sp-4);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);transition:all var(--t-base) var(--ease)}
.stat:hover{border-color:var(--line-2);transform:translateY(-2px)}
.stat-label{font-size:var(--fs-2xs);color:var(--fg-2);font-weight:500;display:flex;
  align-items:center;gap:6px;margin-bottom:var(--sp-2)}
/* .stat-value 是 .stat-val 的另一种写法，服务器页 5 张卡一直在用。
   没有定义，那几个数字长年是 13px 正文字号，看着完全不像统计卡。 */
.stat-val,.stat-value{font-size:var(--fs-2xl);font-weight:660;letter-spacing:-.03em;line-height:1.2}
.stat-val small{font-size:var(--fs-xs);font-weight:500;color:var(--fg-2);margin-left:3px}
.stat-sub{font-size:var(--fs-2xs);color:var(--fg-3);margin-top:5px}

/* ── 一直被引用却从没定义的几个类 ──────────────────────────────
   .hint 用了 38 处、.muted 17 处。它们本该是「弱化的说明文字」，
   没有定义就跟正文一个字号一个颜色 —— 表单里每个字段下面都顶着
   一行和标签同样醒目的说明，整页看上去哪里都在喊。 */
.hint{display:block;font-size:var(--fs-2xs);color:var(--fg-3);line-height:1.6;margin-top:5px;
  overflow-wrap:anywhere}

/* 字段说明改成标签旁边的小问号，鼠标放上去才显示。
 *
 * 原先是常驻在输入框下面的一行小字。字段一多，整个表单就被灰色小字
 * 撑得又长又碎，真正要填的输入框反而被挤散了 —— 而这些说明大多是
 * 「第一次填的时候想知道，之后再也不看」的那种。
 *
 * 纯 CSS 实现，没有 JS 参与：tooltip 是 ::after，靠 :hover 和 :focus
 * 触发。focus 那条是给键盘用的，不然只有鼠标能看到说明。 */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;margin-left:5px;border-radius:var(--r-full);
  background:var(--surface-2);color:var(--fg-3);
  font-size:10px;font-weight:600;line-height:1;cursor:help;vertical-align:middle;
  border:0;padding:0;flex:0 0 auto;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.tip:hover,.tip:focus-visible{background:var(--brand-soft);color:var(--brand)}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;
  transform:translateX(-50%);width:max-content;max-width:264px;
  padding:8px 10px;border-radius:var(--r-md);
  background:var(--bg-elev);color:var(--fg-2);border:1px solid var(--line-2);
  box-shadow:var(--shadow-lg);
  font-size:var(--fs-2xs);font-weight:400;line-height:1.6;text-align:left;
  white-space:normal;opacity:0;visibility:hidden;pointer-events:none;z-index:80;
  transition:opacity var(--t-fast) var(--ease)}
.tip:hover::after,.tip:focus-visible::after{opacity:1;visibility:visible}
/* 贴着表单右边的字段，气泡往左收，否则会被弹窗裁掉。 */
.field:nth-child(even) .tip::after,.tip.tip-left::after{left:auto;right:0;transform:none}
.muted{color:var(--fg-2);font-size:var(--fs-xs);line-height:1.6}

/* 提示块。.notice 单用是中性提示，加 .warn / .err 变色。 */
.notice{padding:var(--sp-3);border-radius:var(--r-md);background:var(--surface-2);
  color:var(--fg-2);font-size:var(--fs-xs);line-height:1.7;overflow-wrap:anywhere}
.notice.warn,.callout.warn{background:var(--warn-soft);color:var(--warn)}
.notice.err,.callout.err{background:var(--err-soft);color:var(--err)}
.callout{padding:var(--sp-3);border-radius:var(--r-md);background:var(--surface-2);
  color:var(--fg-2);font-size:var(--fs-xs);line-height:1.7;overflow-wrap:anywhere}

/* 表单双列网格。没定义时所有字段一列到底，弹窗被拉得很长。 */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));
  gap:var(--sp-3)}
/* 批量运营的命中统计条 */
.sum{padding:var(--sp-3);border-radius:var(--r-md);background:var(--brand-soft);
  color:var(--brand-on-soft);font-size:var(--fs-xs);line-height:1.7}
/* 图表图例 */
.lgd{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-2);
  font-size:var(--fs-2xs);color:var(--fg-2)}
.lgd>*{display:inline-flex;align-items:center;gap:5px}

/* 复选框。原生控件在这个配色下是一颗黑色实心方块，跟整套 UI 完全
   不搭；表格里每行一个，扫过去像一列墨点。accent-color 一行就能让
   它跟着品牌色走，同时保留原生的键盘和无障碍行为。 */
input[type=checkbox],input[type=radio]{
  accent-color:var(--brand);width:15px;height:15px;margin:0;cursor:pointer;
  vertical-align:middle;flex:0 0 auto}
input[type=checkbox]:disabled,input[type=radio]:disabled{cursor:not-allowed;opacity:.45}
/* 统计卡片的三档语气。
 *
 * 原先所有卡片长得一模一样：「需关注 0」（好事）和「高负载 1」（得去
 * 处理）视觉上毫无区别，一排数字看下来不知道该看哪个。而 .stat.alert
 * 这个样式其实早就写好了，全站只有账本漂移一处用过。
 *
 * ok 只在「本该有问题、现在是 0」时用 —— 给用户一个「这里不用管」的
 * 确认，而不是让每张正常卡片都绿油油的。 */
/* 节点列表：对齐 xboard 的那套列。
   协议短标贴在节点名前面，显隐做成开关而不是下拉——
   「这个节点用户看不看得见」是个是非题，下拉框要点两下还得读一遍选项。 */
.nd-tag{display:inline-block;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.04em;
  padding:1px 5px;margin-right:6px;border-radius:var(--r-sm);
  background:var(--brand-soft);color:var(--brand);vertical-align:1px}
.nd-tag-none{background:var(--warn-soft);color:var(--warn)}
.nd-no{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);
  font-size:var(--fs-xs);padding:2px 7px;border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--fg)}
.nd-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
  background:var(--ok);flex:none}
.nd-dot.off{background:var(--fg-3)}
.nd-dot.warn{background:var(--warn)}
/* 显隐开关。原生 checkbox 在这一列太小、也看不出「开/关」哪边是开。 */
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:19px;
  cursor:pointer;transition:background .15s}
.sw span::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;
  background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--brand)}
.sw input:checked+span::before{transform:translateX(15px)}
.sw input:disabled+span{opacity:.45;cursor:not-allowed}
.sw input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.nd-addr{font-family:var(--mono);font-size:var(--fs-xs);word-break:break-all}
.stat.alert{border-color:var(--err);background:var(--err-soft)}
.stat.alert .stat-val,.stat.alert .stat-value{color:var(--err)}
.stat.warn{border-color:rgba(245,158,11,.4);background:var(--warn-soft)}
.stat.warn .stat-val,.stat.warn .stat-value{color:var(--warn)}
.stat.ok .stat-val,.stat.ok .stat-value{color:var(--ok)}

/* ---------- 表格 ---------- */
.tbl-wrap{max-width:100%;overflow-x:auto;position:relative;overscroll-behavior-inline:contain;
  scrollbar-gutter:stable}
.tbl-wrap:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.table-scroll-hint{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{text-align:left;padding:var(--sp-3) var(--sp-4);font-size:var(--fs-2xs);font-weight:650;
  color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);
  vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--t-fast) var(--ease)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .email{font-weight:550}
.tbl .sub{font-size:var(--fs-2xs);color:var(--fg-3)}

.toolbar{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;
  padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line)}
/* flex:1 会让搜索框吃掉工具栏里所有剩余空间——宽屏上一个搜索框拉到
   600px 多，旁边的筛选器被推到很远，视线要横跨半个屏幕。给个上限，
   多出来的宽度留白就好。 */
.toolbar .input{height:34px;width:auto;flex:1 1 auto;min-width:180px;max-width:420px}
.toolbar select.input{flex:0 0 auto;min-width:132px}
.node-toolbar #ndSearch{min-width:min(280px,100%)}
.check-label{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:34px;
  color:var(--fg-2);font-size:var(--fs-xs);white-space:nowrap;cursor:pointer}
.check-label input{accent-color:var(--brand)}
.node-table{min-width:1180px}
.node-table th:first-child,.node-table td:first-child{width:42px;text-align:center}
.node-table .node-actions{min-width:168px;white-space:nowrap}

/* 表格右侧的操作列。
 *
 * 原先是一排间距相同、粗细相同的按钮：详情 编辑 复制 迁移 删除。
 * 五个动作视觉权重完全一样，眼睛没有落点，「删除」和「详情」看起来
 * 一样安全 —— 一整行看下来就是密密麻麻一片，这正是「一团糟」的来源。
 *
 * 不改结构、不动事件绑定，只调三件事：
 *   · 按钮之间收紧，成为一组而不是五个独立元素
 *   · 常规操作降到 ghost 的轻量态，hover 才浮起来
 *   · 破坏性操作（删除）用间隔推开，手滑点不到旁边
 */
/* 溢出菜单：把次要操作从一排平铺的按钮里收起来。
 *
 * 菜单必须用 fixed 定位。表格外层是 .tbl-wrap{overflow-x:auto}，
 * 绝对定位的下拉会被它裁掉一半 —— 越靠右的行裁得越狠，而操作列
 * 恰好在最右边。fixed 脱离了裁剪上下文，代价是位置得在打开时算，
 * 见 positionActMenu()。
 */
.act-more{display:inline-block;position:relative;vertical-align:middle}
.act-more>summary{list-style:none;display:inline-flex;align-items:center;
  justify-content:center;width:28px;height:28px;padding:0;cursor:pointer;
  border-radius:var(--r-sm);color:var(--fg-3);letter-spacing:1px;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.act-more>summary::-webkit-details-marker{display:none}
.act-more>summary::marker{content:""}
.act-more>summary:hover,.act-more[open]>summary{background:var(--surface-2);color:var(--fg)}
.act-menu{position:fixed;z-index:70;min-width:148px;padding:5px;
  background:var(--bg-elev);border:1px solid var(--line-2);
  border-radius:var(--r-md);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;gap:2px;
  animation:actIn var(--t-fast) var(--ease-out)}
@keyframes actIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.act-menu .btn{width:100%;justify-content:flex-start;margin:0!important;
  height:30px;font-weight:500}
.act-menu .btn-danger{margin-top:3px!important}
.act-menu .btn:disabled{opacity:.45}

.tbl td.r .btn-sm{margin-left:2px}
.tbl td.r .btn-sm:first-child{margin-left:0}
.tbl td.r .btn-danger{margin-left:var(--sp-3)}
.tbl td.r .btn-ghost{color:var(--fg-2);font-weight:500}
.tbl td.r .btn-ghost:hover{color:var(--fg);background:var(--surface-2)}
/* 禁用的操作不该还占着视觉重量 —— 它现在多半在解释「为什么不能点」。 */
.tbl td.r .btn:disabled{opacity:.42;cursor:not-allowed}
.tbl td.r .btn:disabled:hover{background:transparent}
.node-table [data-nd-sort]{height:30px;padding-inline:8px}

/* 窄屏收起次要列。
 *
 * 节点表和订单表各有 11 列，在 1400px 以下就得横着拖才能看到操作按钮 ——
 * 而横滚条在表格内部，很多人根本没注意到它，只觉得「按钮不见了」。
 *
 * 收的都是「看一眼就过」的列，它们的信息在别处还能拿到：节点表的服务器
 * 名字在节点那一列的副文本里已经有了，倍率绝大多数是 1.00，流量和在线
 * 数点进详情能看到完整的；订单表的周期和实收在订单详情里都有。
 *
 * 用 nth-child 而不是给每列加 class：列顺序在表头和表体各写一遍，再加
 * 一套 class 就是第三处要同步的地方。下面按序号把列名标出来，改列顺序
 * 时对着改这里即可，另有一条契约测试锁住列数。
 *
 * 节点表 11 列（对齐 xboard 的列序）：
 *   1 勾选  2 节点ID  3 显隐  4 节点  5 部署方式  6 地址
 *   7 在线人数  8 倍率  9 权限组  10 流量使用  11 操作
 * 订单表 11 列：
 *   1 单号  2 用户  3 类型  4 套餐  5 周期  6 状态  7 金额
 *   8 实收  9 退款  10 创建时间  11 操作
 */
@media (max-width:1400px){
  /* 先收最不常看的：倍率、流量使用、退款 */
  .node-table th:nth-child(8),.node-table td:nth-child(8),   /* 倍率 */
  .node-table th:nth-child(10),.node-table td:nth-child(10), /* 流量使用 */
  .order-table th:nth-child(9),.order-table td:nth-child(9)  /* 退款 */
  {display:none}
}
@media (max-width:1180px){
  /* 再收：部署方式、在线人数、周期、实收 */
  .node-table th:nth-child(5),.node-table td:nth-child(5),
  .node-table th:nth-child(7),.node-table td:nth-child(7),
  .order-table th:nth-child(5),.order-table td:nth-child(5),
  .order-table th:nth-child(8),.order-table td:nth-child(8)
  {display:none}
}
@media (max-width:920px){
  /* 最后收：权限组、地址、类型、创建时间。
   * 节点ID 和显隐留着 —— 窄屏上最常做的两件事就是「找到那个号」和
   * 「把它关掉」，收了这张表就只能看不能用了。操作列同理，任何时候都不收。 */
  .node-table th:nth-child(9),.node-table td:nth-child(9),
  .node-table th:nth-child(6),.node-table td:nth-child(6),
  .order-table th:nth-child(3),.order-table td:nth-child(3),
  .order-table th:nth-child(10),.order-table td:nth-child(10)
  {display:none}
  .node-table .node-actions{min-width:0}
}
.pager{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);
  border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--fg-2)}
.pager .spacer{flex:1}

.empty{display:flex;flex-direction:column;align-items:center;padding:var(--sp-16) var(--sp-6);
  text-align:center}
.empty svg{color:var(--fg-3);opacity:.5;margin-bottom:var(--sp-3)}
.empty p{margin:0;color:var(--fg-2);font-size:var(--fs-sm);font-weight:550}
/* 说明这块地方是干什么的、现在该做什么。
 * 原先空状态只有一句「还没有 X」——对第一次用面板的人是个死胡同：
 * 知道没有了，然后呢？ */
.empty .empty-hint{margin:var(--sp-2) 0 0;max-width:34em;line-height:1.65;
  color:var(--fg-3);font-size:var(--fs-xs);font-weight:400}

/* 危险操作确认框里的后果说明。
 * 用户点「删除」时最想知道的不是「你确定吗」，而是「删了会怎样、
 * 能不能撤回」——原生 confirm 给不了这个层次。 */
.danger-box{margin:0 0 var(--sp-4);padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-md);background:var(--err-soft);
  border:1px solid rgba(240,97,109,.22)}
.danger-box ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
.danger-box li{color:var(--fg-2);font-size:var(--fs-xs);line-height:1.65}
.danger-box li::marker{color:var(--err)}
.danger-what{margin:0 0 var(--sp-3);font-size:var(--fs-sm);line-height:1.7;color:var(--fg)}

/* ---------- 弹窗 ---------- */
/* 节点与探针 */
.nd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--sp-4)}
.nd-card{
  padding:var(--sp-5);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);cursor:pointer;
  transition:border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);
}
.nd-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.nd-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.nd-head b{flex:1;min-width:0;font-size:var(--fs-base);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* 在线指示灯：颜色是判断节点死活的第一眼信息，必须比文字更醒目 */
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.off{background:var(--fg-3)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.nd-meta{font-size:var(--fs-xs);color:var(--fg-3);margin-bottom:var(--sp-4);
  display:flex;gap:var(--sp-3);flex-wrap:wrap}
.gauge{margin-bottom:var(--sp-3)}
.gauge-top{display:flex;justify-content:space-between;font-size:var(--fs-xs);margin-bottom:5px}
.gauge-top .k{color:var(--fg-2)}
.gauge-top .v{font-variant-numeric:tabular-nums;font-weight:600}
.gauge-bar{height:5px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden}
.gauge-bar i{display:block;height:100%;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  transition:width var(--t-slow) var(--ease-out)}
.gauge-bar.w i{background:linear-gradient(90deg,var(--warn),#fb923c)}
.gauge-bar.d i{background:linear-gradient(90deg,var(--err),#f87171)}
.chart{width:100%;height:120px;display:block}
.chart-wrap{padding:var(--sp-4) var(--sp-5)}
.chart-hd{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:var(--sp-2)}
.chart-hd h4{font-size:var(--fs-sm);font-weight:600}
.chart-hd span{font-size:var(--fs-xs);color:var(--fg-2);font-variant-numeric:tabular-nums}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:var(--sp-3);margin-bottom:var(--sp-5)}
.mini{padding:var(--sp-3) var(--sp-4);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md)}
.mini .k{font-size:var(--fs-2xs);color:var(--fg-2);margin-bottom:3px}
.mini .v{font-size:var(--fs-lg);font-weight:650;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
/* 详情页里的键值行 */
.kv{display:flex;flex-direction:column;gap:1px;margin-bottom:var(--sp-2)}
.kv-row{display:flex;gap:var(--sp-4);padding:7px 0;border-bottom:1px solid var(--line)}
.kv-row:last-child{border-bottom:0}
.kv-k{flex:0 0 84px;color:var(--fg-3);font-size:var(--fs-xs)}
.kv-v{flex:1;min-width:0;font-size:var(--fs-sm);overflow-wrap:anywhere}

.token-box{padding:var(--sp-4);background:var(--warn-soft);border:1px dashed var(--warn);
  border-radius:var(--r-md);margin-top:var(--sp-3);word-break:break-all}
.token-box code{font-family:var(--mono);font-size:var(--fs-xs);color:var(--fg)}

/* 工单 */
.nav-badge{
  margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:var(--r-full);
  background:var(--err);color:#fff;font-size:var(--fs-2xs);font-weight:700;
  display:grid;place-items:center;
}
.tk-filters{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.tk-filters .input{width:auto;min-width:132px;height:34px;font-size:var(--fs-sm)}
.chip{
  height:34px;padding:0 var(--sp-3);border:1px solid var(--line-2);border-radius:var(--r-md);
  background:transparent;color:var(--fg-2);font-size:var(--fs-sm);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.chip.on{background:var(--err-soft);border-color:transparent;color:var(--err);font-weight:600}
.tk-thread{display:flex;flex-direction:column;gap:var(--sp-4);
  padding:var(--sp-5);max-height:46vh;overflow-y:auto;background:var(--bg)}
.msg{display:flex;flex-direction:column;gap:5px;max-width:84%}
.msg.agent{align-self:flex-end;align-items:flex-end}
.msg.system{align-self:center;max-width:100%}
.msg-who{font-size:var(--fs-2xs);color:var(--fg-3)}
.msg-body{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-lg);font-size:var(--fs-sm);
  background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;
  word-break:break-word;line-height:1.65}
.msg.agent .msg-body{background:var(--brand-soft);border-color:transparent}
.msg.system .msg-body{background:transparent;border:0;color:var(--fg-3);
  font-size:var(--fs-xs);text-align:center;padding:2px}
/* 内部备注必须一眼可辨，避免客服误把它当成对外回复 */
.msg.note .msg-body{background:var(--warn-soft);border:1px dashed var(--warn);color:var(--fg)}
.msg.note .msg-who{color:var(--warn);font-weight:600}
textarea.input{height:auto;min-height:84px;padding:var(--sp-3) var(--sp-4);
  resize:vertical;line-height:1.6;font-family:inherit}
.sla-warn{color:var(--err);font-weight:600}

.mask{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:var(--sp-5);
  background:rgba(4,5,8,.62);backdrop-filter:blur(6px);animation:fadeIn var(--t-base) var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:432px;background:var(--bg-elev);border:1px solid var(--line-2);
  border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;
  animation:pop var(--t-slow) var(--ease-out);
  display:flex;flex-direction:column;max-height:calc(100vh - var(--sp-10));
}
.modal.wide{max-width:760px}
.node-detail-modal{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-elev);z-index:1;flex:0 0 auto}
.modal-head h3{flex:1;font-size:var(--fs-base)}
.modal-body{min-width:0;padding:var(--sp-5);overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;flex:1 1 auto}
/* 底部按钮按主次排布，而不是每个都拉满整行。
 *
 * 原先是 .modal-foot .btn{flex:1}：两个按钮时「取消」和「确认」等宽，
 * 分不出主次；只有一个「关闭」时，它被拉成一整条全宽紫色按钮 ——
 * 一个「看完了，关掉」的动作，长得像页面上最重要的行动号召。
 *
 * 现在靠右排，按内容定宽给个下限；主按钮在最右，符合从左到右
 * 「放弃 → 执行」的阅读顺序。 */
.modal-foot{display:flex;justify-content:flex-end;gap:var(--sp-2);
  padding:var(--sp-4) var(--sp-5) var(--sp-5);
  border-top:1px solid var(--line);background:var(--bg-elev);box-shadow:0 -10px 24px -22px rgba(0,0,0,.7);
  position:sticky;bottom:0;z-index:2;flex:0 0 auto}
.modal-foot .btn{height:38px;min-width:88px;padding:0 var(--sp-5);flex:0 0 auto}
/* 只有一个按钮时也不拉满：它多半是「关闭」，不值得占满一行。 */
.modal-foot .btn:only-child{min-width:104px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--sp-4)}
.grid2>.field{min-width:0}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin-bottom:var(--sp-4)}
.check.is-off{opacity:.5}
.check{min-width:0;min-height:42px;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-3);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;overflow-wrap:anywhere}
.check input{accent-color:var(--brand);flex:0 0 auto}
.check:has(input:disabled){cursor:not-allowed;opacity:.62}

.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-4);font-size:var(--fs-sm)}
.kv dt{color:var(--fg-2);white-space:nowrap}
.kv dd{min-width:0;margin:0;text-align:right;overflow-wrap:anywhere;word-break:break-word}

.sect{font-size:var(--fs-2xs);font-weight:650;color:var(--fg-3);text-transform:uppercase;
  letter-spacing:.06em;margin:var(--sp-5) 0 var(--sp-2);display:flex;align-items:center;
  gap:var(--sp-2)}
.sect::after{content:'';flex:1;height:1px;background:var(--line)}

.warn-box{display:flex;gap:var(--sp-2);padding:var(--sp-3);background:var(--warn-soft);
  color:var(--warn);border-radius:var(--r-md);font-size:var(--fs-xs);line-height:1.5;
  margin-bottom:var(--sp-4)}

.sw{position:relative;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--surface-3);border-radius:var(--r-full);
  transition:background var(--t-fast) var(--ease)}
.sw i::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:transform var(--t-fast) var(--ease);
  box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i::before{transform:translateX(16px)}
.sw input:disabled + i{opacity:.4;cursor:not-allowed}

.proto-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--sp-4)}
.proto-grid>.field{min-width:0}
.proto-check{min-height:38px;display:flex;align-items:center;gap:var(--sp-2);
  padding:0 var(--sp-3);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);cursor:pointer}
.proto-check input{accent-color:var(--brand)}
.proto-note{grid-column:1/-1;color:var(--fg-3);font-size:var(--fs-xs);line-height:1.6;
  margin-top:calc(-1 * var(--sp-2));margin-bottom:var(--sp-4)}

@media(max-width:1100px){
  aside{position:fixed;transform:translateX(-100%);z-index:50;
    transition:transform var(--t-base) var(--ease);box-shadow:var(--shadow-lg)}
  aside.open{transform:none}
  .side-mask{display:block;position:fixed;inset:0;z-index:49;border:0;padding:0;
    background:rgba(4,5,8,.58);backdrop-filter:blur(3px);opacity:0;pointer-events:none;
    transition:opacity var(--t-base) var(--ease)}
  aside.open + .side-mask{opacity:1;pointer-events:auto}
  .content{padding:var(--sp-5)}
  .topbar{padding:0 var(--sp-5)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btn-icon,.pw-toggle{min-width:44px;min-height:44px}
  .pw-wrap .input{padding-right:52px}
  .nav-item{height:auto;min-height:44px}
  .tbl-wrap.is-scrollable .table-scroll-hint{
    display:flex;align-items:center;width:max-content;max-width:calc(100% - var(--sp-4));
    min-height:32px;margin:var(--sp-2);padding:0 var(--sp-3);position:sticky;left:var(--sp-2);z-index:5;
    border:1px solid var(--line-2);border-radius:var(--r-full);background:var(--bg-elev);
    color:var(--fg-2);box-shadow:var(--shadow-sm);font-size:var(--fs-2xs);pointer-events:none
  }
  .tbl.has-sticky-actions th:last-child,.tbl.has-sticky-actions td:last-child{
    position:sticky;right:0;z-index:2;background:var(--surface);
    box-shadow:-10px 0 16px -16px rgba(0,0,0,.75)
  }
  .tbl.has-sticky-actions th:last-child{z-index:3;background:var(--surface-2)}
  .tbl.has-sticky-actions tbody tr:hover td:last-child{background:var(--surface-2)}
  body.nav-drawer-open{overflow:hidden}
}
@media(max-width:1180px){.overview-grid{grid-template-columns:1fr}}
@media(max-width:1180px){.dashboard-ops-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1100px){.card-head>.rev-controls{width:100%;justify-content:flex-start}}
@media(max-width:560px){
  aside{width:min(86vw,300px);flex-basis:min(86vw,300px)}
  .topbar{height:56px;flex-basis:56px;padding-left:max(var(--sp-3),env(safe-area-inset-left));
    padding-right:max(var(--sp-3),env(safe-area-inset-right))}
  .content{padding:var(--sp-3);padding-left:max(var(--sp-3),env(safe-area-inset-left));
    padding-right:max(var(--sp-3),env(safe-area-inset-right));padding-bottom:max(var(--sp-3),env(safe-area-inset-bottom))}
  .stats{grid-template-columns:1fr;gap:var(--sp-3);margin-bottom:var(--sp-4)}
  .rev-summary{grid-template-columns:1fr;padding:var(--sp-4)}
  .dashboard-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .dashboard-control .input{width:100%;min-width:0}
  .dashboard-controls .btn{min-height:44px}
  .dashboard-tabs{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .dashboard-tabs .btn{min-height:44px;flex:1}
  .dashboard-summary{grid-template-columns:repeat(2,minmax(0,1fr));padding:var(--sp-4)}
  .dashboard-notice,.dashboard-backlog-status,.dashboard-unobservable{margin-left:var(--sp-4);margin-right:var(--sp-4)}
  .rev-chart-box{padding:0 var(--sp-2) var(--sp-4);overflow-x:auto}
  .rev-chart{min-width:680px}
  .card{margin-bottom:var(--sp-4);border-radius:var(--r-md)}
  .card-head{align-items:flex-start;flex-wrap:wrap;white-space:normal}
  .card-head>.rev-controls{width:100%}
  .rev-controls{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
  .rev-control-group{width:100%}
  .rev-control-group .btn{flex:1;min-width:0}
  .rev-control-label{flex:0 0 100%}
  .card-head,.toolbar{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .card-pad{padding:var(--sp-4)}
  .tbl-wrap>.tbl{min-width:640px}
  /* 窄屏一行一格 */
  .rt-row{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
  .rt-row .input,.rt-row [style*="max-width"]{width:100%!important;max-width:none!important}
  .rt-row .btn{justify-self:end}
  .pager{flex-wrap:wrap}
  .pager .spacer{display:none}
  .kv{grid-template-columns:1fr;gap:var(--sp-1)}
  .kv dt,.kv dd{text-align:left;white-space:normal}
  .proto-grid{grid-template-columns:minmax(0,1fr)}
  .grid2,.check-grid{grid-template-columns:minmax(0,1fr)}
  .modal{max-height:calc(100dvh - var(--sp-4));border-radius:var(--r-lg)}
  .modal-foot{padding-bottom:max(var(--sp-4),env(safe-area-inset-bottom))}
  .mask{padding:var(--sp-2)}
  #toasts{left:var(--sp-3);right:var(--sp-3);top:var(--sp-3)}
  .toast{min-width:0;max-width:none;width:100%}
}
@media(min-width:2560px){
  :root{--fs-2xs:13px;--fs-xs:14px;--fs-sm:15px;--fs-base:16px;--fs-md:18px;
    --fs-lg:20px;--fs-xl:23px;--fs-2xl:28px;--fs-3xl:34px;--fs-4xl:42px}
  aside{width:264px;flex-basis:264px;padding:var(--sp-5) var(--sp-4)}
  .side-brand{padding-bottom:var(--sp-6)}
  .nav-item{height:40px}
  .topbar{height:66px;flex-basis:66px;padding:0 var(--sp-10)}
  .content{max-width:3200px;padding:var(--sp-10)}
  /* 别写死 4 列。节点页和服务器页各有 5 张卡，固定 4 列会让第 5 张
     单独占满第二行，看着像出了错。auto-fit 让它按可用宽度排，
     宽屏一行 5 张，窄下来自己折。 */
  /* 超宽屏只加大间距，列数交给基础规则的 auto-fit 决定。
     这里原来写死 repeat(4,...)，5 张卡的页面会掉一张到第二行。 */
  .stats{gap:var(--sp-5);max-width:none;margin-inline:auto}
  .stat{padding:var(--sp-5)}
  .overview-grid{grid-template-columns:minmax(0,2.2fr) minmax(380px,1fr);gap:var(--sp-6)}
  .rev-chart-box{max-width:none}
  .tbl th,.tbl td{padding-left:var(--sp-5);padding-right:var(--sp-5)}
  .node-table{min-width:1500px}
  .node-detail-modal{max-width:1200px}
  .modal.wide{max-width:1120px}
}
@media(min-width:1101px){#btnMenu{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;
  transition-duration:.01ms!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6d5efc"/><stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
</defs></svg>

<div id="toasts"></div>

<!-- ══════════════ 登录 ══════════════ -->
<section id="authView">
  <div class="auth-shell">
    <div class="auth-brand">
      <svg width="42" height="42" viewBox="0 0 46 46" fill="none">
        <rect width="46" height="46" rx="12" fill="url(#mg)"/>
        <path d="M23 12l8 3.6v6.2c0 4.8-3.2 9.2-8 10.7-4.8-1.5-8-5.9-8-10.7v-6.2L23 12z"
              stroke="#fff" stroke-width="2.1" stroke-linejoin="round"/>
        <path d="M19.6 22.6l2.5 2.5 4.6-4.9" stroke="#fff" stroke-width="2.1"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>潘多拉面板控制台</h1>
      <p>管理员登录</p>
    </div>
    <div class="card card-pad">
      <form id="loginForm">
        <div class="field">
          <label for="email">管理员邮箱</label>
          <input class="input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="pass">密码</label>
          <div class="pw-wrap">
            <input class="input" id="pass" type="password" autocomplete="current-password" required>
            <button class="pw-toggle" id="togglePass" type="button" aria-label="显示密码"
                    aria-controls="pass" aria-pressed="false" title="显示密码">
              <svg id="passEye" width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="btnLogin" type="submit">登录控制台</button>
      </form>
      <div class="lock-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" style="flex:0 0 auto;margin-top:1px">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/>
        </svg>
        <span>只有持有角色的账号可以登录此域。管理域令牌与用户门户令牌互不通用。</span>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════ 控制台 ══════════════ -->
<section id="appView" class="hide">
  <aside id="sidebar" tabindex="-1">
    <div class="side-brand">
      <svg width="24" height="24" viewBox="0 0 46 46" fill="none">
        <rect width="46" height="46" rx="12" fill="url(#mg)"/>
        <path d="M23 12l8 3.6v6.2c0 4.8-3.2 9.2-8 10.7-4.8-1.5-8-5.9-8-10.7v-6.2L23 12z"
              stroke="#fff" stroke-width="2.1" stroke-linejoin="round"/>
      </svg>
      <strong>潘多拉面板</strong>
      <span class="tag">ADMIN</span>
    </div>

    <nav id="nav" aria-label="管理控制台导航">
      <button class="nav-item on" data-page="overview" data-perm="billing.ledger.read">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 15l4-5 3.5 3L21 6"/></svg>概览
      </button>

      <div class="nav-grp" data-grp="node">
        <button type="button" class="nav-sec" aria-expanded="true">节点管理
          <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="nav-grp-body">
          <button class="nav-item" data-page="servers" data-perm="node.read">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="6" rx="1.5"/><rect x="3" y="15" width="18" height="6" rx="1.5"/>
              <path d="M7 6h.01M7 18h.01M11 6h7M11 18h7"/></svg>服务器
          </button>
          <button class="nav-item" data-page="nodes" data-perm="node.read">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="3" width="19" height="7" rx="1.6"/>
              <rect x="2.5" y="14" width="19" height="7" rx="1.6"/>
              <path d="M6.5 6.5h.01M6.5 17.5h.01"/></svg>节点
          </button>
          <button class="nav-item" data-page="traffic" data-perm="metering.reset.read">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 3v6h-6"/><path d="M12 8v4l3 2"/>
            </svg>流量重置
          </button>
        </div>
      </div>

      <div class="nav-grp" data-grp="sub">
        <button type="button" class="nav-sec" aria-expanded="true">订阅管理
          <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="nav-grp-body">
          <button class="nav-item" data-page="plans" data-perm="catalog.read">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.6 13.5L13.5 20.6a2 2 0 01-2.8 0l-8.3-8.3V2h10.3l8 8a2 2 0 010 2.8z"/>
              <circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"/></svg>套餐
          </button>
          <button class="nav-item" data-page="orders" data-perm="billing.order.read">

<script>
'use strict';
const TK='aegis_admin_token', THK='aegis_admin_theme';
const $=id=>document.getElementById(id);
let token=localStorage.getItem(TK)||'', perms=[], me=null;
let page='overview';
const state={users:{q:'',status:'',offset:0},orders:{q:'',status:'',from:'',to:'',offset:0},coupons:{q:'',status:'',offset:0},audit:{offset:0,action:'',actorKind:'',outcome:''},revenue:{currency:'CNY',days:30,metric:'amount'},dashboardTraffic:{range:'7d',limit:10,tab:'nodes'}};
let dashboardGeneration=0,dashboardTrafficRun=0,dashboardBacklogRun=0;
let dashboardCache={nodes:null,users:null,backlog:null};

//---------------------------------------------------------------- 主题
function applyTheme(t){
  document.documentElement.dataset.theme=t;localStorage.setItem(THK,t);
  $('icoMoon').classList.toggle('hide',t==='light');
  $('icoSun').classList.toggle('hide',t!=='light');
}
applyTheme(localStorage.getItem(THK)||
  (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
$('btnTheme').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

//---------------------------------------------------------------- Toast
const ICO={ok:'<path d="M20 6L9 17l-5-5"/>',
  err:'<circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/>'};
function toast(msg,kind='info',ms=4200){
  const el=document.createElement('div');el.className='toast toast-'+kind;
  el.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px">'+
    ICO[kind]+'</svg><div style="flex:1;min-width:0"></div>';
  el.lastChild.textContent=msg;
  $('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),220)},ms);
}

//---------------------------------------------------------------- API
// The administrator console is mounted below a high-entropy edge path. Keep
// every browser request inside that prefix so public and administrator routes
// can safely share one listener without sharing an authentication domain.
const ADMIN_BASE=location.pathname.replace(/\/+$/,'');
// 新版入口跟随 ADMIN_BASE：从不带尾斜杠的 /前缀 打开时，相对 app/ 会落到公网门户的 /app/
document.getElementById('lnkNewConsole').href=ADMIN_BASE+'/app/';
async function api(path,opts={}){
  let body=opts.body;
  const plainBody=body!==null&&typeof body==='object'&&!Array.isArray(body)&&Object.getPrototypeOf(body)===Object.prototype;
  if(plainBody)body=JSON.stringify(body);
  const h=Object.assign({},opts.headers||{});
  const hasContentType=Object.keys(h).some(k=>k.toLowerCase()==='content-type');
  if(!hasContentType&&(plainBody||typeof body==='string'))h['Content-Type']='application/json';
  if(token)h.Authorization='Bearer '+token;
  const res=await fetch(ADMIN_BASE+path,{method:opts.method||'GET',headers:h,body});
  const txt=await res.text();
  let data;try{data=txt?JSON.parse(txt):{}}catch(_){data={raw:txt}}
  // 响应体是 JSON 字面量 null（或数字、字符串）时，调用方那句 data.xxx
  // 会当场抛出，整页变成「载入失败」——哪怕页面上另外七八块本来都能画。
  // 全站有几十个 `const r = await api(...)` 后直接 r.list.map(...) 的写法，
  // 与其逐个补 ||{}（漏一个就等于没补），不如让这个函数保证返回值
  // 永远是可以安全读属性的东西。数组是对象，会原样保留。
  if(data===null||typeof data!=='object')data={};
  if(!res.ok){
    // 需要重新验证身份：当场问密码，成功后把这次请求原样重放。
    //
    // 53 条写路由要求令牌里的 rat 在 15 分钟以内，而 rat 只在登录那一刻
    // 写入，令牌本身却活 720 小时。也就是说登录满一刻钟，后台就变成
    // 只读——接入命令、编辑保存、删除、开单全部报这句话，而在此之前
    // 界面既没有解释，也没有出路，看上去就是一大片功能同时坏掉。
    //
    // 重放而不是让用户重来：他刚填完一屏表单，弹个框问密码再叫他
    // 「请重试」，那一屏就白填了。
    if(res.status===403&&/重新验证身份/.test((data.error&&data.error.message)||'')&&!opts._retried){
      if(await promptReauth()){
        return api(path,Object.assign({},opts,{_retried:true}));
      }
    }
    const e=new Error((data.error&&data.error.message)||('请求失败 HTTP '+res.status));
    e.status=res.status;e.code=data.error&&data.error.code;
    e.fields=(data.error&&data.error.fields)||{};throw e;
  }
  return data;
}

// promptReauth 弹出密码框换一枚新令牌。确认成功返回 true。
//
// 同一时刻只允许有一个重认证框：一屏上并发的几个请求同时撞到 403 时，
// 后来的都等着第一个的结果，而不是叠出三四个密码框。
let reauthPending=null;
function promptReauth(){
  if(reauthPending)return reauthPending;
  reauthPending=new Promise(resolve=>{
    const m=modal('确认身份',
      '<p class="muted" style="margin:0 0 14px">出于安全考虑，涉及节点、订单、'+
      '结算的操作需要每 15 分钟确认一次身份。</p>'+
      fld('当前密码',
        '<input class="input" type="password" id="reauthPw" autocomplete="current-password">',
    '涉及节点、订单、结算的操作每 15 分钟需要确认一次身份。')+
      '<div id="reauthErr" class="hint" style="display:none;color:var(--err)"></div>',
      '<button class="btn" data-close>取消</button>'+
      '<button class="btn btn-primary" id="reauthGo">确认</button>');
    const pw=m.querySelector('#reauthPw');
    const err=m.querySelector('#reauthErr');
    const go=m.querySelector('#reauthGo');
    let done=false;
    const finish=v=>{if(done)return;done=true;reauthPending=null;m.remove();resolve(v)};
    m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>finish(false));
    m.onclick=e=>{if(e.target===m)finish(false)};
    const submit=async()=>{
      const v=pw.value;
      if(!v){pw.focus();return}
      busy(go,true,'确认中');err.style.display='none';
      try{
        const r=await fetch(ADMIN_BASE+'/v1/auth/reauth',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
          body:JSON.stringify({password:v})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error((d.error&&d.error.message)||'确认失败');
        token=d.access_token;localStorage.setItem(TK,token);
        finish(true);
      }catch(e){
        busy(go,false);
        err.textContent=e.message;err.style.display='';
        pw.select();
      }
    };
    go.onclick=submit;
    pw.onkeydown=e=>{if(e.key==='Enter')submit()};
    setTimeout(()=>pw.focus(),50);
  });
  return reauthPending;
}
function busy(btn,on,label){
  if(on){btn.dataset.l=btn.innerHTML;btn.innerHTML='<span class="spin"></span>'+(label||'');btn.disabled=true}
  else{if(btn.dataset.l)btn.innerHTML=btn.dataset.l;btn.disabled=false}
}
const can=p=>perms.includes(p);

//---------------------------------------------------------------- 格式化
const EXP={JPY:0,KRW:0,VND:0,TWD:0};
const SYM={CNY:'¥',USD:'$',EUR:'€',GBP:'£',JPY:'¥'};
// 取一个用于显示的数字。null / undefined / 非数字一律当 0。
//
// 后端在「一条记录都没有」时不少接口返回的是 null 而不是 0，直接拼进
// 字符串就是页面上的「undefined」；参与运算则变成 NaN，一路扩散成
// 「¥N.aN」。统计数字缺失显示 0 是对的——那本来就是零。
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}

function money(minor,cur){
  // null / undefined 当 0 处理。少了这一步，String(undefined).padStart()
  // 会产出「¥N.aN」这种在页面上出现过的字样——后端某个金额字段偶尔
  // 返回 null（比如一条佣金记录都没有时），整块就变成乱码。
  if(minor===null||minor===undefined||Number.isNaN(Number(minor)))minor=0;
  minor=Math.round(Number(minor));
  const e=cur in EXP?EXP[cur]:2, neg=minor<0, v=Math.abs(minor);
  let s;
  if(e===0)s=String(v);
  else{const p=String(v).padStart(e+1,'0');s=p.slice(0,-e)+'.'+p.slice(-e)}
  return (neg?'-':'')+(SYM[cur]||'')+s;
}
function bytes(n){
  if(n===null||n===undefined)return '不限';
  const u=['B','KB','MB','GB','TB','PB'];let i=0,v=Number(n);
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return (i===0?v:v.toFixed(v>=100?0:v>=10?1:2))+' '+u[i];
}
function dt(s){
  if(!s)return '—';
  const d=new Date(s), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function adminUTF8ByteLength(value){
  if(typeof TextEncoder==='function')return new TextEncoder().encode(value).length;
  let bytes=0;
  for(const char of value){
    const point=char.codePointAt(0);
    bytes+=point<=0x7f?1:point<=0x7ff?2:point<=0xffff?3:4;
  }
  return bytes;
}

function adminPasswordPolicyError(password){
  if(Array.from(password).length<8)return '密码至少需要8个字符';
  if(adminUTF8ByteLength(password)>256)return '密码不能超过256个 UTF-8 字节';
  try{
    if(!new RegExp('\\p{L}','u').test(password)||!new RegExp('\\p{Nd}','u').test(password)){
      return '密码必须同时包含字母和数字';
    }
  }catch(_){return '当前浏览器不支持 Unicode 密码校验，请升级浏览器'}
  return '';
}

//---------------------------------------------------------------- 渲染分发
//---------------------------------------------------------------------------
// 实时刷新
//
// 管理端订阅的是租户级频道：任何用户的订单、工单、节点状态变化都会推过来，
// 当前页面自动重新渲染。
//
// 不用 EventSource 的原因和用户端一样 —— 它不允许带请求头，
// 令牌只能塞 URL，那会落进 nginx 日志和浏览器历史。
//---------------------------------------------------------------------------
let rtAbort=null, rtTimer=null, rtBackoff=1000;

// 一次操作常连带改多张表，防抖把连发的通知合成一次重绘。
// 管理端列表通常比用户端大，重绘成本更高，防抖窗口也就放宽一些。
function scheduleRefresh(){
  clearTimeout(rtTimer);
  rtTimer=setTimeout(()=>{
    render();startRealtime().catch(()=>{});
    // 工单角标不在主视图里，得单独刷
    if(typeof refreshTicketBadge==='function') refreshTicketBadge().catch(()=>{});
  },400);
}

function stopRealtime(){
  if(rtAbort){rtAbort.abort();rtAbort=null;}
  clearTimeout(rtTimer);
}

async function startRealtime(){
  if(!token) return;
  stopRealtime();
  rtAbort=new AbortController();
  try{
    const res=await fetch(ADMIN_BASE+'/v1/events',{
      headers:{'Authorization':'Bearer '+token},
      signal:rtAbort.signal,
    });
    if(!res.ok||!res.body){
      if(res.status===401) return;      // 登录已失效，重连无意义
      throw new Error('SSE '+res.status);
    }
    rtBackoff=1000;
    const reader=res.body.getReader(), dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      // SSE 以空行分帧；一次读取可能拿到半帧或多帧
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const frame=buf.slice(0,i); buf=buf.slice(i+2);
        let ev='message';
        let heartbeat=false;
        for(const line of frame.split('\n')){
          if(line.startsWith(':')){heartbeat=true;break;}
          if(line.startsWith('event:')) ev=line.slice(6).trim();
        }
        if(!heartbeat && ev!=='message') scheduleRefresh();
      }
    }
  }catch(e){
    if(rtAbort&&rtAbort.signal.aborted) return;   // 主动断开
  }
  if(token){
    setTimeout(startRealtime,rtBackoff);
    rtBackoff=Math.min(rtBackoff*2,30000);        // 避免服务重启时的重连风暴
  }
}

function updateScrollableTable(wrap){
  const overflow=wrap.scrollWidth-wrap.clientWidth>2;
  wrap.classList.toggle('is-scrollable',overflow);
  if(overflow){
    wrap.tabIndex=0;
    wrap.setAttribute('role','region');
    wrap.setAttribute('aria-label','可横向滚动的数据表');
  }else{
    wrap.removeAttribute('tabindex');
    wrap.removeAttribute('role');
    wrap.removeAttribute('aria-label');
  }
  const hint=wrap.querySelector('.table-scroll-hint');
  if(!hint)return;
  const atEnd=wrap.scrollLeft+wrap.clientWidth>=wrap.scrollWidth-2;
  const message=atEnd?'已到表格末端，可向左滑动':'左右滑动查看完整表格';
  if(hint.textContent!==message)hint.textContent=message;
}
function enhanceScrollableTables(root){
  (root||document).querySelectorAll('.tbl-wrap').forEach(wrap=>{
    const table=[...wrap.children].find(el=>el.matches('table.tbl'));
    if(!table)return;
    const hasActions=table.hasAttribute('data-sticky-actions');
    table.classList.toggle('has-sticky-actions',hasActions);
    if(!wrap.dataset.scrollEnhanced){
      wrap.dataset.scrollEnhanced='true';
      const hint=document.createElement('div');
      hint.className='table-scroll-hint';hint.setAttribute('aria-hidden','true');
      wrap.insertBefore(hint,table);
      wrap.addEventListener('scroll',()=>updateScrollableTable(wrap),{passive:true});
    }
    updateScrollableTable(wrap);
  });
}
let tableEnhanceFrame=0;
function scheduleTableEnhancement(){
  if(tableEnhanceFrame)return;
  tableEnhanceFrame=requestAnimationFrame(()=>{
    tableEnhanceFrame=0;
    enhanceScrollableTables($('appView'));
  });
}
const tableObserver=new MutationObserver(scheduleTableEnhancement);
tableObserver.observe($('appView'),{childList:true,subtree:true});
